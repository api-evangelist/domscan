openapi: 3.2.0
info:
  title: DomScan Business Verification API
  description: 'DomScan is a domain intelligence API providing domain analysis tools. **Core Features:**

    - Domain Availability: Check single or bulk domains using RDAP with 1,100+ TLDs supported

    - Domain Intelligence: AI suggestions, valuations, health checks, typosquatting detection

    - OSINT Tools: DNS lookup, WHOIS/RDAP, SSL certificates, subdomain discovery, IP geolocation, tech stack detection

    - Social & Branding: Social handle checker, brand name scoring

    - Phone Intelligence: Privacy-first phone number validation, normalization, and classification

    - Pricing: Scheduled standard-TLD tables from verified official registrar sources, plus separate credential-backed exact-domain quotes

    - Watchlist: Domain monitoring for expiration and availability alerts


    **Authentication:**

    Most API endpoints require authentication. Pass your API key via the x-api-key header or Authorization: Bearer header. Operations marked with an empty security requirement are intentionally public, including API specifications and selected catalog endpoints. Get your free API key at https://domscan.net/dashboard. Logged-in users on domscan.net tools pages are authenticated automatically via session cookie. **Rate Limits:**

    Free accounts can sustain 120 requests per minute per account, with a burst capacity of 60. All API keys and dashboard sessions belonging to the same free account share this budget. Bulk endpoints have an additional free-tier budget of 20 HTTP requests per minute per account across all bulk endpoints. Free-tier bulk traffic is also capped at 100 requests per minute per IPv4 address or IPv6 /56 network. Platform-wide edge protections still apply to every tier. Paid accounts can sustain 600 requests per minute, with a burst capacity of 120, shared by every API key and dashboard session of the account. Paid accounts do not receive the additional free-tier bulk budget. Scope: RapidAPI subscribers are counted per subscriber. (scope=rapidapi-customer) Zyla subscribers are counted per subscriber when the gateway identifies them, (scope=zyla-customer) and as one shared gateway budget when it does not. (scope=zyla-gateway) Other authenticated requests are counted per account: every API key and dashboard session of the account shares one budget. (scope=account) A key that is not linked to an account is counted on its own. (scope=api-key) Unauthenticated requests to public endpoints are counted per client IP address (scope unknown when the address cannot be determined, as one shared budget). (scope=ip)


    Every authenticated response, success or error, includes X-RateLimit-Plan, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, and X-RateLimit-Policy. X-RateLimit-Limit and X-RateLimit-Remaining describe the immediate burst bucket; X-RateLimit-Reset is the Unix time in seconds when that bucket is full again; X-RateLimit-Policy also states the sustained per-minute rate, scope, and any free bulk limits. Exceeding a limit returns HTTP 429 with Retry-After. Retry only after the indicated delay. **Credits System:**

    API calls consume credits based on endpoint complexity. Sign up for free to receive 10,000 credits monthly. - 1 credit: Status checks, DNS lookups, tool builders

    - 2-5 credits: Health checks, valuations, OSINT tools

    - Bulk endpoints: standard per-item rate for batching multiple items into fewer HTTP requests. - 6-25 credits: Recipe compound operations


    When credits reach zero, the API returns HTTP 402 with credits_remaining, credits_required, and a purchase_url. API responses include X-Credits-Requested, X-Credits-Charged, and X-Credits-Refunded. X-Credits-Charged is the net charge after any refund made during the request. Authenticated responses also include X-Credits-Remaining whenever the balance is known without an extra lookup. Free credits refresh monthly on the account''s signup anniversary. POST /v1/estimate returns the credits a request would charge without running it, at no cost.'
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: Business Verification
  description: Bank details, VAT numbers, healthcare providers and sanctions screening against official registers and lists
paths:
  /v1/bank/validate:
    post:
      tags:
      - Business Verification
      summary: Validate an IBAN, BIC and US routing number
      description: 'Validate any combination of an IBAN, a BIC (SWIFT code) and a US ABA routing number. The IBAN is checked for country, length, national account structure and ISO 7064 mod-97 check digits for every country in the IBAN registry, and split into bank code, branch code and account number. Territories that use a parent country format (for example GF, RE, GG, JE) validate with that format and carry a signal. A BIC is checked for structure and country, and compared with the IBAN country; a different country is a signal, never an invalid result. Routing numbers are checked for prefix and the 3-7-1 checksum. Everything runs offline: account numbers are not sent anywhere or kept in request logs. Validation proves the details are well formed, not that the account exists or is open. 1 credit.'
      operationId: validateBankDetails
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send at least one field.
              properties:
                iban:
                  type: string
                  maxLength: 100
                  description: IBAN in electronic or print format.
                  example: DE89 3704 0044 0532 0130 00
                bic:
                  type: string
                  maxLength: 40
                  description: BIC or SWIFT code, 8 or 11 characters.
                  example: COBADEFFXXX
                routing_number:
                  type: string
                  maxLength: 40
                  description: US ABA routing number, 9 digits.
                  example: '021000021'
            example:
              iban: DE89 3704 0044 0532 0130 00
              bic: COBADEFFXXX
      responses:
        '200':
          description: Bank details validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankValidationResponse'
              example:
                valid: true
                iban:
                  valid: true
                  errors: []
                  iban: DE89370400440532013000
                  iban_print: DE89 3704 0044 0532 0130 00
                  country_code: DE
                  format_country_code: DE
                  registry_status: swift_registry
                  check_digits: '89'
                  bban: '370400440532013000'
                  bank_code: '37040044'
                  branch_code: null
                  account_number: '0532013000'
                  sepa: true
                  length: 22
                  expected_length: 22
                  checks:
                    characters: pass
                    country_supported: pass
                    length: pass
                    structure: pass
                    checksum: pass
                bic:
                  valid: true
                  errors: []
                  bic: COBADEFFXXX
                  bic8: COBADEFF
                  institution_code: COBA
                  country_code: DE
                  location_code: FF
                  branch_code: XXX
                  primary_office: true
                  test_bic: false
                  passive_participant: false
                routing_number: null
                bic_iban_country_relation: same
                signals: []
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/vat/validate:
    get:
      tags:
      - Business Verification
      summary: Validate a VAT or tax ID
      description: Check a VAT number. EU member states and Northern Ireland (XI) are checked live with the official EU VAT register and Norway with the Norwegian business register; the result is valid or invalid only from that register, with the registered name and address where the country discloses them. GB, CH and AU numbers are checked for format and check digits only, so a well-formed number is unknown with reason no_live_source. A malformed number is invalid without any register call. Unknown results (register unavailable, busy or timed out) are not charged. 1 credit.
      operationId: validateVatNumber
      parameters:
      - name: vat
        in: query
        description: VAT number with its country prefix (DE811569869, EL094014201, CHE-116.068.369 MWST, NO923609016MVA), or without it when country is set.
        schema:
          type: string
          maxLength: 100
        required: true
        example: DE811569869
      - name: country
        in: query
        description: Country code when vat has no prefix. GR is accepted for Greece (EL).
        schema:
          type: string
          enum:
          - AT
          - BE
          - BG
          - CY
          - CZ
          - DE
          - DK
          - EE
          - EL
          - GR
          - ES
          - FI
          - FR
          - HR
          - HU
          - IE
          - IT
          - LT
          - LU
          - LV
          - MT
          - NL
          - PL
          - PT
          - RO
          - SE
          - SI
          - SK
          - XI
          - GB
          - UK
          - CH
          - 'NO'
          - AU
      - name: requester
        in: query
        description: Your own EU VAT number. The EU register then returns a consultation number you can keep as proof of the check.
        schema:
          type: string
          maxLength: 100
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: VAT validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VatValidationResponse'
              example:
                input: NO923609016MVA
                vat_number: NO923609016MVA
                number: '923609016'
                country_code: 'NO'
                status: valid
                valid: true
                reason: active_vat_registration
                format_valid: true
                checksum: valid
                registered_name: EQUINOR ASA
                registered_address: Forusbeen 50, 4035 STAVANGER, Norge
                name_disclosed: true
                consultation_number: null
                upstream_code: null
                source:
                  id: brreg
                  authority: bronnoysund_register_centre
                  url: https://data.brreg.no/enhetsregisteret/api/enheter/923609016
                  checked_at: '2026-10-18T03:58:55.722Z'
                details:
                  organization_number: '923609016'
                  organization_form:
                    code: ASA
                    description: Allmennaksjeselskap
                  vat_registered: true
                  vat_registered_since: '1989-07-01'
                  deleted: false
                  deleted_on: null
                  bankrupt: false
                  under_liquidation: false
                  under_forced_liquidation: false
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/national-id/validate:
    get:
      tags:
      - Business Verification
      summary: Validate a Spanish DNI, NIE or NIF/CIF
      description: 'Check a Spanish identity or tax number offline. DNI (8 digits and a letter; 7 digits are padded with a leading zero), NIE (X, Y or Z, 7 digits and a letter), K, L and M NIFs, and company NIFs (formerly CIF: an entity letter, 7 digits and a control digit or letter, where some entity types require a letter and others a digit). Spaces, dots, hyphens and an ES prefix are ignored. A failed control returns the expected control character. Valid means the number is well formed, not that it was issued or belongs to a real person or company; to confirm a company is VAT registered use /v1/vat/validate with the ES prefix. 1 credit.'
      operationId: validateNationalId
      parameters:
      - name: id
        in: query
        required: true
        description: DNI, NIE or NIF/CIF.
        schema:
          type: string
          maxLength: 64
        example: 12345678Z
      - name: country
        in: query
        description: Issuing country.
        schema:
          type: string
          enum:
          - ES
          default: ES
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: National ID validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NationalIdValidationResponse'
              example:
                country: ES
                input: B-58378431
                normalized: B58378431
                valid: true
                type: cif
                entity_type: sociedad_responsabilidad_limitada
                holder: null
                checks:
                  format: true
                  control: true
                expected_control: null
                errors: []
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/sanctions/screen:
    post:
      tags:
      - Business Verification
      summary: Screen a name against sanctions lists
      description: Screen a person, organization, vessel or aircraft name against the US OFAC SDN list, the OFAC consolidated (non-SDN) list, the UN Security Council consolidated list, the EU consolidated financial sanctions list and the UK sanctions list. Names are normalized (accents, transliteration, word order, punctuation, organization legal forms) and matched exactly, by alias, by initials and with small spelling differences; Cyrillic and Arabic names also match the original-script names on the lists. threshold applies to name_score; date_of_birth and country only adjust score and set signals, so they never hide a match. status is potential_match when any requested list has a match, no_match only when every requested list was confirmed against its source in the last 72 hours, and unknown otherwise (unknown is not charged). A potential match is a lead for human review, never a determination. Names sent here are not kept in request logs. 2 credits.
      operationId: screenSanctions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  maxLength: 200
                  description: Name to screen.
                type:
                  type: string
                  enum:
                  - any
                  - person
                  - organization
                  - vessel
                  - aircraft
                  default: any
                  description: Only match entries of this type.
                country:
                  type: string
                  description: ISO 3166-1 alpha-2 country of nationality or registration.
                  example: RU
                date_of_birth:
                  type: string
                  description: YYYY-MM-DD or YYYY, for persons.
                  example: '1952-10-07'
                lists:
                  type: array
                  items:
                    type: string
                    enum:
                    - ofac_sdn
                    - ofac_consolidated
                    - un
                    - eu
                    - uk
                  description: 'Lists to screen against (default: all). A comma-separated string is also accepted.'
                threshold:
                  type: number
                  minimum: 0.7
                  maximum: 1
                  default: 0.85
                  description: Minimum name_score for a match.
                limit:
                  type: integer
                  minimum: 1
                  maximum: 50
                  default: 10
                  description: Maximum matches returned.
            example:
              name: Vladimir Putin
              type: person
              country: RU
              date_of_birth: '1952-10-07'
      responses:
        '200':
          description: Sanctions screening
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionsScreenResponse'
              example:
                status: potential_match
                reason: null
                query:
                  name: Vladimir Putin
                  type: person
                  country: RU
                  date_of_birth: '1952-10-07'
                  lists:
                  - ofac_sdn
                  - ofac_consolidated
                  - un
                  - eu
                  - uk
                  threshold: 0.85
                  limit: 10
                matches:
                - list: ofac_sdn
                  entry_id: '35096'
                  score: 1
                  name_score: 1
                  match_type: exact
                  matched_name: PUTIN, Vladimir Vladimirovich
                  matched_name_kind: primary
                  alias_strength: null
                  entity_type: person
                  primary_name: PUTIN, Vladimir Vladimirovich
                  aliases: []
                  programs:
                  - RUSSIA-EO14024
                  countries:
                  - RU
                  birth_dates:
                  - date: '1952-10-07'
                    year: 1952
                    year_from: null
                    year_to: null
                    approximate: false
                  birth_places:
                  - Leningrad, Russia
                  listed_on: null
                  source_url: null
                  remarks: President of the Russian Federation.
                  signals:
                    date_of_birth: match
                    country: match
                total_matches: 1
                lists:
                - id: ofac_sdn
                  name: Specially Designated Nationals and Blocked Persons List
                  authority: US Treasury OFAC
                  status: checked
                  entries: 19457
                  published_at: '2026-10-16'
                  fetched_at: '2026-10-18T04:05:12.000Z'
                  source_url: https://sanctionslistservice.ofac.treas.gov/api/publicationpreview/exports/sdn.csv
                checked_at: '2026-10-18T04:20:00.000Z'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-credits:
        model: per_request
        default: 2
  /v1/npi:
    get:
      tags:
      - Business Verification
      summary: Look up and verify a US healthcare provider by NPI
      description: 'Look up a 10-digit National Provider Identifier in the NPPES registry. The check digit is validated first, so a mistyped number is invalid without a registry call. found returns the provider or organization record; not_found means the registry lists no active record for a valid number. Optional name, state and taxonomy are compared with the record: verified is true only when the NPI is found and active and every supplied field matches. Registry errors and timeouts are unknown and not charged. 1 credit.'
      operationId: lookupNpi
      parameters:
      - name: number
        in: query
        required: true
        description: 10-digit NPI.
        schema:
          type: string
          pattern: ^[0-9 -]{10,14}$
        example: '1003000126'
      - name: name
        in: query
        description: Provider or organization name to verify against the record.
        schema:
          type: string
          maxLength: 100
      - name: state
        in: query
        description: Two-letter US state to verify against practice locations and licenses.
        schema:
          type: string
          maxLength: 100
      - name: taxonomy
        in: query
        description: Taxonomy code (208M00000X) or specialty description to verify.
        schema:
          type: string
          maxLength: 100
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: NPI lookup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NpiLookupResponse'
              example:
                npi: '1003000126'
                status: found
                checksum_valid: true
                reason: null
                notes: []
                provider:
                  npi: '1003000126'
                  type: individual
                  enumeration_type: NPI-1
                  name: ARDALAN ENKESHAFI
                  individual:
                    prefix: null
                    first_name: ARDALAN
                    middle_name: null
                    last_name: ENKESHAFI
                    suffix: null
                    credential: M.D.
                    sex: M
                  organization: null
                  record_status: A
                  active: true
                  enumeration_date: '2007-08-31'
                  certification_date: '2025-05-28'
                  last_updated: '2025-05-28'
                  sole_proprietor: false
                  taxonomies:
                  - code: 208M00000X
                    description: Hospitalist
                    primary: true
                    state: DC
                    license: MD600003480
                    group: null
                  primary_taxonomy:
                    code: 208M00000X
                    description: Hospitalist
                    primary: true
                    state: DC
                    license: MD600003480
                    group: null
                  addresses:
                    location:
                      purpose: location
                      address_type: DOM
                      line1: 6410 ROCKLEDGE DR STE 304
                      line2: null
                      city: BETHESDA
                      state: MD
                      postal_code: 20817-1841
                      country_code: US
                      country_name: United States
                      telephone: 443-602-6207
                      fax: null
                    mailing: null
                  practice_locations: []
                  identifiers: []
                  endpoints: []
                  other_names: []
                verification:
                  name:
                    status: match
                    matched_on: name
                  state:
                    status: match
                    matched_on: location
                  taxonomy:
                    status: not_requested
                    matched_on: null
                  fields_checked: 2
                  verified: true
                upstream_error_code: null
                source:
                  name: nppes_npi_registry
                  url: https://npiregistry.cms.hhs.gov/api/?version=2.1&number=1003000126
                  checked_at: '2026-10-18T03:58:55.722Z'
                  latency_ms: 286
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/npi/search:
    get:
      tags:
      - Business Verification
      summary: Search US healthcare providers
      description: Search the NPPES registry by individual (first_name, last_name) or organization_name, never both, with optional city, state, postal_code and taxonomy_description. A trailing * after at least 2 characters matches a prefix. Former names and practice locations also match. 1 credit per page; unknown results are not charged.
      operationId: searchNpi
      parameters:
      - name: first_name
        in: query
        description: Individual first name.
        schema:
          type: string
          maxLength: 100
      - name: last_name
        in: query
        description: Individual last name.
        schema:
          type: string
          maxLength: 100
      - name: organization_name
        in: query
        description: Organization name.
        schema:
          type: string
          maxLength: 100
      - name: city
        in: query
        description: City.
        schema:
          type: string
          maxLength: 100
      - name: state
        in: query
        description: Two-letter US state. Needs a name field too.
        schema:
          type: string
          maxLength: 100
      - name: postal_code
        in: query
        description: 5 or 9 digit ZIP code, or a prefix ending in *.
        schema:
          type: string
          maxLength: 100
      - name: taxonomy_description
        in: query
        description: Specialty description, such as Cardiology.
        schema:
          type: string
          maxLength: 100
      - name: limit
        in: query
        description: Results per page.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      - name: skip
        in: query
        description: Results to skip.
        schema:
          type: integer
          minimum: 0
