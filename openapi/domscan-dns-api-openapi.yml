  /v1/dns/propagation:
    get:
      tags:
      - DNS
      summary: Compare public recursive resolver answers
      description: Compare answers from DomScan's configured public recursive resolvers. Without expected, propagation_percentage is the share represented by the largest identical-answer cohort. With expected, it is the share whose answer matches the expected value. This is not a geographic or worldwide propagation measurement.
      operationId: getDnsPropagation
      parameters:
      - name: domain
        in: query
        required: true
        description: Domain whose recursive-resolver answers should be compared
        schema:
          type: string
          example: example.com
      - name: type
        in: query
        description: DNS record type to check
        schema:
          type: string
          enum:
          - A
          - AAAA
          - CNAME
          - MX
          - TXT
          - NS
          - SOA
          default: A
      - name: expected
        in: query
        description: Optional exact value to match after DNS-type normalization. When supplied, propagation_percentage measures expected-value matches instead of resolver convergence.
        schema:
          type: string
      responses:
        '200':
          description: Comparison across the configured public recursive resolvers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsPropagationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 2
  /v1/dns/propagation/bulk:
    post:
      operationId: bulkDnsPropagation
      summary: Compare resolver answers for multiple domains
      description: Compare one DNS record type across the configured public recursive resolvers for multiple domains. This is not a worldwide geographic propagation measurement. Accepts up to 10 items, preserves input order, and uses bounded concurrency. The outer response is HTTP 200 when the batch is accepted, so inspect each result for data or an error. Billing is 2 credits per validated item with no bulk discount, including items that return a per-item lookup error.
      tags:
      - DNS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domains
              properties:
                domains:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: hostname
                type:
                  type: string
                  enum:
                  - A
                  - AAAA
                  - CNAME
                  - MX
                  - TXT
                  - NS
                  - SOA
                  default: A
                expected:
                  type: string
            example:
              domains:
              - example.com
              - cloudflare.com
              type: A
      responses:
        '200':
          description: Batch accepted. Each ordered result contains either data or a per-item error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkLookupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_item
        default: 2
  /v1/dns/servers:
    get:
      tags:
      - DNS
      summary: List configured recursive resolvers
      description: List the public recursive DoH providers used for resolver comparison. These are global anycast services, not geographic probes.
      operationId: getDnsServers
      responses:
        '200':
          description: List of DNS servers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsServersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 0
components:
  schemas:
    SpfLookupTree:
      type: object
      description: Recursive SPF lookup graph with per-node status, includes, redirects, and cycle/limit visibility.
      properties:
        root_domain:
          type: string
        node_count:
          type: integer
        max_depth:
          type: integer
        cycles_detected:
          type: array
          items:
            type: string
        nodes:
          type: array
          items:
            type: object
            properties:
              domain:
                type: string
              depth:
                type: integer
              status:
                type: string
                enum:
                - present
                - missing
                - cycle
                - error
                - limit_exceeded
              direct_lookup_count:
                type: integer
              total_lookup_count:
                type: integer
              includes:
                type: array
                items:
                  type: string
              redirect:
                type:
                - string
                - 'null'
              mechanisms:
                type: array
                items:
                  type: string
              errors:
                type: array
                items:
                  type: string
        edges:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string
              type:
                type: string
                enum:
                - include
                - redirect
    DnsServersResponse:
      type: object
      description: Configured public recursive DoH providers. These are global anycast services, not geographic probes.
      properties:
        measurement_scope:
          type: string
          enum:
          - configured_recursive_resolvers
        geographic_vantage:
          type: boolean
          enum:
          - false
        servers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              location:
                type: string
              country:
                type: string
              ip:
                type: string
              provider:
                type: string
              scope:
                type: string
                enum:
                - global-anycast
              doh_endpoint:
                type: string
                format: uri
              documentation_url:
                type: string
                format: uri
              format:
                type: string
                enum:
                - dns-json
        total:
          type: integer
    ErrorResponse:
      type: object
      description: Standard error response format
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Error code for programmatic handling
              example: INVALID_DOMAIN
            type:
              type: string
              enum:
              - authentication_error
              - credits_error
              - permission_error
              - not_found_error
              - conflict_error
              - rate_limit_error
              - timeout_error
              - validation_error
              - upstream_error
              - api_error
              - request_error
              description: Stable error category used by official SDK subclasses
            message:
              type: string
              description: Human-readable error message
              example: Invalid domain format
            status:
              type: integer
              minimum: 400
              maximum: 599
              description: HTTP status repeated in the JSON error for queue and log processors
            retryable:
              type: boolean
              description: Whether retrying can be appropriate after applying retry guidance
            request_id:
              type: string
              description: Request identifier matching the X-Request-Id response header
            suggestion:
              type: string
              description: Suggestion for fixing the error
            details:
              type: object
              description: Optional structured context for the error
              additionalProperties: true
            retry_after:
              type: integer
              minimum: 0
