openapi: 3.2.0
info:
  title: DomScan DNS API
  description: DomScan is a domain intelligence API providing domain analysis tools.
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: DNS
  description: DNS record lookup, security analysis, and propagation checking
paths:
  /v1/dns:
    get:
      tags:
      - DNS
      summary: DNS record lookup
      description: Query specific DNS record types for a domain. Returns records with TTL, DNSSEC validation status, semantic TXT classification, additive warnings, and query timing.
      operationId: getDnsRecords
      parameters:
      - name: domain
        in: query
        required: true
        description: Domain to query DNS records for
        schema:
          type: string
          example: example.com
      - name: type
        in: query
        description: DNS record type to query
        schema:
          type: string
          enum:
          - A
          - AAAA
          - MX
          - NS
          - TXT
          - SOA
          - CNAME
          - CAA
          - PTR
          - SRV
          default: A
      responses:
        '200':
          description: DNS records for the specified type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsResponse'
              example:
                domain: google.com
                record_type: TXT
                records:
                - type: TXT
                  name: google.com
                  data: v=spf1 include:_spf.google.com ~all
                  ttl: 300
                  classification: spf
                - type: TXT
                  name: google.com
                  data: google-site-verification=abc123
                  ttl: 300
                  classification: verification
                status: success
                dnssec_validated: false
                query_time_ms: 37
                checked_at: '2026-04-18T21:00:00Z'
                warnings:
                - code: TXT_MULTIPLE_RESPONSES
                  message: Domain publishes multiple TXT records; use classification to isolate the security ones.
                  severity: info
                meta:
                  served_by: pop=unknown country=unknown
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/dns/bulk:
    post:
      tags:
      - DNS
      summary: Bulk DNS record lookup
      description: 'Query one DNS record type across multiple domains in a single request.


        **Credits:** 1 credit per domain. Max 25 domains per request.'
      operationId: bulkDnsLookup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domains
              properties:
                domains:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 25
                  description: Array of domains to query
                  example:
                  - example.com
                  - cloudflare.com
                type:
                  type: string
                  enum:
                  - A
                  - AAAA
                  - NS
                  - MX
                  - TXT
                  - CAA
                  - SOA
                  - CNAME
                  - PTR
                  - SRV
                  - HTTPS
                  - SVCB
                  default: A
                  description: DNS record type to query for every domain
      responses:
        '200':
          description: Bulk DNS lookup results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDnsResponse'
              example:
                results:
                - domain: example.com
                  record_type: A
                  records:
                  - type: A
                    name: example.com
                    data: 93.184.216.34
                    ttl: 300
                  status: success
                  dnssec_validated: true
                  query_time_ms: 22
                  checked_at: '2024-01-15T12:00:00Z'
                - domain: missing.invalid
                  record_type: A
                  records: []
                  status: error
                  dnssec_validated: false
                  query_time_ms: 0
                  checked_at: '2024-01-15T12:00:00Z'
                  error:
                    code: INVALID_DOMAIN
                    message: Invalid domain format
                summary:
                  total: 2
                  successful: 1
                  nxdomain: 0
                  errors: 1
                  query_time_ms: 31
                meta:
                  served_by: pop=MAD country=ES
                  record_type: A
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_item
        default: 1
  /v1/dns/all:
    get:
      tags:
      - DNS
      summary: Get all DNS records
      description: Query all common DNS record types (A, AAAA, NS, MX, TXT, CAA, SOA, HTTPS, SVCB) in parallel. Returns a comprehensive view of domain DNS configuration plus optional additive signals (IPv6 parity, MX priority sanity, private-IP leaks, TXT classification, wildcard probe).
      operationId: getAllDnsRecords
      parameters:
      - name: domain
        in: query
        required: true
        description: Domain to query
        schema:
          type: string
          example: example.com
      - name: wildcard_probe
        in: query
        required: false
        description: When set to 1, perform a random-label probe to detect wildcard DNS. Adds one extra DoH lookup.
        schema:
          type: string
          enum:
          - '1'
      responses:
        '200':
          description: All DNS records grouped by type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsAllResponse'
              example:
                domain: openai.com
                records:
                  A:
                  - type: A
                    name: openai.com
                    data: 104.18.33.45
                    ttl: 300
                  AAAA:
                  - type: AAAA
                    name: openai.com
                    data: 2606:4700::6812:212d
                    ttl: 300
                  MX:
                  - type: MX
                    name: openai.com
                    data: aspmx.l.google.com
                    ttl: 300
                    priority: 1
                  NS:
                  - type: NS
                    name: openai.com
                    data: ns1-02.azure-dns.com
                    ttl: 172800
                  - type: NS
                    name: openai.com
                    data: ns2-02.azure-dns.net
                    ttl: 172800
                  TXT:
                  - type: TXT
                    name: openai.com
                    data: v=spf1 include:_spf.google.com ~all
                    ttl: 300
                    classification: spf
                  - type: TXT
                    name: openai.com
                    data: v=TLSRPTv1; rua=mailto:tlsrpt@openai.com
                    ttl: 300
                    classification: tls_rpt
                summary:
                  has_a: true
                  has_aaaa: true
                  has_ns: true
                  has_mx: true
                  has_txt: true
                  has_https: false
                  has_svcb: false
                  ipv6_parity: full
                warnings:
                - code: MX_PRIORITY_SHARED
                  message: Multiple MX hosts share the same priority.
                  severity: info
                wildcard:
                  suspected: false
                  probe_label: _domscan-probe-4f6a2c.openai.com
                query_time_ms: 82
                checked_at: '2026-04-18T21:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 2
  /v1/dns/security:
