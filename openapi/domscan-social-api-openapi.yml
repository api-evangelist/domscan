openapi: 3.2.0
info:
  title: DomScan Social API
  description: 'DomScan is a domain intelligence API providing domain analysis tools. **Core Features:**

    - Domain Availability: Check single or bulk domains using RDAP with 1,100+ TLDs supported

    - Domain Intelligence: AI suggestions, valuations, health checks, typosquatting detection

    - OSINT Tools: DNS lookup, WHOIS/RDAP, SSL certificates, subdomain discovery, IP geolocation, tech stack detection

    - Social & Branding: Social handle checker, brand name scoring

    - Phone Intelligence: Privacy-first phone number validation, normalization, and classification

    - Pricing: Scheduled standard-TLD tables from verified official registrar sources, plus separate credential-backed exact-domain quotes

    - Watchlist: Domain monitoring for expiration and availability alerts


    **Authentication:**

    Most API endpoints require authentication. Pass your API key via the x-api-key header or Authorization: Bearer header. Operations marked with an empty security requirement are intentionally public, including API specifications and selected catalog endpoints. Get your free API key at https://domscan.net/dashboard. Logged-in users on domscan.net tools pages are authenticated automatically via session cookie. **Rate Limits:**

    Free accounts can sustain 120 requests per minute per account, with a burst capacity of 60. All API keys and dashboard sessions belonging to the same free account share this budget. Bulk endpoints have an additional free-tier budget of 20 HTTP requests per minute per account across all bulk endpoints. Free-tier bulk traffic is also capped at 100 requests per minute per IPv4 address or IPv6 /56 network. Platform-wide edge protections still apply to every tier. Paid accounts can sustain 600 requests per minute, with a burst capacity of 120, shared by every API key and dashboard session of the account. Paid accounts do not receive the additional free-tier bulk budget. Scope: RapidAPI subscribers are counted per subscriber. (scope=rapidapi-customer) Zyla subscribers are counted per subscriber when the gateway identifies them, (scope=zyla-customer) and as one shared gateway budget when it does not. (scope=zyla-gateway) Other authenticated requests are counted per account: every API key and dashboard session of the account shares one budget. (scope=account) A key that is not linked to an account is counted on its own. (scope=api-key) Unauthenticated requests to public endpoints are counted per client IP address (scope unknown when the address cannot be determined, as one shared budget). (scope=ip)


    Every authenticated response, success or error, includes X-RateLimit-Plan, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, and X-RateLimit-Policy. X-RateLimit-Limit and X-RateLimit-Remaining describe the immediate burst bucket; X-RateLimit-Reset is the Unix time in seconds when that bucket is full again; X-RateLimit-Policy also states the sustained per-minute rate, scope, and any free bulk limits. Exceeding a limit returns HTTP 429 with Retry-After. Retry only after the indicated delay. **Credits System:**

    API calls consume credits based on endpoint complexity. Sign up for free to receive 10,000 credits monthly. - 1 credit: Status checks, DNS lookups, tool builders

    - 2-5 credits: Health checks, valuations, OSINT tools

    - Bulk endpoints: standard per-item rate for batching multiple items into fewer HTTP requests. - 6-25 credits: Recipe compound operations


    When credits reach zero, the API returns HTTP 402 with credits_remaining, credits_required, and a purchase_url. API responses include X-Credits-Requested, X-Credits-Charged, and X-Credits-Refunded. X-Credits-Charged is the net charge after any refund made during the request. Authenticated responses also include X-Credits-Remaining whenever the balance is known without an extra lookup. Free credits refresh monthly on the account''s signup anniversary. POST /v1/estimate returns the credits a request would charge without running it, at no cost.'
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: Social
  description: Social media handle availability checking
paths:
  /v1/name-check:
    get:
      tags:
      - Social
      summary: Check a name across domains, handles and package registries
      description: 'Check one name everywhere in a single request: domain availability across up to 20 TLDs (default com, io, ai, co, app, dev, net, org), the same handle on social and developer platforms (a curated default set, or all), and the package name in npm, PyPI, crates.io, RubyGems, NuGet, Packagist (vendor) and Homebrew. Each item keeps its own status; blocked, rate-limited or failed checks are unknown, never available. The verdict and score summarise the definite results. 5 credits; refunded when nothing could be determined.'
      operationId: checkNameAvailability
      parameters:
      - name: name
        in: query
        required: true
        description: Letters, digits and inner hyphens.
        schema:
          type: string
          minLength: 2
          maxLength: 63
          example: acmeflow
      - name: tlds
        in: query
        description: Up to 20 TLDs. Default com,io,ai,co,app,dev,net,org.
        schema:
          type: string
          example: com,io,ai
      - name: platforms
        in: query
        description: 'Platform ids from /v1/social/info, all or none. Default: 20 major platforms.'
        schema:
          type: string
          example: github,instagram,tiktok
      - name: packages
        in: query
        description: npm, pypi, crates, rubygems, nuget, packagist, homebrew, all or none. Default all.
        schema:
          type: string
          example: npm,pypi
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Name availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameCheckResponse'
              example:
                name: acmeflow
                status: ok
                checked_at: '2026-10-13T18:00:00.000Z'
                verdict: mostly_available
                score: 80
                determinacy: 100
                summary:
                  com_available: false
                  domains:
                    checked: 2
                    free: 1
                    taken: 1
                    unknown: 0
                  handles:
                    checked: 2
                    free: 2
                    taken: 0
                    unknown: 0
                  packages:
                    checked: 1
                    free: 1
                    taken: 0
                    unknown: 0
                domains:
                - domain: acmeflow.com
                  tld: com
                  status: taken
                  reason: null
                - domain: acmeflow.io
                  tld: io
                  status: available
                  reason: null
                handles:
                - platform: github
                  status: available
                  url: null
                  reason: null
                - platform: instagram
                  status: available
                  url: null
                  reason: null
                packages:
                - registry: npm
                  name: acmeflow
                  status: not_found
                  url: null
                  reason: similar_name_rules
                meta:
                  duration_ms: 4210
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 5
  /v1/social:
    get:
      tags:
      - Social
      summary: Check social handle availability
      description: Check if a username is available on supported platforms, or opt into a scoped resource check such as a repository, subreddit, invite, Substack profile, or federated account. Broad checks use a bounded server processing budget (12 seconds by default); unfinished live platform or resource checks return an explicit unknown timeout result instead of delaying the whole response.
      operationId: checkSocialHandles
      parameters:
      - name: handle
        description: Social handle to check, without a leading @.
        in: query
        required: true
        schema:
          type: string
          example: myusername
      - name: platforms
        in: query
        description: Comma-separated platforms to check. Defaults to all known social platforms. Aliases listed by GET /v1/social/info are accepted. An explicitly empty value is valid only when at least one scoped resource is requested.
        schema:
          type: string
          example: github,gitlab,bitbucket,devto,huggingface,dribbble,soundcloud,gumroad,buymeacoffee,substack,itchio,hackernews,reddit,bluesky,patreon,snapchat,youtube
      - name: resources
        in: query
        description: Optional comma-separated resource types. If platforms is omitted, the request checks only these resources. Aliases listed by GET /v1/social/info are accepted.
        schema:
          type: string
          example: github:repository
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Platform availability results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialResponse'
              example:
                handle: examplebrand
                checked_at: '2026-10-09T10:15:30.000Z'
                availability:
                  github:
                    available: true
                    profile_url: null
                    checked: true
                    method: official_api
                    confidence: high
                    latency_ms: 112
                    evidence:
                      source: upstream
                    requested: true
                  gitlab:
                    available: false
                    profile_url: https://gitlab.com/examplebrand
                    checked: true
                    entity_type: user
                    canonical_handle: examplebrand
                    visibility: public
                    method: official_api
                    confidence: high
                    latency_ms: 96
                    evidence:
                      source: upstream
                    requested: true
                  reddit:
                    available: null
                    profile_url: null
                    checked: false
                    reason: not_requested
                    method: public_endpoint
                    confidence: high
                    latency_ms: 0
                    evidence:
                      source: not_requested
                    requested: false
                resources: {}
                resource_summary:
                  requested_count: 0
                  checked_count: 0
                  present_count: 0
                  absent_count: 0
                  unknown_count: 0
                  cached_count: 0
                  determinacy_rate: 0
                summary:
                  available_count: 1
                  unavailable_count: 1
                  unknown_count: 34
                summary_v2:
                  requested_count: 2
                  checked_count: 2
                  available_count: 1
                  unavailable_count: 1
                  unknown_count: 0
                  not_supported_count: 0
                  determinacy_rate: 1
                platform_summary:
                  requested_count: 2
                  checked_count: 2
                  available_count: 1
                  unavailable_count: 1
                  unknown_count: 0
                  not_supported_count: 0
                  cached_count: 0
                  high_confidence_count: 2
                  live_platform_count: 2
                  experimental_count: 0
                  blocked_count: 0
                  beta_limited_count: 0
                  determinacy_rate: 1
                  method_counts:
                    official_api: 2
                  source_counts:
                    upstream: 2
                beta_notice: This endpoint is in beta. Supported platforms and coverage may expand as new checkers graduate to production.
                meta:
                  supported_platforms:
                  - github
                  - gitlab
                  - bitbucket
                  supported_resources:
                  - reddit:subreddit
                  - github:repository
                  - gitlab:project
                  unsupported_platforms: []
                  latency_ms: 412
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 2
  /v1/social/bulk:
    post:
      tags:
      - Social
      summary: Check social handle availability in bulk
      description: Check up to 10 handles in one request. Each valid handle costs the normal 2-credit rate, with no bulk discount. Invalid handles are returned as per-item errors and are not billed. Other per-handle failures do not prevent successful results from being returned.
      operationId: bulkCheckSocialHandles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - handles
              properties:
                handles:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                  description: Social handles to check.
                platforms:
                  type: array
                  items:
                    type: string
                  description: Optional platforms to check for every handle. Defaults to all known platforms. Aliases listed by GET /v1/social/info are accepted. An empty array is valid only when at least one scoped resource is requested.
                resources:
                  type: array
                  items:
                    type: string
                  description: Optional resource types to check for every identifier. If platforms is omitted, only these resources are checked.
            example:
              handles:
              - mycompany
              - myproduct
              platforms:
              - github
              - reddit
              - youtube
      responses:
        '200':
          description: Bulk social handle availability results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SocialBulkResponse'
              example:
                results:
                - handle: mycompany
                  availability:
                    github:
                      available: false
                      profile_url: https://github.com/mycompany
                      checked: true
                      requested: true
                      method: official_api
                      confidence: high
                  resources: {}
                  resource_summary:
                    requested_count: 0
                    checked_count: 0
                    present_count: 0
                    absent_count: 0
                    unknown_count: 0
                    cached_count: 0
                    determinacy_rate: 0
                  summary:
                    available_count: 0
                    unavailable_count: 1
                    unknown_count: 0
                  checked_at: '2026-07-09T20:45:00.000Z'
                - handle: myproduct
                  availability:
                    github:
                      available: true
                      profile_url: null
                      checked: true
                      requested: true
                      method: official_api
                      confidence: high
                  resources: {}
                  resource_summary:
                    requested_count: 0
                    checked_count: 0
                    present_count: 0
                    absent_count: 0
                    unknown_count: 0
                    cached_count: 0
                    determinacy_rate: 0
                  summary:
                    available_count: 1
                    unavailable_count: 0
                    unknown_count: 0
                  checked_at: '2026-07-09T20:45:00.000Z'
                summary:
                  total: 2
                  succeeded: 2
                  failed: 0
                beta_notice: Social handle checks are in beta; verify critical results directly.
                meta:
                  served_by: pop=MAD country=ES
                  platforms:
                  - github
                  resources: []
                  max_handles: 10
                  credits_per_handle: 2
                  credits_required: 4
                  latency_ms: 420
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/DryRun'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-credits:
        model: per_item
        default: 2
  /v1/social/info:
    get:
      tags:
      - Social
      summary: Get social handle endpoint details
      description: Returns supported platforms, parameters, and an example response for the social handle checker.
      operationId: getSocialInfo
      responses:
        '200':
          description: Social endpoint reference
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoint:
                    type: string
                  description:
                    type: string
                  parameters:
                    type: object
                  bulk:
                    type: object
                    properties:
                      endpoint:
                        type: string
                      method:
                        type: string
                        enum:
                        - POST
                      max_handles:
                        type: integer
                        example: 10
                      credits_per_handle:
                        type: integer
                        example: 2
                      pricing_formula:
                        type: string
                        example: valid_handle_count * credits_per_handle
                      bulk_discount:
                        type: boolean
                        example: false
                      invalid_handles_charged:
                        type: boolean
                        example: false
                      partial_results:
                        type: boolean
                        example: true
                      parameters:
                        type: object
                      example_request:
                        type: object
                    required:
                    - endpoint
                    - method
                    - max_handles
                    - credits_per_handle
                    - pricing_formula
                    - bulk_discount
                    - invalid_handles_charged
                    - partial_results
                    - parameters
                    - example_request
                  platforms:
                    type: object
                    properties:
                      supported:
                        type: array
                        items:
                          type: string
                      coming_soon:
                        type: array
                        items:
                          type: string
                      experimental:
                        type: array
                        items:
                          type: string
                      planned:
                        type: array
                        items:
                          type: string
                      blocked:
                        type: array
                        items:
                          type: string
                      details:
                        type: array
                        description: Platform metadata used by docs and tools. Includes live, experimental, planned, and blocked platforms.
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            display_name:
                              type: string
                            aliases:
                              type: array
                              items:
                                type: string
                            category:
                              type: string
                            tier:
                              type: integer
                              enum:
                              - 0
                              - 1
                              - 2
                            status:
                              type: string
                              enum:
                              - live
                              - experimental
                              - planned
                              - blocked
                            method:
                              type: string
                              enum:
                              - official_api
                              - public_endpoint
                              - public_profile
                              - not_available
                            confidence:
                              type: string
                              enum:
                              - high
                              - medium
                              - low
                              - none
                            logo_key:
                              type: string
                            profile_url_template:
                              type:
                              - string
                              - 'null'
                            docs_anchor:
                              type: string
                            caveat_codes:
                              type: array
                              items:
                                type: string
                              description: Stable caveat codes for docs and localized UI rendering.
                            cache_ttl_s:
                              type: object
                              description: Recommended cache TTL policy by result class.
                              properties:
                                available:
                                  type: integer
                                taken:
                                  type: integer
                                unknown:
                                  type: integer
                                rate_limited:
                                  type: integer
                            handle_rules:
                              type: object
                              properties:
                                min_length:
                                  type: integer
                                max_length:
                                  type: integer
                                description:
                                  type: string
                  resource_types:
                    type: object
                    properties:
                      supported:
                        type: array
                        items:
                          type: string
                      details:
                        type: array
                        items:
                          type: object
                  example_request:
                    type: string
                  resource_example_request:
                    type: string
                  example_response:
                    type: object
              example:
                endpoint: /v1/social
                description: Check if a username is available on supported social platforms.
                parameters:
                  handle:
                    type: string
                    required: true
                    description: Username to check
                  platforms:
                    type: string
                    required: false
                    description: Comma-separated platform list
                    example: github,gitlab,reddit
                  resources:
                    type: string
                    required: false
                    description: Comma-separated resource type list
                    example: github:repository
                bulk:
                  endpoint: /v1/social/bulk
                  method: POST
                  max_handles: 10
                  credits_per_handle: 2
                  pricing_formula: valid_handle_count * credits_per_handle
                  bulk_discount: false
                  invalid_handles_charged: false
                  partial_results: true
                  parameters:
                    handles:
                      type: array
                      required: true
                      min_items: 1
                      max_items: 10
                    platforms:
                      type: array
                      required: false
                    resources:
                      type: array
                      required: false
                  example_request:
                    handles:
                    - mycompany
                    - myproduct
                    platforms:
                    - github
                    - reddit
                    - youtube
                platforms:
                  supported:
                  - github
                  - gitlab
                  - bitbucket
                  - devto
                  - huggingface
                  - dribbble
                  - soundcloud
                  - gumroad
                  - buymeacoffee
                  - substack
                  - itchio
                  - behance
                  - dockerhub
                  - hashnode
                  - rubygems
                  - hackernews
                  - reddit
                  - bluesky
                  - twitter
                  - instagram
                  - facebook
                  - threads
                  - pinterest
                  - snapchat
                  - telegram
                  - twitch
                  - patreon
                  - tiktok
                  - youtube
                  - linkedin
                  - steam
                  - tumblr
                  - vimeo
                  - letterboxd
                  - linktree
                  - kick
                  - medium
                  - mastodon
                  - roblox
                  - minecraft
                  - chesscom
                  - lichess
                  - npm
                  - discord
                  coming_soon: []
                  experimental: []
                  planned: []
                  blocked: []
                  details:
                  - id: github
                    display_name: GitHub
                    aliases:
                    - github
                    category: developer
                    tier: 0
                    status: live
                    method: official_api
                    confidence: high
                    logo_key: github
                    profile_url_template: https://github.com/{handle}
                    docs_anchor: github
                    caveat_codes: []
                    cache_ttl_s:
                      available: 300
