            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      x-domscan-credits:
        model: per_request
        default: 0
components:
  schemas:
    SocialResourceResult:
      type: object
      description: A scoped platform resource observation. Exists describes public presence; claimability is separate because public absence does not always guarantee registration eligibility.
      properties:
        classification:
          $ref: '#/components/schemas/ClassificationStatus'
        identifier:
          type: string
        network:
          type: string
        resource_type:
          type: string
        exists:
          type:
          - boolean
          - 'null'
        claimability:
          type: string
          enum:
          - available
          - taken
          - unknown
          - not_applicable
        checked:
          type: boolean
        canonical_url:
          type:
          - string
          - 'null'
        canonical_id:
          type: string
        canonical_handle:
          type: string
        entity_type:
          type: string
        visibility:
          type: string
          enum:
          - public
          - unknown
        reason:
          type: string
          enum:
          - blocked
          - error
          - invalid_identifier
          - rate_limited
          - timeout
        method:
          type: string
          enum:
          - official_api
          - public_endpoint
          - public_profile
          - not_available
        confidence:
          type: string
          enum:
          - high
          - medium
          - low
          - none
        latency_ms:
          type: integer
        evidence:
          type: object
          properties:
            source:
              type: string
              enum:
              - cache
              - upstream
              - validation
              - request_budget
        cached:
          type: boolean
        cache_age_s:
          type: integer
        metadata:
          type: object
          additionalProperties: true
      required:
      - identifier
      - network
      - resource_type
      - exists
      - claimability
      - checked
      - canonical_url
      - method
      - confidence
      - latency_ms
      - evidence
    SocialResourceSummary:
      type: object
      properties:
        requested_count:
          type: integer
        checked_count:
          type: integer
        present_count:
          type: integer
        absent_count:
          type: integer
        unknown_count:
          type: integer
        cached_count:
          type: integer
        determinacy_rate:
          type: number
          minimum: 0
          maximum: 1
      required:
      - requested_count
      - checked_count
      - present_count
      - absent_count
      - unknown_count
      - cached_count
      - determinacy_rate
    ClassificationEvidence:
      type: object
      description: 'Where a classification came from: the source that answered, the method used, when it was observed and an optional machine-readable detail.'
      properties:
        source:
          type: string
          description: Source that produced the observation, for example rdap, dns, http or cache.
          example: rdap
        method:
          type: string
          description: Check method used, for example rdap_lookup, txt_lookup or http_get.
          example: rdap_lookup
        observed_at:
          type: string
          format: date-time
          description: When the evidence was observed. Earlier than checked_at for cached results.
        detail:
          type: string
          description: Optional machine-readable detail such as http_404, nxdomain or taken.
      required:
      - source
      - method
      - observed_at
    NameCheckSection:
      type: object
      required:
      - checked
      - free
      - taken
      - unknown
      properties:
        checked:
          type: integer
          minimum: 0
        free:
          type: integer
          minimum: 0
        taken:
          type: integer
          minimum: 0
        unknown:
          type: integer
          minimum: 0
    ClassificationStatus:
      type: object
      description: Shared present/absent/unknown classification. present and absent are returned only from exact authoritative evidence. Blocked, rate-limited, timed-out, failed and ambiguous checks are unknown with a reason, never absent.
      properties:
        status:
          type: string
          enum:
          - present
          - absent
          - unknown
          description: present, absent or unknown.
        reason:
          type: string
          enum:
          - blocked
          - rate_limited
          - timeout
          - ambiguous
          - upstream_error
          - unsupported
          description: Why the result is unknown. Returned only when status is unknown.
        evidence:
          $ref: '#/components/schemas/ClassificationEvidence'
        checked_at:
          type: string
          format: date-time
          description: When DomScan produced this classification.
      required:
      - status
      - evidence
      - checked_at
    NameCheckResponse:
      type: object
      required:
      - name
      - status
      - checked_at
      - verdict
      - score
      - determinacy
      - summary
      - domains
      - handles
      - packages
      - meta
      properties:
        name:
          type: string
          description: The normalized name that was checked.
        status:
          type: string
          enum:
          - ok
          - unknown
          description: 'unknown: no item had a definite answer; refunded.'
        checked_at:
          type: string
          format: date-time
        verdict:
          type: string
          enum:
          - available_everywhere
          - mostly_available
          - contested
          - unknown
          description: 'available_everywhere: every checked item is free. mostly_available: at least 70% of definite results are free. contested: less than 70%. unknown: fewer than half of the items had a definite answer.'
        score:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
          description: Share of definite results that are free.
        determinacy:
          type: integer
          minimum: 0
          maximum: 100
          description: Share of checked items with a definite answer.
        summary:
          type: object
          required:
          - com_available
          - domains
          - handles
          - packages
          properties:
            com_available:
              type:
              - boolean
              - 'null'
            domains:
              $ref: '#/components/schemas/NameCheckSection'
            handles:
              $ref: '#/components/schemas/NameCheckSection'
            packages:
              $ref: '#/components/schemas/NameCheckSection'
        domains:
          type: array
          items:
            type: object
            required:
            - domain
            - tld
            - status
            - reason
            properties:
              domain:
                type: string
              tld:
                type: string
              status:
                type: string
                enum:
                - available
                - taken
                - unknown
              reason:
                type:
                - string
                - 'null'
        handles:
          type: array
          items:
            type: object
            required:
            - platform
            - status
            - url
            - reason
            properties:
              platform:
                type: string
              status:
                type: string
                enum:
                - available
                - taken
                - unknown
                - not_supported
                - invalid
                description: 'invalid: the name breaks this platform handle rules (reason invalid_handle); not counted'
              url:
                type:
                - string
                - 'null'
                description: Profile URL when taken.
              reason:
                type:
                - string
                - 'null'
        packages:
          type: array
          items:
            type: object
            required:
            - registry
            - name
            - status
            - url
            - reason
            properties:
              registry:
                type: string
                enum:
                - npm
                - pypi
                - crates
                - rubygems
                - nuget
                - packagist
                - homebrew
              name:
                type: string
                description: The name as normalized by the registry.
              status:
                type: string
                enum:
                - taken
                - not_found
                - unknown
                - invalid
                description: 'not_found: no package uses the name; the registry may still refuse names too similar to existing ones.'
              url:
                type:
                - string
                - 'null'
              reason:
                type:
                - string
                - 'null'
        meta:
          type: object
          required:
          - duration_ms
          properties:
            duration_ms:
              type: integer
              minimum: 0
    SocialResponse:
      type: object
      description: Social handle availability check
      properties:
        handle:
          type: string
          description: Username checked
        checked_at:
          type: string
          format: date-time
        availability:
          type: object
          description: Per-platform availability results keyed by platform id
          additionalProperties:
            type: object
            properties:
              available:
                type:
                - boolean
                - 'null'
                description: true when available, false when taken, null when the platform could not be checked
              classification:
                $ref: '#/components/schemas/ClassificationStatus'
              profile_url:
                type:
                - string
                - 'null'
                description: Profile URL when the handle is taken and a canonical URL is known
              checked:
                type: boolean
                description: Whether DomScan completed a deterministic check for this platform
              requested:
                type: boolean
                description: Whether this platform was included in the caller request. False means the platform result is present only because the legacy response includes every known platform.
              reason:
                type: string
                enum:
                - blocked
                - rate_limited
                - error
                - not_supported
                - timeout
                - invalid_handle
                - reserved
                - not_requested
                - claimability_unknown
                description: Reason metadata for a reserved name or why a deterministic availability result could not be returned. `blocked` means the platform refused access (HTTP 401/403); `rate_limited` means it asked us to slow down (HTTP 429). `claimability_unknown` means the platform gave an exact not-found answer, so no public account uses the handle, but no public source proves it can be registered (suspended, retired and reserved names look the same); `classification.status` is `absent` and `available` stays null.
              method:
                type: string
                enum:
                - official_api
                - public_endpoint
                - public_profile
                - not_available
                description: Checker method associated with this platform result
              confidence:
                type: string
                enum:
                - high
                - medium
                - low
                - none
                description: Current confidence level for this checker method
              latency_ms:
                type: integer
                description: Checker latency in milliseconds, request-budget wait for an unfinished check, or 0 for cached/skipped results
              evidence:
                type: object
                description: Small evidence metadata for how this result was produced
                properties:
                  source:
                    type: string
                    enum:
                    - cache
                    - upstream
                    - validation
                    - not_supported
                    - not_requested
                    - circuit_breaker
                    - concurrency_limiter
                    - request_budget
                    - stale_cache
                    - canary_quarantine
                    description: '`stale_cache` serves earlier exact taken evidence (see `cache_age_s`) only while it remains within that platform’s normal taken-cache freshness limit and the live check is inconclusive; older evidence and earlier absence are never reused. `canary_quarantine` means a positive answer was withheld because DomScan monitoring caught this platform reporting known accounts as available.'
              cached:
                type: boolean
                description: Whether this result was served from cache
              cache_age_s:
                type: integer
                description: Age of the cached result in seconds
              entity_type:
                type: string
                description: Observed account or page type when the upstream exposes it
              canonical_id:
                type: string
                description: Stable upstream identifier when publicly exposed
              canonical_handle:
                type: string
                description: Canonical handle casing returned by the upstream
              visibility:
                type: string
                enum:
                - public
                - private
                - restricted
                - unknown
              verified:
                type: boolean
              metadata:
                type: object
                additionalProperties: true
                description: Small, platform-specific public metadata when available
        resources:
          type: object
          description: Opt-in scoped resource results keyed by resource type
          additionalProperties:
            $ref: '#/components/schemas/SocialResourceResult'
        resource_summary:
          $ref: '#/components/schemas/SocialResourceSummary'
        summary:
          type: object
          description: Legacy summary across every known platform, including platforms that were not requested
          properties:
            available_count:
              type: integer
            unavailable_count:
              type: integer
            unknown_count:
              type: integer
        summary_v2:
          type: object
          description: Requested-platform summary. This is additive and avoids counting unrequested platforms as unknown.
          properties:
            requested_count:
              type: integer
            checked_count:
              type: integer
            available_count:
              type: integer
            unavailable_count:
              type: integer
            unknown_count:
              type: integer
            not_supported_count:
              type: integer
            determinacy_rate:
              type: number
              minimum: 0
              maximum: 1
              description: checked_count / requested_count rounded to four decimals
        platform_summary:
          $ref: '#/components/schemas/SocialPlatformSummary'
        beta_notice:
          type: string
        meta:
          type: object
          additionalProperties: true
          properties:
            served_by:
              type: string
              description: Location that served the request, as `pop=<code> country=<code>`.
            supported_platforms:
              type: array
              items:
                type: string
            supported_resources:
              type: array
              items:
                type: string
            unsupported_platforms:
              type: array
              items:
                type: string
            latency_ms:
              type: integer
    SocialBulkResponse:
      type: object
      description: Bulk social handle availability response for up to 10 handles. Results preserve request order and isolate per-handle failures.
      properties:
        results:
          type: array
          description: One result per requested handle, in request order. Invalid handles and isolated processing failures contain an error object.
          items:
            oneOf:
            - $ref: '#/components/schemas/SocialResponse'
            - type: object
              properties:
                handle:
                  type:
                  - string
                  - 'null'
                error:
                  type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - INVALID_HANDLE
                      - INTERNAL
                    message:
                      type: string
                  required:
                  - code
                  - message
              required:
              - handle
              - error
        summary:
          type: object
          description: Counts for all requested handles and their per-item outcomes.
          properties:
            total:
              type: integer
              description: Number of submitted handles.
            succeeded:
              type: integer
              description: Handles with availability results.
            failed:
              type: integer
              description: Handles returned with per-item errors.
          required:
          - total
          - succeeded
          - failed
        beta_notice:
          type: string
        meta:
          type: object
          properties:
            served_by:
              type: string
            platforms:
              type: array
              items:
                type: string
            resources:
              type: array
              items:
                type: string
            max_handles:
              type: integer
              example: 10
            credits_per_handle:
              type: integer
              example: 2
            credits_required:
              type: integer
              description: Total credit cost for valid handles in this request. There is no bulk discount.
              example: 4
            latency_ms:
              type: integer
      required:
      - results
      - summary
      - beta_notice
      - meta
    ErrorResponse:
      type: object
      description: Canonical error format shared by every API error response. Endpoint-specific fields (for example credits_remaining, login_url or evidence_summary) may appear next to error or inside it; clients should ignore fields they do not recognise.
      additionalProperties: true
      properties:
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
              description: Stable, upper-case machine code. Codes are never renamed; the full catalog with HTTP status, type and retryability is published as x-domscan-error-codes.
              example: INVALID_DOMAIN
            type:
              type: string
              enum:
              - authentication_error
              - credits_error
              - permission_error
              - not_found_error
              - conflict_error
              - rate_limit_error
              - timeout_error
              - validation_error
              - upstream_error
              - api_error
              - request_error
              description: Stable error category used by official SDK subclasses
            message:
              type: string
              description: Human-readable error message
              example: Invalid domain format
            status:
              type: integer
              minimum: 400
              maximum: 599
              description: HTTP status repeated in the JSON error for queue and log processors
            retryable:
              type: boolean
              description: Whether retrying can be appropriate after applying retry guidance
            request_id:
              type: string
              description: Request identifier matching the X-Request-Id response header
            suggestion:
              type: string
              description: Suggestion for fixing the error
            details:
              type: object
              description: Optional structured context for the error
              additionalProperties: true
            retry_after:
              type: integer
              minimum: 0
              description: Seconds to wait before retrying when the error is temporary
              example: 300
            docs_url:
              type: string
              description: Absolute link to the documentation section for this error
              example: https://domscan.net/docs/check-availability
          required:
          - type
          - code
          - message
          - status
          - retryable
          - request_id
          - docs_url
    SocialPlatformSummary:
      type: object
      description: Additive social checker rollup for requested platforms, confidence, cache, checker methods, and beta-limited outcomes.
      properties:
        requested_count:
          type: integer
        checked_count:
          type: integer
        available_count:
          type: integer
        unavailable_count:
          type: integer
        unknown_count:
          type: integer
        not_supported_count:
          type: integer
        cached_count:
          type: integer
        high_confidence_count:
          type: integer
        live_platform_count:
          type: integer
        experimental_count:
          type: integer
        blocked_count:
          type: integer
        beta_limited_count:
          type: integer
        determinacy_rate:
          type: number
          minimum: 0
          maximum: 1
        method_counts:
          type: object
          additionalProperties:
            type: integer
        source_counts:
          type: object
          additionalProperties:
            type: integer
  headers:
    XRateLimitLimit:
      description: Burst capacity of the rate limit that applies to this API key.
      schema:
        type: integer
        minimum: 0
    XRateLimitRemaining:
      description: Requests that can still be sent immediately before the rate limit applies.
      schema:
        type: integer
        minimum: 0
    XRateLimitReset:
      description: Unix time in seconds when the burst capacity is fully refilled.
      schema:
        type: integer
        minimum: 0
    IdempotentReplayed:
      description: Present and `true` when this response is a stored replay for a repeated Idempotency-Key. A replay charges nothing.
      schema:
        type: string
        enum:
        - 'true'
    XCreditsRemaining:
      description: Credits remaining on the account after this request. Omitted when the balance is not already known without an extra lookup.
      schema:
        type: integer
        minimum: 0
    XCreditsCharged:
      description: Credits charged by this request, net of any refund made in the same request. Sent on authenticated /v1 responses, including errors (0 when nothing was charged).
      schema:
        type: integer
        minimum: 0
    XFieldsIgnored:
      description: 'Sent when `fields` was used and some paths matched nothing in this response: those paths, comma-separated, at most 20.'
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request - invalid parameters
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: Invalid domain format
              suggestion: Domain must be a valid format like example.com
              type: validation_error
              status: 400
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
    IdempotencyInProgress:
      description: A request with the same Idempotency-Key is still running. Retry after Retry-After seconds to receive its stored response. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: IDEMPOTENCY_IN_PROGRESS
              message: A request with this Idempotency-Key is still being processed. Retry shortly to receive its result.
              type: conflict_error
              status: 409
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
              retry_after: 1
    PaymentRequired:
      description: Insufficient credits for this request. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          schema:
            type: integer
          description: Credits remaining on the account
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INSUFFICIENT_CREDITS
              message: Insufficient credits. This endpoint costs 2 credits but you have 0. Purchase more at https://domscan.net/billing or wait for your monthly reset.
              credits_remaining: 0
              credits_required: 2
              purchase_url: https://domscan.net/billing
              type: credits_error
              status: 402
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/credits-pricing
    RateLimited:
      description: Rate limit exceeded. Free accounts can sustain 120 requests per minute per account with a burst capacity of 60. Free bulk traffic is additionally limited to 20 requests per minute per account across all bulk endpoints and 100 per minute per IPv4 address or IPv6 /56 network. Paid accounts can sustain 600 requests per minute with a burst capacity of 120.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          schema:
            type: integer
          description: The immediate burst capacity, or the active bulk fixed-window limit when a bulk-specific limit is exceeded.
        X-RateLimit-Remaining:
          schema:
            type: integer
            example: 0
          description: Immediate burst tokens remaining, or requests remaining in the active bulk fixed window.
        X-RateLimit-Reset:
          schema:
            type: integer
            example: 1791590400
          description: Unix time in seconds when the limit that was exceeded allows a new request again.
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
        X-RateLimit-Plan:
          schema:
            type: string
            enum:
            - free
            - paid
          description: The account plan whose policy was applied.
        X-RateLimit-Policy:
          schema:
            type: string
          description: Machine-readable summary of the active tier and limit policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded. Please wait before making more requests.
              type: rate_limit_error
              status: 429
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/rate-limits
              retry_after: 12
    IdempotencyKeyReused:
      description: The Idempotency-Key was already used by this API key for a different request (method, path, query or body) in the last 24 hours. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: IDEMPOTENCY_KEY_REUSED
              message: This Idempotency-Key was already used with a different request. Use a new key for a new request.
              type: validation_error
              status: 422
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
    Unauthorized:
      description: 'Authentication required. All API endpoints require a valid API key (x-api-key header or Authorization: Bearer) or an active session cookie.'
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_REQUIRED
              message: 'Authentication required. Provide an API key via x-api-key header or Authorization: Bearer header.'
              docs: https://domscan.net/docs/authentication
              get_key: https://domscan.net/login
              type: authentication_error
              status: 401
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/authentication
  parameters:
    DryRun:
      name: dry_run
      in: query
      required: false
      description: 'Set to `true` to return the credit estimate for this exact request instead of running it. Nothing is executed, no source is called and 0 credits are charged. The response has the same shape as POST /v1/estimate plus `dry_run: true`.'
      schema:
        type: string
        enum:
        - 'true'
      example: 'true'
    Fields:
      name: fields
      in: query
      required: false
      x-domscan-global-parameter: true
      description: Comma-separated dot paths to keep in a successful JSON response, e.g. `domain,classification.status` (arrays apply the path to each item; max 50 paths, 6 levels). Unmatched paths are listed in X-Fields-Ignored. Cost is unchanged.
      schema:
        type: string
      example: domain,classification.status
    Naming:
      name: naming
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`snake` returns every camelCase key of a successful JSON response in snake_case (for example `registrarName` becomes `registrar_name`); values are never changed. The `DomScan-Naming: snake` request header does the same; when both are sent this parameter wins, and `default` keeps the original names. Runs before `compact` and `fields`, so `fields` paths use snake_case. Error bodies are already snake_case. Cost is unchanged.'
      schema:
        type: string
        enum:
        - snake
        - default
      example: snake
    Compact:
      name: compact
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`true` drops serving metadata (meta timings and served_by, empty warnings/caveats/notes/errors arrays, a request_id that repeats X-Request-Id) from a successful JSON response. Data fields are never removed.'
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
      example: 'true'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional client-chosen key (1 to 255 printable ASCII characters, for example a UUID). Retrying with the same key, API key and identical request within 24 hours returns the stored response with `Idempotent-Replayed: true` and charges nothing again. Responses larger than 1 MiB, and refunded errors, are not stored, so a retry runs normally. Reusing a key for a different request returns 422 IDEMPOTENCY_KEY_REUSED; a duplicate sent while the first is still running returns 409 IDEMPOTENCY_IN_PROGRESS.'
      schema:
        type: string
        minLength: 1
        maxLength: 255
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: 'API key for authentication. Get yours free at https://domscan.net. Also accepts Authorization: Bearer header.'
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Active DomScan browser session. Used by account-management endpoints.
