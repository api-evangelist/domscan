  /v1/account/logs:
    get:
      tags:
      - User
      summary: List API request logs
      description: List privacy-safe API request logs for the active customer account. Headers and secret values are never stored. Logs expire after 30 days.
      operationId: listApiRequestLogs
      security:
      - sessionCookie: []
      parameters:
      - name: limit
        description: Log entries to return per page, from 1 to 100. Defaults to 50.
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        description: Opaque cursor from next_cursor on the previous page. A malformed cursor returns 400.
        in: query
        schema:
          type: string
          maxLength: 512
      - name: status
        description: Exact HTTP status code to filter by, from 100 to 599.
        in: query
        schema:
          type: integer
          minimum: 100
          maximum: 599
      - name: method
        description: HTTP method to filter by. Case-insensitive.
        in: query
        schema:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
      - name: outcome
        description: Outcome to filter by. The value error matches both client_error and server_error.
        in: query
        schema:
          type: string
          enum:
          - success
          - client_error
          - server_error
          - error
      - name: q
        in: query
        description: Search endpoint paths, request IDs, and error codes.
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - name: period
        in: query
        description: Only return logs from this recent time window.
        schema:
          type: string
          enum:
          - 1h
          - 24h
          - 7d
          - 30d
      - name: path
        description: Exact route template to filter by, such as /v1/batches/:job_id/results. Use q for fuzzy matching.
        in: query
        schema:
          type: string
          maxLength: 200
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Account API request logs
          content:
            application/json:
              schema:
                type: object
                required:
                - logs
                - next_cursor
                - retention_days
                properties:
                  logs:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiRequestLogSummary'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                  retention_days:
                    type: integer
                    enum:
                    - 30
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 0
  /v1/account/logs/{id}:
    get:
      tags:
      - User
      summary: Get API request log
      description: Get a privacy-safe request and response JSON preview for one account API request, together with the stored AI analysis when one was generated.
      operationId: getApiRequestLog
      security:
      - sessionCookie: []
      parameters:
      - name: id
        description: Log entry identifier.
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: API request log detail
          content:
            application/json:
              schema:
                type: object
                required:
                - log
                properties:
                  log:
                    $ref: '#/components/schemas/ApiRequestLogDetail'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 0
  /v1/account/logs/{id}/ai-help:
    post:
      tags:
      - User
      summary: AI log analysis
      description: Generate an AI explanation of one logged API request. The analysis is grounded in the official endpoint documentation and produced server-side from the stored privacy-safe log preview. The result is stored with the log and returned again by GET /v1/account/logs/{id}, so reopening a log does not spend the allowance. Running this again replaces the stored analysis. Limited to 50 analyses per user per month.
      operationId: postApiRequestLogAiHelp
      security:
      - sessionCookie: []
      parameters:
      - name: id
        description: Log entry identifier.
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: AI analysis of the logged request
          content:
            application/json:
              schema:
                type: object
                required:
                - answer
                - remaining
                - language
                - model
                - created_at
                - stored
                properties:
                  answer:
                    type: string
                    description: Plain-text analysis of the logged request.
                  remaining:
                    type: integer
                    description: AI analyses left for this user in the current month.
                  language:
                    type: string
                    description: Language the analysis was written in.
                  model:
                    type: string
                    description: Model that produced the analysis.
                  created_at:
                    type: string
                    format: date-time
                  stored:
                    type: boolean
                    description: Whether the analysis was saved with the log. False means the answer is still valid but will not be available after a reload.
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Monthly AI analysis limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: The AI provider failed to produce an analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The AI assistant is not configured or temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-domscan-credits:
        model: per_request
        default: 0
components:
  schemas:
    ApiKeysResponse:
      type: object
      description: API keys and credit balance for the active customer account
      properties:
        keys:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              prefix:
                type: string
                description: Key prefix for identification
              name:
                type: string
              credits_used:
                type: integer
              last_used_at:
                type: string
                format: date-time
              created_at:
                type: string
                format: date-time
              is_active:
                type: boolean
              created_by_user_id:
                type: string
                format: uuid
              is_own:
                type: boolean
        account:
          type: object
          description: Account-level credit balance shared across active keys
          properties:
            total_credits:
              type: integer
            free_credits:
              type: integer
              description: Credits remaining from the account's current monthly allocation, whether it comes from DomScan's standard monthly plan or an active AppSumo license.
            paid_credits:
              type: integer
            free_cycle_month:
              type:
              - string
              - 'null'
              description: Current UTC calendar month used for the monthly allocation, in YYYY-MM format.
            id:
              type: string
              format: uuid
            role:
              type: string
              enum:
              - owner
              - admin
              - guest
    CustomerAccountSummary:
      type: object
      required:
      - id
      - name
      - role
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum:
          - owner
          - admin
          - guest
        owner_user_id:
          type: string
          format: uuid
        member_count:
          type: integer
          minimum: 1
    AccountInvitationCreateResponse:
      type: object
      required:
      - invitation
      properties:
        invitation:
          $ref: '#/components/schemas/AccountInvitation'
    EmailConsentState:
      type:
      - object
      - 'null'
      required:
      - enabled
      - source
      - policy_version
      - occurred_at
      properties:
        enabled:
          type: boolean
        source:
          type: string
          enum:
          - dashboard
          - signup
          - email_unsubscribe
          - admin
          - import
          - system
        policy_version:
          type: string
        occurred_at:
          type: string
          format: date-time
    EmailPreferencesUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        categories:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            required_transactional:
              type: boolean
              enum:
              - true
            requested_alerts:
              type: boolean
            onboarding:
              type: boolean
            lifecycle:
              type: boolean
            digest:
              type: boolean
            product_updates:
              type: boolean
            reactivation:
              type: boolean
        marketing_suppressed:
          type: boolean
        preferred_locale:
          type: string
          enum:
          - en
          - es
          - de
          - fr
          - pt
          - ja
          - zh
          - ar
          - it
          - ko
          - ru
          - nl
          - tr
          - pl
          - sv
        frequency:
          type: object
          additionalProperties: false
          minProperties: 1
          properties:
            digest:
              type: string
              enum:
              - weekly
              - monthly
    ApiRequestLogDetail:
      allOf:
      - $ref: '#/components/schemas/ApiRequestLogSummary'
      - type: object
        required:
        - request
        - response
        properties:
          request:
            type:
            - object
            - 'null'
            additionalProperties: true
            description: Privacy-safe bounded JSON request preview.
          response:
            type:
            - object
            - 'null'
            additionalProperties: true
            description: Privacy-safe bounded JSON response preview.
          aiHelp:
            type:
            - object
            - 'null'
            description: The stored AI analysis for this log, or null when none was generated yet. Only the most recent analysis is kept, and it expires with the log.
            required:
            - answer
            - language
            - model
            - createdAt
            properties:
              answer:
                type: string
                description: Plain-text analysis of the logged request.
              language:
                type: string
                description: Language the analysis was written in.
              model:
                type: string
                description: Model that produced the analysis.
              createdAt:
                type: string
                format: date-time
    CustomerAccountSummaryResponse:
      type: object
      required:
      - account
      properties:
        success:
          type: boolean
        account:
          $ref: '#/components/schemas/CustomerAccountSummary'
    ApiRequestLogSummary:
      type: object
      required:
      - id
      - requestId
      - authMode
      - source
      - method
      - path
      - statusCode
      - outcome
      - requestBytes
      - responseBytes
      - creditsCharged
      - creditsRefunded
      - durationMs
      - createdAt
      - expiresAt
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
        userId:
          type:
          - string
          - 'null'
          format: uuid
        apiKeyId:
          type:
          - string
          - 'null'
          format: uuid
        authMode:
          type: string
          enum:
          - api_key
          - session
        source:
          type: string
        method:
          type: string
        path:
          type: string
        statusCode:
          type: integer
          minimum: 100
          maximum: 599
        outcome:
          type: string
          enum:
          - success
          - client_error
          - server_error
        errorCode:
          type:
          - string
          - 'null'
        requestBytes:
          type: integer
          minimum: 0
        responseBytes:
          type: integer
          minimum: 0
        creditsCharged:
          type: integer
          minimum: 0
        creditsRefunded:
          type: integer
          minimum: 0
        durationMs:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    AccountInvitation:
      type: object
      required:
      - id
      - email
      - status
      - expires_at
      - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - pending
          - accepted
          - cancelled
          - expired
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    CustomerAccountResponse:
      type: object
      required:
      - account
      - members
      - invitations
      properties:
        account:
          $ref: '#/components/schemas/CustomerAccountSummary'
        members:
          type: array
          items:
            $ref: '#/components/schemas/CustomerAccountMember'
        invitations:
          type: array
          description: Visible to the account owner. Admins and guests receive an empty array.
          items:
            $ref: '#/components/schemas/AccountInvitation'
    CreditBalanceResponse:
      type: object
      description: Current balance for the authenticated customer account
      additionalProperties: false
      required:
      - credits
      - free_credits
      - paid_credits
      - free_cycle_month
      properties:
        credits:
          type: integer
          description: Current total account credit balance
        free_credits:
          type: integer
          description: Credits remaining from the account's current monthly allocation, whether it comes from DomScan's standard monthly plan or an active AppSumo license.
        paid_credits:
          type: integer
          description: Current account paid credit balance
        free_cycle_month:
          type:
          - string
          - 'null'
          description: Current UTC calendar month used for the monthly allocation, in YYYY-MM format.
    ApiKeyCreateResponse:
      type: object
      description: Newly created API key (full key only shown once)
      properties:
        id:
          type: string
        key:
          type: string
          description: Full API key - save this, shown only once!
        prefix:
          type: string
        name:
          type: string
        account_credits:
          type: integer
          description: Current account-level credit balance after the key is created
        created_at:
          type: string
          format: date-time
        message:
          type: string
    EmailPreferences:
      type: object
      required:
      - policy_version
      - categories
      - marketing_suppressed
      - preferred_locale
      - frequency
      - consent
      properties:
        policy_version:
          type: string
          example: '2026-08-02'
        categories:
          $ref: '#/components/schemas/EmailPreferenceCategories'
        marketing_suppressed:
          type: boolean
          default: false
        preferred_locale:
          type: string
          enum:
          - en
          - es
          - de
          - fr
          - pt
          - ja
          - zh
          - ar
          - it
          - ko
          - ru
          - nl
          - tr
          - pl
          - sv
          default: en
        frequency:
          type: object
          required:
          - digest
          properties:
            digest:
              type: string
              enum:
              - weekly
              - monthly
              default: monthly
        consent:
          type: object
          required:
          - requested_alerts
          - onboarding
          - lifecycle
          - digest
          - product_updates
          - reactivation
          - all_marketing
          properties:
            requested_alerts:
              $ref: '#/components/schemas/EmailConsentState'
            onboarding:
              $ref: '#/components/schemas/EmailConsentState'
            lifecycle:
              $ref: '#/components/schemas/EmailConsentState'
            digest:
              $ref: '#/components/schemas/EmailConsentState'
            product_updates:
              $ref: '#/components/schemas/EmailConsentState'
            reactivation:
              $ref: '#/components/schemas/EmailConsentState'
            all_marketing:
              $ref: '#/components/schemas/EmailConsentState'
    EmailPreferenceCategories:
      type: object
      additionalProperties: false
      required:
      - required_transactional
      - requested_alerts
      - onboarding
      - lifecycle
      - digest
      - product_updates
      - reactivation
      properties:
        required_transactional:
          type: boolean
          enum:
          - true
          description: Always enabled for authentication, security, account, and billing messages.
        requested_alerts:
          type: boolean
          default: true
        onboarding:
          type: boolean
          default: true
        lifecycle:
          type: boolean
          default: true
        digest:
          type: boolean
          default: true
        product_updates:
          type: boolean
          default: true
        reactivation:
          type: boolean
          default: true
    UsageResponse:
