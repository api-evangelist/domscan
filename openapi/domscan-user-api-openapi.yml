                type: integer
        by_date:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              requests:
                type: integer
              credits:
                type: integer
        total_requests:
          type: integer
        total_credits_spent:
          type: integer
        previous_period:
          type: object
