          properties:
            total_requests:
              type: integer
            total_credits_spent:
              type: integer
        trends:
          type: object
          description: Percentage changes from the preceding period when compare=true
          properties:
            requests_change_pct:
              type: number
            credits_change_pct:
              type: number
    CustomerAccountMember:
      type: object
      required:
      - user_id
      - email
      - role
      - joined_at
      - is_current_user
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type:
          - string
          - 'null'
        picture:
          type:
          - string
          - 'null'
          format: uri
        role:
          type: string
          enum:
          - owner
          - admin
          - guest
        joined_at:
          type: string
          format: date-time
        is_current_user:
          type: boolean
    CreditsResponse:
      type: object
      description: Active customer account credit balance and transaction history
      properties:
        credits:
          type: integer
          description: Current account credit balance
        free_credits:
          type: integer
          description: Credits remaining from the account's current monthly allocation, whether it comes from DomScan's standard monthly plan or an active AppSumo license.
        paid_credits:
          type: integer
          description: Current account paid credit balance
        free_cycle_month:
          type:
          - string
          - 'null'
          description: Current UTC calendar month used for the monthly allocation, in YYYY-MM format.
        transactions:
          type: array
          items:
            type: object
            properties:
              amount:
                type: integer
                description: Transaction amount (negative for usage)
              balance_after:
                type: integer
              type:
                type: string
                enum:
                - usage
                - purchase
                - auto_recharge
                - refund
                - signup_bonus
                - monthly_grant
                - admin_adjustment
                - migration_opening_balance
                - reconciliation_adjustment
              description:
                type: string
              created_at:
                type: string
                format: date-time
    SuccessResponse:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
          example: true
    ErrorResponse:
      type: object
      description: Canonical error format shared by every API error response. Endpoint-specific fields (for example credits_remaining, login_url or evidence_summary) may appear next to error or inside it; clients should ignore fields they do not recognise.
      additionalProperties: true
      properties:
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
              description: Stable, upper-case machine code. Codes are never renamed; the full catalog with HTTP status, type and retryability is published as x-domscan-error-codes.
              example: INVALID_DOMAIN
            type:
              type: string
              enum:
              - authentication_error
              - credits_error
              - permission_error
              - not_found_error
              - conflict_error
              - rate_limit_error
              - timeout_error
              - validation_error
              - upstream_error
              - api_error
              - request_error
              description: Stable error category used by official SDK subclasses
            message:
              type: string
              description: Human-readable error message
              example: Invalid domain format
            status:
              type: integer
              minimum: 400
              maximum: 599
              description: HTTP status repeated in the JSON error for queue and log processors
            retryable:
              type: boolean
              description: Whether retrying can be appropriate after applying retry guidance
            request_id:
              type: string
              description: Request identifier matching the X-Request-Id response header
            suggestion:
              type: string
              description: Suggestion for fixing the error
            details:
              type: object
              description: Optional structured context for the error
              additionalProperties: true
            retry_after:
              type: integer
              minimum: 0
              description: Seconds to wait before retrying when the error is temporary
              example: 300
            docs_url:
              type: string
              description: Absolute link to the documentation section for this error
              example: https://domscan.net/docs/check-availability
          required:
          - type
          - code
          - message
          - status
          - retryable
          - request_id
          - docs_url
  headers:
    XRateLimitLimit:
      description: Burst capacity of the rate limit that applies to this API key.
      schema:
        type: integer
        minimum: 0
    XRateLimitReset:
      description: Unix time in seconds when the burst capacity is fully refilled.
