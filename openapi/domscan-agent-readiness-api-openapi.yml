openapi: 3.2.0
info:
  title: DomScan Agent Readiness API
  description: 'DomScan is a domain intelligence API providing domain analysis tools. **Core Features:**

    - Domain Availability: Check single or bulk domains using RDAP with 1,100+ TLDs supported

    - Domain Intelligence: AI suggestions, valuations, health checks, typosquatting detection

    - OSINT Tools: DNS lookup, WHOIS/RDAP, SSL certificates, subdomain discovery, IP geolocation, tech stack detection

    - Social & Branding: Social handle checker, brand name scoring

    - Phone Intelligence: Privacy-first phone number validation, normalization, and classification

    - Pricing: Scheduled standard-TLD tables from verified official registrar sources, plus separate credential-backed exact-domain quotes

    - Watchlist: Domain monitoring for expiration and availability alerts


    **Authentication:**

    Most API endpoints require authentication. Pass your API key via the x-api-key header or Authorization: Bearer header. Operations marked with an empty security requirement are intentionally public, including API specifications and selected catalog endpoints. Get your free API key at https://domscan.net/dashboard. Logged-in users on domscan.net tools pages are authenticated automatically via session cookie. **Rate Limits:**

    Free accounts can sustain 120 requests per minute per account, with a burst capacity of 60. All API keys and dashboard sessions belonging to the same free account share this budget. Bulk endpoints have an additional free-tier budget of 20 HTTP requests per minute per account across all bulk endpoints. Free-tier bulk traffic is also capped at 100 requests per minute per IPv4 address or IPv6 /56 network. Platform-wide edge protections still apply to every tier. Paid accounts can sustain 600 requests per minute, with a burst capacity of 120, shared by every API key and dashboard session of the account. Paid accounts do not receive the additional free-tier bulk budget. Scope: RapidAPI subscribers are counted per subscriber. (scope=rapidapi-customer) Zyla subscribers are counted per subscriber when the gateway identifies them, (scope=zyla-customer) and as one shared gateway budget when it does not. (scope=zyla-gateway) Other authenticated requests are counted per account: every API key and dashboard session of the account shares one budget. (scope=account) A key that is not linked to an account is counted on its own. (scope=api-key) Unauthenticated requests to public endpoints are counted per client IP address (scope unknown when the address cannot be determined, as one shared budget). (scope=ip)


    Every authenticated response, success or error, includes X-RateLimit-Plan, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, and X-RateLimit-Policy. X-RateLimit-Limit and X-RateLimit-Remaining describe the immediate burst bucket; X-RateLimit-Reset is the Unix time in seconds when that bucket is full again; X-RateLimit-Policy also states the sustained per-minute rate, scope, and any free bulk limits. Exceeding a limit returns HTTP 429 with Retry-After. Retry only after the indicated delay. **Credits System:**

    API calls consume credits based on endpoint complexity. Sign up for free to receive 10,000 credits monthly. - 1 credit: Status checks, DNS lookups, tool builders

    - 2-5 credits: Health checks, valuations, OSINT tools

    - Bulk endpoints: standard per-item rate for batching multiple items into fewer HTTP requests. - 6-25 credits: Recipe compound operations


    When credits reach zero, the API returns HTTP 402 with credits_remaining, credits_required, and a purchase_url. API responses include X-Credits-Requested, X-Credits-Charged, and X-Credits-Refunded. X-Credits-Charged is the net charge after any refund made during the request. Authenticated responses also include X-Credits-Remaining whenever the balance is known without an extra lookup. Free credits refresh monthly on the account''s signup anniversary. POST /v1/estimate returns the credits a request would charge without running it, at no cost.'
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: Agent Readiness
paths:
  /v1/agent-readiness:
    get:
      tags:
      - Agent Readiness
      summary: Score website agent readiness across four evidence dimensions
      description: Score a public website from 0 to 100 across discoverability, content, access policy, and capabilities. The bounded audit covers more than 35 checks, including sitemaps, Markdown delivery, crawler policy, WebMCP, remote MCP, OpenAPI, API catalogs, OAuth metadata, Agent Skills, and page structure. Unknown evidence is excluded from the score and lowers confidence. The audit does not execute discovered tools and is not an SEO ranking.
      operationId: checkAgentReadiness
      x-required-any-of:
      - - url
      - - domain
      parameters:
      - name: url
        description: Full public HTTP(S) URL to check. Takes precedence over domain.
        in: query
        schema:
          type: string
          format: uri
          maxLength: 2048
        example: https://example.com
      - name: domain
        description: Public domain or hostname to check when url is omitted.
        in: query
        schema:
          type: string
          maxLength: 253
        example: example.com
      - name: skip_cache
        in: query
        description: Deprecated alias of `max_age=0`; still accepted. Set to 1 to bypass cached readiness evidence. Deprecated on 2026-10-10; works until at least 2027-10-10 (Sunset header).
        schema:
          type: string
          enum:
          - '1'
        deprecated: true
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/MaxAge'
      responses:
        '200':
          description: Transparent agent readiness score, dimension scores, checks, evidence, caveats, and recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentReadinessResponse'
              example:
                requested_url: https://www.example.com/
                final_url: https://www.example.com/
                checked_at: '2026-10-09T10:15:30.000Z'
                outcome: partial
                fetch_state: ok
                http_status: 200
                summary:
                  coverage: multi_channel
                  detected_signals: 3
                  total_signals: 12
                  score: 78
                  rating: good
                  confidence: 95
                  passed_checks: 18
                  warning_checks: 12
                  failed_checks: 2
                  unknown_checks: 2
                  not_applicable_checks: 8
                signals:
                  webmcp:
                    status: unknown
                    validation: runtime_required
                    method: static_html
                    checked_url: https://www.example.com/
                    http_status: 200
                    evidence: []
                    caveats:
                    - runtime_observation_required
                  remote_mcp:
                    status: not_detected
                    validation: not_applicable
                    method: oauth_protected_resource_metadata
                    checked_url: https://www.example.com/.well-known/oauth-protected-resource/mcp
                    http_status: 404
                    evidence:
                    - exact_missing_response
                    caveats:
                    - custom_or_unauthenticated_endpoints_not_checked
                  openapi:
                    status: detected
                    validation: confirmed
                    method: service_description
                    checked_url: https://www.example.com/openapi.json
                    http_status: 200
                    evidence:
                    - openapi_document_validated
                    caveats: []
                  llms_txt:
                    status: detected
                    validation: confirmed
                    method: well_known_path
                    checked_url: https://www.example.com/llms.txt
                    http_status: 200
                    evidence:
                    - markdown_h1
                    - markdown_links_1
                    caveats: []
                  api_catalog:
                    status: detected
                    validation: confirmed
                    method: rfc9727_api_catalog
                    checked_url: https://www.example.com/.well-known/api-catalog
                    http_status: 200
                    evidence:
                    - service_descriptions_1
                    - api_catalog_link_header
                    caveats: []
                  mcp_server_card:
                    status: not_detected
                    validation: not_applicable
                    method: mcp_server_card
                    checked_url: null
                    http_status: null
                    evidence:
                    - bounded_candidates_missing
                    caveats: []
                  agent_skills:
                    status: not_detected
                    validation: not_applicable
                    method: agent_skills_index
                    checked_url: https://www.example.com/.well-known/agent-skills/index.json
                    http_status: 404
                    evidence:
                    - exact_missing_response
                    caveats: []
                  oauth:
                    status: not_detected
                    validation: not_applicable
                    method: oauth_server_metadata
                    checked_url: null
                    http_status: null
                    evidence:
                    - bounded_candidates_missing
                    caveats: []
                  markdown:
                    status: not_detected
                    validation: not_applicable
                    method: accept_content_negotiation
                    checked_url: https://www.example.com/
                    http_status: 200
                    evidence:
                    - html_returned_for_markdown_accept
                    caveats: []
                  web_bot_auth:
                    status: not_detected
                    validation: not_applicable
                    method: web_bot_auth_directory
                    checked_url: https://www.example.com/.well-known/http-message-signatures-directory
                    http_status: 404
                    evidence:
                    - exact_missing_response
                    caveats: []
                  sitemap_markdown:
                    status: not_detected
                    validation: not_applicable
                    method: markdown_sitemap
                    checked_url: null
                    http_status: null
                    evidence:
                    - bounded_candidates_missing
                    caveats: []
                  agent_guide:
                    status: not_detected
                    validation: not_applicable
                    method: public_agent_guide
                    checked_url: null
                    http_status: null
                    evidence:
                    - bounded_candidates_missing
                    caveats: []
                foundations:
                  https:
                    state: pass
                    evidence:
                    - https
                  indexable:
                    state: pass
                    evidence:
                    - no_noindex_directive
                  robots:
                    state: pass
                    evidence:
                    - robots_allows_crawl
                  title:
                    state: pass
                    evidence:
                    - title_present
                  meta_description:
                    state: pass
                    evidence:
                    - meta_description_present
                  canonical:
                    state: warn
                    evidence:
                    - canonical_missing
                  language:
                    state: pass
                    evidence:
                    - html_lang_present
                  structured_data:
                    state: warn
                    evidence:
                    - json_ld_not_detected
                  labeled_forms:
                    state: pass
                    evidence:
                    - no_form_controls
                  origin_isolation:
                    state: unknown
                    evidence:
                    - origin_agent_cluster_not_declared
                  webmcp_permission:
                    state: pass
                    evidence:
                    - tools_permission_default_self
                dimensions:
                  discoverability:
                    score: 84
                    confidence: 100
                    passed: 8
                    warned: 1
                    failed: 2
                    unknown: 0
                    not_applicable: 1
                    checks:
                    - https
                    - http_response
                    - redirect_chain
                    - html_content_type
                    - indexable
                    - robots_access
                    - sitemap_xml
                    - sitemap_lastmod
                    - target_discoverable
                    - llms_txt
                    - sitemap_markdown
                    - api_catalog_link
                  content:
                    score: 67
                    confidence: 100
                    passed: 5
                    warned: 8
                    failed: 0
                    unknown: 0
                    not_applicable: 2
                    checks:
                    - title
                    - meta_description
                    - open_graph
                    - canonical
                    - language
                    - structured_data
                    - heading_structure
                    - content_density
                    - form_controls
                    - markdown_negotiation
                    - markdown_alternate
                    - code_languages
                    - api_schema_link
                    - glossary_context
                    - public_agent_guide
                  access_policy:
                    score: 88
                    confidence: 100
                    passed: 2
                    warned: 1
                    failed: 0
                    unknown: 0
                    not_applicable: 2
                    checks:
                    - ai_bot_access
                    - explicit_ai_policy
                    - content_signals
                    - agent_content_directives
                    - web_bot_auth
                  capabilities:
                    score: 83
                    confidence: 75
                    passed: 3
                    warned: 2
                    failed: 0
                    unknown: 2
                    not_applicable: 3
                    checks:
                    - webmcp
                    - remote_mcp
                    - openapi
                    - api_catalog
                    - mcp_server_card
                    - agent_skills
                    - oauth_discovery
                    - service_description_link
                    - origin_isolation
                    - webmcp_permission
                checks:
                  https:
                    id: https
                    dimension: discoverability
                    state: pass
                    weight: 3
                    method: document_analysis
                    checked_url: https://www.example.com/
                    http_status: 200
                    evidence:
                    - https
                    caveats: []
                    reference: HTTPS
                    maturity: standard
                  http_response:
                    id: http_response
                    dimension: discoverability
                    state: pass
                    weight: 3
                    method: document_analysis
                    checked_url: https://www.example.com/
                    http_status: 200
                    evidence:
                    - http_status_200
                    caveats: []
                    reference: HTTP semantics
                    maturity: standard
                  llms_txt:
                    id: llms_txt
                    dimension: discoverability
                    state: pass
                    weight: 2
                    method: well_known_path
                    checked_url: https://www.example.com/llms.txt
                    http_status: 200
                    evidence:
                    - markdown_h1
                    - markdown_links_1
                    caveats: []
                    reference: llms.txt proposal
                    maturity: proposal
                recommendations:
                - code: ADD_CANONICAL
                  severity: medium
                - code: ADD_STRUCTURED_DATA
                  severity: low
                - code: PUBLISH_MCP_METADATA
                  severity: medium
                meta:
                  cached: false
                  fetch_path: primary
                  duration_ms: 1840
                  probe_count: 22
                  body_truncated: false
                  source_version: '2026-08-28'
                  last_verified: '2026-08-28'
                  rubric_version: 2026-08-28.3
                  max_probes: 32
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            X-Cache-Age:
              $ref: '#/components/headers/XCacheAge'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
      x-domscan-freshness:
        parameter: max_age
        aliases:
        - name: skip_cache
          in: query
          max_age: 0
      x-domscan-deprecated-aliases:
      - name: skip_cache
        in: query
        replacement: max_age=0
        deprecated_on: '2026-10-10'
        sunset_on: '2027-10-10'
      x-domscan-credits:
        model: per_request
        default: 3
components:
  headers:
    XRateLimitLimit:
      description: Burst capacity of the rate limit that applies to this API key.
      schema:
        type: integer
        minimum: 0
    XRateLimitReset:
      description: Unix time in seconds when the burst capacity is fully refilled.
      schema:
        type: integer
        minimum: 0
    XRateLimitRemaining:
      description: Requests that can still be sent immediately before the rate limit applies.
      schema:
        type: integer
        minimum: 0
    XCreditsRemaining:
      description: Credits remaining on the account after this request. Omitted when the balance is not already known without an extra lookup.
      schema:
        type: integer
        minimum: 0
    XCreditsCharged:
      description: Credits charged by this request, net of any refund made in the same request. Sent on authenticated /v1 responses, including errors (0 when nothing was charged).
      schema:
        type: integer
        minimum: 0
    XCacheAge:
      description: Age in whole seconds of the cached data this response used (0 when it was checked fresh). The same value is returned as `cache_age_s`.
      schema:
        type: integer
        minimum: 0
    Sunset:
      description: 'RFC 8594. Sent with Deprecation: the earliest date the deprecated alias may stop working, as an HTTP-date. See /docs/versioning.'
      schema:
        type: string
        example: Sun, 10 Oct 2027 00:00:00 GMT
    Deprecation:
      description: 'RFC 9745. Sent when the request used a deprecated alias: the date it was deprecated, as `@` and Unix seconds. The response body is unchanged.'
      schema:
        type: string
        example: '@1791590400'
    XFieldsIgnored:
      description: 'Sent when `fields` was used and some paths matched nothing in this response: those paths, comma-separated, at most 20.'
      schema:
        type: string
  schemas:
    AgentReadinessResponse:
      type: object
      required:
      - requested_url
      - final_url
      - checked_at
      - outcome
      - fetch_state
      - http_status
      - summary
      - signals
      - foundations
      - dimensions
      - checks
      - recommendations
      - meta
      properties:
        cache_age_s:
          type: integer
          minimum: 0
          description: Age in whole seconds of the cached data used for this response; 0 when it was checked fresh. For multi-item responses, the oldest item.
        requested_url:
          type: string
          format: uri
        final_url:
          type: string
          format: uri
        checked_at:
          type: string
          format: date-time
        outcome:
          type: string
          enum:
          - complete
          - partial
          - unavailable
        fetch_state:
          type: string
          enum:
          - ok
          - blocked
          - http_error
          - non_html
          - empty
          - unknown
        http_status:
          type:
          - integer
          - 'null'
        summary:
          type: object
          required:
          - coverage
          - detected_signals
          - total_signals
          - score
          - rating
          - confidence
          - passed_checks
          - warning_checks
          - failed_checks
          - unknown_checks
          - not_applicable_checks
          description: The readiness score uses conclusive applicable checks. Unknown checks are excluded from the score and reduce the separate confidence percentage.
          properties:
            coverage:
              type: string
              enum:
              - broad
              - multi_channel
              - single_channel
              - none_detected
              - indeterminate
            detected_signals:
              type: integer
              minimum: 0
              maximum: 12
            total_signals:
              type: integer
              enum:
              - 12
            score:
              type:
              - integer
              - 'null'
              minimum: 0
              maximum: 100
            rating:
              type: string
              enum:
              - excellent
              - good
              - fair
              - needs_improvement
              - indeterminate
            confidence:
              type: integer
              minimum: 0
              maximum: 100
            passed_checks:
              type: integer
              minimum: 0
            warning_checks:
              type: integer
              minimum: 0
            failed_checks:
              type: integer
              minimum: 0
            unknown_checks:
              type: integer
              minimum: 0
            not_applicable_checks:
              type: integer
              minimum: 0
        signals:
          type: object
          required:
          - webmcp
          - remote_mcp
          - openapi
          - llms_txt
          - api_catalog
          - mcp_server_card
          - agent_skills
          - oauth
          - markdown
          - web_bot_auth
          - sitemap_markdown
          - agent_guide
          properties:
            webmcp:
              $ref: '#/components/schemas/AgentReadinessSignal'
            remote_mcp:
              $ref: '#/components/schemas/AgentReadinessSignal'
            openapi:
              $ref: '#/components/schemas/AgentReadinessSignal'
            llms_txt:
              $ref: '#/components/schemas/AgentReadinessSignal'
            api_catalog:
              $ref: '#/components/schemas/AgentReadinessSignal'
            mcp_server_card:
              $ref: '#/components/schemas/AgentReadinessSignal'
            agent_skills:
              $ref: '#/components/schemas/AgentReadinessSignal'
            oauth:
              $ref: '#/components/schemas/AgentReadinessSignal'
            markdown:
              $ref: '#/components/schemas/AgentReadinessSignal'
            web_bot_auth:
              $ref: '#/components/schemas/AgentReadinessSignal'
            sitemap_markdown:
              $ref: '#/components/schemas/AgentReadinessSignal'
            agent_guide:
              $ref: '#/components/schemas/AgentReadinessSignal'
        foundations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AgentReadinessFoundation'
        dimensions:
          type: object
          required:
          - discoverability
          - content
          - access_policy
          - capabilities
          properties:
            discoverability:
              $ref: '#/components/schemas/AgentReadinessDimensionScore'
            content:
              $ref: '#/components/schemas/AgentReadinessDimensionScore'
            access_policy:
              $ref: '#/components/schemas/AgentReadinessDimensionScore'
            capabilities:
              $ref: '#/components/schemas/AgentReadinessDimensionScore'
        checks:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/AgentReadinessCheck'
        recommendations:
          type: array
          items:
            type: object
            required:
            - code
            - severity
            properties:
              code:
                type: string
              severity:
                type: string
                enum:
                - high
                - medium
                - low
        meta:
          type: object
          required:
          - cached
          - fetch_path
          - duration_ms
          - probe_count
          - body_truncated
          - source_version
          - last_verified
          - rubric_version
          - max_probes
          properties:
            cached:
              type: boolean
            fetch_path:
              type: string
              enum:
              - primary
              - fallback
              - unknown
            duration_ms:
              type: integer
            probe_count:
              type: integer
            body_truncated:
              type: boolean
            source_version:
              type: string
            last_verified:
              type: string
              format: date
            rubric_version:
              type: string
            max_probes:
              type: integer
              minimum: 1
    AgentReadinessFoundation:
      type: object
      required:
      - state
      - evidence
      properties:
        state:
          type: string
          enum:
          - pass
          - warn
          - fail
          - unknown
        evidence:
          type: array
          items:
            type: string
    AgentReadinessSignal:
      type: object
      required:
      - status
      - validation
      - method
      - checked_url
      - http_status
      - evidence
      - caveats
      properties:
        status:
          type: string
          enum:
          - detected
          - not_detected
          - unknown
          - unchecked
          description: not_detected means only that the documented bounded probes found no signal. It is not proof of absence.
        validation:
          type: string
          enum:
          - confirmed
          - advertised
          - malformed
          - runtime_required
          - not_applicable
        method:
          type: string
        checked_url:
          type:
          - string
          - 'null'
          format: uri
        http_status:
          type:
          - integer
          - 'null'
        evidence:
          type: array
          items:
            type: string
        caveats:
          type: array
          items:
            type: string
    AgentReadinessDimensionScore:
      type: object
      required:
      - score
      - confidence
      - passed
      - warned
      - failed
      - unknown
      - not_applicable
      - checks
      properties:
        score:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
        confidence:
          type: integer
          minimum: 0
          maximum: 100
        passed:
          type: integer
          minimum: 0
        warned:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        unknown:
          type: integer
          minimum: 0
        not_applicable:
          type: integer
          minimum: 0
        checks:
          type: array
          items:
            type: string
    AgentReadinessCheck:
      type: object
      required:
      - id
      - dimension
      - state
      - weight
      - method
      - checked_url
      - http_status
      - evidence
      - caveats
      - reference
      - maturity
      properties:
        id:
          type: string
        dimension:
          type: string
          enum:
          - discoverability
          - content
          - access_policy
          - capabilities
        state:
          type: string
          enum:
          - pass
          - warn
          - fail
          - unknown
          - not_applicable
        weight:
          type: integer
          minimum: 1
          maximum: 3
        method:
          type: string
        checked_url:
          type:
          - string
          - 'null'
          format: uri
        http_status:
          type:
          - integer
          - 'null'
        evidence:
          type: array
          items:
            type: string
        caveats:
          type: array
          items:
            type: string
        reference:
          type: string
        maturity:
          type: string
          enum:
          - standard
          - specification
          - proposal
          - draft
          - practice
    ErrorResponse:
      type: object
      description: Canonical error format shared by every API error response. Endpoint-specific fields (for example credits_remaining, login_url or evidence_summary) may appear next to error or inside it; clients should ignore fields they do not recognise.
      additionalProperties: true
      properties:
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
              description: Stable, upper-case machine code. Codes are never renamed; the full catalog with HTTP status, type and retryability is published as x-domscan-error-codes.
              example: INVALID_DOMAIN
            type:
              type: string
              enum:
              - authentication_error
              - credits_error
              - permission_error
              - not_found_error
              - conflict_error
              - rate_limit_error
              - timeout_error
              - validation_error
              - upstream_error
              - api_error
              - request_error
              description: Stable error category used by official SDK subclasses
            message:
              type: string
              description: Human-readable error message
              example: Invalid domain format
            status:
              type: integer
              minimum: 400
              maximum: 599
              description: HTTP status repeated in the JSON error for queue and log processors
            retryable:
              type: boolean
              description: Whether retrying can be appropriate after applying retry guidance
            request_id:
              type: string
              description: Request identifier matching the X-Request-Id response header
            suggestion:
              type: string
              description: Suggestion for fixing the error
            details:
              type: object
              description: Optional structured context for the error
              additionalProperties: true
            retry_after:
              type: integer
              minimum: 0
              description: Seconds to wait before retrying when the error is temporary
              example: 300
            docs_url:
              type: string
              description: Absolute link to the documentation section for this error
              example: https://domscan.net/docs/check-availability
          required:
          - type
          - code
          - message
          - status
          - retryable
          - request_id
          - docs_url
  responses:
    BadRequest:
      description: Bad request - invalid parameters
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
