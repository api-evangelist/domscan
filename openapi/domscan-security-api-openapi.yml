components:
  schemas:
    IdnAnalysisResponse:
      type: object
      required:
      - input
      - outcome
      - unicode
      - ascii
      - is_idn
      - valid
      - errors
      - labels
      - skeleton
      - risk
      - tld
      - checked_at
      - caveats
      properties:
        input:
          type: string
        outcome:
          type: string
          enum:
          - analyzed
          - invalid
        unicode:
          type: string
        ascii:
          type: string
        is_idn:
          type: boolean
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
            enum:
            - label_too_long
            - name_too_long
            - empty_label
            - invalid_punycode_label
        labels:
          type: array
          items:
            type: object
            required:
            - unicode
            - ascii
            - is_idn
            - scripts
            - mixed_script
            - has_invisible
            - confusable_characters
            properties:
              unicode:
                type: string
              ascii:
                type: string
              is_idn:
                type: boolean
              scripts:
                type: array
                items:
                  type: string
              mixed_script:
                type: boolean
              has_invisible:
                type: boolean
              confusable_characters:
                type: array
                items:
                  type: object
                  required:
                  - char
                  - codepoint
                  - script
                  - looks_like
                  properties:
                    char:
                      type: string
                    codepoint:
                      type: string
                      pattern: ^U\+[0-9A-F]{4,6}$
                    script:
                      type: string
                    looks_like:
                      type: string
        skeleton:
          type: string
          description: Lowercased name with invisible characters dropped and lookalikes mapped to ASCII.
        risk:
          type: object
          required:
          - level
          - reasons
          properties:
            level:
              type: string
              enum:
              - none
              - low
              - medium
              - high
            reasons:
              type: array
              items:
                type: string
                enum:
                - invisible_characters
                - mixed_latin_and_lookalike_script
                - mixed_script
                - whole_script_confusable
                - confusable_characters
                - idn_label
                - fullwidth_characters
        tld:
          type:
          - object
          - 'null'
          required:
          - label
          - ascii
          - is_idn
          properties:
            label:
              type: string
            ascii:
              type: string
            is_idn:
              type: boolean
        checked_at:
          type: string
          format: date-time
        caveats:
          type: array
          items:
            type: string
            enum:
            - partial_confusable_table
            - trailing_dot_removed
    SecurityRatingResponse:
      type: object
      required:
      - domain
      - status
      - score
      - grade
      - checks_unknown
      - score_confidence
      - weight_covered
      - capped_by_critical_finding
      - categories
      - findings
      - sources
      - checked_at
      - duration_ms
      - rating_version
      - caveats
      properties:
        domain:
          type: string
        status:
          type: string
          enum:
          - ok
          - partial
          - unknown
          description: 'ok: every category was scored. partial: some categories were unknown and left out of the score. unknown: no category could be scored; score and grade are null and the request is refunded.'
        score:
          type:
          - integer
          - 'null'
          description: Weighted average (0-100) of the scored categories. A critical finding caps it at 59. Null when nothing was scored.
        grade:
          type:
          - string
          - 'null'
          enum:
          - A
          - B
          - C
          - D
          - F
          - null
          description: A 90+, B 80+, C 70+, D 60+, otherwise F.
        checks_unknown:
          type: integer
          description: Categories left out of the score.
        score_confidence:
          type: string
          enum:
          - high
          - medium
          - low
          description: high when at least 90% of the weight was scored, medium at 60%, otherwise low.
        weight_covered:
          type: integer
          description: Share of the total weight that was scored, 0-100.
        capped_by_critical_finding:
          type: boolean
        categories:
          type: array
          description: 'Fixed order. Weights: tls 30, http_headers 20, email_authentication 20, dns 10, reputation 15, disclosure 5.'
          items:
            type: object
            required:
            - id
            - status
            - score
            - weight
            - unknown_reason
            - findings
            properties:
              id:
                type: string
                enum:
                - tls
                - http_headers
                - email_authentication
                - dns
                - reputation
                - disclosure
              status:
                type: string
                enum:
                - scored
                - unknown
              score:
                type:
                - integer
                - 'null'
              weight:
                type: integer
              unknown_reason:
                type:
                - string
                - 'null'
                enum:
                - timeout
                - check_failed
                - no_evidence
                - not_received
                - partial_response
                - null
                description: 'Why the category was not scored. partial_response: the site answered with a challenge or error page. no_evidence includes a blocklist that did not answer, which is never treated as clean.'
              findings:
                type: array
                items:
                  type: object
                  required:
                  - code
                  - severity
                  properties:
                    code:
                      type: string
                      description: 'Stable finding code: certificate_expired, certificate_expires_within_7_days, certificate_expires_within_30_days, certificate_chain_invalid, certificate_revoked, ssl3_enabled, legacy_tls_enabled, tls13_not_supported, tls_critical_issue, site_not_served_over_https, header_<check>_missing or header_<check>_fail (for example header_content_security_policy_missing), spf_missing, spf_invalid, spf_permissive_all, spf_lookup_limit_exceeded, dmarc_missing, dmarc_invalid, dmarc_policy_none, dmarc_partial_enforcement, dnssec_bogus, dnssec_not_enabled, dnssec_not_validated, caa_missing, domain_blocklisted, security_txt_missing, security_txt_invalid or security_txt_expired.'
                    severity:
                      type: string
                      enum:
                      - critical
                      - high
                      - medium
                      - low
                      - info
        findings:
          type: array
          description: All findings, most severe first.
          items:
            type: object
            required:
            - category
            - code
            - severity
            properties:
              category:
                type: string
                enum:
                - tls
                - http_headers
                - email_authentication
                - dns
                - reputation
                - disclosure
              code:
                type: string
                description: 'Stable finding code: certificate_expired, certificate_expires_within_7_days, certificate_expires_within_30_days, certificate_chain_invalid, certificate_revoked, ssl3_enabled, legacy_tls_enabled, tls13_not_supported, tls_critical_issue, site_not_served_over_https, header_<check>_missing or header_<check>_fail (for example header_content_security_policy_missing), spf_missing, spf_invalid, spf_permissive_all, spf_lookup_limit_exceeded, dmarc_missing, dmarc_invalid, dmarc_policy_none, dmarc_partial_enforcement, dnssec_bogus, dnssec_not_enabled, dnssec_not_validated, caa_missing, domain_blocklisted, security_txt_missing, security_txt_invalid or security_txt_expired.'
              severity:
                type: string
                enum:
                - critical
                - high
                - medium
                - low
                - info
        sources:
          type: object
          required:
          - tls
          - http_headers
          - dns_security
          - security_txt
          properties:
            tls:
              type:
              - object
              - 'null'
              required:
              - grade
              - score
              - checked_at
              properties:
                grade:
                  type:
                  - string
                  - 'null'
                  enum:
                  - A+
                  - A
                  - B
                  - C
                  - D
                  - F
                  - null
                score:
                  type:
                  - integer
                  - 'null'
                checked_at:
                  type: string
              description: Summary of /v1/ssl/grade; null when the check failed or timed out.
            http_headers:
              type:
              - object
              - 'null'
              required:
              - status
              - grade
              - score
              - final_url
              - http_status
              properties:
                status:
                  type: string
                  enum:
                  - ok
                  - partial
                  - unknown
                grade:
                  type:
                  - string
                  - 'null'
                  enum:
                  - A+
                  - A
                  - B
                  - C
                  - D
                  - F
                  - null
                score:
                  type:
                  - integer
                  - 'null'
                final_url:
                  type:
                  - string
                  - 'null'
                http_status:
                  type:
                  - integer
                  - 'null'
              description: Summary of /v1/headers; null when the check failed or timed out.
            dns_security:
              type:
              - object
              - 'null'
              required:
              - score
              - grade
              - checks_unknown
              - blocklists_checked
              - blocklists_unknown
              properties:
                score:
                  type:
                  - integer
                  - 'null'
                grade:
                  type:
                  - string
                  - 'null'
                  enum:
                  - A+
                  - A
                  - B
                  - C
                  - D
                  - F
                  - null
                checks_unknown:
                  type: integer
                blocklists_checked:
                  type: integer
                blocklists_unknown:
                  type: integer
              description: Summary of /v1/dns/security; null when the check failed or timed out.
            security_txt:
              type:
              - object
              - 'null'
              required:
              - status
              - location
              properties:
                status:
                  type: string
                  enum:
                  - valid
                  - invalid
                  - not_found
                  - unknown
                location:
                  type:
                  - string
                  - 'null'
                  enum:
                  - well_known
                  - legacy
                  - null
              description: Summary of /v1/security-txt; null when the check failed or timed out.
          description: The underlying checks, for drilling down with their own endpoints.
        checked_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
        rating_version:
          type: string
        caveats:
          type: array
          items:
            type: string
            enum:
            - passive_checks_only
            - not_a_penetration_test
            - tls_protocols_inferred
            - unknown_categories_excluded_from_score
    BulkLookupResponse:
      type: object
      description: Ordered bulk lookup response. A successful outer response can contain per-item failures.
      required:
      - results
      - meta
      properties:
        results:
          type: array
          description: Results in the same order as the submitted inputs.
          items:
            oneOf:
            - type: object
              required:
              - input
              - data
              properties:
                input:
                  type: string
                data:
                  type: object
                  additionalProperties: true
            - type: object
              required:
              - input
              - error
              properties:
                input:
                  type: string
                error:
                  type: object
                  required:
                  - code
                  - message
                  - status
                  properties:
                    code:
                      type: string
                    message:
                      type: string
                    status:
                      type: integer
                  additionalProperties: true
        meta:
          type: object
          required:
          - total
          - succeeded
          - failed
          - max_items
          - credits_per_item
          - duration_ms
          properties:
            total:
              type: integer
              minimum: 1
              maximum: 10
            succeeded:
              type: integer
              minimum: 0
              maximum: 10
            failed:
              type: integer
              minimum: 0
              maximum: 10
            max_items:
              type: integer
              enum:
              - 10
            credits_per_item:
              type: integer
              minimum: 1
            duration_ms:
              type: integer
              minimum: 0
    ClassificationEvidence:
      type: object
      description: 'Where a classification came from: the source that answered, the method used, when it was observed and an optional machine-readable detail.'
      properties:
        source:
          type: string
          description: Source that produced the observation, for example rdap, dns, http or cache.
          example: rdap
        method:
          type: string
          description: Check method used, for example rdap_lookup, txt_lookup or http_get.
          example: rdap_lookup
        observed_at:
          type: string
          format: date-time
          description: When the evidence was observed. Earlier than checked_at for cached results.
        detail:
          type: string
          description: Optional machine-readable detail such as http_404, nxdomain or taken.
      required:
      - source
      - method
      - observed_at
    ClassificationStatus:
      type: object
      description: Shared present/absent/unknown classification. present and absent are returned only from exact authoritative evidence. Blocked, rate-limited, timed-out, failed and ambiguous checks are unknown with a reason, never absent.
      properties:
        status:
          type: string
          enum:
          - present
          - absent
          - unknown
          description: present, absent or unknown.
        reason:
          type: string
          enum:
          - blocked
          - rate_limited
          - timeout
          - ambiguous
          - upstream_error
          - unsupported
          description: Why the result is unknown. Returned only when status is unknown.
        evidence:
          $ref: '#/components/schemas/ClassificationEvidence'
        checked_at:
          type: string
          format: date-time
          description: When DomScan produced this classification.
      required:
      - status
      - evidence
      - checked_at
    SecurityHeadersAuditResponse:
      type: object
      required:
      - url
      - domain
      - status
      - checked_at
      - final_url
      - http_status
      - redirect_count
      - https
      - score
      - grade
      - summary
      - checks
      - cookies
      - headers_raw
      - recommendations
      - fetch
      - caveats
      - rubric_version
      properties:
        classification:
          $ref: '#/components/schemas/ClassificationStatus'
        url:
          type: string
          format: uri
        domain:
          type: string
        status:
          type: string
          enum:
          - ok
          - partial
          - unknown
          description: 'ok: a 2xx or final 3xx response was graded. partial: a 4xx, 5xx or challenge response was analysed but not graded. unknown: no response was received; refunded.'
        checked_at:
          type: string
          format: date-time
        final_url:
          type:
          - string
          - 'null'
        http_status:
          type:
          - integer
          - 'null'
        redirect_count:
          type:
          - integer
          - 'null'
        https:
          type:
          - boolean
          - 'null'
        score:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
          description: Weighted score. Null unless status is ok.
        grade:
          type:
          - string
          - 'null'
          enum:
          - A+
          - A
          - B
          - C
          - D
          - F
          - null
          description: Null unless status is ok. Capped at D when the final URL is not https.
        summary:
          type:
          - object
          - 'null'
          required:
          - passed
          - warned
          - failed
          - missing
          - not_applicable
          - hsts_preload_ready
          - csp_strict
          properties:
            passed:
              type: integer
              minimum: 0
            warned:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
            missing:
              type: integer
              minimum: 0
            not_applicable:
              type: integer
              minimum: 0
            hsts_preload_ready:
              type: boolean
            csp_strict:
              type: boolean
        checks:
          type: array
          description: 11 checks in a fixed order; empty when status is unknown.
          items:
            type: object
            required:
            - id
            - status
            - value
            - detail_code
            - issues
            - weight
            properties:
              id:
                type: string
                enum:
                - strict_transport_security
                - content_security_policy
                - clickjacking
                - x_content_type_options
                - referrer_policy
                - permissions_policy
                - cross_origin_opener_policy
                - cross_origin_embedder_policy
                - cross_origin_resource_policy
                - information_disclosure
                - cookies
              status:
                type: string
                enum:
                - pass
                - warn
                - fail
                - missing
                - not_applicable
              value:
                type:
                - string
                - 'null'
                description: Observed value, truncated to 512 characters. Cookie checks list names only.
              detail_code:
                type: string
              issues:
                type: array
                items:
                  type: string
              weight:
                type: integer
                minimum: 0
              classification:
                $ref: '#/components/schemas/ClassificationStatus'
        cookies:
          type: array
          description: Observed cookies (max 25). Values are never returned.
          items:
            type: object
            required:
            - name
            - secure
            - http_only
            - same_site
            - issues
            properties:
              name:
                type: string
              secure:
                type: boolean
              http_only:
                type: boolean
              same_site:
                type:
                - string
                - 'null'
                enum:
                - strict
                - lax
                - none
                - invalid
                - null
              issues:
                type: array
                items:
                  type: string
        headers_raw:
          type: object
          additionalProperties:
            type: string
          description: Security-relevant response headers that were present, with lowercase names. Never includes set-cookie.
        recommendations:
          type: array
          items:
            type: string
          description: Triggered recommendation codes in fixed priority order.
        fetch:
          type: object
          required:
          - checked_url
          - http_status
          - final_url
          - via_proxy
          - redirect_count
          - unknown_reason
          properties:
            checked_url:
              type: string
              format: uri
            http_status:
              type:
              - integer
              - 'null'
            final_url:
              type:
              - string
              - 'null'
            via_proxy:
              type:
              - boolean
              - 'null'
            redirect_count:
              type:
              - integer
              - 'null'
            unknown_reason:
              type:
              - string
              - 'null'
              enum:
              - timeout
              - dns_error
              - network_error
              - malformed_response
              - redirect_limit
              - proxy_unavailable
              - null
        caveats:
          type: array
          items:
            type: string
        rubric_version:
          type: string
    SecurityTxtResponse:
      type: object
      required:
      - domain
      - status
      - location
      - checked_at
      - fetch
      - fields
      - signed
      - issues
      - caveats
      properties:
        classification:
          $ref: '#/components/schemas/ClassificationStatus'
        domain:
          type: string
        status:
          type: string
          enum:
          - valid
          - invalid
          - not_found
          - unknown
          description: 'valid: found with no error-severity issues. invalid: found with errors, or an HTML page was served. not_found: both locations returned an exact 404 or 410. unknown: blocked, rate-limited, server-error or failed fetch; refunded.'
        location:
          type:
          - string
          - 'null'
          enum:
          - well_known
          - legacy
          - null
        checked_at:
          type: string
          format: date-time
        fetch:
          type: array
          description: One entry per attempt (1 or 2).
          items:
            type: object
            required:
            - location
            - checked_url
            - http_status
            - final_url
            - via_proxy
            - content_type
            - bytes
            - truncated
            - outcome
            - error
            properties:
              location:
                type: string
                enum:
                - well_known
                - legacy
              checked_url:
                type: string
                format: uri
              http_status:
                type:
                - integer
                - 'null'
              final_url:
                type:
                - string
                - 'null'
              via_proxy:
                type:
                - boolean
                - 'null'
              content_type:
                type:
                - string
                - 'null'
              bytes:
                type:
                - integer
                - 'null'
              truncated:
                type: boolean
              outcome:
                type: string
                enum:
                - found
                - not_found
                - unknown
              error:
                type:
                - string
                - 'null'
                description: timeout, network_error, dns_error, blocked_response, malformed_response or http_<status>.
        fields:
          type: object
          required:
          - contact
          - expires
          - expires_in_days
          - encryption
          - acknowledgments
          - preferred_languages
          - canonical
          - policy
          - hiring
          - csaf
          - other_fields
          properties:
            contact:
              type: array
              items:
                type: string
            expires:
              type:
              - string
              - 'null'
              format: date-time
            expires_in_days:
              type:
              - integer
              - 'null'
              description: Whole days until expiry; negative when expired.
            encryption:
              type: array
              items:
                type: string
            acknowledgments:
              type: array
              items:
                type: string
            preferred_languages:
              type: array
              items:
                type: string
            canonical:
              type: array
              items:
                type: string
            policy:
              type: array
              items:
                type: string
            hiring:
              type: array
              items:
                type: string
            csaf:
              type: array
              items:
                type: string
            other_fields:
              type: array
              items:
                type: object
                required:
                - name
                - value
                properties:
                  name:
                    type: string
                  value:
                    type: string
        signed:
          type: boolean
          description: OpenPGP cleartext signature present. The signature is not verified.
        issues:
          type: array
          items:
            type: object
            required:
            - code
            - severity
            - field
            properties:
              code:
                type: string
              severity:
                type: string
                enum:
                - error
                - warning
              field:
                type:
                - string
                - 'null'
        caveats:
          type: array
          items:
            type: string
            enum:
            - signature_not_verified
            - body_truncated
            - legacy_location_unknown
    ErrorResponse:
      type: object
      description: Canonical error format shared by every API error response. Endpoint-specific fields (for example credits_remaining, login_url or evidence_summary) may appear next to error or inside it; clients should ignore fields they do not recognise.
      additionalProperties: true
      properties:
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
              description: Stable, upper-case machine code. Codes are never renamed; the full catalog with HTTP status, type and retryability is published as x-domscan-error-codes.
              example: INVALID_DOMAIN
            type:
              type: string
              enum:
              - authentication_error
              - credits_error
              - permission_error
              - not_found_error
              - conflict_error
              - rate_limit_error
              - timeout_error
              - validation_error
              - upstream_error
              - api_error
              - request_error
              description: Stable error category used by official SDK subclasses
            message:
              type: string
              description: Human-readable error message
              example: Invalid domain format
            status:
              type: integer
              minimum: 400
              maximum: 599
              description: HTTP status repeated in the JSON error for queue and log processors
            retryable:
              type: boolean
              description: Whether retrying can be appropriate after applying retry guidance
            request_id:
              type: string
              description: Request identifier matching the X-Request-Id response header
            suggestion:
              type: string
              description: Suggestion for fixing the error
            details:
              type: object
              description: Optional structured context for the error
              additionalProperties: true
            retry_after:
              type: integer
              minimum: 0
              description: Seconds to wait before retrying when the error is temporary
              example: 300
            docs_url:
              type: string
              description: Absolute link to the documentation section for this error
              example: https://domscan.net/docs/check-availability
          required:
          - type
          - code
          - message
          - status
          - retryable
          - request_id
          - docs_url
  headers:
    XRateLimitLimit:
      description: Burst capacity of the rate limit that applies to this API key.
      schema:
        type: integer
        minimum: 0
    XRateLimitRemaining:
      description: Requests that can still be sent immediately before the rate limit applies.
      schema:
        type: integer
        minimum: 0
    XRateLimitReset:
      description: Unix time in seconds when the burst capacity is fully refilled.
      schema:
        type: integer
        minimum: 0
    IdempotentReplayed:
      description: Present and `true` when this response is a stored replay for a repeated Idempotency-Key. A replay charges nothing.
      schema:
        type: string
        enum:
        - 'true'
    XCreditsRemaining:
      description: Credits remaining on the account after this request. Omitted when the balance is not already known without an extra lookup.
      schema:
        type: integer
        minimum: 0
    XCreditsCharged:
      description: Credits charged by this request, net of any refund made in the same request. Sent on authenticated /v1 responses, including errors (0 when nothing was charged).
      schema:
        type: integer
        minimum: 0
    XFieldsIgnored:
      description: 'Sent when `fields` was used and some paths matched nothing in this response: those paths, comma-separated, at most 20.'
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request - invalid parameters
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: Invalid domain format
              suggestion: Domain must be a valid format like example.com
              type: validation_error
              status: 400
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
    IdempotencyInProgress:
      description: A request with the same Idempotency-Key is still running. Retry after Retry-After seconds to receive its stored response. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: IDEMPOTENCY_IN_PROGRESS
              message: A request with this Idempotency-Key is still being processed. Retry shortly to receive its result.
              type: conflict_error
              status: 409
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
              retry_after: 1
    PaymentRequired:
      description: Insufficient credits for this request. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          schema:
            type: integer
          description: Credits remaining on the account
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INSUFFICIENT_CREDITS
              message: Insufficient credits. This endpoint costs 2 credits but you have 0. Purchase more at https://domscan.net/billing or wait for your monthly reset.
              credits_remaining: 0
              credits_required: 2
              purchase_url: https://domscan.net/billing
              type: credits_error
              status: 402
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/credits-pricing
    BadGateway:
      description: The public website could not be fetched or returned an unusable response.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FETCH_ERROR
              message: Failed to fetch website
              type: upstream_error
              status: 502
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/error-codes
    RateLimited:
      description: Rate limit exceeded. Free accounts can sustain 120 requests per minute per account with a burst capacity of 60. Free bulk traffic is additionally limited to 20 requests per minute per account across all bulk endpoints and 100 per minute per IPv4 address or IPv6 /56 network. Paid accounts can sustain 600 requests per minute with a burst capacity of 120.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          schema:
            type: integer
          description: The immediate burst capacity, or the active bulk fixed-window limit when a bulk-specific limit is exceeded.
        X-RateLimit-Remaining:
          schema:
            type: integer
            example: 0
          description: Immediate burst tokens remaining, or requests remaining in the active bulk fixed window.
        X-RateLimit-Reset:
          schema:
            type: integer
            example: 1791590400
          description: Unix time in seconds when the limit that was exceeded allows a new request again.
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
        X-RateLimit-Plan:
          schema:
            type: string
            enum:
            - free
            - paid
          description: The account plan whose policy was applied.
        X-RateLimit-Policy:
          schema:
            type: string
          description: Machine-readable summary of the active tier and limit policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded. Please wait before making more requests.
              type: rate_limit_error
              status: 429
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/rate-limits
              retry_after: 12
    IdempotencyKeyReused:
      description: The Idempotency-Key was already used by this API key for a different request (method, path, query or body) in the last 24 hours. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: IDEMPOTENCY_KEY_REUSED
              message: This Idempotency-Key was already used with a different request. Use a new key for a new request.
              type: validation_error
              status: 422
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
    Unauthorized:
      description: 'Authentication required. All API endpoints require a valid API key (x-api-key header or Authorization: Bearer) or an active session cookie.'
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
