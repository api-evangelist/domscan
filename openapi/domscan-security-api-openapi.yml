  /v1/idn:
    get:
      tags:
      - Security
      summary: Analyze IDN and homograph risk
      description: 'Convert a domain between Unicode and punycode (UTS #46) and analyse each label: Unicode scripts, mixed-script use, invisible characters and lookalike (confusable) characters, plus a confusable skeleton of the whole name and a homograph risk level with reasons. Pure computation with no outbound requests. Uses a curated subset of Unicode confusables, so the absence of a flag is not proof of safety. Names that cannot be converted return 400; label or name length violations return 200 with `valid: false`.'
      operationId: getIdnAnalysis
      parameters:
      - name: domain
        description: Unicode or punycode domain name. Case-insensitive; one trailing dot is removed. No scheme, path, port or whitespace.
        in: query
        required: true
        schema:
          type: string
          maxLength: 512
          example: xn--80ak6aa92e.com
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Unicode and ASCII forms, per-label script analysis, skeleton and risk
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdnAnalysisResponse'
              example:
                input: xn--80ak6aa92e.com
                outcome: analyzed
                unicode: аррӏе.com
                ascii: xn--80ak6aa92e.com
                is_idn: true
                valid: true
                errors: []
                labels:
                - unicode: аррӏе
                  ascii: xn--80ak6aa92e
                  is_idn: true
                  scripts:
                  - Cyrillic
                  mixed_script: false
                  has_invisible: false
                  confusable_characters:
                  - char: а
                    codepoint: U+0430
                    script: Cyrillic
                    looks_like: a
                  - char: р
                    codepoint: U+0440
                    script: Cyrillic
                    looks_like: p
                  - char: р
                    codepoint: U+0440
                    script: Cyrillic
                    looks_like: p
                  - char: ӏ
                    codepoint: U+04CF
                    script: Cyrillic
                    looks_like: l
                  - char: е
                    codepoint: U+0435
                    script: Cyrillic
                    looks_like: e
                - unicode: com
                  ascii: com
                  is_idn: false
                  scripts:
                  - Latin
                  mixed_script: false
                  has_invisible: false
                  confusable_characters: []
                skeleton: apple.com
                risk:
                  level: high
                  reasons:
                  - whole_script_confusable
                  - idn_label
                tld:
                  label: com
                  ascii: com
                  is_idn: false
                checked_at: '2026-10-09T10:15:30.000Z'
