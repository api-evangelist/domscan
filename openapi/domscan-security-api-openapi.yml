openapi: 3.2.0
info:
  title: DomScan Security API
  description: 'DomScan is a domain intelligence API providing domain analysis tools. **Core Features:**

    - Domain Availability: Check single or bulk domains using RDAP with 1,100+ TLDs supported

    - Domain Intelligence: AI suggestions, valuations, health checks, typosquatting detection

    - OSINT Tools: DNS lookup, WHOIS/RDAP, SSL certificates, subdomain discovery, IP geolocation, tech stack detection

    - Social & Branding: Social handle checker, brand name scoring

    - Phone Intelligence: Privacy-first phone number validation, normalization, and classification

    - Pricing: Scheduled standard-TLD tables from verified official registrar sources, plus separate credential-backed exact-domain quotes

    - Watchlist: Domain monitoring for expiration and availability alerts


    **Authentication:**

    Most API endpoints require authentication. Pass your API key via the x-api-key header or Authorization: Bearer header. Operations marked with an empty security requirement are intentionally public, including API specifications and selected catalog endpoints. Get your free API key at https://domscan.net/dashboard. Logged-in users on domscan.net tools pages are authenticated automatically via session cookie. **Rate Limits:**

    Free accounts can sustain 120 requests per minute per account, with a burst capacity of 60. All API keys and dashboard sessions belonging to the same free account share this budget. Bulk endpoints have an additional free-tier budget of 20 HTTP requests per minute per account across all bulk endpoints. Free-tier bulk traffic is also capped at 100 requests per minute per IPv4 address or IPv6 /56 network. Platform-wide edge protections still apply to every tier. Paid accounts can sustain 600 requests per minute, with a burst capacity of 120, shared by every API key and dashboard session of the account. Paid accounts do not receive the additional free-tier bulk budget. Scope: RapidAPI subscribers are counted per subscriber. (scope=rapidapi-customer) Zyla subscribers are counted per subscriber when the gateway identifies them, (scope=zyla-customer) and as one shared gateway budget when it does not. (scope=zyla-gateway) Other authenticated requests are counted per account: every API key and dashboard session of the account shares one budget. (scope=account) A key that is not linked to an account is counted on its own. (scope=api-key) Unauthenticated requests to public endpoints are counted per client IP address (scope unknown when the address cannot be determined, as one shared budget). (scope=ip)


    Every authenticated response, success or error, includes X-RateLimit-Plan, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, and X-RateLimit-Policy. X-RateLimit-Limit and X-RateLimit-Remaining describe the immediate burst bucket; X-RateLimit-Reset is the Unix time in seconds when that bucket is full again; X-RateLimit-Policy also states the sustained per-minute rate, scope, and any free bulk limits. Exceeding a limit returns HTTP 429 with Retry-After. Retry only after the indicated delay. **Credits System:**

    API calls consume credits based on endpoint complexity. Sign up for free to receive 10,000 credits monthly. - 1 credit: Status checks, DNS lookups, tool builders

    - 2-5 credits: Health checks, valuations, OSINT tools

    - Bulk endpoints: standard per-item rate for batching multiple items into fewer HTTP requests. - 6-25 credits: Recipe compound operations


    When credits reach zero, the API returns HTTP 402 with credits_remaining, credits_required, and a purchase_url. API responses include X-Credits-Requested, X-Credits-Charged, and X-Credits-Refunded. X-Credits-Charged is the net charge after any refund made during the request. Authenticated responses also include X-Credits-Remaining whenever the balance is known without an extra lookup. Free credits refresh monthly on the account''s signup anniversary. POST /v1/estimate returns the credits a request would charge without running it, at no cost.'
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: Security
  description: Security posture, reputation, exposure, and vulnerability intelligence
paths:
  /v1/certificates/bulk:
    post:
      operationId: bulkGetCertificates
      summary: Search certificates for multiple domains
      description: Search public Certificate Transparency data for multiple domains with shared filtering options. Accepts up to 10 items, preserves input order, and uses bounded concurrency. The outer response is HTTP 200 when the batch is accepted, so inspect each result for data or an error. Billing is 2 credits per validated item with no bulk discount, including items that return a per-item lookup error.
      tags:
      - Security
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domains
              properties:
                domains:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: hostname
                include_subdomains:
                  type: boolean
                  default: true
                include_expired:
                  type: boolean
                  default: false
                limit:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  default: 100
            example:
              domains:
              - example.com
              - cloudflare.com
              include_subdomains: true
              limit: 100
      responses:
        '200':
          description: Batch accepted. Each ordered result contains either data or a per-item error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkLookupResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/DryRun'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-credits:
        model: per_item
        default: 2
  /v1/subdomains/bulk:
    post:
      operationId: bulkGetSubdomains
      summary: Discover subdomains for multiple domains
      description: Run the best-effort passive hostname evidence pipeline for multiple root domains. Discovery coverage is incomplete and result entries retain source labels. Accepts up to 10 items, preserves input order, and uses bounded concurrency. The outer response is HTTP 200 when the batch is accepted, so inspect each result for data or an error. Billing is 4 credits per validated item by default, or 5 credits per item when verify=true, with no bulk discount. Items that return a per-item lookup error are still billed.
      tags:
      - Security
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domains
              properties:
                domains:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: hostname
                verify:
                  type: boolean
                  default: false
                include_wildcards:
                  type: boolean
                  default: false
                limit:
                  type: integer
                  minimum: 1
                  maximum: 2000
                  default: 500
            example:
              domains:
              - example.com
              - cloudflare.com
              verify: false
              limit: 500
      responses:
        '200':
          description: Batch accepted. Each ordered result contains either data or a per-item error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkLookupResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/DryRun'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-credits:
        model: per_item
        default: 4
        variants:
        - parameter: verify
          equals: true
          credits: 5
        note: 4 credits per item by default; 5 credits per item when verify=true.
  /v1/email-auth/bulk:
    post:
      operationId: bulkGetEmailAuth
      summary: Audit email authentication for multiple domains
      description: Check SPF, DKIM, DMARC, MTA-STS, TLS-RPT, and recursive SPF behavior for multiple domains with an optional shared DKIM selector list. Accepts up to 10 items, preserves input order, and uses bounded concurrency. The outer response is HTTP 200 when the batch is accepted, so inspect each result for data or an error. Billing is 3 credits per validated item with no bulk discount, including items that return a per-item lookup error.
      tags:
      - Security
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domains
              properties:
                domains:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: hostname
                selectors:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: string
            example:
              domains:
              - example.com
              - cloudflare.com
              selectors:
              - selector1
              - selector2
      responses:
        '200':
          description: Batch accepted. Each ordered result contains either data or a per-item error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkLookupResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/DryRun'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-credits:
        model: per_item
        default: 3
  /v1/vulnerabilities:
    get:
      tags:
      - Security
      summary: Scan exposed software for known vulnerabilities
      description: Run a passive, evidence-first vulnerability snapshot for a public URL or domain. DomScan correlates exposed technology versions with authoritative public advisories and exploitation-priority data, and reports deterministic response-header misconfigurations separately. Deep mode adds one isolated JavaScript-rendered page. The scan sends no exploit payloads, preserves unknown coverage, and never treats a versionless fingerprint as a detected vulnerability. If the target page is unavailable, the response is partial with unknown target coverage, does not infer findings from missing evidence, and refunds the request credits.
      operationId: getVulnerabilities
      x-required-any-of:
      - - url
      - - domain
      parameters:
      - name: url
        in: query
        required: false
        description: Full public HTTP(S) URL to analyze. Takes precedence over domain when both are supplied.
        schema:
          type: string
          format: uri
          minLength: 1
          maxLength: 2048
      - name: domain
        in: query
        required: false
        description: Public domain or HTTP(S) URL to analyze. At least one of url or domain is required.
        schema:
          type: string
          minLength: 1
          maxLength: 2048
      - name: mode
        in: query
        required: false
        description: Choose standard for bounded response inspection or deep to add isolated JavaScript rendering.
        schema:
          type: string
          enum:
          - standard
          - deep
          default: standard
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Passive vulnerability intelligence result with explicit evidence and coverage limits.
          content:
            application/json:
              schema:
                type: object
                required:
                - target
                - scan
                - summary
                - findings
                - components
                - coverage
                - sources
                properties:
                  target:
                    type: object
                    required:
                    - requested_url
                    - final_url
                    - hostname
                    properties:
                      requested_url:
                        type: string
                        format: uri
                      final_url:
                        type: string
                        format: uri
                      hostname:
                        type: string
                  scan:
                    type: object
                    required:
                    - mode
                    - status
                    - checked_at
                    - duration_ms
                    - disclaimer
                    properties:
                      mode:
                        type: string
                        enum:
                        - standard
                        - deep
                      status:
                        type: string
                        enum:
                        - complete
                        - partial
                      checked_at:
                        type: string
                        format: date-time
                      duration_ms:
                        type: integer
                        minimum: 0
                      disclaimer:
                        type: string
                  summary:
                    type: object
                    required:
                    - posture
                    - risk_level
                    - finding_count
                    - version_affected_count
                    - misconfiguration_count
                    - urgent_count
                    - severity_counts
                    properties:
                      posture:
                        type: string
                        enum:
                        - action_required
                        - review
                        - no_known_findings
                        - unknown
                      risk_level:
                        type: string
                        enum:
                        - critical
                        - high
                        - medium
                        - low
                        - none
                        - unknown
                      finding_count:
                        type: integer
                        minimum: 0
                      version_affected_count:
                        type: integer
                        minimum: 0
                      misconfiguration_count:
                        type: integer
                        minimum: 0
                      urgent_count:
                        type: integer
                        minimum: 0
                      severity_counts:
                        type: object
                        additionalProperties:
                          type: integer
                          minimum: 0
                  findings:
                    type: array
                    items:
                      type: object
                      required:
                      - fingerprint
                      - classification
                      - severity
                      - priority
                      - title
                      - summary
                      - evidence
                      - remediation
                      - sources
                      properties:
                        fingerprint:
                          type: string
                        classification:
                          type: string
                          enum:
                          - version_affected
                          - security_misconfiguration
                        severity:
                          type: string
                          enum:
                          - critical
                          - high
                          - medium
                          - low
                          - info
                          - unknown
                        priority:
                          type: string
                          enum:
                          - urgent
                          - high
                          - elevated
                          - normal
                        title:
                          type: string
                        summary:
                          type: string
                        component:
                          type: object
                          properties:
                            technology_id:
                              type: string
                            name:
                              type: string
                            detected_version:
                              type: string
                            version_kind:
                              type: string
                              enum:
                              - product
                              - asset
                              - protocol
                              - edge_build
                            confidence:
                              type: string
                              enum:
                              - high
                              - medium
                              - low
                            confidence_score:
                              type: integer
                              minimum: 0
                              maximum: 100
                            ecosystem:
                              type: string
                            package:
                              type: string
                            purl:
                              type: string
                        advisory:
                          type: object
                          properties:
                            id:
                              type: string
                            aliases:
                              type: array
                              items:
                                type: string
                            cves:
                              type: array
                              items:
                                type: string
                            published_at:
                              type:
                              - string
                              - 'null'
                              format: date-time
                            modified_at:
                              type:
                              - string
                              - 'null'
                              format: date-time
                            cvss:
                              type: array
                              items:
                                type: object
                                properties:
                                  type:
                                    type: string
                                  vector:
                                    type: string
                            fixed_versions:
                              type: array
                              items:
                                type: string
                            affected_ranges:
                              type: array
                              items:
                                type: object
                                additionalProperties: true
                            references:
                              type: array
                              items:
                                type: string
                                format: uri
                        exploitation:
                          type: object
                          properties:
                            cisa_kev:
                              type:
                              - boolean
                              - 'null'
                            kev_added_at:
                              type:
                              - string
                              - 'null'
                              format: date
                            kev_required_action:
                              type:
                              - string
                              - 'null'
                            known_ransomware_use:
                              type:
                              - string
                              - 'null'
                            epss_probability:
                              type:
                              - number
                              - 'null'
                              minimum: 0
                              maximum: 1
                            epss_percentile:
                              type:
                              - number
                              - 'null'
                              minimum: 0
                              maximum: 1
                            epss_date:
                              type:
                              - string
                              - 'null'
                              format: date
                        evidence:
                          type: object
                          required:
                          - confidence
                          - observed
                          - limitations
                          properties:
                            confidence:
                              type: string
                              enum:
                              - high
                              - medium
                              - low
                            observed:
                              type: array
                              items:
                                type: string
                            limitations:
                              type: array
                              items:
                                type: string
                        remediation:
                          type: object
                          required:
                          - summary
                          - fixed_versions
                          properties:
                            summary:
                              type: string
                            fixed_versions:
                              type: array
                              items:
                                type: string
                        sources:
                          type: array
                          items:
                            type: string
                            enum:
                            - osv
                            - cisa_kev
                            - first_epss
                            - target_response
                  components:
                    type: array
                    items:
                      type: object
                      required:
                      - technology_id
                      - name
                      - detected_version
                      - version_kind
                      - confidence
                      - advisory_status
                      - matched_advisories
                      properties:
                        technology_id:
                          type: string
                        name:
                          type: string
                        detected_version:
                          type:
                          - string
                          - 'null'
                        version_kind:
                          type:
                          - string
                          - 'null'
                        confidence:
                          type: string
                          enum:
                          - high
                          - medium
                          - low
                        advisory_status:
                          type: string
                          enum:
                          - checked
                          - version_unavailable
                          - mapping_unavailable
                          - version_kind_not_supported
                          - version_format_not_supported
                          - not_checked_limit
                          - unknown
                          description: Package advisory coverage for this component. not_checked_limit means the component was eligible but fell beyond the bounded per-scan query limit.
                        matched_advisories:
                          type: integer
                          minimum: 0
                  coverage:
                    type: object
                    properties:
                      target_response:
                        type: string
                      technology_detection:
                        type: string
                      package_advisories:
                        type: string
                      known_exploitation:
                        type: string
                      exploitation_probability:
                        type: string
                      detected_components:
                        type: integer
                      versioned_components:
                        type: integer
                      advisory_eligible_components:
                        type: integer
                      advisory_checked_components:
                        type: integer
                      advisory_deferred_components:
                        type: integer
                        description: Eligible components not queried because they exceeded the bounded per-scan advisory limit.
                      advisory_query_limit:
                        type: integer
                        description: Maximum package-version advisory queries performed per scan.
                      relay_used:
                        type: boolean
                      limitations:
                        type: array
                        items:
                          type: string
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        owner:
                          type: string
                        url:
                          type: string
                          format: uri
                        status:
                          type: string
                        retrieved_at:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        cache_hit:
                          type: boolean
                        expected_freshness:
                          type: string
                        fallback_behavior:
                          type: string
                        cost:
                          type: string
                          enum:
                          - none
                  _meta:
                    type: object
                    additionalProperties: true
              example:
                target:
                  requested_url: https://www.example.com/
                  final_url: https://www.example.com/
                  hostname: www.example.com
                scan:
                  mode: standard
                  status: complete
                  checked_at: '2026-10-09T10:15:30.000Z'
                  duration_ms: 3120
                  disclaimer: A clean result means DomScan did not detect an issue within the documented scan coverage. Automated scanning cannot prove that an application is vulnerability-free or replace an authorized penetration test.
                summary:
                  posture: review
                  risk_level: medium
                  finding_count: 2
                  version_affected_count: 0
                  misconfiguration_count: 2
                  urgent_count: 0
                  severity_counts:
                    critical: 0
                    high: 0
                    medium: 1
                    low: 1
                    info: 0
                    unknown: 0
                findings:
                - fingerprint: configuration:content-security-policy:www.example.com
                  classification: security_misconfiguration
                  severity: medium
                  priority: elevated
                  title: Content Security Policy is not advertised
                  summary: The observed response did not include a Content-Security-Policy header.
                  evidence:
                    confidence: high
                    observed:
                    - Public response did not include the expected content-security-policy protection.
                    limitations:
                    - header_policy_can_vary_by_path_or_response_status
                  remediation:
                    summary: Deploy a restrictive Content Security Policy in report-only mode first, then enforce it.
                    fixed_versions: []
                  sources:
                  - target_response
                - fingerprint: configuration:referrer-policy:www.example.com
                  classification: security_misconfiguration
                  severity: low
                  priority: normal
                  title: Referrer Policy is not advertised
                  summary: The response did not include an explicit Referrer-Policy header.
                  evidence:
                    confidence: high
                    observed:
                    - Public response did not include the expected referrer-policy protection.
                    limitations:
                    - header_policy_can_vary_by_path_or_response_status
                  remediation:
                    summary: Choose and deploy a Referrer-Policy that matches the application privacy and analytics requirements.
                    fixed_versions: []
                  sources:
                  - target_response
                components:
                - technology_id: jquery
                  name: jQuery
                  detected_version: 3.7.1
                  version_kind: asset
                  confidence: high
                  advisory_status: checked
                  matched_advisories: 0
                - technology_id: cloudflare
                  name: Cloudflare
                  detected_version: null
                  version_kind: null
                  confidence: high
                  advisory_status: mapping_unavailable
                  matched_advisories: 0
                coverage:
                  target_response: checked
                  technology_detection: checked
                  package_advisories: checked
                  known_exploitation: not_requested
                  exploitation_probability: not_requested
                  detected_components: 2
                  versioned_components: 1
                  advisory_eligible_components: 1
                  advisory_checked_components: 1
                  advisory_deferred_components: 0
                  advisory_query_limit: 20
                  relay_used: true
                  limitations:
                  - Only exact reviewed technology-to-package mappings are checked against OSV.
                  - Versionless or semantically incompatible detections are not reported as vulnerable.
                  - This passive scan does not send exploit payloads or prove exploitability.
                  - Response headers and exposed versions can vary by path, edge location, or authentication state.
                sources:
                - id: target_response
                  name: Observed public response
                  owner: Target website
                  url: https://domscan.net/tech-stack-api
                  status: checked
                  retrieved_at: '2026-10-09T10:15:30.000Z'
                  cache_hit: false
                  expected_freshness: Live at scan time
                  fallback_behavior: Unavailable signals remain unknown and never imply that the target is unaffected
                  cost: none
                - id: osv
                  name: OSV
                  owner: Google Open Source Security Team
                  url: https://google.github.io/osv.dev/
                  status: checked
                  retrieved_at: '2026-10-09T10:15:29.000Z'
                  cache_hit: false
                  expected_freshness: OSV targets advisory freshness within 15 minutes
                  fallback_behavior: Use a fresh cached result when available; otherwise mark the component advisory check unknown
                  cost: none
                - id: cisa_kev
