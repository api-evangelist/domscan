      summary: Domain security rating
      description: 'One weighted, explainable security rating for a domain, built from passive checks DomScan already runs: TLS and certificate grade, HTTP security headers, SPF and DMARC, DNSSEC and CAA, domain blocklists and security.txt. They run in parallel within a 25-second budget. Each category has a 0-100 score, a weight and coded findings; a category whose check gave no evidence (a timeout, a challenge page, a blocklist that did not answer) is unknown and left out of the score instead of counting against it, and score_confidence shows how much weight was covered. A critical finding (an expired, revoked or invalid certificate, or a blocklist listing) caps the grade at F. Passive and non-intrusive: not a penetration test. 5 credits; refunded when no category could be scored.'
