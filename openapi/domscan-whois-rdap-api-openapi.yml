  /v1/rdap:
    get:
      tags:
      - WHOIS/RDAP
      summary: RDAP lookup
      description: Get raw RDAP registration data for a domain, IP address, or autonomous system number. Domains remain the default query type; use type=ip or type=autnum for non-domain lookups. Responses include a lookup summary with source and fallback evidence.
      operationId: getRdap
      parameters:
      - name: query
        in: query
        required: false
        description: Lookup value. Defaults to a registrable domain unless type is provided, including valid names under multi-label public suffixes such as example.co.uk or example.com.tw. Subdomains and hosted-service hostnames are rejected with HTTP 400; negative DNS results alone do not establish that a domain is available.
        schema:
          type: string
          example: example.com
        examples:
          domain:
            summary: Domain lookup
            value: example.com
          ipv4:
            summary: IPv4 lookup
            value: 8.8.8.8
          ipv6Cidr:
            summary: IPv6 CIDR lookup
            value: 2001:4860:4860::8888/128
          autnum:
            summary: Autnum lookup
            value: AS174
      - name: type
        in: query
        required: false
        description: 'Optional RDAP query type. Supported values: domain, ip, autnum.'
        schema:
          type: string
          enum:
          - domain
          - ip
          - autnum
          example: domain
        examples:
          domain:
            summary: Domain lookup
            value: domain
          ip:
            summary: IP lookup
            value: ip
          autnum:
            summary: Autnum lookup
            value: autnum
      - name: domain
        in: query
        required: false
        deprecated: true
        description: Alias for query parameter on domain lookups
        schema:
          type: string
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: RDAP registration data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RdapResponse'
              examples:
                domain:
                  summary: Registered domain
                  value:
                    query: example.com
                    type: domain
                    status: registered
                    rdap:
                      objectClassName: domain
                      ldhName: example.com
                      handle: 2336799_DOMAIN_COM-VRSN
                    entity_summary:
                      roles_present:
                      - abuse
                      - registrar
                      abuse_contact:
                        handle: ABUSE-1
                        name: null
                        email: abuse@example.test
                        roles:
                        - abuse
                        public_field_count: 1
                      registrar:
                        handle: REG-1
                        name: Example Registrar
                        email: null
                        roles:
                        - registrar
                        public_field_count: 1
                      registrant: null
                      admin: null
                      tech: null
                      entity_count: 2
                      redacted_role_count: 1
                    lookup_summary:
                      relay_configured: true
                      query_type: domain
                      status: registered
                      data_source: rdap
                      relay_whois_used: false
                      dns_fallback_used: false
                      rdap_object_class: domain
                      event_count: null
                      entity_count: null
                      nameserver_count: null
                      port43_available: false
                domainDnsFallback:
                  summary: Registered domain with RDAP temporarily unavailable
                  value:
                    query: example.com
                    type: domain
                    status: registered
                    rdap: null
                    dns_status:
                      checked: true
                      has_nameservers: true
                      resolvable: true
                    lookup_summary:
                      relay_configured: true
                      query_type: domain
                      status: registered
                      data_source: dns_fallback
                      relay_whois_used: false
                      dns_fallback_used: true
                      rdap_object_class: null
                      event_count: null
                      entity_count: null
                      nameserver_count: null
                      port43_available: null
                    meta:
                      source: dns_fallback
                      warning_code: RDAP_UNAVAILABLE_DNS_FALLBACK
                      reason: RDAP response temporarily unavailable
                ip:
                  summary: IP network
                  value:
                    query: 8.8.8.8
                    type: ip
                    status: found
                    rdap:
                      objectClassName: ip network
                      handle: NET-8-8-8-0-2
                      startAddress: 8.8.8.0
                      endAddress: 8.8.8.255
                autnum:
                  summary: Autonomous system
                  value:
                    query: '174'
