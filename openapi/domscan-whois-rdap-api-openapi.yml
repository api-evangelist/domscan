openapi: 3.2.0
info:
  title: DomScan WHOIS/RDAP API
  description: 'DomScan is a domain intelligence API providing domain analysis tools. **Core Features:**

    - Domain Availability: Check single or bulk domains using RDAP with 1,100+ TLDs supported

    - Domain Intelligence: AI suggestions, valuations, health checks, typosquatting detection

    - OSINT Tools: DNS lookup, WHOIS/RDAP, SSL certificates, subdomain discovery, IP geolocation, tech stack detection

    - Social & Branding: Social handle checker, brand name scoring

    - Phone Intelligence: Privacy-first phone number validation, normalization, and classification

    - Pricing: Scheduled standard-TLD tables from verified official registrar sources, plus separate credential-backed exact-domain quotes

    - Watchlist: Domain monitoring for expiration and availability alerts


    **Authentication:**

    Most API endpoints require authentication. Pass your API key via the x-api-key header or Authorization: Bearer header. Operations marked with an empty security requirement are intentionally public, including API specifications and selected catalog endpoints. Get your free API key at https://domscan.net/dashboard. Logged-in users on domscan.net tools pages are authenticated automatically via session cookie. **Rate Limits:**

    Free accounts can sustain 120 requests per minute per account, with a burst capacity of 60. All API keys and dashboard sessions belonging to the same free account share this budget. Bulk endpoints have an additional free-tier budget of 20 HTTP requests per minute per account across all bulk endpoints. Free-tier bulk traffic is also capped at 100 requests per minute per IPv4 address or IPv6 /56 network. Platform-wide edge protections still apply to every tier. Paid accounts can sustain 600 requests per minute, with a burst capacity of 120, shared by every API key and dashboard session of the account. Paid accounts do not receive the additional free-tier bulk budget. Scope: RapidAPI subscribers are counted per subscriber. (scope=rapidapi-customer) Zyla subscribers are counted per subscriber when the gateway identifies them, (scope=zyla-customer) and as one shared gateway budget when it does not. (scope=zyla-gateway) Other authenticated requests are counted per account: every API key and dashboard session of the account shares one budget. (scope=account) A key that is not linked to an account is counted on its own. (scope=api-key) Unauthenticated requests to public endpoints are counted per client IP address (scope unknown when the address cannot be determined, as one shared budget). (scope=ip)


    Every authenticated response, success or error, includes X-RateLimit-Plan, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, and X-RateLimit-Policy. X-RateLimit-Limit and X-RateLimit-Remaining describe the immediate burst bucket; X-RateLimit-Reset is the Unix time in seconds when that bucket is full again; X-RateLimit-Policy also states the sustained per-minute rate, scope, and any free bulk limits. Exceeding a limit returns HTTP 429 with Retry-After. Retry only after the indicated delay. **Credits System:**

    API calls consume credits based on endpoint complexity. Sign up for free to receive 10,000 credits monthly. - 1 credit: Status checks, DNS lookups, tool builders

    - 2-5 credits: Health checks, valuations, OSINT tools

    - Bulk endpoints: standard per-item rate for batching multiple items into fewer HTTP requests. - 6-25 credits: Recipe compound operations


    When credits reach zero, the API returns HTTP 402 with credits_remaining, credits_required, and a purchase_url. API responses include X-Credits-Requested, X-Credits-Charged, and X-Credits-Refunded. X-Credits-Charged is the net charge after any refund made during the request. Authenticated responses also include X-Credits-Remaining whenever the balance is known without an extra lookup. Free credits refresh monthly on the account''s signup anniversary. POST /v1/estimate returns the credits a request would charge without running it, at no cost.'
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: WHOIS/RDAP
  description: Domain registration data lookup via RDAP and WHOIS
paths:
  /v1/profile/bulk:
    post:
      operationId: bulkGetDomainProfile
      summary: Get registration profiles for multiple domains
      description: Get normalized RDAP registration profiles for multiple domains with bounded concurrency and ordered per-domain results. Accepts up to 10 items, preserves input order, and uses bounded concurrency. The outer response is HTTP 200 when the batch is accepted, so inspect each result for data or an error. Billing is 3 credits per validated item with no bulk discount, including items that return a per-item lookup error.
      tags:
      - WHOIS/RDAP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domains
              properties:
                domains:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: hostname
            example:
              domains:
              - example.com
              - cloudflare.com
      responses:
        '200':
          description: Batch accepted. Each ordered result contains either data or a per-item error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkLookupResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/DryRun'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-credits:
        model: per_item
        default: 3
  /v1/whois:
    get:
      tags:
      - WHOIS/RDAP
      summary: WHOIS lookup
      description: Get WHOIS registration data for a domain. Returns parsed and normalized data including registrar, dates, nameservers, status codes, source confidence, and fallback evidence. For guarded `.io` and `.biz` lookups, if RDAP reports no registration but WHOIS confirmation is unavailable or inconclusive, the endpoint can return HTTP 200 with limited DNS-only evidence. The `registered` and `available` fields remain `null` when DNS cannot establish activity. Other lookup failures may still return HTTP 502.
      operationId: getWhois
      parameters:
      - name: domain
        in: query
        required: true
        description: Domain to look up
        schema:
          type: string
          example: example.com
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: WHOIS registration data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoisResponse'
              example:
                domain: example.com
                registrar: Example Registrar, Inc.
                registrar_url: https://registrar.example.net
                registrar_iana_id: '9999'
                created_date: '2019-03-11T14:22:08Z'
                updated_date: '2026-03-10T09:41:55Z'
                expiry_date: '2027-03-11T14:22:08Z'
                domain_age_days: 2769
                domain_age_years: 7
                is_newly_registered: false
                days_until_expiry: 153
                transfer_locked: true
                status:
                - client transfer prohibited
                nameservers:
                - ns1.example.net
                - ns2.example.net
                dnssec: false
                contacts:
                  registrant: null
                  admin: null
                  tech: null
                  billing: null
                privacy:
                  is_private: false
                  privacy_service: null
                  detected_patterns: []
                raw_rdap_link: https://rdap.example.net/domain/example.com
                checked_at: '2026-10-09T10:15:30.000Z'
                query_time_ms: 412
                registered: true
                summary:
                  has_registrant: false
                  has_admin: false
                  has_tech: false
                  has_billing: false
                  contact_count: 0
                  is_privacy_protected: false
                edge_summary:
                  relay_configured: true
                  data_sources:
                  - rdap
                  authoritative_source: rdap
                  relay_whois_used: false
                  raw_whois_available: false
                  parse_error_count: null
                  registered: true
                  available: false
                  registration_age_days: 2769
                  days_until_expiry: 153
                  expires_within_30_days: false
                  transfer_locked: true
                  privacy_protected: false
                  dnssec: false
                  nameserver_count: 2
                  contact_roles_available: []
                  abuse_contact_available: false
                  registrar_whois_server: null
                meta:
                  served_by: pop=MAD country=ES
                  data_source: rdap
                  note: Contact information may be redacted due to privacy regulations (GDPR)
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
      x-domscan-credits:
        model: per_request
        default: 3
  /v2/whois:
    get:
      tags:
      - WHOIS/RDAP
      summary: Enhanced WHOIS lookup
      description: Fetch RDAP and traditional WHOIS in parallel, then merge available abuse contacts, registrar WHOIS server details, glue addresses, and raw WHOIS evidence into the normalized response. For guarded `.io` and `.biz` lookups, if RDAP reports no registration but WHOIS confirmation is unavailable or inconclusive, the endpoint can return HTTP 200 with limited DNS-only evidence. The `registered` and `available` fields remain `null` when DNS cannot establish activity. Other lookup failures may still return HTTP 502.
      operationId: getWhoisV2
      parameters:
      - name: domain
        in: query
        required: true
        description: Domain to look up
        schema:
          type: string
          example: example.com
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Merged RDAP and traditional WHOIS registration data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoisResponse'
              example:
                domain: example.com
                registrar: Example Registrar, Inc.
                registrar_url: https://registrar.example.net
                registrar_iana_id: '9999'
                created_date: '2019-03-11T14:22:08Z'
                updated_date: '2026-03-10T09:41:55Z'
                expiry_date: '2027-03-11T14:22:08Z'
                domain_age_days: 2769
                domain_age_years: 7
                is_newly_registered: false
                days_until_expiry: 153
                transfer_locked: true
                status:
                - client transfer prohibited
                nameservers:
                - ns1.example.net
                - ns2.example.net
                dnssec: false
                contacts:
                  registrant: null
                  admin: null
                  tech: null
                  billing: null
                privacy:
                  is_private: false
                  privacy_service: null
                  detected_patterns: []
                raw_rdap_link: https://rdap.example.net/domain/example.com
                checked_at: '2026-10-09T10:15:30.000Z'
                query_time_ms: 412
                registered: true
                summary:
                  has_registrant: false
                  has_admin: false
                  has_tech: false
                  has_billing: false
                  contact_count: 0
                  is_privacy_protected: false
                abuse_contact:
                  email: abuse@registrar.example.net
                  phone: '+1.5555550100'
                registry_domain_id: 2336799_DOMAIN_COM-VRSN
                registrar_whois_server: whois.registrar.example.net
                raw_whois: 'Domain Name: EXAMPLE.COM

                  Registry Domain ID: 2336799_DOMAIN_COM-VRSN

                  Registrar WHOIS Server: whois.registrar.example.net

                  Creation Date: 2019-03-11T14:22:08Z

                  ...'
                nameserver_ips:
                - name: ns1.example.net
                  ipv4: 192.0.2.53
                  ipv6: null
                edge_summary:
                  relay_configured: true
                  data_sources:
                  - rdap
                  - whois
                  authoritative_source: whois
                  relay_whois_used: true
                  raw_whois_available: true
                  parse_error_count: 0
                  registered: true
                  available: false
                  registration_age_days: 2769
                  days_until_expiry: 153
                  expires_within_30_days: false
                  transfer_locked: true
                  privacy_protected: false
                  dnssec: false
                  nameserver_count: 2
                  contact_roles_available: []
                  abuse_contact_available: true
                  registrar_whois_server: whois.registrar.example.net
                meta:
                  served_by: pop=MAD country=ES
                  data_sources:
                  - rdap
                  - whois
                  note: Contact information may be redacted due to privacy regulations (GDPR)
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
      x-domscan-credits:
        model: per_request
        default: 3
  /v1/whois/bulk:
    post:
      tags:
      - WHOIS/RDAP
      summary: Bulk WHOIS lookup
      description: 'Get WHOIS data for multiple domains at once. Returns parsed registration data for each domain.


        **Credits:** 3 credits per domain. Example: 10 domains = 30 credits.'
      operationId: bulkWhois
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domains
              properties:
                domains:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 20
                  description: Array of domains to look up (max 20)
                  example:
                  - example.com
                  - google.com
            example:
              domains:
              - example.com
              - example.org
      responses:
        '200':
          description: Bulk WHOIS results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkWhoisResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/DryRun'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-credits:
        model: per_item
        default: 3
  /v1/whois/history:
    get:
      tags:
      - WHOIS/RDAP
      summary: Query recorded WHOIS observations
      description: Query the DomScan WHOIS observation log. A qualifying fresh, successful RDAP-backed GET /v1/whois or /v2/whois lookup can record at most one normalized snapshot per domain per UTC day. Cached responses, bulk lookups, history reads, and traditional WHOIS-only fallbacks do not add snapshots. This is not a global historical WHOIS archive, does not store registrant identity or contact history, and does not prove ownership or transfer.
      operationId: getWhoisHistory
      parameters:
      - name: domain
        in: query
        required: true
        description: Domain whose DomScan observation log to query
        schema:
          type: string
          example: example.com
      - name: limit
        in: query
        required: false
        description: Maximum recent snapshots to return. Summary, first_seen, last_seen, and total_snapshots describe only this returned window.
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 100
          example: 50
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Limit-scoped WHOIS observation window with snapshots and detected changes
          content:
            application/json:
              schema:
                type: object
                required:
                - domain
                - total_snapshots
                - first_seen
                - last_seen
                - snapshots
                - summary
                - lifecycle_drift_summary
                properties:
                  has_more:
                    type: boolean
                    description: True when another page exists after this one.
                  next_cursor:
                    type:
                    - string
                    - 'null'
                    description: Pass as `cursor` to get the next page; null on the last page.
                  domain:
                    type: string
                    description: Normalized domain queried in the DomScan observation log.
                    example: example.com
                  total_snapshots:
                    type: integer
                    description: Number of snapshots in this response, not the lifetime count outside the requested limit.
                    example: 1
                  first_seen:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Earliest snapshot_date in the returned limit-scoped window.
                    example: '2026-07-09'
                  last_seen:
                    type:
                    - string
                    - 'null'
                    format: date
                    description: Latest snapshot_date in the returned limit-scoped window.
                    example: '2026-07-09'
                  snapshots:
                    type: array
                    description: Most recent normalized observations, ordered newest first. At most one snapshot can be stored per domain per UTC day.
                    items:
                      type: object
                      required:
                      - id
                      - domain
                      - registrar
                      - registrar_iana_id
                      - created_date
                      - expiry_date
                      - updated_date
                      - status
                      - nameservers
                      - dnssec
                      - transfer_locked
                      - privacy_protected
                      - snapshot_date
                      - changes_from_previous
                      - created_at
                      properties:
                        id:
                          type: integer
                          description: Internal identifier for this stored observation.
                          example: 42
                        domain:
                          type: string
                          description: Normalized domain stored with this observation.
                          example: example.com
                        registrar:
                          type:
                          - string
                          - 'null'
                          description: Normalized registrar name observed in RDAP.
                          example: Example Registrar, Inc.
                        registrar_iana_id:
                          type:
                          - string
                          - 'null'
                          description: IANA registrar identifier observed in RDAP, when available.
                          example: '9999'
                        created_date:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: Domain registration event time observed in RDAP.
                          example: '1995-08-14T04:00:00Z'
                        expiry_date:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: Domain expiration event time observed in RDAP.
                          example: '2027-08-13T04:00:00Z'
                        updated_date:
                          type:
                          - string
                          - 'null'
                          format: date-time
                          description: Latest update event time observed in RDAP.
                          example: '2026-06-01T12:00:00Z'
                        status:
                          type: array
                          description: Normalized RDAP status values observed for the domain.
                          items:
                            type: string
                          example:
                          - client transfer prohibited
                        nameservers:
                          type: array
                          description: Normalized nameserver hostnames observed in RDAP.
                          items:
                            type: string
                          example:
                          - a.iana-servers.net
                          - b.iana-servers.net
                        dnssec:
                          type: boolean
                          description: Whether the RDAP observation indicated DNSSEC.
                          example: true
                        transfer_locked:
                          type: boolean
                          description: Whether observed RDAP status values indicated a transfer lock.
                          example: true
                        privacy_protected:
                          type: boolean
                          description: Whether privacy or redaction indicators were detected in the RDAP observation. This is detection, not registrant identity history.
                          example: true
                        snapshot_date:
                          type: string
                          format: date
                          description: UTC calendar date assigned to the observation.
                          example: '2026-07-09'
                        changes_from_previous:
                          type:
                          - array
                          - 'null'
                          description: Detected changes from the preceding stored observation. Comparisons cover registrar name, expiry value, nameservers, status, DNSSEC, transfer lock, and privacy or redaction detection.
                          items:
                            type: object
                            required:
                            - field
                            - old_value
                            - new_value
                            properties:
                              field:
                                type: string
                                description: Normalized field whose value changed.
                                enum:
                                - registrar
                                - expiry_date
                                - nameservers
                                - status
                                - dnssec
                                - transfer_locked
                                - privacy_protected
                                example: nameservers
                              old_value:
                                type:
                                - string
                                - 'null'
                                description: Previous normalized value serialized as text.
                                example: ns1.example.net, ns2.example.net
                              new_value:
                                type:
                                - string
                                - 'null'
                                description: Current normalized value serialized as text.
                                example: a.iana-servers.net, b.iana-servers.net
                        created_at:
                          type: string
                          format: date-time
                          description: Database creation time for the stored observation.
                          example: '2026-07-09T10:15:30Z'
                  summary:
                    type: object
                    description: Compatibility summary counted only across snapshots returned in this response. DNSSEC and transfer lock changes remain available in changes_from_previous and lifecycle_drift_summary.
                    required:
                    - registrar_changes
                    - nameserver_changes
                    - expiry_extensions
                    - privacy_toggles
                    - status_changes
                    properties:
                      registrar_changes:
                        type: integer
                        description: Count of detected changes to the normalized registrar name.
                      nameserver_changes:
                        type: integer
                        description: Count of detected changes to the normalized nameserver set.
                      expiry_extensions:
                        type: integer
                        description: Compatibility field that counts every detected expiry_date value change, including shortening and null transitions. It is not limited to extensions.
                      privacy_toggles:
                        type: integer
                        description: Compatibility field that counts changes in privacy or redaction detection. It does not identify a privacy service or registrant.
                      status_changes:
                        type: integer
                        description: Count of detected changes to the normalized RDAP status set.
                  lifecycle_drift_summary:
                    type: object
                    description: Derived comparison summary across the returned limit-scoped window for registrar name, nameservers, expiry value, status, DNSSEC, transfer lock, and privacy or redaction detection.
                    properties:
                      drift_detected:
                        type: boolean
                      change_event_count:
                        type: integer
                      latest_change_date:
                        type:
                        - string
                        - 'null'
                      registrar_changed:
                        type: boolean
                      nameservers_changed:
                        type: boolean
                      expiry_extended:
                        type: boolean
                      status_changed:
                        type: boolean
                      privacy_changed:
                        type: boolean
                      transfer_lock_changed:
                        type: boolean
                      dnssec_changed:
                        type: boolean
                      expiry_extension_days_total:
                        type: integer
                      latest_changes:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                            old_value:
                              type:
                              - string
                              - 'null'
                            new_value:
                              type:
                              - string
                              - 'null'
                      current_snapshot:
                        type:
                        - object
                        - 'null'
                        description: Selected fields from the newest snapshot in the returned window.
                        properties:
                          registrar:
                            type:
                            - string
                            - 'null'
                          expiry_date:
                            type:
                            - string
                            - 'null'
                            format: date-time
                          nameservers:
