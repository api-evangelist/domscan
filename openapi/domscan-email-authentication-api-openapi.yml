openapi: 3.2.0
info:
  title: DomScan Email Authentication API
  description: 'DomScan is a domain intelligence API providing domain analysis tools. **Core Features:**

    - Domain Availability: Check single or bulk domains using RDAP with 1,100+ TLDs supported

    - Domain Intelligence: AI suggestions, valuations, health checks, typosquatting detection

    - OSINT Tools: DNS lookup, WHOIS/RDAP, SSL certificates, subdomain discovery, IP geolocation, tech stack detection

    - Social & Branding: Social handle checker, brand name scoring

    - Phone Intelligence: Privacy-first phone number validation, normalization, and classification

    - Pricing: Scheduled standard-TLD tables from verified official registrar sources, plus separate credential-backed exact-domain quotes

    - Watchlist: Domain monitoring for expiration and availability alerts


    **Authentication:**

    Most API endpoints require authentication. Pass your API key via the x-api-key header or Authorization: Bearer header. Operations marked with an empty security requirement are intentionally public, including API specifications and selected catalog endpoints. Get your free API key at https://domscan.net/dashboard. Logged-in users on domscan.net tools pages are authenticated automatically via session cookie. **Rate Limits:**

    Free accounts can sustain 120 requests per minute per account, with a burst capacity of 60. All API keys and dashboard sessions belonging to the same free account share this budget. Bulk endpoints have an additional free-tier budget of 20 HTTP requests per minute per account across all bulk endpoints. Free-tier bulk traffic is also capped at 100 requests per minute per IPv4 address or IPv6 /56 network. Platform-wide edge protections still apply to every tier. Paid accounts can sustain 600 requests per minute, with a burst capacity of 120, shared by every API key and dashboard session of the account. Paid accounts do not receive the additional free-tier bulk budget. Scope: RapidAPI subscribers are counted per subscriber. (scope=rapidapi-customer) Zyla subscribers are counted per subscriber when the gateway identifies them, (scope=zyla-customer) and as one shared gateway budget when it does not. (scope=zyla-gateway) Other authenticated requests are counted per account: every API key and dashboard session of the account shares one budget. (scope=account) A key that is not linked to an account is counted on its own. (scope=api-key) Unauthenticated requests to public endpoints are counted per client IP address (scope unknown when the address cannot be determined, as one shared budget). (scope=ip)


    Every authenticated response, success or error, includes X-RateLimit-Plan, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, and X-RateLimit-Policy. X-RateLimit-Limit and X-RateLimit-Remaining describe the immediate burst bucket; X-RateLimit-Reset is the Unix time in seconds when that bucket is full again; X-RateLimit-Policy also states the sustained per-minute rate, scope, and any free bulk limits. Exceeding a limit returns HTTP 429 with Retry-After. Retry only after the indicated delay. **Credits System:**

    API calls consume credits based on endpoint complexity. Sign up for free to receive 10,000 credits monthly. - 1 credit: Status checks, DNS lookups, tool builders

    - 2-5 credits: Health checks, valuations, OSINT tools

    - Bulk endpoints: standard per-item rate for batching multiple items into fewer HTTP requests. - 6-25 credits: Recipe compound operations


    When credits reach zero, the API returns HTTP 402 with credits_remaining, credits_required, and a purchase_url. API responses include X-Credits-Requested, X-Credits-Charged, and X-Credits-Refunded. X-Credits-Charged is the net charge after any refund made during the request. Authenticated responses also include X-Credits-Remaining whenever the balance is known without an extra lookup. Free credits refresh monthly on the account''s signup anniversary. POST /v1/estimate returns the credits a request would charge without running it, at no cost.'
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: Email Authentication
  description: Build and validate SPF, DMARC, and DKIM records
paths:
  /v1/tools/spf/build:
    post:
      tags:
      - Email Authentication
      summary: Build SPF record
      description: Generate an SPF record from specified parameters
      operationId: buildSpf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - all
              properties:
                include:
                  type: array
                  items:
                    type: string
                  description: Domains to include
                ip4:
                  type: array
                  items:
                    type: string
                  description: IPv4 addresses/ranges
                ip6:
                  type: array
                  items:
                    type: string
                  description: IPv6 addresses/ranges
                a:
                  type: boolean
                  description: Include A record
                mx:
                  type: boolean
                  description: Include MX record
                redirect:
                  type: string
                  description: Redirect to another domain
                all:
                  type: string
                  enum:
                  - pass
                  - fail
                  - softfail
                  - neutral
                  description: Default policy
            example:
              include:
              - _spf.google.com
              ip4:
              - 192.0.2.0/24
              mx: true
              all: softfail
      responses:
        '200':
          description: Generated SPF record
          content:
            application/json:
              schema:
                type: object
                properties:
                  record:
                    type: string
                  dns_name:
                    type: string
                  record_type:
                    type: string
                  length:
                    type: integer
                    description: Record length in characters (TXT strings hold 255)
                  dns_lookups:
                    type: integer
                  valid:
                    type: boolean
                  warnings:
                    type: array
                    items:
                      type: string
                  explanation:
                    type: object
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/tools/spf/validate:
    post:
      tags:
      - Email Authentication
      summary: Validate SPF record
      description: Validate an SPF record and check for issues
      operationId: validateSpf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                record:
                  type: string
                  description: SPF record to validate
                domain:
                  type: string
                  description: Domain to fetch SPF record from (if record not provided)
            example:
              domain: example.com
              record: v=spf1 include:_spf.google.com ip4:192.0.2.0/24 ~all
      responses:
        '200':
          description: SPF validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    type: string
                    description: Normalized domain, when one was supplied
                  record:
                    type:
                    - string
                    - 'null'
                    description: SPF record that was validated. Null when the domain publishes no SPF record.
                  valid:
                    type: boolean
                  version:
                    type:
                    - string
                    - 'null'
                  mechanisms:
                    type: array
                    items:
                      type: object
                      properties:
                        qualifier:
                          type: string
                          enum:
                          - +
                          - '-'
                          - '~'
                          - '?'
                        mechanism:
                          type: string
                        value:
                          type: string
                        description:
                          type: string
                  dns_lookups:
                    type: integer
                  max_lookups:
                    type: integer
                    description: RFC 7208 DNS lookup limit (10)
                  lookup_limit_exceeded:
                    type: boolean
                  policy:
                    type:
                    - string
                    - 'null'
                    enum:
                    - pass
                    - fail
                    - softfail
                    - neutral
                    - null
                  includes:
                    type: array
                    items:
                      type: string
                    description: 'Domains referenced by include: mechanisms'
                  ips:
                    type: array
                    items:
                      type: string
                    description: 'IPv4 and IPv6 addresses or ranges from ip4: and ip6: mechanisms'
                  issues:
                    type: array
                    items:
                      type: string
                  warnings:
                    type: array
                    items:
                      type: string
                  error:
                    type: string
                    description: Present only when a domain was supplied and it publishes no SPF record.
              example:
                domain: example.com
                record: v=spf1 include:_spf.google.com ip4:192.0.2.0/24 ~all
                valid: true
                version: spf1
                mechanisms:
                - qualifier: +
                  mechanism: include
                  value: _spf.google.com
                  description: Include SPF from _spf.google.com
                - qualifier: +
                  mechanism: ip4
                  value: 192.0.2.0/24
                  description: IPv4 address/range 192.0.2.0/24
                - qualifier: '~'
                  mechanism: all
                  description: 'Default policy: softfail'
                dns_lookups: 1
                max_lookups: 10
                lookup_limit_exceeded: false
                policy: softfail
                includes:
                - _spf.google.com
                ips:
                - 192.0.2.0/24
                issues: []
                warnings: []
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/tools/spf/flatten:
    post:
      tags:
      - Email Authentication
      summary: Flatten SPF record
      description: Flatten SPF includes to IP addresses to reduce DNS lookups
      operationId: flattenSpf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domain
              properties:
                domain:
                  type: string
                  description: Domain to flatten SPF for
            example:
              domain: example.com
      responses:
        '200':
          description: Flattened SPF record
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    type: string
                  original_record:
                    type: string
                  flattened_record:
                    type: string
                  original_lookups:
                    type: integer
                  flattened_lookups:
                    type: integer
                  resolved_ips:
                    type: object
                    properties:
                      ip4:
                        type: array
                        items:
                          type: string
                      ip6:
                        type: array
                        items:
                          type: string
                  includes_resolved:
                    type: array
                    description: 'Each include: mechanism and the addresses it resolved to'
                    items:
                      type: object
                      properties:
                        include:
                          type: string
                        resolved_to:
                          type: array
                          items:
                            type: string
                  warnings:
                    type: array
                    items:
                      type: string
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-credits:
        model: per_request
        default: 2
  /v1/tools/dmarc/build:
    post:
      tags:
      - Email Authentication
      summary: Build DMARC record
      description: Generate a DMARC record from specified parameters
      operationId: buildDmarc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - policy
              properties:
                policy:
                  type: string
                  enum:
                  - none
                  - quarantine
                  - reject
                  description: DMARC policy
                subdomain_policy:
                  type: string
                  enum:
                  - none
                  - quarantine
                  - reject
                percentage:
                  type: integer
                  minimum: 0
                  maximum: 100
                rua:
                  type: array
                  items:
                    type: string
                  description: Aggregate report addresses
                ruf:
                  type: array
                  items:
                    type: string
                  description: Forensic report addresses
                adkim:
                  type: string
                  enum:
                  - relaxed
                  - strict
                aspf:
                  type: string
                  enum:
                  - relaxed
                  - strict
            example:
              policy: quarantine
              subdomain_policy: quarantine
              percentage: 100
              rua:
              - mailto:dmarc@example.com
              adkim: relaxed
              aspf: relaxed
      responses:
        '200':
          description: Generated DMARC record
          content:
            application/json:
              schema:
                type: object
                properties:
                  record:
                    type: string
                  dns_name:
                    type: string
                  record_type:
                    type: string
                  valid:
                    type: boolean
                  explanation:
                    type: object
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/tools/dmarc/validate:
    post:
      tags:
      - Email Authentication
      summary: Validate DMARC record
      description: Validate a DMARC record and check for issues
      operationId: validateDmarc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                record:
                  type: string
                  description: DMARC record to validate
                domain:
                  type: string
                  description: Domain to fetch DMARC record from (if record not provided)
            example:
              domain: example.com
              record: v=DMARC1; p=quarantine; pct=50; rua=mailto:dmarc@example.com; ruf=mailto:forensics@example.com
      responses:
        '200':
          description: DMARC validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    type: string
                    description: Normalized domain, when one was supplied
                  record:
                    type:
                    - string
                    - 'null'
                    description: DMARC record that was validated. Null when the domain publishes no DMARC record.
                  valid:
                    type: boolean
                  version:
                    type:
                    - string
                    - 'null'
                  policy:
                    type:
                    - string
                    - 'null'
                  subdomain_policy:
                    type:
                    - string
                    - 'null'
                  percentage:
                    type: integer
                  rua:
                    type: array
                    items:
                      type: string
                  ruf:
                    type: array
                    items:
                      type: string
                  adkim:
                    type: string
                    enum:
                    - relaxed
                    - strict
                    description: DKIM alignment mode (relaxed when adkim= is absent)
                  aspf:
                    type: string
                    enum:
                    - relaxed
                    - strict
                    description: SPF alignment mode (relaxed when aspf= is absent)
                  fo:
                    type: string
                    description: Failure reporting options (0 when fo= is absent)
                  ri:
                    type: integer
                    description: Aggregate report interval in seconds (86400 when ri= is absent)
                  strength:
                    type: string
                    enum:
                    - strong
                    - moderate
                    - weak
                    - monitoring
                  issues:
                    type: array
                    items:
                      type: string
                  warnings:
                    type: array
                    items:
                      type: string
                  error:
                    type: string
                    description: Present only when a domain was supplied and it publishes no DMARC record.
              example:
                domain: example.com
                record: v=DMARC1; p=quarantine; pct=50; rua=mailto:dmarc@example.com; ruf=mailto:forensics@example.com
                valid: true
                version: DMARC1
                policy: quarantine
                subdomain_policy: null
                percentage: 50
                rua:
                - mailto:dmarc@example.com
                ruf:
                - mailto:forensics@example.com
                adkim: relaxed
                aspf: relaxed
                fo: '0'
                ri: 86400
                strength: weak
                issues: []
                warnings:
                - DMARC only applies to 50% of messages
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/tools/dkim/check:
    get:
      tags:
      - Email Authentication
      summary: Check DKIM selector
      description: Check a specific DKIM selector for a domain
      operationId: checkDkim
      parameters:
      - name: domain
        in: query
        required: true
        schema:
          type: string
        description: Domain to check
      - name: selector
        in: query
        required: true
        schema:
          type: string
        description: DKIM selector name
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: DKIM check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    type: string
                  selector:
                    type: string
                  dns_name:
                    type: string
                  exists:
                    type: boolean
                  valid:
                    type: boolean
                  record:
                    type: string
                  version:
                    type: string
                    description: v= tag, normally DKIM1
                  key_type:
                    type: string
                  key_data:
                    type: string
                    description: Base64 public key from the p= tag
                  key_size:
                    type: integer
                    description: 'Public key size in bits: the RSA modulus length, or 256 for Ed25519. Omitted when the key is empty or cannot be parsed.'
                  flags:
                    type: array
                    items:
                      type: string
                    description: t= flags
                  hash_algorithms:
                    type: array
                    items:
                      type: string
                    description: h= acceptable hash algorithms
                  service_type:
                    type: string
                    description: s= service type
                  issues:
                    type: array
                    items:
                      type: string
              example:
                domain: example.com
                selector: s1
                dns_name: s1._domainkey.example.com
                exists: true
                valid: true
                record: v=DKIM1; k=rsa; 
                version: DKIM1
                key_type: rsa
                key_data: 
                key_size: 2048
                issues: []
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/tools/dkim/discover:
    get:
      tags:
      - Email Authentication
      summary: Discover DKIM selectors
      description: Discover common DKIM selectors for a domain
      operationId: discoverDkim
      parameters:
      - name: domain
        in: query
        required: true
        schema:
          type: string
        description: Domain to scan
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: DKIM discovery result
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    type: string
                  selectors_checked:
                    type: array
                    items:
                      type: string
                  selectors_found:
                    type: array
                    items:
                      type: object
                      properties:
                        selector:
                          type: string
                        dns_name:
                          type: string
                        exists:
                          type: boolean
                        record:
                          type:
                          - string
                          - 'null'
                        record_type:
                          type:
                          - string
                          - 'null'
                          enum:
                          - TXT
                          - CNAME
                          - null
                        cname_targets:
                          type: array
                          items:
                            type: string
                        key_type:
                          type:
                          - string
                          - 'null'
                        key_size:
                          type:
                          - integer
                          - 'null'
                        provider_hint:
                          type:
                          - string
                          - 'null'
                        valid:
                          type: boolean
                        revoked:
                          type: boolean
                        weak:
                          type: boolean
                        hash_algorithms:
                          type: array
                          items:
                            type: string
                        service_type:
                          type:
                          - string
                          - 'null'
                        flags:
                          type: array
                          items:
                            type: string
                        issues:
                          type: array
                          items:
                            type: string
                  total_found:
                    type: integer
                  common_providers_detected:
                    type: array
                    items:
                      type: string
                  providers_detected:
                    type: array
                    items:
                      type: string
                  valid_selector_count:
                    type: integer
                  weak_selector_count:
                    type: integer
                  revoked_selector_count:
                    type: integer
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 2
components:
  headers:
    XCreditsCharged:
      description: Credits charged by this request, net of any refund made in the same request. Sent on authenticated /v1 responses, including errors (0 when nothing was charged).
      schema:
        type: integer
        minimum: 0
    XFieldsIgnored:
      description: 'Sent when `fields` was used and some paths matched nothing in this response: those paths, comma-separated, at most 20.'
      schema:
        type: string
    XRateLimitLimit:
      description: Burst capacity of the rate limit that applies to this API key.
      schema:
        type: integer
        minimum: 0
    XRateLimitReset:
      description: Unix time in seconds when the burst capacity is fully refilled.
      schema:
        type: integer
        minimum: 0
    XRateLimitRemaining:
      description: Requests that can still be sent immediately before the rate limit applies.
      schema:
        type: integer
        minimum: 0
    XCreditsRemaining:
      description: Credits remaining on the account after this request. Omitted when the balance is not already known without an extra lookup.
      schema:
        type: integer
        minimum: 0
    IdempotentReplayed:
      description: Present and `true` when this response is a stored replay for a repeated Idempotency-Key. A replay charges nothing.
      schema:
        type: string
        enum:
        - 'true'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional client-chosen key (1 to 255 printable ASCII characters, for example a UUID). Retrying with the same key, API key and identical request within 24 hours returns the stored response with `Idempotent-Replayed: true` and charges nothing again. Responses larger than 1 MiB, and refunded errors, are not stored, so a retry runs normally. Reusing a key for a different request returns 422 IDEMPOTENCY_KEY_REUSED; a duplicate sent while the first is still running returns 409 IDEMPOTENCY_IN_PROGRESS.'
      schema:
        type: string
        minLength: 1
        maxLength: 255
    Naming:
      name: naming
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`snake` returns every camelCase key of a successful JSON response in snake_case (for example `registrarName` becomes `registrar_name`); values are never changed. The `DomScan-Naming: snake` request header does the same; when both are sent this parameter wins, and `default` keeps the original names. Runs before `compact` and `fields`, so `fields` paths use snake_case. Error bodies are already snake_case. Cost is unchanged.'
      schema:
        type: string
        enum:
        - snake
        - default
      example: snake
    Fields:
      name: fields
      in: query
      required: false
      x-domscan-global-parameter: true
      description: Comma-separated dot paths to keep in a successful JSON response, e.g. `domain,classification.status` (arrays apply the path to each item; max 50 paths, 6 levels). Unmatched paths are listed in X-Fields-Ignored. Cost is unchanged.
      schema:
        type: string
      example: domain,classification.status
    Compact:
      name: compact
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`true` drops serving metadata (meta timings and served_by, empty warnings/caveats/notes/errors arrays, a request_id that repeats X-Request-Id) from a successful JSON response. Data fields are never removed.'
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
      example: 'true'
  responses:
    Unauthorized:
      description: 'Authentication required. All API endpoints require a valid API key (x-api-key header or Authorization: Bearer) or an active session cookie.'
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_REQUIRED
              message: 'Authentication required. Provide an API key via x-api-key header or Authorization: Bearer header.'
              docs: https://domscan.net/docs/authentication
              get_key: https://domscan.net/login
              type: authentication_error
              status: 401
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/authentication
    PaymentRequired:
      description: Insufficient credits for this request. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          schema:
            type: integer
          description: Credits remaining on the account
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INSUFFICIENT_CREDITS
              message: Insufficient credits. This endpoint costs 2 credits but you have 0. Purchase more at https://domscan.net/billing or wait for your monthly reset.
              credits_remaining: 0
              credits_required: 2
              purchase_url: https://domscan.net/billing
              type: credits_error
              status: 402
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/credits-pricing
    RateLimited:
      description: Rate limit exceeded. Free accounts can sustain 120 requests per minute per account with a burst capacity of 60. Free bulk traffic is additionally limited to 20 requests per minute per account across all bulk endpoints and 100 per minute per IPv4 address or IPv6 /56 network. Paid accounts can sustain 600 requests per minute with a burst capacity of 120.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          schema:
            type: integer
          description: The immediate burst capacity, or the active bulk fixed-window limit when a bulk-specific limit is exceeded.
        X-RateLimit-Remaining:
          schema:
            type: integer
            example: 0
          description: Immediate burst tokens remaining, or requests remaining in the active bulk fixed window.
        X-RateLimit-Reset:
          schema:
            type: integer
            example: 1791590400
          description: Unix time in seconds when the limit that was exceeded allows a new request again.
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
        X-RateLimit-Plan:
          schema:
            type: string
            enum:
            - free
            - paid
          description: The account plan whose policy was applied.
        X-RateLimit-Policy:
          schema:
            type: string
          description: Machine-readable summary of the active tier and limit policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded. Please wait before making more requests.
              type: rate_limit_error
              status: 429
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/rate-limits
              retry_after: 12
    BadRequest:
      description: Bad request - invalid parameters
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: Invalid domain format
              suggestion: Domain must be a valid format like example.com
              type: validation_error
              status: 400
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
    IdempotencyKeyReused:
      description: The Idempotency-Key was already used by this API key for a different request (method, path, query or body) in the last 24 hours. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: IDEMPOTENCY_KEY_REUSED
              message: This Idempotency-Key was already used with a different request. Use a new key for a new request.
              type: validation_error
              status: 422
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
    IdempotencyInProgress:
      description: A request with the same Idempotency-Key is still running. Retry after Retry-After seconds to receive its stored response. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: IDEMPOTENCY_IN_PROGRESS
              message: A request with this Idempotency-Key is still being processed. Retry shortly to receive its result.
              type: conflict_error
              status: 409
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
              retry_after: 1
  schemas:
    ErrorResponse:
      type: object
      description: Canonical error format shared by every API error response. Endpoint-specific fields (for example credits_remaining, login_url or evidence_summary) may appear next to error or inside it; clients should ignore fields they do not recognise.
      additionalProperties: true
      properties:
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
              description: Stable, upper-case machine code. Codes are never renamed; the full catalog with HTTP status, type and retryability is published as x-domscan-error-codes.
              example: INVALID_DOMAIN
            type:
              type: string
              enum:
              - authentication_error
              - credits_error
              - permission_error
              - not_found_error
              - conflict_error
              - rate_limit_error
              - timeout_error
              - validation_error
              - upstream_error
              - api_error
              - request_error
              description: Stable error category used by official SDK subclasses
            message:
              type: string
              description: Human-readable error message
              example: Invalid domain format
            status:
              type: integer
              minimum: 400
              maximum: 599
              description: HTTP status repeated in the JSON error for queue and log processors
            retryable:
              type: boolean
              description: Whether retrying can be appropriate after applying retry guidance
            request_id:
              type: string
              description: Request identifier matching the X-Request-Id response header
            suggestion:
              type: string
              description: Suggestion for fixing the error
            details:
              type: object
              description: Optional structured context for the error
              additionalProperties: true
            retry_after:
              type: integer
              minimum: 0
              description: Seconds to wait before retrying when the error is temporary
              example: 300
            docs_url:
              type: string
              description: Absolute link to the documentation section for this error
              example: https://domscan.net/docs/check-availability
          required:
          - type
          - code
          - message
          - status
          - retryable
          - request_id
          - docs_url
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: 'API key for authentication. Get yours free at https://domscan.net. Also accepts Authorization: Bearer header.'
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Active DomScan browser session. Used by account-management endpoints.
externalDocs:
  description: Full API Documentation
  url: https://domscan.net/docs
x-rapidapi-product: domscan
x-domscan-rate-limits:
  free:
    general:
      scope: account
      sustained_requests_per_minute: 120
      burst_capacity: 60
      shared_across_api_keys_and_sessions: true
    bulk:
      scope: all bulk endpoints combined
      account_requests_per_minute: 20
      network_requests_per_minute: 100
      ipv6_network_prefix: 56
  paid:
    general:
      scope: API key for key-authenticated requests; IP for browser sessions
      sustained_requests_per_minute: 600
      burst_capacity: 120
    free_bulk_budget_applies: false
  response:
    status: 429
    retry_header: Retry-After
    headers_on_every_authenticated_response:
    - X-RateLimit-Plan
    - X-RateLimit-Limit
    - X-RateLimit-Remaining
    - X-RateLimit-Reset
    - X-RateLimit-Policy
    reset_header: X-RateLimit-Reset
    burst_headers:
    - X-RateLimit-Limit
    - X-RateLimit-Remaining
    policy_header: X-RateLimit-Policy
