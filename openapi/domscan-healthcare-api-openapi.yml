tags:
- name: Healthcare
  description: US healthcare provider lookup and verification by NPI
paths:
  /v1/npi:
    get:
      tags:
      - Healthcare
      summary: Look up and verify a US healthcare provider by NPI
      description: 'Look up a 10-digit National Provider Identifier in the NPPES registry. The check digit is validated first, so a mistyped number is invalid without a registry call. found returns the provider or organization record; not_found means the registry lists no active record for a valid number. Optional name, state and taxonomy are compared with the record: verified is true only when the NPI is found and active and every supplied field matches. Registry errors and timeouts are unknown and not charged. 1 credit.'
      operationId: lookupNpi
      parameters:
      - name: number
        in: query
        required: true
        description: 10-digit NPI.
        schema:
          type: string
          pattern: ^[0-9 -]{10,14}$
        example: '1003000126'
      - name: name
        in: query
        description: Provider or organization name to verify against the record.
        schema:
          type: string
          maxLength: 100
      - name: state
        in: query
        description: Two-letter US state to verify against practice locations and licenses.
        schema:
          type: string
          maxLength: 100
      - name: taxonomy
        in: query
        description: Taxonomy code (208M00000X) or specialty description to verify.
        schema:
          type: string
          maxLength: 100
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: NPI lookup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NpiLookupResponse'
              example:
                npi: '1003000126'
                status: found
                checksum_valid: true
                reason: null
                notes: []
                provider:
                  npi: '1003000126'
                  type: individual
                  enumeration_type: NPI-1
                  name: ARDALAN ENKESHAFI
                  individual:
                    prefix: null
                    first_name: ARDALAN
                    middle_name: null
                    last_name: ENKESHAFI
                    suffix: null
                    credential: M.D.
                    sex: M
                  organization: null
                  record_status: A
                  active: true
                  enumeration_date: '2007-08-31'
                  certification_date: '2025-05-28'
                  last_updated: '2025-05-28'
                  sole_proprietor: false
                  taxonomies:
                  - code: 208M00000X
                    description: Hospitalist
                    primary: true
                    state: DC
                    license: MD600003480
                    group: null
                  primary_taxonomy:
                    code: 208M00000X
                    description: Hospitalist
                    primary: true
                    state: DC
                    license: MD600003480
                    group: null
                  addresses:
                    location:
                      purpose: location
                      address_type: DOM
                      line1: 6410 ROCKLEDGE DR STE 304
                      line2: null
                      city: BETHESDA
                      state: MD
                      postal_code: 20817-1841
                      country_code: US
                      country_name: United States
                      telephone: 443-602-6207
                      fax: null
                    mailing: null
                  practice_locations: []
                  identifiers: []
                  endpoints: []
                  other_names: []
                verification:
                  name:
                    status: match
                    matched_on: name
                  state:
                    status: match
                    matched_on: location
                  taxonomy:
                    status: not_requested
                    matched_on: null
                  fields_checked: 2
                  verified: true
                upstream_error_code: null
                source:
                  name: nppes_npi_registry
                  url: https://npiregistry.cms.hhs.gov/api/?version=2.1&number=1003000126
                  checked_at: '2026-10-18T03:58:55.722Z'
                  latency_ms: 286
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/npi/search:
    get:
      tags:
      - Healthcare
      summary: Search US healthcare providers
      description: Search the NPPES registry by individual (first_name, last_name) or organization_name, never both, with optional city, state, postal_code and taxonomy_description. A trailing * after at least 2 characters matches a prefix. Former names and practice locations also match. 1 credit per page; unknown results are not charged.
      operationId: searchNpi
      parameters:
      - name: first_name
        in: query
        description: Individual first name.
        schema:
          type: string
          maxLength: 100
      - name: last_name
        in: query
        description: Individual last name.
        schema:
          type: string
          maxLength: 100
      - name: organization_name
        in: query
        description: Organization name.
        schema:
          type: string
          maxLength: 100
      - name: city
        in: query
        description: City.
        schema:
          type: string
          maxLength: 100
      - name: state
        in: query
        description: Two-letter US state. Needs a name field too.
        schema:
          type: string
          maxLength: 100
      - name: postal_code
        in: query
        description: 5 or 9 digit ZIP code, or a prefix ending in *.
        schema:
          type: string
          maxLength: 100
      - name: taxonomy_description
        in: query
        description: Specialty description, such as Cardiology.
        schema:
          type: string
          maxLength: 100
      - name: limit
        in: query
        description: Results per page.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      - name: skip
        in: query
        description: Results to skip.
        schema:
          type: integer
          minimum: 0
          maximum: 1000
          default: 0
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: NPI search
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NpiSearchResponse'
              example:
                status: ok
                reason: null
                field: null
                query:
                  first_name: null
                  last_name: null
                  organization_name: mayo clinic*
                  city: null
                  state: MN
                  postal_code: null
                  taxonomy_description: null
                  limit: 1
                  skip: 0
                results:
                - npi: '1003000126'
                  type: individual
                  enumeration_type: NPI-1
                  name: ARDALAN ENKESHAFI
                  individual:
                    prefix: null
                    first_name: ARDALAN
                    middle_name: null
                    last_name: ENKESHAFI
                    suffix: null
                    credential: M.D.
                    sex: M
                  organization: null
                  record_status: A
                  active: true
                  enumeration_date: '2007-08-31'
                  certification_date: '2025-05-28'
                  last_updated: '2025-05-28'
                  sole_proprietor: false
                  taxonomies:
                  - code: 208M00000X
                    description: Hospitalist
                    primary: true
                    state: DC
                    license: MD600003480
                    group: null
                  primary_taxonomy:
                    code: 208M00000X
                    description: Hospitalist
                    primary: true
                    state: DC
                    license: MD600003480
                    group: null
                  addresses:
                    location:
                      purpose: location
                      address_type: DOM
                      line1: 6410 ROCKLEDGE DR STE 304
                      line2: null
                      city: BETHESDA
                      state: MD
                      postal_code: 20817-1841
                      country_code: US
                      country_name: United States
                      telephone: 443-602-6207
                      fax: null
                    mailing: null
                  practice_locations: []
                  identifiers: []
                  endpoints: []
                  other_names: []
                result_count: 1
                has_more: true
                upstream_error_code: null
                source:
                  name: nppes_npi_registry
                  url: https://npiregistry.cms.hhs.gov/api/?version=2.1
                  checked_at: '2026-10-18T03:58:55.722Z'
                  latency_ms: 286
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
