            final_url:
              type:
              - string
              - 'null'
            via_proxy:
              type:
              - boolean
              - 'null'
            redirect_count:
              type:
              - integer
              - 'null'
            content_type:
              type:
              - string
              - 'null'
            bytes:
              type:
              - integer
              - 'null'
            truncated:
              type: boolean
            error:
              type:
