    SitemapAuditResponse:
      type: object
      required:
      - url
      - domain
      - origin
      - status
      - checked_at
      - fetch
      - robots_txt
      - sitemaps
      - totals
      - freshness
      - issues
      - caveats
      properties:
        classification:
          $ref: '#/components/schemas/ClassificationStatus'
        url:
          type: string
          format: uri
        domain:
          type: string
        origin:
          type: string
          format: uri
        status:
          type: string
          enum:
          - found
          - not_found
          - invalid
          - unknown
          description: 'found: at least one sitemap parsed. unknown: a decisive fetch was blocked, rate limited, failed or skipped for budget; refunded. invalid: files were found but none is a usable sitemap, or declared sitemaps are missing. not_found: every candidate returned an exact 404 or 410.'
        checked_at:
          type: string
          format: date-time
        fetch:
          type: object
          description: 'Primary fetch evidence: the robots.txt fetch, or the explicit sitemap fetch when sitemap is set.'
          required:
          - checked_url
          - http_status
          - final_url
          - via_proxy
          properties:
            checked_url:
              type: string
              format: uri
            http_status:
              type:
              - integer
              - 'null'
            final_url:
              type:
              - string
              - 'null'
            via_proxy:
              type:
              - boolean
              - 'null'
        robots_txt:
          type: object
          required:
          - status
          - url
          - http_status
          - declared_sitemaps
          properties:
            status:
              type: string
              enum:
              - found
              - not_found
              - invalid
              - unknown
              - not_requested
            url:
              type: string
              format: uri
            http_status:
              type:
              - integer
              - 'null'
            declared_sitemaps:
              type: array
              description: All Sitemap declarations (max 50). Cross-site ones are not fetched.
              items:
                type: object
                required:
                - url
                - same_site
                properties:
                  url:
                    type: string
                  same_site:
                    type: boolean
        sitemaps:
          type: array
          description: One entry per fetched or budget-skipped sitemap, in fetch order.
          items:
            $ref: '#/components/schemas/SitemapAuditEntry'
        totals:
          type: object
          required:
          - sitemaps_checked
          - sitemaps_discovered
          - urls_counted
          - budget_exhausted
          properties:
            sitemaps_checked:
              type: integer
              minimum: 0
            sitemaps_discovered:
              type: integer
              minimum: 0
            urls_counted:
              type: integer
              minimum: 0
            budget_exhausted:
              type: boolean
        freshness:
          type: object
          required:
          - newest_lastmod
          - days_since_newest
          properties:
            newest_lastmod:
              type:
              - string
              - 'null'
              format: date-time
            days_since_newest:
              type:
              - integer
              - 'null'
              minimum: 0
        issues:
          type: array
          items:
            type: string
          description: Deduplicated site-level and per-sitemap issue codes.
        caveats:
          type: array
          items:
            type: string
          description: Machine codes such as counts_cover_fetched_files_only, budget_exhausted, time_budget_exhausted, gzip_not_decoded, cross_site_sitemaps_not_fetched and max_index_depth_reached.
    KeywordDensityResponse:
      type: object
      required:
      - url
      - final_url
      - status
      - reason
      - checked_at
      - fetch
      - language
      - total_words
      - unique_words
      - stopwords_removed
      - keywords
      - targets
      - caveats
      properties:
        url:
          type: string
          format: uri
          description: Normalized requested URL.
        final_url:
          type: string
          description: URL after redirects.
        status:
          type: string
          enum:
          - ok
          - not_found
          - not_html
          - unknown
          description: 'ok: a 200 HTML page was analysed. not_found: the page returned an exact 404 or 410. not_html: the page is not HTML. unknown: the page could not be read (blocked, rate limited, timed out, failed, empty, unresolved redirect or a non-final 2xx such as a 202 challenge); analysis fields are null or empty and the request is refunded.'
        reason:
          type:
          - string
          - 'null'
          enum:
          - blocked
          - rate_limited
          - timeout
          - upstream_error
          - redirect_unresolved
          - http_error
          - empty
          - ambiguous
          - fetch_failed
          - null
          description: Why the page is unknown; null otherwise.
        checked_at:
          type: string
          format: date-time
        fetch:
          $ref: '#/components/schemas/OnPageFetch'
        language:
          type:
          - string
          - 'null'
          description: Primary language subtag from <html lang>.
        total_words:
          type: integer
        unique_words:
          type: integer
        stopwords_removed:
          type: boolean
          description: Stopword lists exist for en, es, de, fr, pt, it, nl and sv.
        keywords:
          type:
          - object
          - 'null'
          properties:
            one_word:
              type: array
              items:
                $ref: '#/components/schemas/KeywordTerm'
            two_words:
              type: array
              items:
                $ref: '#/components/schemas/KeywordTerm'
            three_words:
              type: array
              items:
                $ref: '#/components/schemas/KeywordTerm'
        targets:
          type: array
          items:
            type: object
            properties:
              keyword:
                type: string
              count:
                type: integer
              density:
                type: number
              in_title:
                type: boolean
              in_meta_description:
                type: boolean
              in_h1:
                type: boolean
              in_headings:
                type: boolean
              in_url:
                type: boolean
              in_first_100_words:
                type: boolean
        caveats:
          type: array
          items:
            type: string
            enum:
            - stopwords_unavailable_for_language
            - cjk_word_segmentation_approximate
            - page_truncated
            - text_truncated
            description: 'text_truncated: only the first 50,000 words were analysed.'
    RobotsTxtRule:
