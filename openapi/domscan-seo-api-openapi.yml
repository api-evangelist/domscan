      required:
      - url
      - hreflang
      - state
      - http_status
      - final_url
      - canonical
      - lang
      - issues
      properties:
        url:
          type: string
        hreflang:
          type: array
          items:
            type: string
        state:
          type: string
          enum:
          - confirmed
          - missing_return_link
          - return_code_mismatch
          - not_found
          - not_html
          - unknown
          description: 'confirmed: the alternate links back to this page. return_code_mismatch: it links back, but with none of the codes this page declares for itself. missing_return_link: the full alternate was read and has no link back. unknown: it could not be read, or it was truncated before a link back was found.'
        http_status:
          type:
          - integer
          - 'null'
        final_url:
          type:
          - string
          - 'null'
        canonical:
          type:
          - string
          - 'null'
        lang:
          type:
          - string
          - 'null'
        issues:
          type: array
          items:
            type: string
          description: alternate_redirects, alternate_canonicalized_elsewhere, language_mismatch, or the unknown reason (blocked, rate_limited, timeout, fetch_failed, truncated, host_budget_reached and others).
    CookieScanResponse:
      type: object
      required:
      - url
      - final_url
      - status
      - reason
      - checked_at
      - http_status
      - redirect_count
      - duration_ms
      - resource_limit_reached
      - summary
      - consent
      - cookies
      - trackers
      - third_party_domains
      - storage
      - findings
      properties:
        url:
          type: string
          format: uri
        final_url:
          type: string
        status:
          type: string
          enum:
          - ok
          - not_found
          - unknown
          description: 'ok: the page loaded in the isolated browser. not_found: the page answered 404 or 410 (audits only; a screenshot still captures the page). unknown: the page was blocked, served a challenge, was rate limited, timed out or failed, the renderer was unavailable, or the requested capture could not be produced; refunded.'
        reason:
          type:
          - string
          - 'null'
          enum:
          - blocked
          - rate_limited
          - timeout
          - upstream_error
          - fetch_failed
          - renderer_unavailable
          - capture_too_large
          - feature_failed
          - null
        checked_at:
          type: string
          format: date-time
        http_status:
          type:
          - integer
          - 'null'
        redirect_count:
          type: integer
        duration_ms:
          type: integer
        resource_limit_reached:
          type: boolean
          description: The load stopped at 8 MB, 200 requests or 20 seconds.
        summary:
          type:
          - object
          - 'null'
          properties:
            cookies:
              type: integer
            first_party_cookies:
              type: integer
            third_party_cookies:
              type: integer
            session_cookies:
              type: integer
            persistent_cookies:
              type: integer
            trackers:
              type: integer
            third_party_domains:
              type: integer
        consent:
          type:
          - object
          - 'null'
          properties:
            cmp:
              type:
              - string
              - 'null'
              description: Consent manager detected, such as onetrust, cookiebot or iab_tcf.
            tcf_api:
              type: boolean
        cookies:
          type: array
          description: Cookie metadata only; values are never collected.
          items:
            type: object
            properties:
              name:
                type: string
              domain:
                type: string
              path:
                type: string
              party:
                type: string
                enum:
                - first
                - third
              session:
                type: boolean
              lifetime_days:
                type:
                - integer
                - 'null'
              secure:
                type: boolean
              http_only:
                type: boolean
              same_site:
                type:
                - string
                - 'null'
              size:
                type: integer
              tracker:
                type:
                - object
                - 'null'
                properties:
                  name:
                    type: string
                  category:
                    type: string
        trackers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              category:
                type: string
                enum:
                - analytics
                - advertising
                - social
                - session_replay
                - tag_manager
                - customer_data
                - consent
              requests:
                type: integer
                description: Requests to the tracker host.
              cookies:
                type: integer
                description: Cookies attributed to the tracker by host or by cookie name.
        third_party_domains:
          type: array
          items:
            type: object
            properties:
              domain:
                type: string
              requests:
                type: integer
        storage:
          type:
          - object
          - 'null'
          properties:
            local_storage_keys:
              type: integer
            session_storage_keys:
              type: integer
        findings:
          type: array
          items:
            type: string
            enum:
            - trackers_load_before_consent
            - tracking_cookies_before_consent
            - third_party_cookies
            - cookie_lifetime_over_13_months
            - cookies_without_secure_flag
            - no_consent_manager_detected
    ClassificationStatus:
      type: object
      description: Shared present/absent/unknown classification. present and absent are returned only from exact authoritative evidence. Blocked, rate-limited, timed-out, failed and ambiguous checks are unknown with a reason, never absent.
      properties:
        status:
          type: string
          enum:
          - present
          - absent
          - unknown
          description: present, absent or unknown.
        reason:
          type: string
          enum:
          - blocked
          - rate_limited
          - timeout
          - ambiguous
          - upstream_error
          - unsupported
          description: Why the result is unknown. Returned only when status is unknown.
        evidence:
          $ref: '#/components/schemas/ClassificationEvidence'
        checked_at:
          type: string
          format: date-time
          description: When DomScan produced this classification.
      required:
      - status
      - evidence
      - checked_at
    LinkCheckResult:
      type: object
      required:
      - url
      - state
      - http_status
      - final_url
      - redirect_count
      - reason
      properties:
        url:
          type: string
        state:
          type: string
          enum:
          - ok
          - redirect
          - broken
          - unknown
          - unchecked
          - skipped
          description: 'broken only for an exact 404, 410 or a host name that DNS reports as nonexistent (NXDOMAIN). unknown: blocked (including challenge pages served with 2xx), rate limited, failed, DNS unavailable or ambiguous. unchecked: the time budget or the per-host request budget ran out. skipped: private or unsafe target.'
        http_status:
          type:
          - integer
          - 'null'
        final_url:
          type:
          - string
          - 'null'
        redirect_count:
          type: integer
        reason:
          type:
          - string
          - 'null'
          description: 'broken: http_404, http_410, dns_nxdomain. unknown: blocked, rate_limited, ambiguous, dns_unavailable, timeout, fetch_failed, upstream_error, http_error, redirect_unresolved. unchecked: deadline, host_budget_reached. skipped: unsafe_target.'
    HreflangResponse:
      type: object
      required:
      - url
      - final_url
      - status
      - reason
      - checked_at
      - fetch
      - lang
      - entries
      - self_reference
      - x_default
      - issues
      - return_links
      properties:
        url:
          type: string
          format: uri
          description: Normalized requested URL.
        final_url:
          type: string
          description: URL after redirects.
        status:
          type: string
          enum:
          - ok
          - not_found
          - not_html
          - unknown
          description: 'ok: a 200 HTML page was analysed. not_found: the page returned an exact 404 or 410. not_html: the page is not HTML. unknown: the page could not be read (blocked, rate limited, timed out, failed, empty, unresolved redirect or a non-final 2xx such as a 202 challenge); analysis fields are null or empty and the request is refunded.'
        reason:
          type:
          - string
          - 'null'
          enum:
          - blocked
          - rate_limited
          - timeout
          - upstream_error
          - redirect_unresolved
          - http_error
          - empty
          - ambiguous
          - fetch_failed
          - null
          description: Why the page is unknown; null otherwise.
        checked_at:
          type: string
          format: date-time
        fetch:
          $ref: '#/components/schemas/OnPageFetch'
        lang:
          type:
          - string
          - 'null'
        entries:
          type: array
          items:
            type: object
            required:
            - hreflang
            - href
            - url
            - source
            - valid_code
            - issues
            properties:
              hreflang:
                type: string
              href:
                type: string
              url:
