    StructuredDataItem:
      type: object
      required:
      - format
      - types
      - properties
      - values
      - children
      - path
      - status
      - errors
      - warnings
      properties:
        format:
          type: string
          enum:
          - json-ld
          - microdata
          - rdfa
        types:
          type: array
          items:
            type: string
          description: schema.org types without the vocabulary prefix.
        properties:
          type: array
          items:
            type: string
          description: Properties with a value, in source order.
        values:
          type: object
          additionalProperties:
            type: string
          description: Preview (first 200 characters) of scalar property values.
        children:
          type: array
          items:
            $ref: '#/components/schemas/StructuredDataNestedItem'
          description: Nested typed items, such as an Offer inside a Product.
        path:
          type: string
          example: json_ld[0].children[1]
        status:
          type: string
          enum:
          - valid
          - warnings
          - errors
          - unchecked
          description: 'unchecked: no rules exist for this type; the item was extracted but not validated.'
        errors:
