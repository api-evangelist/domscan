  /v1/page-weight:
    get:
      tags:
      - SEO
      summary: Page weight, requests and timings
      description: 'Load a public page in an isolated browser and measure every request: total and third-party bytes, requests and bytes by type, the 10 largest resources, bytes per third-party domain, render-blocking stylesheets and scripts in the head, and timings (TTFB, first contentful paint, DOMContentLoaded and load). Redirect hops are not counted as separate requests. Loads stop at 8 MB, 200 requests or 20 seconds, flagged as measurement_truncated.'
      operationId: getPageWeight
      parameters:
      - name: url
        in: query
        required: true
        description: Page URL or bare domain.
        schema:
          type: string
        example: https://example.com/shoes/trail-runner
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Page weight
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageWeightResponse'
              example:
                url: https://example.com/
                final_url: https://example.com/
                status: ok
                reason: null
                checked_at: '2026-10-13T12:00:00.000Z'
                http_status: 200
                redirect_count: 0
                duration_ms: 4210
                resource_limit_reached: false
                summary:
                  requests: 86
                  blocked_requests: 4
                  total_bytes: 3412887
                  third_party_requests: 22
                  third_party_bytes: 1210554
                  transfer_bytes: 3425100
                by_type:
                - type: image
                  requests: 31
                  bytes: 1840221
                - type: script
                  requests: 28
                  bytes: 1120334
                largest:
                - url: https://example.com/hero.jpg
                  type: image
                  bytes: 612004
                  mime_type: image/jpeg
                third_parties:
                - domain: googletagmanager.com
                  requests: 3
                  bytes: 310442
                render_blocking:
                - url: https://example.com/styles.css
                  type: stylesheet
                timing:
                  ttfb_ms: 180
                  first_contentful_paint_ms: 1240
                  dom_content_loaded_ms: 1610
                  load_ms: 3890
                findings:
                - page_weight_over_3mb
                - images_over_200kb
                - render_blocking_resources
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
