              issues:
                type: array
                items:
                  type: string
                  enum:
                  - underscore_separator
                  - invalid_format
                  - invalid_language
                  - invalid_script
                  - invalid_region
                  - relative_url
                  - invalid_url
        self_reference:
          type: boolean
        x_default:
          type: boolean
        issues:
          type: array
          items:
            type: string
            enum:
