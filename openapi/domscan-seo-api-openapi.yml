    ErrorResponse:
      type: object
      description: Canonical error format shared by every API error response. Endpoint-specific fields (for example credits_remaining, login_url or evidence_summary) may appear next to error or inside it; clients should ignore fields they do not recognise.
      additionalProperties: true
      properties:
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
              description: Stable, upper-case machine code. Codes are never renamed; the full catalog with HTTP status, type and retryability is published as x-domscan-error-codes.
              example: INVALID_DOMAIN
            type:
              type: string
              enum:
              - authentication_error
              - credits_error
              - permission_error
              - not_found_error
              - conflict_error
              - rate_limit_error
              - timeout_error
              - validation_error
              - upstream_error
              - api_error
              - request_error
              description: Stable error category used by official SDK subclasses
            message:
              type: string
              description: Human-readable error message
              example: Invalid domain format
            status:
              type: integer
              minimum: 400
              maximum: 599
              description: HTTP status repeated in the JSON error for queue and log processors
            retryable:
              type: boolean
              description: Whether retrying can be appropriate after applying retry guidance
            request_id:
              type: string
              description: Request identifier matching the X-Request-Id response header
            suggestion:
              type: string
              description: Suggestion for fixing the error
            details:
              type: object
              description: Optional structured context for the error
              additionalProperties: true
            retry_after:
              type: integer
              minimum: 0
              description: Seconds to wait before retrying when the error is temporary
              example: 300
            docs_url:
              type: string
              description: Absolute link to the documentation section for this error
              example: https://domscan.net/docs/check-availability
          required:
          - type
          - code
          - message
          - status
          - retryable
          - request_id
          - docs_url
    AccessibilityResponse:
      type: object
      required:
      - url
      - final_url
      - status
      - reason
      - checked_at
      - http_status
      - redirect_count
      - duration_ms
      - resource_limit_reached
      - score
      - engine
      - summary
      - violations
      - incomplete
      properties:
        url:
          type: string
          format: uri
        final_url:
          type: string
        status:
          type: string
          enum:
          - ok
          - not_found
          - unknown
          description: 'ok: the page loaded in the isolated browser. not_found: the page answered 404 or 410 (audits only; a screenshot still captures the page). unknown: the page was blocked, served a challenge, was rate limited, timed out or failed, the renderer was unavailable, or the requested capture could not be produced; refunded.'
        reason:
          type:
          - string
          - 'null'
          enum:
          - blocked
          - rate_limited
          - timeout
          - upstream_error
          - fetch_failed
          - renderer_unavailable
          - capture_too_large
          - feature_failed
          - null
        checked_at:
          type: string
          format: date-time
        http_status:
          type:
          - integer
          - 'null'
        redirect_count:
          type: integer
        duration_ms:
          type: integer
        resource_limit_reached:
          type: boolean
          description: The load stopped at 8 MB, 200 requests or 20 seconds.
        standard:
          type:
          - string
          - 'null'
          enum:
          - wcag2a
          - wcag2aa
          - wcag21aa
          - wcag22aa
          - null
          description: The rule set requested with standard; null when every rule ran.
        score:
          type:
          - integer
          - 'null'
          description: passes / (passes + weighted violations) x 100; critical 3, serious 2, moderate 1, minor 0.5.
        engine:
          type:
          - object
          - 'null'
          properties:
            name:
              type: string
            version:
              type:
              - string
              - 'null'
        summary:
          type:
          - object
          - 'null'
          properties:
            violations:
              type: integer
            affected_elements:
              type: integer
            by_impact:
              type: object
              properties:
                critical:
                  type: integer
                serious:
                  type: integer
                moderate:
                  type: integer
                minor:
                  type: integer
            passes:
              type: integer
            incomplete:
              type: integer
            inapplicable:
              type: integer
        violations:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              impact:
                type: string
                enum:
                - critical
                - serious
                - moderate
                - minor
              help:
                type: string
              help_url:
                type:
                - string
                - 'null'
              wcag_level:
                type:
                - string
                - 'null'
                enum:
                - A
                - AA
                - AAA
                - best_practice
                - null
              tags:
                type: array
                items:
                  type: string
              node_count:
                type: integer
              nodes:
                type: array
                items:
                  type: object
                  properties:
                    target:
                      type: string
                    html:
                      type: string
                    failure_summary:
                      type: string
        violations_truncated:
          type: boolean
          description: More than 100 rules failed; only the first 100 are listed and counted.
        incomplete:
          type: array
          description: Rules that need manual review.
          items:
            type: object
            properties:
              id:
                type: string
              impact:
                type:
                - string
                - 'null'
              help:
                type: string
              node_count:
                type: integer
    DuplicateContentResponse:
      type: object
      required:
      - status
      - checked_at
      - threshold
      - pages
      - pairs
      - clusters
      - duplicates
      - summary
      properties:
        status:
          type: string
          enum:
          - ok
          - unknown
          - insufficient_pages
          description: 'ok: at least two pages were read and at least one pair could be compared. unknown: fewer than two pages could be read because of blocked or failed fetches, or no pair had enough text to compare; refunded. insufficient_pages: fewer than two HTML pages exist.'
        checked_at:
          type: string
          format: date-time
        threshold:
          type: number
          description: Similarity at or above which a pair is a near duplicate.
        pages:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              final_url:
                type: string
              status:
                type: string
                enum:
                - ok
                - not_found
                - not_html
                - unknown
              reason:
                type:
                - string
                - 'null'
              http_status:
                type:
                - integer
                - 'null'
              title:
                type:
                - string
                - 'null'
              meta_description:
                type:
                - string
                - 'null'
              h1:
                type:
                - string
                - 'null'
              canonical:
                type:
                - string
                - 'null'
              word_count:
                type: integer
              comparable:
                type: boolean
                description: False when the page was not read, or has fewer than 50 main-content words and is not scored.
              comparison_reason:
                type:
                - string
                - 'null'
                enum:
                - insufficient_content
                - null
                description: 'insufficient_content: the page was read but is too short to score.'
        pairs:
          type: array
          items:
            type: object
            properties:
              a:
                type: string
              b:
                type: string
              similarity:
                type:
                - number
                - 'null'
                description: Jaccard index of 5-word shingles of the main content (0-1). Null when the pair is not scored.
              containment:
                type:
                - number
                - 'null'
                description: Share of the smaller page found in the larger one (0-1). Null when the pair is not scored.
              near_duplicate:
                type:
                - boolean
                - 'null'
                description: Null when a page has too little content to decide; false when both URLs reach the same final URL.
              comparable:
                type: boolean
                description: Whether the pair was scored.
              canonicalized:
                type: boolean
                description: One page declares the other as canonical, or both declare the same one.
              same_final_url:
                type: boolean
                description: Both URLs end at the same final URL, so they are one page.
              reason:
                type:
                - string
                - 'null'
                enum:
                - insufficient_content
                - same_final_url
                - null
                description: Why the pair was not scored.
        clusters:
          type: array
          items:
            type: array
            items:
              type: string
        duplicates:
          type: object
          properties:
            titles:
              type: array
              items:
                type: object
                properties:
                  value:
                    type: string
                  urls:
                    type: array
                    items:
                      type: string
            meta_descriptions:
              type: array
              items:
                type: object
                properties:
                  value:
                    type: string
                  urls:
                    type: array
                    items:
                      type: string
            h1:
              type: array
              items:
                type: object
                properties:
                  value:
                    type: string
                  urls:
                    type: array
                    items:
                      type: string
        summary:
          type: object
          properties:
            pages:
              type: integer
            readable:
              type: integer
            unknown:
              type: integer
            comparable_pairs:
              type: integer
            unknown_pairs:
              type: integer
              description: Pairs not scored because a page has too little content.
            same_final_url_pairs:
              type: integer
            near_duplicate_pairs:
              type: integer
            uncanonicalized_near_duplicates:
              type: integer
    RenderDiffResponse:
      type: object
      required:
      - url
      - final_url
      - status
      - reason
      - checked_at
      - raw
      - rendered
      - js_dependence
      - rendered_word_share
      - differences
      - issues
      properties:
        url:
          type: string
          format: uri
          description: Normalized requested URL.
        final_url:
          type: string
          description: URL after redirects.
        status:
          type: string
          enum:
          - ok
          - not_found
          - not_html
          - unknown
          description: 'Status of the comparison: ok only when both fetches were analysed. When only one version could be read, the result is unknown (the failing fetch''s reason, or ambiguous when it was a definite not_found or not_html answer). ok: a 200 HTML page was analysed. not_found: the page returned an exact 404 or 410. not_html: the page is not HTML. unknown: the page could not be read (blocked, rate limited, timed out, failed, empty, unresolved redirect or a non-final 2xx such as a 202 challenge); analysis fields are null or empty and the request is refunded.'
        reason:
          type:
          - string
          - 'null'
          enum:
          - blocked
          - rate_limited
          - timeout
          - upstream_error
          - redirect_unresolved
          - http_error
          - empty
          - ambiguous
          - fetch_failed
          - null
          description: Why the page is unknown; null otherwise.
        checked_at:
          type: string
          format: date-time
        raw:
          type: object
          required:
          - fetch
          - signals
          properties:
            fetch:
              $ref: '#/components/schemas/OnPageFetch'
            signals:
              allOf:
              - $ref: '#/components/schemas/OnPageSignals'
        rendered:
          type: object
          required:
          - fetch
          - signals
          properties:
            fetch:
              $ref: '#/components/schemas/OnPageFetch'
            signals:
              allOf:
              - $ref: '#/components/schemas/OnPageSignals'
        js_dependence:
          type:
          - string
          - 'null'
          enum:
          - none
          - low
          - medium
          - high
          - null
          description: 'high: a high-impact signal (title, canonical, robots, H1 or content) differs. medium: a medium-impact signal differs or JavaScript adds at least 20% of the words.'
        rendered_word_share:
          type:
          - number
          - 'null'
          description: Share of rendered words that are missing from the raw HTML (0-1).
        differences:
          type: array
          items:
            type: object
            required:
            - field
            - change
            - impact
            - raw
            - rendered
            properties:
              field:
                type: string
                enum:
                - title
                - meta_description
                - canonical
                - robots
                - noindex
                - h1
                - word_count
                - internal_links
                - external_links
                - structured_data_types
                - hreflang_count
                - lang
              change:
                type: string
                enum:
                - added_by_js
                - removed_by_js
                - changed_by_js
              impact:
                type: string
                enum:
                - high
                - medium
                - low
              raw:
                description: Raw HTML value (any JSON type, may be null).
              rendered:
                description: Rendered value (any JSON type, may be null).
        issues:
          type: array
          items:
            type: string
            enum:
            - robots_changed_by_js
            - canonical_changed_by_js
            - title_requires_js
            - h1_requires_js
            - content_requires_js
            - links_require_js
            - structured_data_changed_by_js
    StructuredDataIssue:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          enum:
          - missing_required
          - missing_recommended
          - invalid_date
          - invalid_number
          - invalid_url
          - invalid_json
          - missing_type
          - non_schema_context
        property:
          type: string
          description: Property name; alternatives are joined with |.
  headers:
    XRateLimitLimit:
      description: Burst capacity of the rate limit that applies to this API key.
      schema:
        type: integer
        minimum: 0
    XRateLimitRemaining:
      description: Requests that can still be sent immediately before the rate limit applies.
      schema:
        type: integer
        minimum: 0
    XRateLimitReset:
      description: Unix time in seconds when the burst capacity is fully refilled.
      schema:
        type: integer
        minimum: 0
    IdempotentReplayed:
      description: Present and `true` when this response is a stored replay for a repeated Idempotency-Key. A replay charges nothing.
      schema:
        type: string
        enum:
        - 'true'
    XCreditsRemaining:
      description: Credits remaining on the account after this request. Omitted when the balance is not already known without an extra lookup.
      schema:
        type: integer
        minimum: 0
    XCreditsCharged:
      description: Credits charged by this request, net of any refund made in the same request. Sent on authenticated /v1 responses, including errors (0 when nothing was charged).
      schema:
        type: integer
        minimum: 0
    XCacheAge:
      description: Age in whole seconds of the cached data this response used (0 when it was checked fresh). The same value is returned as `cache_age_s`.
      schema:
        type: integer
        minimum: 0
    Sunset:
      description: 'RFC 8594. Sent with Deprecation: the earliest date the deprecated alias may stop working, as an HTTP-date. See /docs/versioning.'
      schema:
        type: string
        example: Sun, 10 Oct 2027 00:00:00 GMT
    Deprecation:
      description: 'RFC 9745. Sent when the request used a deprecated alias: the date it was deprecated, as `@` and Unix seconds. The response body is unchanged.'
      schema:
        type: string
        example: '@1791590400'
    XFieldsIgnored:
      description: 'Sent when `fields` was used and some paths matched nothing in this response: those paths, comma-separated, at most 20.'
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request - invalid parameters
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: Invalid domain format
              suggestion: Domain must be a valid format like example.com
              type: validation_error
              status: 400
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
    IdempotencyInProgress:
      description: A request with the same Idempotency-Key is still running. Retry after Retry-After seconds to receive its stored response. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: IDEMPOTENCY_IN_PROGRESS
              message: A request with this Idempotency-Key is still being processed. Retry shortly to receive its result.
              type: conflict_error
              status: 409
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
              retry_after: 1
    PaymentRequired:
      description: Insufficient credits for this request. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          schema:
            type: integer
          description: Credits remaining on the account
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INSUFFICIENT_CREDITS
              message: Insufficient credits. This endpoint costs 2 credits but you have 0. Purchase more at https://domscan.net/billing or wait for your monthly reset.
              credits_remaining: 0
              credits_required: 2
              purchase_url: https://domscan.net/billing
              type: credits_error
              status: 402
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/credits-pricing
    BadGateway:
      description: The public website could not be fetched or returned an unusable response.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FETCH_ERROR
              message: Failed to fetch website
              type: upstream_error
              status: 502
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/error-codes
    RateLimited:
      description: Rate limit exceeded. Free accounts can sustain 120 requests per minute per account with a burst capacity of 60. Free bulk traffic is additionally limited to 20 requests per minute per account across all bulk endpoints and 100 per minute per IPv4 address or IPv6 /56 network. Paid accounts can sustain 600 requests per minute with a burst capacity of 120.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          schema:
            type: integer
          description: The immediate burst capacity, or the active bulk fixed-window limit when a bulk-specific limit is exceeded.
        X-RateLimit-Remaining:
          schema:
            type: integer
            example: 0
          description: Immediate burst tokens remaining, or requests remaining in the active bulk fixed window.
        X-RateLimit-Reset:
          schema:
            type: integer
            example: 1791590400
          description: Unix time in seconds when the limit that was exceeded allows a new request again.
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
        X-RateLimit-Plan:
          schema:
            type: string
            enum:
            - free
            - paid
          description: The account plan whose policy was applied.
        X-RateLimit-Policy:
          schema:
            type: string
          description: Machine-readable summary of the active tier and limit policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded. Please wait before making more requests.
              type: rate_limit_error
              status: 429
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/rate-limits
              retry_after: 12
    IdempotencyKeyReused:
      description: The Idempotency-Key was already used by this API key for a different request (method, path, query or body) in the last 24 hours. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: IDEMPOTENCY_KEY_REUSED
              message: This Idempotency-Key was already used with a different request. Use a new key for a new request.
              type: validation_error
              status: 422
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
    Unauthorized:
      description: 'Authentication required. All API endpoints require a valid API key (x-api-key header or Authorization: Bearer) or an active session cookie.'
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_REQUIRED
              message: 'Authentication required. Provide an API key via x-api-key header or Authorization: Bearer header.'
              docs: https://domscan.net/docs/authentication
              get_key: https://domscan.net/login
              type: authentication_error
              status: 401
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/authentication
  parameters:
    Fields:
      name: fields
      in: query
      required: false
      x-domscan-global-parameter: true
      description: Comma-separated dot paths to keep in a successful JSON response, e.g. `domain,classification.status` (arrays apply the path to each item; max 50 paths, 6 levels). Unmatched paths are listed in X-Fields-Ignored. Cost is unchanged.
      schema:
        type: string
      example: domain,classification.status
    Naming:
      name: naming
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`snake` returns every camelCase key of a successful JSON response in snake_case (for example `registrarName` becomes `registrar_name`); values are never changed. The `DomScan-Naming: snake` request header does the same; when both are sent this parameter wins, and `default` keeps the original names. Runs before `compact` and `fields`, so `fields` paths use snake_case. Error bodies are already snake_case. Cost is unchanged.'
      schema:
        type: string
        enum:
        - snake
        - default
      example: snake
    MaxAge:
      name: max_age
      in: query
      required: false
      x-domscan-global-parameter: true
      description: Highest acceptable age of cached data, in whole seconds (0 to 2592000). Cached data older than this is checked again; `0` forces a fresh check. Without it the endpoint keeps its default cache policy. The age served is reported in `cache_age_s` and `X-Cache-Age`. Cost is unchanged.
      schema:
        type: integer
        minimum: 0
        maximum: 2592000
      example: 3600
    Compact:
      name: compact
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`true` drops serving metadata (meta timings and served_by, empty warnings/caveats/notes/errors arrays, a request_id that repeats X-Request-Id) from a successful JSON response. Data fields are never removed.'
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
      example: 'true'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional client-chosen key (1 to 255 printable ASCII characters, for example a UUID). Retrying with the same key, API key and identical request within 24 hours returns the stored response with `Idempotent-Replayed: true` and charges nothing again. Responses larger than 1 MiB, and refunded errors, are not stored, so a retry runs normally. Reusing a key for a different request returns 422 IDEMPOTENCY_KEY_REUSED; a duplicate sent while the first is still running returns 409 IDEMPOTENCY_IN_PROGRESS.'
      schema:
        type: string
        minLength: 1
        maxLength: 255
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: 'API key for authentication. Get yours free at https://domscan.net. Also accepts Authorization: Bearer header.'
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Active DomScan browser session. Used by account-management endpoints.
externalDocs:
  description: Full API Documentation
  url: https://domscan.net/docs
x-rapidapi-product: domscan
x-domscan-rate-limits:
  free:
    general:
      scope: account
