openapi: 3.2.0
info:
  title: DomScan SEO API
  description: 'DomScan is a domain intelligence API providing domain analysis tools. **Core Features:**

    - Domain Availability: Check single or bulk domains using RDAP with 1,100+ TLDs supported

    - Domain Intelligence: AI suggestions, valuations, health checks, typosquatting detection

    - OSINT Tools: DNS lookup, WHOIS/RDAP, SSL certificates, subdomain discovery, IP geolocation, tech stack detection

    - Social & Branding: Social handle checker, brand name scoring

    - Phone Intelligence: Privacy-first phone number validation, normalization, and classification

    - Pricing: Scheduled standard-TLD tables from verified official registrar sources, plus separate credential-backed exact-domain quotes

    - Watchlist: Domain monitoring for expiration and availability alerts


    **Authentication:**

    Most API endpoints require authentication. Pass your API key via the x-api-key header or Authorization: Bearer header. Operations marked with an empty security requirement are intentionally public, including API specifications and selected catalog endpoints. Get your free API key at https://domscan.net/dashboard. Logged-in users on domscan.net tools pages are authenticated automatically via session cookie. **Rate Limits:**

    Free accounts can sustain 120 requests per minute per account, with a burst capacity of 60. All API keys and dashboard sessions belonging to the same free account share this budget. Bulk endpoints have an additional free-tier budget of 20 HTTP requests per minute per account across all bulk endpoints. Free-tier bulk traffic is also capped at 100 requests per minute per IPv4 address or IPv6 /56 network. Platform-wide edge protections still apply to every tier. Paid accounts can sustain 600 requests per minute, with a burst capacity of 120, shared by every API key and dashboard session of the account. Paid accounts do not receive the additional free-tier bulk budget. Scope: RapidAPI subscribers are counted per subscriber. (scope=rapidapi-customer) Zyla subscribers are counted per subscriber when the gateway identifies them, (scope=zyla-customer) and as one shared gateway budget when it does not. (scope=zyla-gateway) Other authenticated requests are counted per account: every API key and dashboard session of the account shares one budget. (scope=account) A key that is not linked to an account is counted on its own. (scope=api-key) Unauthenticated requests to public endpoints are counted per client IP address (scope unknown when the address cannot be determined, as one shared budget). (scope=ip)


    Every authenticated response, success or error, includes X-RateLimit-Plan, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, and X-RateLimit-Policy. X-RateLimit-Limit and X-RateLimit-Remaining describe the immediate burst bucket; X-RateLimit-Reset is the Unix time in seconds when that bucket is full again; X-RateLimit-Policy also states the sustained per-minute rate, scope, and any free bulk limits. Exceeding a limit returns HTTP 429 with Retry-After. Retry only after the indicated delay. **Credits System:**

    API calls consume credits based on endpoint complexity. Sign up for free to receive 10,000 credits monthly. - 1 credit: Status checks, DNS lookups, tool builders

    - 2-5 credits: Health checks, valuations, OSINT tools

    - Bulk endpoints: standard per-item rate for batching multiple items into fewer HTTP requests. - 6-25 credits: Recipe compound operations


    When credits reach zero, the API returns HTTP 402 with credits_remaining, credits_required, and a purchase_url. API responses include X-Credits-Requested, X-Credits-Charged, and X-Credits-Refunded. X-Credits-Charged is the net charge after any refund made during the request. Authenticated responses also include X-Credits-Remaining whenever the balance is known without an extra lookup. Free credits refresh monthly on the account''s signup anniversary. POST /v1/estimate returns the credits a request would charge without running it, at no cost.'
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: SEO
paths:
  /v1/robots:
    get:
      tags:
      - SEO
      summary: Parse robots.txt and test crawler access
      description: 'Fetch and parse the robots.txt of a public website under RFC 9309. Returns user-agent groups with allow and disallow rules, declared sitemaps, nonstandard directives and line-level issues, an allow or disallow verdict for one user agent and path, and root access for 14 major AI crawlers. A 404 or other exact 4xx means no restrictions. Access-denied, rate-limited, server-error, challenge and network outcomes return `status: unknown` with a null verdict and are refunded. An HTML page served at /robots.txt is reported as `invalid`.'
      operationId: getRobotsTxt
      x-required-any-of:
      - - url
      - - domain
      parameters:
      - name: url
        description: Site URL or bare domain. Takes precedence over domain. The file is always fetched from https://<host>/robots.txt.
        in: query
        schema:
          type: string
          maxLength: 2048
        example: https://example.com
      - name: domain
        description: Alias for url when url is omitted.
        in: query
        schema:
          type: string
          maxLength: 253
        example: example.com
      - name: user_agent
        description: Crawler to test. Matched on its product token, case-insensitive (GPTBot/1.1 becomes gptbot). Defaults to * (wildcard group only).
        in: query
        schema:
          type: string
          maxLength: 200
          default: '*'
          example: GPTBot
      - name: path
        description: Path to test, including any query string. Full URLs are reduced to path and query, a missing leading slash is added and fragments are dropped. Defaults to the path of url, or /.
        in: query
        schema:
          type: string
          maxLength: 2048
          example: /admin/settings
      - name: skip_cache
        in: query
        description: Deprecated alias of `max_age=0`; still accepted. Set to 1 to bypass the 15-minute robots.txt cache. Deprecated on 2026-10-10; works until at least 2027-10-10 (Sunset header).
        schema:
          type: string
          enum:
          - '1'
        deprecated: true
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/MaxAge'
      responses:
        '200':
          description: Parsed robots.txt, crawler access verdict, AI crawler access, issues and caveats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotsTxtResponse'
              example:
                domain: example.com
                url: https://example.com/
                robots_url: https://example.com/robots.txt
                status: found
                checked_at: '2026-10-09T10:15:30.000Z'
                fetch:
                  checked_url: https://example.com/robots.txt
                  http_status: 200
                  final_url: https://example.com/robots.txt
                  via_proxy: true
                  redirect_count: 0
                  content_type: text/plain; charset=utf-8
                  bytes: 180
                  truncated: false
                  error: null
                sitemaps:
                - https://example.com/sitemap.xml
                groups:
                - user_agents:
                  - GPTBot
                  - CCBot
                  rules:
                  - type: disallow
                    path: /
                    line: 3
                  crawl_delay: null
                - user_agents:
                  - '*'
                  rules:
                  - type: disallow
                    path: /admin/
                    line: 6
                  - type: allow
                    path: /admin/public$
                    line: 7
                  crawl_delay: 10
                other_directives:
                - name: host
                  count: 1
                  standard: false
                test:
                  user_agent: GPTBot
                  path: /admin/settings
                  allowed: false
                  matched_rule:
                    type: disallow
                    path: /
                    line: 3
                  matched_group: specific
                  matched_user_agents:
                  - GPTBot
                  reason: matched_disallow
                ai_crawlers:
                - user_agent: GPTBot
                  owner: openai
                  purpose: training
                  root_access: disallowed
                  group: specific
                - user_agent: OAI-SearchBot
                  owner: openai
                  purpose: search
                  root_access: partial
                  group: wildcard
                - user_agent: ChatGPT-User
                  owner: openai
                  purpose: user_fetch
                  root_access: partial
                  group: wildcard
                - user_agent: ClaudeBot
                  owner: anthropic
                  purpose: training
                  root_access: partial
                  group: wildcard
                - user_agent: Claude-SearchBot
                  owner: anthropic
                  purpose: search
                  root_access: partial
                  group: wildcard
                - user_agent: Claude-User
                  owner: anthropic
                  purpose: user_fetch
                  root_access: partial
                  group: wildcard
                - user_agent: Google-Extended
                  owner: google
                  purpose: training_control
                  root_access: partial
                  group: wildcard
                - user_agent: PerplexityBot
                  owner: perplexity
                  purpose: search
                  root_access: partial
                  group: wildcard
                - user_agent: Perplexity-User
                  owner: perplexity
                  purpose: user_fetch
                  root_access: partial
                  group: wildcard
                - user_agent: CCBot
                  owner: common_crawl
                  purpose: training
                  root_access: disallowed
                  group: specific
                - user_agent: Bytespider
                  owner: bytedance
                  purpose: training
                  root_access: partial
                  group: wildcard
                - user_agent: Applebot-Extended
                  owner: apple
                  purpose: training_control
                  root_access: partial
                  group: wildcard
                - user_agent: meta-externalagent
                  owner: meta
                  purpose: training
                  root_access: partial
                  group: wildcard
                - user_agent: Amazonbot
                  owner: amazon
                  purpose: search
                  root_access: partial
                  group: wildcard
                issues:
                - code: crawl_delay_nonstandard
                  count: 1
                  lines:
                  - 8
                - code: nonstandard_directive
                  count: 1
                  lines:
                  - 10
                caveats: []
                summary:
                  groups: 2
                  rules: 3
                  allow_rules: 1
                  disallow_rules: 2
                  sitemaps: 1
                  issues: 2
                  lines: 12
                  ai_crawlers_allowed: 0
                  ai_crawlers_disallowed: 2
                  ai_crawlers_partial: 12
                  ai_crawlers_unknown: 0
                  ai_crawlers_with_specific_group: 2
                meta:
                  cached: false
                  duration_ms: 184
                  source_version: '2026-10-09'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            X-Cache-Age:
              $ref: '#/components/headers/XCacheAge'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
      x-domscan-freshness:
        parameter: max_age
        aliases:
        - name: skip_cache
          in: query
          max_age: 0
      x-domscan-deprecated-aliases:
      - name: skip_cache
        in: query
        replacement: max_age=0
        deprecated_on: '2026-10-10'
        sunset_on: '2027-10-10'
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/sitemaps:
    get:
      tags:
      - SEO
      summary: Discover and audit XML sitemaps
      description: Discover the XML sitemaps of a public website from robots.txt Sitemap lines, falling back to /sitemap.xml and /sitemap_index.xml, then follow sitemap indexes within a bounded fetch budget. Each fetched file reports its type, URL count, lastmod freshness, image, video, news and hreflang extensions, and protocol issues such as invalid or cross-host URLs, bad dates, duplicates and size limits. Cross-site sitemaps are listed but never fetched. Counts cover fetched files only. Blocked, rate-limited or failed fetches stay `unknown` and an unknown result is refunded.
      operationId: getSitemapAudit
      x-required-any-of:
      - - url
      - - domain
      parameters:
      - name: url
        description: Site URL or bare domain to audit. Only the origin is used. Takes precedence over domain.
        in: query
        schema:
          type: string
          maxLength: 2048
        example: https://example.com
      - name: domain
        description: Alias for url when url is omitted.
        in: query
        schema:
          type: string
          maxLength: 253
        example: example.com
      - name: sitemap
        description: Audit only this sitemap and its index children. Must be an http(s) URL on the same registrable domain as the target. robots.txt is not fetched and standard locations are not tried in this mode.
        in: query
        schema:
          type: string
          maxLength: 2048
          example: https://example.com/sitemap_index.xml
      - name: max_sitemaps
        description: Maximum sitemap documents fetched per request (robots.txt not counted). Sitemaps beyond the budget are listed as skipped_budget.
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          example: 5
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Sitemap discovery, per-file audit results, totals, freshness, issues and caveats
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SitemapAuditResponse'
              example:
                url: https://example.com/
                domain: example.com
                origin: https://example.com
                status: found
                checked_at: '2026-10-09T12:00:00.000Z'
                fetch:
                  checked_url: https://example.com/robots.txt
                  http_status: 200
                  final_url: https://example.com/robots.txt
                  via_proxy: true
                robots_txt:
                  status: found
                  url: https://example.com/robots.txt
                  http_status: 200
                  declared_sitemaps:
                  - url: https://example.com/sitemap_index.xml
                    same_site: true
                  - url: https://sitemaps.example.net/example.xml
                    same_site: false
                sitemaps:
                - url: https://example.com/sitemap_index.xml
                  source: robots
                  parent: null
                  status: ok
                  http_status: 200
                  final_url: https://example.com/sitemap_index.xml
                  via_proxy: true
                  content_type: application/xml; charset=utf-8
                  bytes: 412
                  type: sitemapindex
                  url_count: 0
                  child_sitemap_count: 2
                  lastmod:
                    newest: '2026-10-01T00:00:00.000Z'
                    oldest: '2026-10-01T00:00:00.000Z'
                    with_lastmod_ratio: 1
                  extensions:
                    images: false
                    videos: false
                    news: false
                    hreflang: false
                  counts:
                    invalid_loc: 0
                    missing_loc: 0
                    loc_too_long: 0
                    cross_host_urls: 0
                    protocol_mismatch_urls: 0
                    duplicate_urls: 0
                    invalid_lastmod: 0
                    future_lastmod: 0
                    cross_site_child_sitemaps: 0
                  issues: []
                  sample_urls:
                  - https://example.com/posts.xml
                  - https://example.com/pages.xml
                - url: https://example.com/posts.xml
                  source: index_child
                  parent: https://example.com/sitemap_index.xml
                  status: ok
                  http_status: 200
                  final_url: https://example.com/posts.xml
                  via_proxy: true
                  content_type: application/xml
                  bytes: 18234
                  type: urlset
                  url_count: 120
                  child_sitemap_count: 0
                  lastmod:
                    newest: '2026-10-05T00:00:00.000Z'
                    oldest: '2024-03-11T00:00:00.000Z'
                    with_lastmod_ratio: 0.975
                  extensions:
                    images: true
                    videos: false
                    news: false
                    hreflang: true
                  counts:
                    invalid_loc: 0
                    missing_loc: 0
                    loc_too_long: 0
                    cross_host_urls: 0
                    protocol_mismatch_urls: 2
                    duplicate_urls: 1
                    invalid_lastmod: 3
                    future_lastmod: 0
                    cross_site_child_sitemaps: 0
                  issues:
                  - protocol_mismatch
                  - duplicate_urls
                  - invalid_lastmod
                  sample_urls:
                  - https://example.com/blog/a
                  - https://example.com/blog/b
                  - https://example.com/blog/c
                  - http://example.com/blog/d
                  - https://example.com/blog/e
                - url: https://example.com/pages.xml
                  source: index_child
                  parent: https://example.com/sitemap_index.xml
                  status: unknown
                  http_status: 429
                  final_url: https://example.com/pages.xml
                  via_proxy: true
                  content_type: text/html
                  bytes: 162
                  type: null
                  url_count: 0
                  child_sitemap_count: 0
                  lastmod:
                    newest: null
                    oldest: null
                    with_lastmod_ratio: null
                  extensions:
                    images: false
                    videos: false
                    news: false
                    hreflang: false
                  counts:
                    invalid_loc: 0
                    missing_loc: 0
                    loc_too_long: 0
                    cross_host_urls: 0
                    protocol_mismatch_urls: 0
                    duplicate_urls: 0
                    invalid_lastmod: 0
                    future_lastmod: 0
                    cross_site_child_sitemaps: 0
                  issues:
                  - rate_limited
                  sample_urls: []
                totals:
                  sitemaps_checked: 3
                  sitemaps_discovered: 4
                  urls_counted: 120
                  budget_exhausted: false
                freshness:
                  newest_lastmod: '2026-10-05T00:00:00.000Z'
                  days_since_newest: 4
                issues:
                - cross_site_sitemap_declared
                - protocol_mismatch
                - duplicate_urls
                - invalid_lastmod
                - rate_limited
                caveats:
                - counts_cover_fetched_files_only
                - cross_site_sitemaps_not_fetched
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
      x-domscan-credits:
        model: per_request
        default: 2
  /v1/robots/test:
    post:
      tags:
      - SEO
      summary: Test URLs and crawlers against robots.txt
      description: Test up to 100 URLs or paths against up to 10 user agents under RFC 9309 in one request. Send `robots_txt` to test a draft without fetching anything, or omit it to fetch the live file of `url` (or of the first absolute URL in `urls`). Each result gives the verdict, the deciding rule with its line number and the matched group. Full browser-style user agent strings are reduced to their crawler token. With a live file, URLs on another host are reported as `other_host`, and a file that cannot be read gives `unknown` with null verdicts and is refunded. 1 credit per request.
      operationId: testRobotsTxt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - urls
              properties:
                robots_txt:
                  type: string
                  maxLength: 512000
                  description: robots.txt content to test. When set, nothing is fetched.
                url:
                  type: string
                  maxLength: 2048
                  description: Site whose live robots.txt is fetched when robots_txt is omitted.
                urls:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    maxLength: 2048
                  description: URLs or paths to test.
                user_agents:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    maxLength: 200
                  description: Crawlers to test. Defaults to ["*"].
            example:
              robots_txt: 'User-agent: GPTBot

                Disallow: /


                User-agent: *

                Disallow: /admin/

                Allow: /admin/public'
              urls:
              - /blog/post-1
              - /admin/public
              user_agents:
              - Googlebot
              - GPTBot
      responses:
        '200':
          description: Robots.txt test results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotsTesterResponse'
              example:
                source: provided
                url: null
                robots_url: null
                status: found
                checked_at: '2026-10-13T10:00:00.000Z'
                summary:
                  tests: 4
                  allowed: 2
                  disallowed: 2
                  unknown: 0
                  groups: 2
                  rules: 3
                  issues: 0
                user_agents:
                - user_agent: Googlebot
                  allowed: 2
                  disallowed: 0
                  unknown: 0
                - user_agent: GPTBot
                  allowed: 0
                  disallowed: 2
                  unknown: 0
                results:
                - url: /blog/post-1
                  path: /blog/post-1
                  user_agent: Googlebot
                  token: Googlebot
                  allowed: true
                  reason: no_matching_rule
                  matched_rule: null
                  matched_group: wildcard
                  matched_user_agents:
                  - '*'
                  vendor: null
                - url: /admin/public
                  path: /admin/public
                  user_agent: Googlebot
                  token: Googlebot
                  allowed: true
                  reason: matched_allow
                  matched_rule:
                    type: allow
                    path: /admin/public
                    line: 6
                  matched_group: wildcard
                  matched_user_agents:
                  - '*'
                  vendor: null
                - url: /blog/post-1
                  path: /blog/post-1
                  user_agent: GPTBot
                  token: GPTBot
                  allowed: false
                  reason: matched_disallow
                  matched_rule:
                    type: disallow
                    path: /
                    line: 2
                  matched_group: specific
                  matched_user_agents:
                  - GPTBot
                  vendor: null
                - url: /admin/public
                  path: /admin/public
                  user_agent: GPTBot
                  token: GPTBot
                  allowed: false
                  reason: matched_disallow
                  matched_rule:
                    type: disallow
                    path: /
                    line: 2
                  matched_group: specific
                  matched_user_agents:
                  - GPTBot
                  vendor: null
                sitemaps: []
                issues: []
                caveats: []
                fetch: null
                meta:
                  cached: false
                  duration_ms: 2
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/onpage:
    get:
      tags:
      - SEO
      summary: On-page SEO audit
      description: 'Fetch one public page and audit it for on-page SEO: title and meta description (with lengths), canonical (HTML and HTTP Link header), meta robots, meta googlebot and X-Robots-Tag (noindex for all crawlers and for Googlebot, page-level nofollow), meta refresh and duplicate meta tags, language, viewport, favicon, Open Graph and Twitter cards, heading outline, word count and text ratio, internal, external and nofollow links, images missing alt text or dimensions, scripts, stylesheets, render-blocking resources in the head, mixed content and https pages linking to http URLs, structured data types and hreflang. 38 checks report pass, warn, fail or not_applicable with a severity, and a weighted 0-100 score summarises them. `render=true` audits the page after JavaScript runs in an isolated browser. A page that cannot be read is `unknown` and refunded. A page cut at the 1 MB read budget or decoded with the wrong charset is flagged in `caveats`, and body checks that cannot be confirmed on a cut page are not_applicable.'
      operationId: getOnPageAudit
      parameters:
      - name: url
        in: query
        required: true
        description: Page URL or bare domain.
        schema:
          type: string
        example: https://example.com/shoes/trail-runner
      - name: render
        in: query
        description: Run page JavaScript first.
        schema:
          type: boolean
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: On-page SEO audit
          content:
