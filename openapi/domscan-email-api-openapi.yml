openapi: 3.2.0
info:
  title: DomScan Email API
  description: 'DomScan is a domain intelligence API providing domain analysis tools. **Core Features:**

    - Domain Availability: Check single or bulk domains using RDAP with 1,100+ TLDs supported

    - Domain Intelligence: AI suggestions, valuations, health checks, typosquatting detection

    - OSINT Tools: DNS lookup, WHOIS/RDAP, SSL certificates, subdomain discovery, IP geolocation, tech stack detection

    - Social & Branding: Social handle checker, brand name scoring

    - Phone Intelligence: Privacy-first phone number validation, normalization, and classification

    - Pricing: Scheduled standard-TLD tables from verified official registrar sources, plus separate credential-backed exact-domain quotes

    - Watchlist: Domain monitoring for expiration and availability alerts


    **Authentication:**

    Most API endpoints require authentication. Pass your API key via the x-api-key header or Authorization: Bearer header. Operations marked with an empty security requirement are intentionally public, including API specifications and selected catalog endpoints. Get your free API key at https://domscan.net/dashboard. Logged-in users on domscan.net tools pages are authenticated automatically via session cookie. **Rate Limits:**

    Free accounts can sustain 120 requests per minute per account, with a burst capacity of 60. All API keys and dashboard sessions belonging to the same free account share this budget. Bulk endpoints have an additional free-tier budget of 20 HTTP requests per minute per account across all bulk endpoints. Free-tier bulk traffic is also capped at 100 requests per minute per IPv4 address or IPv6 /56 network. Platform-wide edge protections still apply to every tier. Paid accounts can sustain 600 requests per minute, with a burst capacity of 120, shared by every API key and dashboard session of the account. Paid accounts do not receive the additional free-tier bulk budget. Scope: RapidAPI subscribers are counted per subscriber. (scope=rapidapi-customer) Zyla subscribers are counted per subscriber when the gateway identifies them, (scope=zyla-customer) and as one shared gateway budget when it does not. (scope=zyla-gateway) Other authenticated requests are counted per account: every API key and dashboard session of the account shares one budget. (scope=account) A key that is not linked to an account is counted on its own. (scope=api-key) Unauthenticated requests to public endpoints are counted per client IP address (scope unknown when the address cannot be determined, as one shared budget). (scope=ip)


    Every authenticated response, success or error, includes X-RateLimit-Plan, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, and X-RateLimit-Policy. X-RateLimit-Limit and X-RateLimit-Remaining describe the immediate burst bucket; X-RateLimit-Reset is the Unix time in seconds when that bucket is full again; X-RateLimit-Policy also states the sustained per-minute rate, scope, and any free bulk limits. Exceeding a limit returns HTTP 429 with Retry-After. Retry only after the indicated delay. **Credits System:**

    API calls consume credits based on endpoint complexity. Sign up for free to receive 10,000 credits monthly. - 1 credit: Status checks, DNS lookups, tool builders

    - 2-5 credits: Health checks, valuations, OSINT tools

    - Bulk endpoints: standard per-item rate for batching multiple items into fewer HTTP requests. - 6-25 credits: Recipe compound operations


    When credits reach zero, the API returns HTTP 402 with credits_remaining, credits_required, and a purchase_url. API responses include X-Credits-Requested, X-Credits-Charged, and X-Credits-Refunded. X-Credits-Charged is the net charge after any refund made during the request. Authenticated responses also include X-Credits-Remaining whenever the balance is known without an extra lookup. Free credits refresh monthly on the account''s signup anniversary. POST /v1/estimate returns the credits a request would charge without running it, at no cost.'
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: Email
  description: Email blacklist checking, disposable domain detection, and email validation
paths:
  /v1/email-auth/bulk:
    post:
      operationId: bulkGetEmailAuth
      summary: Audit email authentication for multiple domains
      description: Check SPF, DKIM, DMARC, MTA-STS, TLS-RPT, and recursive SPF behavior for multiple domains with an optional shared DKIM selector list. Accepts up to 10 items, preserves input order, and uses bounded concurrency. The outer response is HTTP 200 when the batch is accepted, so inspect each result for data or an error. Billing is 3 credits per validated item with no bulk discount, including items that return a per-item lookup error.
      tags:
      - Email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domains
              properties:
                domains:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    format: hostname
                selectors:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: string
            example:
              domains:
              - example.com
              - cloudflare.com
              selectors:
              - selector1
              - selector2
      responses:
        '200':
          description: Batch accepted. Each ordered result contains either data or a per-item error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkLookupResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/DryRun'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-credits:
        model: per_item
        default: 3
  /v1/email/compliance:
    get:
      tags:
      - Email
      summary: Email compliance readiness
      description: Provider-oriented sender readiness report for Google/Gmail and Microsoft Outlook.com high-volume requirements. Combines SPF, DKIM, DMARC, recursive SPF analysis, DKIM audit, MTA-STS, TLS-RPT, BIMI/VMC, DNSSEC, CAA, AXFR, authority health, and blacklist signals. DNS-visible checks are separated from live message-level requirements such as alignment, spam rate, TLS sessions, and unsubscribe headers.
      operationId: getEmailCompliance
      parameters:
      - name: domain
        in: query
        required: true
        description: Domain to audit for sender compliance readiness
        schema:
          type: string
          example: example.com
      - name: selectors
        in: query
        required: false
        description: Optional comma-separated DKIM selectors to check in addition to common selectors. At most 50 valid DNS selector names are accepted.
        schema:
          type: string
          example: google,selector1,sendgrid
      - name: providers
        in: query
        required: false
        description: 'Optional comma-separated provider readiness profiles. Supported: google,microsoft.'
        schema:
          type: string
          example: google,microsoft
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Email compliance readiness report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailComplianceResponse'
              example:
                domain: example.com
                status: warn
                score: 82
                grade: B
                provider_readiness:
                  google:
                    provider: google
                    display_name: Google/Gmail bulk sender readiness
                    status: pass
                    dns_visible_status: pass
                    requirements:
                    - id: google_spf
                      label: SPF must be configured for bulk senders
                      status: pass
                      severity: critical
                      category: dns
                      evidence: 'SPF policy: softfail'
                      recommendation: Publish one valid SPF record that covers every approved sending platform.
                    - id: google_alignment
                      label: From domain must align with either SPF or DKIM on live messages
                      status: unknown
                      severity: high
                      category: message
                      evidence: Alignment requires Authentication-Results from a real sent message
                      recommendation: Send a test message and verify SPF or DKIM alignment.
                    verification_required:
                    - From domain must align with either SPF or DKIM on live messages
                    - Outbound mail must be transmitted over TLS
                    notes:
                    - Status is based on DNS-visible controls. Live sending requirements still need message-header and sender-platform verification.
                  microsoft:
                    provider: microsoft
                    display_name: Microsoft Outlook.com high-volume sender readiness
                    status: pass
                    dns_visible_status: pass
                    requirements: []
                    verification_required:
                    - DMARC must align with either SPF or DKIM
                    notes:
                    - Status is based on DNS-visible controls. Live sending requirements still need message-header and sender-platform verification.
                summary:
                  authentication:
                    spf:
                      status: pass
                      record: v=spf1 include:_spf.example.com ~all
                      policy: softfail
                      lookup_count: 3
                      lookup_limit_exceeded: false
                    dkim:
                      status: pass
                      selectors_checked:
                      - google
                      - selector1
                      - sendgrid
                      selectors_found:
                      - google
                      valid_selector_count: 1
                      weak_selector_count: 0
                      revoked_selector_count: 0
                      providers_detected:
                      - Google Workspace
                    dmarc:
                      status: warn
                      record: v=DMARC1; p=none; rua=mailto:dmarc@example.com
                      policy: none
                      subdomain_policy: null
                      percentage: 100
                      rua:
                      - mailto:dmarc@example.com
                      alignment_mode:
                        spf: null
                        dkim: null
                  transport:
                    mta_sts:
                      status: pass
                      mode: enforce
                      policy_fetch_ok: true
                      policy_matches_mx: true
                    tls_rpt:
                      status: pass
                      rua:
                      - mailto:tls@example.com
                    mx_records:
                    - aspmx.l.google.com
                    client_access_secure_services: 1
                  dns_security:
                    dnssec: pass
                    caa: pass
                    zone_transfer: pass
                    authoritative_consistency: pass
                    blacklist: pass
                  brand_trust:
                    bimi: unknown
                    vmc: unknown
                action_items:
                - priority: medium
                  category: authentication
                  title: Move DMARC beyond monitoring mode
                  detail: DMARC is valid but still uses p=none.
                  fix: After reviewing aggregate reports, move to p=quarantine or p=reject.
                evidence:
                  email_auth:
                    spf:
                      record: v=spf1 include:_spf.example.com ~all
                    dmarc:
                      record: v=DMARC1; p=none; rua=mailto:dmarc@example.com
                  dns_security:
                    security_score: 86
                    security_grade: B
                proxy:
                  configured: true
                  enriched: true
                  checks:
                  - spf_walk
                  - mail_policies
                  - dkim_audit
                  - bimi_audit
                limitations:
                - DNS-visible checks cannot prove live message-level SPF, DKIM, DMARC alignment, RFC 5322 formatting, spam rate, or one-click unsubscribe behavior.
                checked_at: '2026-04-26T12:00:00Z'
                check_duration_ms: 642
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 6
  /v1/email/check:
    get:
      tags:
      - Email
      summary: Check email address
      description: 'Check an email address for disposable domains, role-based addresses, free providers, MX record validation, and DNS blacklist status.


        **Checks performed:**

        - **disposable**: Match against 186k+ disposable/temporary email domains from 5 aggregated sources

        - **role**: Detect role-based addresses (admin@, support@, info@, etc.)

        - **free**: Identify free email providers (gmail, yahoo, outlook, etc.)

        - **mx**: Validate domain has valid MX records

        - **dnsbl**: Check domain against Spamhaus DBL, SURBL, URIBL


        **Risk scoring:**

        - Disposable domain: +80 points

        - No MX records: +50 points

        - DNSBL listed (high): +60 points

        - Role-based address: +20 points

        - Free provider: +10 points


        Risk levels: low (0-39), medium (40-69), high (70-100)'
      operationId: checkEmailBlacklist
      parameters:
      - name: email
        in: query
        required: true
        description: Email address to check
        schema:
          type: string
          example: user@example.com
      - name: checks
        in: query
        required: false
        description: 'Comma-separated list of checks to run (default: all)'
        schema:
          type: string
          example: disposable,role,free,mx,dnsbl
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Email check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                    example: user@tempmail.org
                  domain:
                    type: string
                    example: tempmail.org
                  local_part:
                    type: string
                    example: user
                  valid_syntax:
                    type: boolean
                    example: true
                  checks:
                    type: object
                    properties:
                      disposable:
                        type:
                        - object
                        - 'null'
                        properties:
                          is_disposable:
                            type: boolean
                            example: true
                          confidence:
                            type:
                            - string
                            - 'null'
                            enum:
                            - high
                            - medium
                            - low
                            - null
                            example: high
                          matched_pattern:
                            type: string
                            description: Wildcard pattern that matched, when the domain matched a pattern rather than an exact entry.
                      role:
                        type:
                        - object
                        - 'null'
                        properties:
                          is_role:
                            type: boolean
                            example: false
                          role_type:
                            type:
                            - string
                            - 'null'
                      free:
                        type:
                        - object
                        - 'null'
                        properties:
                          is_free:
                            type: boolean
                            example: false
                          provider:
                            type:
                            - string
                            - 'null'
                      mx:
                        type:
                        - object
                        - 'null'
                        properties:
                          has_mx:
                            type:
                            - boolean
                            - 'null'
                            example: true
                            description: null when the MX lookup failed, so it is unknown
                          records:
                            type: array
                            items:
                              type: string
                            example:
                            - mx1.tempmail.org
                          null_mx:
                            type: boolean
                            description: True when the domain publishes an RFC 7505 null MX, explicitly accepting no mail.
                      dnsbl:
                        type:
                        - object
                        - 'null'
                        properties:
                          domain:
                            type: string
                            description: Domain that was checked
                          ip:
                            type: string
                            description: IP that was checked, for IP checks
                          listed:
                            type: boolean
                            example: false
                          lists:
                            type: array
                            description: Per-blocklist results
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                listed:
                                  type: boolean
                                status:
                                  type: string
                                  enum:
                                  - listed
                                  - not_listed
                                  - unknown
                                  description: unknown when the list could not answer; never a clean result
                                code:
                                  type: string
                                  description: Return code from the list
                                meaning:
                                  type: string
                                  description: Meaning of the return code when listed
                                unknown_reason:
                                  type: string
                                  enum:
                                  - lookup_failed
                                  - query_refused
                                  - unexpected_answer
                          lists_unknown:
                            type: integer
                            description: Lists that could not give an answer for this check
                            example: 0
                          threat_level:
                            type: string
                            enum:
                            - none
                            - low
                            - medium
                            - high
                            example: none
                          check_type:
                            type: string
                            enum:
                            - ip
                            - domain
                          checked_at:
                            type: string
                            format: date-time
                  risk_score:
                    type: integer
                    minimum: 0
                    maximum: 100
                    example: 80
                  risk_level:
                    type: string
                    enum:
                    - low
                    - medium
                    - high
                    example: high
                  flags:
                    type: array
                    items:
                      type: string
                    example:
                    - DISPOSABLE_DOMAIN
                  checked_at:
                    type: string
                    format: date-time
              example:
                email: support@acme-widgets.com
                domain: acme-widgets.com
                local_part: support
                valid_syntax: true
                checks:
                  disposable:
                    is_disposable: false
                    confidence: null
                  role:
                    is_role: true
                    role_type: support
                  free:
                    is_free: false
                    provider: null
                  mx:
                    has_mx: true
                    records:
                    - mx1.mailhost-example.net
                    - mx2.mailhost-example.net
                  dnsbl:
                    listed: false
                    threat_level: none
                risk_score: 20
                risk_level: low
                flags:
                - ROLE_ADDRESS
                checked_at: '2026-10-09T10:15:30.000Z'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          description: Invalid email format
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; equals error.request_id in the body.
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: email is required
                  type: validation_error
                  status: 400
                  retryable: false
                  request_id: m5x7k2p-a9f3
                  docs_url: https://domscan.net/docs/request-headers
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/email/check/bulk:
    post:
      tags:
      - Email
      summary: Bulk check email addresses
      description: 'Check multiple email addresses in a single request (max 100).


        **Credits:** 1 credit per email. Example: 10 emails = 10 credits.'
      operationId: bulkEmailCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - emails
              properties:
                emails:
                  type: array
                  items:
                    type: string
                  maxItems: 100
                  example:
                  - user1@example.com
                  - user2@tempmail.org
                checks:
                  type: array
                  items:
                    type: string
                    enum:
                    - disposable
                    - role
                    - free
                    - mx
                    - dnsbl
                  example:
                  - disposable
                  - role
                  - free
            example:
              emails:
              - jane.doe@example.com
              - support@example.org
              checks:
              - disposable
              - role
              - mx
      responses:
        '200':
          description: Bulk check results with summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                        example: 10
                      disposable:
                        type: integer
                        example: 3
                      role_based:
                        type: integer
                        example: 1
                      free_provider:
                        type: integer
                        example: 2
                      no_mx:
                        type: integer
                        example: 0
                      dnsbl_listed:
                        type: integer
                        example: 0
                      high_risk:
                        type: integer
                        example: 3
                      medium_risk:
                        type: integer
                        example: 1
                      low_risk:
                        type: integer
                        example: 6
                  checked_at:
                    type: string
                    format: date-time
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          description: Invalid request body
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; equals error.request_id in the body.
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: BAD_REQUEST
                  message: emails array is required
                  type: validation_error
                  status: 400
                  retryable: false
                  request_id: m5x7k2p-a9f3
                  docs_url: https://domscan.net/docs/request-headers
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/DryRun'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-credits:
        model: per_item
        default: 1
  /v1/email/verify:
    get:
      tags:
      - Email
      summary: Verify email address
      description: 'Verify if an email address is deliverable with basic verification.


        **Basic Verification (2 credits):**

        - Syntax validation

        - MX record lookup

        - Disposable domain detection (186k+ domains)

        - Role-based address detection (admin@, support@, etc.)

        - Free provider identification (Gmail, Yahoo, etc.)

        - DNS blacklist reputation check (Spamhaus, SURBL, URIBL)

        - Common provider typo suggestions

        - Random-looking local-part detection

        - Reserved/test domain and domain-literal detection

        - Domain profile signals for punycode, deep subdomains, numeric-heavy labels, long labels, and hyphen clusters

        - Local-part profile signals for plus addressing, no-reply mailboxes, trap-like names, long/random/numeric-heavy inputs, and separator abuse

        - MX redundancy analysis

        - SPF, DMARC, MTA-STS, and TLS-RPT domain authentication evidence

        - Toxic/do-not-mail/gibberish summary signals

        - Industry-style deliverability summary with safe-to-send decisioning

        - Provider fingerprinting from MX records

        - Null MX detection


        **Deprecated full SMTP verification:**

        The `full` parameter is deprecated and ignored. Mailbox-level SMTP probing is not charged or performed because it requires recipient MX probing on port 25, which this service does not provide.


        **Quality Score:**

        - A (90-100): Excellent deliverability

        - B (75-89): Good deliverability

        - C (60-74): Moderate risk

        - D (40-59): High risk

        - F (0-39): Very high risk / invalid


        **Result categories:**

        - `valid`: Email appears deliverable based on syntax, DNS, provider, reputation, and risk signals

        - `invalid`: Email not deliverable (no MX, null MX, syntax error, or reserved/test domain)

        - `risky`: Use with caution (disposable, role-based, suspicious, or reputation issues)

        - `unknown`: Could not determine (timeout or temporary error)

        - `pending`: Legacy status; no longer emitted for deprecated full checks'
