  parameters:
    DryRun:
      name: dry_run
      in: query
      required: false
      description: 'Set to `true` to return the credit estimate for this exact request instead of running it. Nothing is executed, no source is called and 0 credits are charged. The response has the same shape as POST /v1/estimate plus `dry_run: true`.'
      schema:
        type: string
        enum:
        - 'true'
      example: 'true'
    Fields:
      name: fields
      in: query
      required: false
      x-domscan-global-parameter: true
      description: Comma-separated dot paths to keep in a successful JSON response, e.g. `domain,classification.status` (arrays apply the path to each item; max 50 paths, 6 levels). Unmatched paths are listed in X-Fields-Ignored. Cost is unchanged.
      schema:
        type: string
      example: domain,classification.status
    Naming:
      name: naming
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`snake` returns every camelCase key of a successful JSON response in snake_case (for example `registrarName` becomes `registrar_name`); values are never changed. The `DomScan-Naming: snake` request header does the same; when both are sent this parameter wins, and `default` keeps the original names. Runs before `compact` and `fields`, so `fields` paths use snake_case. Error bodies are already snake_case. Cost is unchanged.'
      schema:
        type: string
        enum:
        - snake
        - default
      example: snake
    Compact:
      name: compact
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`true` drops serving metadata (meta timings and served_by, empty warnings/caveats/notes/errors arrays, a request_id that repeats X-Request-Id) from a successful JSON response. Data fields are never removed.'
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
      example: 'true'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional client-chosen key (1 to 255 printable ASCII characters, for example a UUID). Retrying with the same key, API key and identical request within 24 hours returns the stored response with `Idempotent-Replayed: true` and charges nothing again. Responses larger than 1 MiB, and refunded errors, are not stored, so a retry runs normally. Reusing a key for a different request returns 422 IDEMPOTENCY_KEY_REUSED; a duplicate sent while the first is still running returns 409 IDEMPOTENCY_IN_PROGRESS.'
      schema:
        type: string
        minLength: 1
        maxLength: 255
  schemas:
    EmailComplianceResponse:
      type: object
      description: Provider-oriented email sender compliance readiness report with DNS-visible status separated from live message-level verification.
      properties:
        domain:
          type: string
        status:
          type: string
          enum:
          - pass
          - warn
          - fail
        score:
          type: integer
          minimum: 0
          maximum: 100
        grade:
          type: string
          enum:
          - A+
          - A
          - B
          - C
          - D
          - F
        checks_unknown:
          type: integer
          minimum: 0
          description: SPF, DKIM, DMARC and blacklist checks that could not be determined. They are reported as unknown and left out of the score.
        score_confidence:
          type: string
          enum:
          - full
          - partial
        provider_readiness:
          type: object
          properties:
            google:
              $ref: '#/components/schemas/EmailProviderReadiness'
            microsoft:
              $ref: '#/components/schemas/EmailProviderReadiness'
        summary:
          type: object
          properties:
            authentication:
              type: object
            transport:
              type: object
            dns_security:
              type: object
            brand_trust:
              type: object
        action_items:
          type: array
          items:
            $ref: '#/components/schemas/EmailComplianceActionItem'
        evidence:
          type: object
          properties:
            email_auth:
              type: object
            dns_security:
              type: object
        proxy:
          type: object
          properties:
            configured:
              type: boolean
            enriched:
              type: boolean
            checks:
              type: array
              items:
                type: string
        limitations:
          type: array
          items:
            type: string
        checked_at:
          type: string
          format: date-time
        check_duration_ms:
          type: integer
    BulkLookupResponse:
      type: object
      description: Ordered bulk lookup response. A successful outer response can contain per-item failures.
      required:
      - results
      - meta
      properties:
        results:
          type: array
          description: Results in the same order as the submitted inputs.
          items:
            oneOf:
            - type: object
              required:
              - input
              - data
              properties:
                input:
                  type: string
                data:
                  type: object
                  additionalProperties: true
            - type: object
              required:
              - input
              - error
              properties:
                input:
                  type: string
                error:
                  type: object
                  required:
                  - code
                  - message
                  - status
                  properties:
                    code:
                      type: string
                    message:
                      type: string
                    status:
                      type: integer
                  additionalProperties: true
        meta:
          type: object
          required:
          - total
          - succeeded
          - failed
          - max_items
          - credits_per_item
          - duration_ms
          properties:
            total:
              type: integer
              minimum: 1
              maximum: 10
            succeeded:
              type: integer
              minimum: 0
              maximum: 10
            failed:
              type: integer
              minimum: 0
              maximum: 10
            max_items:
              type: integer
              enum:
              - 10
            credits_per_item:
              type: integer
              minimum: 1
            duration_ms:
              type: integer
              minimum: 0
    EmailComplianceActionItem:
      type: object
      properties:
        priority:
          type: string
          enum:
          - critical
          - high
          - medium
          - low
          - info
        category:
          type: string
          enum:
          - authentication
          - transport
          - dns
          - brand
          - reputation
        title:
          type: string
        detail:
          type: string
        fix:
          type: string
    EmailComplianceRequirement:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        status:
          type: string
          enum:
          - pass
          - warn
          - fail
          - unknown
        severity:
          type: string
          enum:
          - critical
          - high
          - medium
          - low
          - info
        category:
          type: string
          enum:
          - dns
          - message
          - transport
          - reputation
          - content
        evidence:
          type: string
        recommendation:
          type: string
    EmailProviderReadiness:
      type: object
      properties:
        provider:
          type: string
          enum:
          - google
          - microsoft
        display_name:
          type: string
        status:
          type: string
          enum:
          - pass
          - warn
          - fail
        dns_visible_status:
          type: string
          enum:
          - pass
          - warn
          - fail
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/EmailComplianceRequirement'
        verification_required:
          type: array
          items:
            type: string
        notes:
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      description: Canonical error format shared by every API error response. Endpoint-specific fields (for example credits_remaining, login_url or evidence_summary) may appear next to error or inside it; clients should ignore fields they do not recognise.
      additionalProperties: true
      properties:
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
              description: Stable, upper-case machine code. Codes are never renamed; the full catalog with HTTP status, type and retryability is published as x-domscan-error-codes.
              example: INVALID_DOMAIN
            type:
              type: string
              enum:
              - authentication_error
              - credits_error
              - permission_error
              - not_found_error
              - conflict_error
              - rate_limit_error
              - timeout_error
              - validation_error
              - upstream_error
              - api_error
              - request_error
              description: Stable error category used by official SDK subclasses
            message:
              type: string
              description: Human-readable error message
              example: Invalid domain format
            status:
              type: integer
              minimum: 400
              maximum: 599
              description: HTTP status repeated in the JSON error for queue and log processors
            retryable:
              type: boolean
              description: Whether retrying can be appropriate after applying retry guidance
            request_id:
              type: string
              description: Request identifier matching the X-Request-Id response header
            suggestion:
              type: string
              description: Suggestion for fixing the error
            details:
              type: object
              description: Optional structured context for the error
              additionalProperties: true
            retry_after:
              type: integer
              minimum: 0
              description: Seconds to wait before retrying when the error is temporary
              example: 300
            docs_url:
              type: string
              description: Absolute link to the documentation section for this error
              example: https://domscan.net/docs/check-availability
          required:
          - type
          - code
          - message
          - status
          - retryable
          - request_id
          - docs_url
