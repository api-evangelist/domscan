openapi: 3.2.0
info:
  title: DomScan Domain Health API
  description: 'DomScan is a domain intelligence API providing domain analysis tools. **Core Features:**

    - Domain Availability: Check single or bulk domains using RDAP with 1,100+ TLDs supported

    - Domain Intelligence: AI suggestions, valuations, health checks, typosquatting detection

    - OSINT Tools: DNS lookup, WHOIS/RDAP, SSL certificates, subdomain discovery, IP geolocation, tech stack detection

    - Social & Branding: Social handle checker, brand name scoring

    - Phone Intelligence: Privacy-first phone number validation, normalization, and classification

    - Pricing: Scheduled standard-TLD tables from verified official registrar sources, plus separate credential-backed exact-domain quotes

    - Watchlist: Domain monitoring for expiration and availability alerts


    **Authentication:**

    Most API endpoints require authentication. Pass your API key via the x-api-key header or Authorization: Bearer header. Operations marked with an empty security requirement are intentionally public, including API specifications and selected catalog endpoints. Get your free API key at https://domscan.net/dashboard. Logged-in users on domscan.net tools pages are authenticated automatically via session cookie. **Rate Limits:**

    Free accounts can sustain 120 requests per minute per account, with a burst capacity of 60. All API keys and dashboard sessions belonging to the same free account share this budget. Bulk endpoints have an additional free-tier budget of 20 HTTP requests per minute per account across all bulk endpoints. Free-tier bulk traffic is also capped at 100 requests per minute per IPv4 address or IPv6 /56 network. Platform-wide edge protections still apply to every tier. Paid accounts can sustain 600 requests per minute, with a burst capacity of 120, shared by every API key and dashboard session of the account. Paid accounts do not receive the additional free-tier bulk budget. Scope: RapidAPI subscribers are counted per subscriber. (scope=rapidapi-customer) Zyla subscribers are counted per subscriber when the gateway identifies them, (scope=zyla-customer) and as one shared gateway budget when it does not. (scope=zyla-gateway) Other authenticated requests are counted per account: every API key and dashboard session of the account shares one budget. (scope=account) A key that is not linked to an account is counted on its own. (scope=api-key) Unauthenticated requests to public endpoints are counted per client IP address (scope unknown when the address cannot be determined, as one shared budget). (scope=ip)


    Every authenticated response, success or error, includes X-RateLimit-Plan, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, and X-RateLimit-Policy. X-RateLimit-Limit and X-RateLimit-Remaining describe the immediate burst bucket; X-RateLimit-Reset is the Unix time in seconds when that bucket is full again; X-RateLimit-Policy also states the sustained per-minute rate, scope, and any free bulk limits. Exceeding a limit returns HTTP 429 with Retry-After. Retry only after the indicated delay. **Credits System:**

    API calls consume credits based on endpoint complexity. Sign up for free to receive 10,000 credits monthly. - 1 credit: Status checks, DNS lookups, tool builders

    - 2-5 credits: Health checks, valuations, OSINT tools

    - Bulk endpoints: standard per-item rate for batching multiple items into fewer HTTP requests. - 6-25 credits: Recipe compound operations


    When credits reach zero, the API returns HTTP 402 with credits_remaining, credits_required, and a purchase_url. API responses include X-Credits-Requested, X-Credits-Charged, and X-Credits-Refunded. X-Credits-Charged is the net charge after any refund made during the request. Authenticated responses also include X-Credits-Remaining whenever the balance is known without an extra lookup. Free credits refresh monthly on the account''s signup anniversary. POST /v1/estimate returns the credits a request would charge without running it, at no cost.'
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: Domain Health
  description: Comprehensive domain health analysis including DNS, SSL, and security
paths:
  /v1/health:
    get:
      tags:
      - Domain Health
      summary: Full domain health check
      description: 'Comprehensive health analysis: DNS configuration, SSL certificates, email authentication records, security headers, and more. Accepts a subdomain (e.g. blog.example.com) as well as a registrable domain. Host-based checks run against the exact hostname, while registration and age data reflect the parent domain. Deprecated SMTP port probing is no longer performed.'
      operationId: getDomainHealth
      parameters:
      - name: domain
        in: query
        required: true
        description: Domain or subdomain to analyze (e.g. example.com or blog.example.com)
        schema:
          type: string
          example: example.com
      - name: details
        in: query
        description: Include detailed breakdown
        schema:
          type: boolean
          default: true
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Health check results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                domain: cloudflare.com
                health_score: 94
                grade: A
                checks:
                  dns_configured: true
                  ssl_valid: true
                  email_deliverable: true
                  blacklist_status: clean
                  age_years: 15
                  registration_stable: true
                  dnssec_enabled: true
                enriched:
                  tls:
                    grade: A+
                    protocol: TLSv1.3
                    cipher: TLS_AES_256_GCM_SHA384
                    chain_valid: true
                    days_to_expiry: 72
                    hostname_match: true
                    ocsp_stapling: true
                    grade_reasons:
                    - TLS 1.3 enabled
                    - Valid certificate chain
                  http_versions:
                    http1_1: true
                    http2: true
                    http3: true
                    alt_svc: h3=":443"; ma=86400
                    http3_advertised: true
                    alt_svc_protocols:
                    - h3
                    curl_http3_supported: true
                    h2_alpn_accepted: h2
                    h3_alpn_accepted: h3
                  hsts:
                    reachable: true
                    final_url: https://cloudflare.com/
                    status_code: 200
                    header_present: true
                    hsts_header: max-age=31536000; includeSubDomains
                    max_age: 31536000
                    include_subdomains: true
                    preload_directive: false
                    preload_eligible: true
                    preload_status: preloaded
                    preloaded_domain: cloudflare.com
                    preload_bulk: false
                    issues:
                    - missing preload directive
                    errors: []
                warnings: []
                recommendations:
                - Publish the HSTS preload directive if you want preload-list eligibility.
                checked_at: '2026-04-18T21:00:00Z'
                details:
                  dns:
                    has_a_record: true
                    has_aaaa_record: true
                    has_nameservers: true
                    has_mx_record: true
                    nameservers:
                    - ns3.cloudflare.com
                    - ns5.cloudflare.com
                    mx_records:
                    - route1.mx.cloudflare.net
                    a_records:
                    - 104.16.132.229
                    - 104.16.133.229
                    aaaa_records:
                    - 2606:4700::6810:84e5
                    - 2606:4700::6810:85e5
                  ssl:
                    https_works: true
                    certificate_valid: true
                    days_until_expiry: 72
                    issuer: Google Trust Services
                  email:
                    has_mx: true
                    has_spf: true
                    has_dmarc: true
                    has_dkim_selector: true
                    spf_record: v=spf1 include:_spf.google.com ~all
                    dmarc_policy: reject
                    mx_hosts:
                    - route1.mx.cloudflare.net
                  security:
                    dnssec_enabled: true
                    has_caa_record: true
                    caa_issuers:
                    - digicert.com
                    - letsencrypt.org
                    http_to_https_redirect: true
                    has_security_txt: true
                    security_txt_fields:
                    - Contact
                    - Expires
                    - Preferred-Languages
                    security_headers:
                      has_hsts: true
                      hsts_max_age: 31536000
                      has_csp: true
                      has_x_frame_options: true
                      has_x_content_type_options: true
                      has_referrer_policy: true
                      has_permissions_policy: true
                      score: 92
                  age:
                    registration_date: '2010-07-06T00:00:00Z'
                    expiration_date: '2030-07-06T00:00:00Z'
                    last_updated: '2025-07-06T00:00:00Z'
                    age_days: 5766
                    age_years: 15
                    days_until_expiry: 1540
                    registrar: Cloudflare Registrar
                  blacklist:
                    clean: true
                    status: clean
                    listed_on: []
                    checked_lists:
                    - spamhaus
                    - surbl
                    domain_listed_on: []
                    ip_listed_on: []
                    check_type: mixed
                health_checks:
                - category: dns
                  name: Authoritative DNS records present
                  passed: true
                  score: 100
                  weight: 15
                meta:
                  check_duration_ms: 248
                  served_by: pop=MAD country=ES
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 3
  /v1/health/quick:
    get:
      tags:
      - Domain Health
      summary: Quick health check
      description: Fast health check focusing on DNS resolution and SSL certificate status. Accepts a subdomain (e.g. blog.example.com) as well as a registrable domain.
      operationId: getQuickHealth
      parameters:
      - name: domain
        in: query
        required: true
        description: Domain or subdomain to check (e.g. example.com or blog.example.com)
        schema:
          type: string
          example: example.com
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Quick health results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickHealthResponse'
              example:
                domain: example.com
                dns_ok: true
                https_ok: true
                checked_at: '2026-04-18T21:00:00Z'
                meta:
                  check_duration_ms: 89
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/health/bulk:
    post:
      tags:
      - Domain Health
      summary: Bulk health check
      description: 'Check health of multiple domains at once. Use quick=true for faster results with basic DNS/SSL checks only.


        **Credits:** 3 credits per domain. Example: 10 domains = 30 credits.'
      operationId: bulkHealthCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domains
              properties:
                domains:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 10
                  description: Array of domains or subdomains to check (max 10)
                  example:
                  - example.com
                  - google.com
                quick:
                  type: boolean
                  default: false
                  description: Use quick check mode (DNS + SSL only)
            example:
              domains:
              - example.com
              - example.org
              quick: true
      responses:
        '200':
          description: Bulk health results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkHealthResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/DryRun'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-credits:
        model: per_item
        default: 3
components:
  responses:
    InternalError:
      description: Unexpected service error.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL
              message: An unexpected error occurred. Please try again.
              type: api_error
              status: 500
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/error-codes
    BadRequest:
      description: Bad request - invalid parameters
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: Invalid domain format
              suggestion: Domain must be a valid format like example.com
              type: validation_error
              status: 400
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
    IdempotencyInProgress:
      description: A request with the same Idempotency-Key is still running. Retry after Retry-After seconds to receive its stored response. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: IDEMPOTENCY_IN_PROGRESS
              message: A request with this Idempotency-Key is still being processed. Retry shortly to receive its result.
              type: conflict_error
              status: 409
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
              retry_after: 1
    PaymentRequired:
      description: Insufficient credits for this request. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          schema:
            type: integer
          description: Credits remaining on the account
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INSUFFICIENT_CREDITS
              message: Insufficient credits. This endpoint costs 2 credits but you have 0. Purchase more at https://domscan.net/billing or wait for your monthly reset.
              credits_remaining: 0
              credits_required: 2
              purchase_url: https://domscan.net/billing
              type: credits_error
              status: 402
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/credits-pricing
    RateLimited:
      description: Rate limit exceeded. Free accounts can sustain 120 requests per minute per account with a burst capacity of 60. Free bulk traffic is additionally limited to 20 requests per minute per account across all bulk endpoints and 100 per minute per IPv4 address or IPv6 /56 network. Paid accounts can sustain 600 requests per minute with a burst capacity of 120.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          schema:
            type: integer
          description: The immediate burst capacity, or the active bulk fixed-window limit when a bulk-specific limit is exceeded.
        X-RateLimit-Remaining:
          schema:
            type: integer
            example: 0
          description: Immediate burst tokens remaining, or requests remaining in the active bulk fixed window.
        X-RateLimit-Reset:
          schema:
            type: integer
            example: 1791590400
          description: Unix time in seconds when the limit that was exceeded allows a new request again.
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
        X-RateLimit-Plan:
          schema:
            type: string
            enum:
            - free
            - paid
          description: The account plan whose policy was applied.
        X-RateLimit-Policy:
          schema:
            type: string
          description: Machine-readable summary of the active tier and limit policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded. Please wait before making more requests.
              type: rate_limit_error
              status: 429
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/rate-limits
              retry_after: 12
    IdempotencyKeyReused:
      description: The Idempotency-Key was already used by this API key for a different request (method, path, query or body) in the last 24 hours. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: IDEMPOTENCY_KEY_REUSED
              message: This Idempotency-Key was already used with a different request. Use a new key for a new request.
              type: validation_error
              status: 422
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
    Unauthorized:
      description: 'Authentication required. All API endpoints require a valid API key (x-api-key header or Authorization: Bearer) or an active session cookie.'
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_REQUIRED
              message: 'Authentication required. Provide an API key via x-api-key header or Authorization: Bearer header.'
              docs: https://domscan.net/docs/authentication
              get_key: https://domscan.net/login
              type: authentication_error
              status: 401
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/authentication
  schemas:
    QuickHealthResponse:
      type: object
      description: Quick health check (DNS + SSL only)
      properties:
        domain:
          type: string
        dns_ok:
          type:
          - boolean
          - 'null'
          description: Whether DNS resolves correctly; null when resolver checks were unavailable.
        https_ok:
          type:
          - boolean
          - 'null'
          description: Whether HTTPS responds successfully; null when its DNS prerequisite is unknown.
        dns_complete:
          type: boolean
          description: Whether every DNS query needed by the quick check completed.
        checked_at:
          type: string
          format: date-time
        confidence:
          $ref: '#/components/schemas/QuickHealthConfidence'
        meta:
          type: object
          properties:
            check_duration_ms:
              type: integer
    QuickHealthConfidence:
      type: object
      description: Additive quick-health confidence object for DNS and HTTPS checks.
      properties:
        checks_run:
          type: array
          items:
            type: string
            enum:
            - dns
            - https
        passed_count:
          type: integer
        failed_count:
          type: integer
        unknown_count:
          type: integer
        confidence:
          type: string
          enum:
          - high
          - medium
          - low
        dns_ok:
          type:
          - boolean
          - 'null'
        https_ok:
          type:
          - boolean
          - 'null'
    HealthResponse:
      type: object
      description: Comprehensive domain health check response
      properties:
        domain:
          type: string
          description: Domain checked
        health_score:
          type: integer
          minimum: 0
          maximum: 100
          description: Overall health score
        grade:
          type: string
          enum:
          - A
          - B
          - C
          - D
          - F
          description: Health grade
        checks:
          type: object
          description: Individual check results
          properties:
            dns_configured:
              type: boolean
            ssl_valid:
              type: boolean
            email_deliverable:
              type: boolean
            blacklist_status:
              type: string
              enum:
              - clean
              - listed
              - unknown
            age_years:
              type:
              - integer
              - 'null'
            registration_stable:
              type: boolean
            dnssec_enabled:
              type: boolean
        enriched:
          type: object
          description: 'HLTH-003/006/008/009: additive supplemental probes. Only present when optional enrichment is configured and at least one probe returned data.'
          properties:
            tls:
              type: object
              description: Full TLS handshake introspection (HLTH-003 / REP-002).
              properties:
                grade:
                  type: string
                  enum:
                  - A+
                  - A
                  - B
                  - C
                  - F
                protocol:
                  type:
                  - string
                  - 'null'
                cipher:
                  type:
                  - string
                  - 'null'
                chain_valid:
                  type: boolean
