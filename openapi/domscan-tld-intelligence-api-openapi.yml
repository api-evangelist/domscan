openapi: 3.2.0
info:
  title: DomScan TLD Intelligence API
  description: 'DomScan is a domain intelligence API providing domain analysis tools. **Core Features:**

    - Domain Availability: Check single or bulk domains using RDAP with 1,100+ TLDs supported

    - Domain Intelligence: AI suggestions, valuations, health checks, typosquatting detection

    - OSINT Tools: DNS lookup, WHOIS/RDAP, SSL certificates, subdomain discovery, IP geolocation, tech stack detection

    - Social & Branding: Social handle checker, brand name scoring

    - Phone Intelligence: Privacy-first phone number validation, normalization, and classification

    - Pricing: Scheduled standard-TLD tables from verified official registrar sources, plus separate credential-backed exact-domain quotes

    - Watchlist: Domain monitoring for expiration and availability alerts


    **Authentication:**

    Most API endpoints require authentication. Pass your API key via the x-api-key header or Authorization: Bearer header. Operations marked with an empty security requirement are intentionally public, including API specifications and selected catalog endpoints. Get your free API key at https://domscan.net/dashboard. Logged-in users on domscan.net tools pages are authenticated automatically via session cookie. **Rate Limits:**

    Free accounts can sustain 120 requests per minute per account, with a burst capacity of 60. All API keys and dashboard sessions belonging to the same free account share this budget. Bulk endpoints have an additional free-tier budget of 20 HTTP requests per minute per account across all bulk endpoints. Free-tier bulk traffic is also capped at 100 requests per minute per IPv4 address or IPv6 /56 network. Platform-wide edge protections still apply to every tier. Paid accounts can sustain 600 requests per minute, with a burst capacity of 120, shared by every API key and dashboard session of the account. Paid accounts do not receive the additional free-tier bulk budget. Scope: RapidAPI subscribers are counted per subscriber. (scope=rapidapi-customer) Zyla subscribers are counted per subscriber when the gateway identifies them, (scope=zyla-customer) and as one shared gateway budget when it does not. (scope=zyla-gateway) Other authenticated requests are counted per account: every API key and dashboard session of the account shares one budget. (scope=account) A key that is not linked to an account is counted on its own. (scope=api-key) Unauthenticated requests to public endpoints are counted per client IP address (scope unknown when the address cannot be determined, as one shared budget). (scope=ip)


    Every authenticated response, success or error, includes X-RateLimit-Plan, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, and X-RateLimit-Policy. X-RateLimit-Limit and X-RateLimit-Remaining describe the immediate burst bucket; X-RateLimit-Reset is the Unix time in seconds when that bucket is full again; X-RateLimit-Policy also states the sustained per-minute rate, scope, and any free bulk limits. Exceeding a limit returns HTTP 429 with Retry-After. Retry only after the indicated delay. **Credits System:**

    API calls consume credits based on endpoint complexity. Sign up for free to receive 10,000 credits monthly. - 1 credit: Status checks, DNS lookups, tool builders

    - 2-5 credits: Health checks, valuations, OSINT tools

    - Bulk endpoints: standard per-item rate for batching multiple items into fewer HTTP requests. - 6-25 credits: Recipe compound operations


    When credits reach zero, the API returns HTTP 402 with credits_remaining, credits_required, and a purchase_url. API responses include X-Credits-Requested, X-Credits-Charged, and X-Credits-Refunded. X-Credits-Charged is the net charge after any refund made during the request. Authenticated responses also include X-Credits-Remaining whenever the balance is known without an extra lookup. Free credits refresh monthly on the account''s signup anniversary. POST /v1/estimate returns the credits a request would charge without running it, at no cost.'
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: TLD Intelligence
  description: TLD information, comparison, and coverage data
paths:
  /v1/tlds:
    get:
      tags:
      - TLD Intelligence
      summary: List TLDs
      description: List TLD metadata catalog entries and their RDAP mapping status. Catalog membership does not establish lookup support, and absence of an RDAP mapping does not rule out traditional WHOIS lookup.
      operationId: getTlds
      security: []
      parameters:
      - name: type
        in: query
        description: Filter by TLD type
        schema:
          type: string
          enum:
          - gtld
          - cctld
          - new-gtld
          - idn
      - name: trust_tier
        in: query
        description: Filter by trust tier.
        schema:
          type: string
          enum:
          - premium
          - standard
          - economy
          - suspicious
      - name: use_case
        in: query
        description: Return TLDs tagged for a use case such as startup, tech, or business.
        schema:
          type: string
          example: startup
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: TLD metadata catalog entries with RDAP mapping status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TldsListResponse'
          headers:
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 0
  /v1/tlds/{tld}:
    get:
      tags:
      - TLD Intelligence
      summary: Get TLD details
      description: Get metadata for a cataloged TLD. RDAP mapping status does not establish or rule out lookup support through traditional WHOIS.
      operationId: getTldDetail
      parameters:
      - name: tld
        description: TLD to describe, with or without the leading dot.
        in: path
        required: true
        schema:
          type: string
          example: io
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: TLD details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TldDetailResponse'
              example:
                tld: com
                type: gTLD
                name: Commercial
                description: The most popular and trusted domain extension worldwide
                introduced: 1985
                operator: Verisign
                restrictions: None - open registration
                rdap_supported: true
                rdap_endpoint: https://rdap.verisign.com/com/v1/
                idn_supported: true
                dnssec_supported: true
                pricing:
                  registration_usd: 12
                  renewal_usd: 12
                  transfer_usd: 12
                  currency: USD
                  source: market_average
                popularity:
                  rank: 1
                  tier: top10
                  use_cases:
                  - business
                  - personal
                  - startup
                  - enterprise
                  - tech
                  - e-commerce
                  - blog
                  - portfolio
                trust:
                  score: 100
                  tier: premium
                  notes: Most trusted TLD globally
                meta:
                  served_by: pop=MAD country=ES
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          description: No metadata catalog entry exists for this TLD. This does not establish that domain lookup is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/compare:
    get:
      tags:
      - TLD Intelligence
      summary: Compare domains
      description: Compare multiple domains side-by-side across availability, valuation, brand score, and TLD quality. Use the `domains` parameter with a comma-separated list. The route also accepts `domain1` and `domain2` as a convenience alias.
      operationId: compareDomains
      parameters:
      - name: domains
        in: query
        required: true
        description: Comma-separated list of 2 to 10 domains to compare
        schema:
          type: string
          example: startup.com,startup.io,startup.ai
      - $ref: '#/components/parameters/DryRun'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Comparison results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompareDomainsResponse'
              example:
                domains:
                - domain: startup.io
                  tld: io
                  available: true
                  valuation:
                    estimate_usd: 2500
                    confidence: 0.7
                    estimate:
                      low: 1400
                      mid: 2500
                      high: 4100
                      currency: USD
                    analysis:
                      scope: intrinsic_domain_value
                      range_source: anchored
                      range_width: moderate
                      confidence_label: medium
                      out_of_distribution: false
                      out_of_distribution_reasons: []
                      positive_factors:
                      - Strong .IO aftermarket demand
                      negative_factors:
                      - Narrower buyer pool than .com
                  score:
                    overall: 85
                    brandability: 90
                  tld_info:
                    type: ccTLD
                    trust_tier: premium
                    popularity_rank: 4
                  recommendation_rank: 85
                  recommendation_reason: available for registration, premium .io TLD, excellent brand score
                recommendation:
                  best_available: startup.io
                  best_overall: startup.com
                  best_value: startup.ai
                  reasoning: 'startup.io is recommended: available for registration, premium .io TLD, excellent brand score'
                decision_summary:
                  compared_count: 3
                  best_overall: startup.com
                  best_available: startup.io
                  runner_up: startup.io
                  rank_margin: 4
                  score_margin: 2
                  value_margin_usd: 1500
                  availability_used: true
                  winning_factor: valuation
                  tie_breaker: higher_valuation
                meta:
                  compared_count: 3
                  available_count: 2
                  total_ms: 84
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 3
  /v1/coverage:
    get:
      tags:
      - TLD Intelligence
      summary: Get RDAP bootstrap coverage
      description: List TLDs in the effective RDAP bootstrap map and representative RDAP endpoints. This is not a complete list of TLDs that can be checked; some lookups use traditional WHOIS fallback. Without `live=1`, RDAP health is explicitly unmeasured and health values are null. With `live=1`, DomScan sends one bounded probe to each of up to 10 representative RDAP hosts; latency and error fraction describe that single probe, not historical performance.
      operationId: getCoverage
      parameters:
      - name: live
        in: query
        description: Set to 1 to send one bounded live probe to each of up to 10 representative RDAP hosts. Each result describes only that single observation; without it, RDAP health fields are unmeasured.
        schema:
          type: string
          enum:
          - '1'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      security: []
      responses:
        '200':
          description: RDAP bootstrap coverage information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoverageResponse'
          headers:
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 0
components:
  headers:
    XRateLimitLimit:
      description: Burst capacity of the rate limit that applies to this API key.
      schema:
        type: integer
        minimum: 0
    XRateLimitReset:
      description: Unix time in seconds when the burst capacity is fully refilled.
      schema:
        type: integer
        minimum: 0
    XRateLimitRemaining:
      description: Requests that can still be sent immediately before the rate limit applies.
      schema:
        type: integer
        minimum: 0
    XCreditsRemaining:
      description: Credits remaining on the account after this request. Omitted when the balance is not already known without an extra lookup.
      schema:
        type: integer
        minimum: 0
    XCreditsCharged:
      description: Credits charged by this request, net of any refund made in the same request. Sent on authenticated /v1 responses, including errors (0 when nothing was charged).
      schema:
        type: integer
        minimum: 0
    XFieldsIgnored:
      description: 'Sent when `fields` was used and some paths matched nothing in this response: those paths, comma-separated, at most 20.'
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request - invalid parameters
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: Invalid domain format
              suggestion: Domain must be a valid format like example.com
              type: validation_error
              status: 400
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
    PaymentRequired:
      description: Insufficient credits for this request. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          schema:
            type: integer
          description: Credits remaining on the account
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INSUFFICIENT_CREDITS
              message: Insufficient credits. This endpoint costs 2 credits but you have 0. Purchase more at https://domscan.net/billing or wait for your monthly reset.
              credits_remaining: 0
              credits_required: 2
              purchase_url: https://domscan.net/billing
              type: credits_error
              status: 402
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/credits-pricing
    RateLimited:
      description: Rate limit exceeded. Free accounts can sustain 120 requests per minute per account with a burst capacity of 60. Free bulk traffic is additionally limited to 20 requests per minute per account across all bulk endpoints and 100 per minute per IPv4 address or IPv6 /56 network. Paid accounts can sustain 600 requests per minute with a burst capacity of 120.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          schema:
            type: integer
          description: The immediate burst capacity, or the active bulk fixed-window limit when a bulk-specific limit is exceeded.
        X-RateLimit-Remaining:
          schema:
            type: integer
            example: 0
          description: Immediate burst tokens remaining, or requests remaining in the active bulk fixed window.
        X-RateLimit-Reset:
          schema:
            type: integer
            example: 1791590400
          description: Unix time in seconds when the limit that was exceeded allows a new request again.
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
        X-RateLimit-Plan:
          schema:
            type: string
            enum:
            - free
            - paid
          description: The account plan whose policy was applied.
        X-RateLimit-Policy:
          schema:
            type: string
          description: Machine-readable summary of the active tier and limit policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded. Please wait before making more requests.
              type: rate_limit_error
              status: 429
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/rate-limits
              retry_after: 12
    Unauthorized:
      description: 'Authentication required. All API endpoints require a valid API key (x-api-key header or Authorization: Bearer) or an active session cookie.'
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_REQUIRED
              message: 'Authentication required. Provide an API key via x-api-key header or Authorization: Bearer header.'
              docs: https://domscan.net/docs/authentication
              get_key: https://domscan.net/login
              type: authentication_error
              status: 401
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/authentication
  parameters:
    DryRun:
      name: dry_run
      in: query
      required: false
      description: 'Set to `true` to return the credit estimate for this exact request instead of running it. Nothing is executed, no source is called and 0 credits are charged. The response has the same shape as POST /v1/estimate plus `dry_run: true`.'
      schema:
        type: string
        enum:
        - 'true'
      example: 'true'
    Fields:
      name: fields
      in: query
      required: false
      x-domscan-global-parameter: true
      description: Comma-separated dot paths to keep in a successful JSON response, e.g. `domain,classification.status` (arrays apply the path to each item; max 50 paths, 6 levels). Unmatched paths are listed in X-Fields-Ignored. Cost is unchanged.
      schema:
        type: string
      example: domain,classification.status
    Naming:
      name: naming
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`snake` returns every camelCase key of a successful JSON response in snake_case (for example `registrarName` becomes `registrar_name`); values are never changed. The `DomScan-Naming: snake` request header does the same; when both are sent this parameter wins, and `default` keeps the original names. Runs before `compact` and `fields`, so `fields` paths use snake_case. Error bodies are already snake_case. Cost is unchanged.'
      schema:
        type: string
        enum:
        - snake
        - default
      example: snake
    Compact:
      name: compact
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`true` drops serving metadata (meta timings and served_by, empty warnings/caveats/notes/errors arrays, a request_id that repeats X-Request-Id) from a successful JSON response. Data fields are never removed.'
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
      example: 'true'
  schemas:
    TldDetailResponse:
      type: object
      description: Detailed metadata for a TLD catalog entry. RDAP mapping status does not establish or rule out lookup support through traditional WHOIS.
      properties:
        tld:
          type: string
        type:
          type: string
          enum:
          - gTLD
          - ccTLD
          - newTLD
          - idn
        name:
          type: string
        description:
          type: string
        introduced:
          type: integer
        operator:
          type:
          - string
          - 'null'
        country:
          type:
          - string
          - 'null'
        restrictions:
          type: string
        rdap_supported:
          type: boolean
          description: True when an RDAP mapping is listed. False does not rule out traditional WHOIS lookup.
        rdap_endpoint:
          type:
          - string
          - 'null'
        idn_supported:
          type: boolean
        dnssec_supported:
          type: boolean
        pricing:
          type: object
          properties:
            registration_usd:
              type: number
            renewal_usd:
              type: number
            transfer_usd:
              type: number
            currency:
              type: string
              enum:
              - USD
            source:
              type: string
              enum:
              - estimate
              - market_average
        popularity:
          type: object
          properties:
            rank:
              type: integer
            tier:
              type: string
              enum:
              - top10
              - top50
              - top100
              - other
            use_cases:
              type: array
              items:
                type: string
        trust:
          type: object
          properties:
            score:
              type: number
            tier:
              type: string
              enum:
              - premium
              - standard
              - economy
              - suspicious
            notes:
              type:
              - string
              - 'null'
        meta:
          type: object
          additionalProperties: true
    ValuationFactors:
      type: object
      description: Factors contributing to value
      properties:
        length:
          type: integer
        lengthMultiplier:
          type: number
        tld:
          type: string
          description: Effective public suffix used for valuation factors
        tldTier:
          type: string
          enum:
          - premium
          - standard
          - value
          - cctld
        tldBase:
          type: integer
        hasHyphens:
          type: boolean
        hasNumbers:
          type: boolean
        lettersOnly:
          type: boolean
        isPremiumWord:
          type: boolean
        isDictionaryWord:
          type: boolean
        isBrandable:
          type: boolean
        isNumericPattern:
          type: boolean
        isLetterPattern:
          type: boolean
        pronounceability:
          type: number
        memorability:
          type: number
        spellingDifficulty:
          type: number
        isAcronym:
          type: boolean
        hasCommonEnding:
          type: boolean
        syllableCount:
          type: integer
    TldsListResponse:
      type: object
      description: TLD metadata catalog entries and RDAP mapping status. Catalog membership does not establish lookup support, and absence of an RDAP mapping does not rule out traditional WHOIS lookup.
      properties:
        tlds:
          type: array
          items:
            type: object
            properties:
              tld:
                type: string
                description: Effective public suffix used for comparison
              type:
                type: string
                enum:
                - gTLD
                - ccTLD
                - newTLD
                - idn
              name:
                type: string
              rdap_supported:
                type: boolean
                description: True when an RDAP mapping is listed. False does not rule out traditional WHOIS lookup.
              trust_tier:
                type: string
                enum:
                - premium
                - standard
                - economy
                - suspicious
              popularity_rank:
                type: integer
              registration_usd:
                type: number
        total:
          type: integer
        by_type:
          type: object
          properties:
            gTLD:
              type: integer
            ccTLD:
              type: integer
            newTLD:
              type: integer
            idn:
              type: integer
        by_trust_tier:
          type: object
          properties:
            premium:
              type: integer
            standard:
              type: integer
            economy:
              type: integer
        use_case:
          type: string
        meta:
          type: object
          additionalProperties: true
    CompareDomainsResponse:
      type: object
      description: Domain comparison results
      properties:
        domains:
          type: array
          items:
            type: object
            properties:
              domain:
                type: string
              tld:
                type: string
              available:
                type:
                - boolean
                - 'null'
                description: null when availability could not be determined
              registered_at:
                type:
                - string
                - 'null'
              expires_at:
                type:
                - string
                - 'null'
              valuation:
                type: object
                properties:
                  estimate_usd:
                    type: number
                  confidence:
                    type: number
                  factors:
                    $ref: '#/components/schemas/ValuationFactors'
                  estimate:
                    type: object
                    properties:
                      low:
                        type: number
                      mid:
                        type: number
                      high:
                        type: number
                      currency:
                        type: string
                  analysis:
                    type: object
                    properties:
                      scope:
                        type: string
                      range_source:
                        type: string
                      range_width:
                        type: string
                      confidence_label:
                        type: string
