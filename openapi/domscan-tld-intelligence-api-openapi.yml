    CoverageResponse:
      type: object
      description: TLDs in the effective RDAP bootstrap map. This is not a complete list of TLDs that can be checked; some lookups use traditional WHOIS fallback.
      required:
      - gtlds
      - cctlds
      - total_tlds
      - all_tlds
      - rdap_health
      - bootstrap_source
      - bootstrap_last_updated
      - meta
      properties:
        gtlds:
          type: array
          items:
            type: string
          description: Generic TLDs with RDAP mappings
        cctlds:
          type: array
          items:
            type: string
          description: Country-code TLDs with RDAP mappings
        total_tlds:
          type: integer
          description: Total TLDs with RDAP mappings
        all_tlds:
          type: array
          items:
            type: string
          description: All TLDs in the effective RDAP bootstrap map
        rdap_health:
          type: array
          items:
            type: object
            required:
            - tld
            - endpoint
            - measurement_status
            - ok
            - p50_ms
            - error_rate
            properties:
              tld:
                type: string
              endpoint:
                type: string
                format: uri
              measurement_status:
                type: string
                enum:
                - single_probe
                - unmeasured
                description: single_probe means this response contains one live observation; unmeasured means live=1 was not requested.
              ok:
                type:
                - boolean
                - 'null'
                description: Whether the single live probe succeeded, or null when no probe was requested.
              p50_ms:
                type:
                - number
                - 'null'
                description: Duration in milliseconds of the single live probe (a one-sample p50), or null when unmeasured. This is not historical latency telemetry.
              error_rate:
                type:
                - number
                - 'null'
                minimum: 0
                maximum: 1
                example: 0
                description: Single-probe error fraction (0 for success, 1 for failure), or null when unmeasured. This is not a historical error rate.
        bootstrap_source:
          type: string
          enum:
          - iana
          - fallback
        bootstrap_last_updated:
          type: string
          format: date-time
        meta:
          type: object
          required:
          - served_by
          - bootstrap_ttl_s
          - live
          properties:
            served_by:
              type: string
            bootstrap_ttl_s:
              type: integer
            live:
              type: boolean
    ErrorResponse:
      type: object
      description: Canonical error format shared by every API error response. Endpoint-specific fields (for example credits_remaining, login_url or evidence_summary) may appear next to error or inside it; clients should ignore fields they do not recognise.
      additionalProperties: true
      properties:
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
              description: Stable, upper-case machine code. Codes are never renamed; the full catalog with HTTP status, type and retryability is published as x-domscan-error-codes.
              example: INVALID_DOMAIN
            type:
              type: string
              enum:
              - authentication_error
              - credits_error
              - permission_error
              - not_found_error
              - conflict_error
              - rate_limit_error
              - timeout_error
              - validation_error
              - upstream_error
              - api_error
              - request_error
              description: Stable error category used by official SDK subclasses
            message:
              type: string
              description: Human-readable error message
              example: Invalid domain format
            status:
              type: integer
              minimum: 400
              maximum: 599
              description: HTTP status repeated in the JSON error for queue and log processors
            retryable:
              type: boolean
              description: Whether retrying can be appropriate after applying retry guidance
            request_id:
              type: string
              description: Request identifier matching the X-Request-Id response header
            suggestion:
              type: string
              description: Suggestion for fixing the error
            details:
              type: object
              description: Optional structured context for the error
              additionalProperties: true
            retry_after:
              type: integer
              minimum: 0
              description: Seconds to wait before retrying when the error is temporary
              example: 300
            docs_url:
              type: string
              description: Absolute link to the documentation section for this error
              example: https://domscan.net/docs/check-availability
          required:
          - type
          - code
          - message
          - status
          - retryable
          - request_id
          - docs_url
