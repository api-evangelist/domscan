                        type: array
                        items:
                          type: string
                      negative_factors:
                        type: array
                        items:
                          type: string
              score:
                type: object
                properties:
                  overall:
                    type: number
                  length:
                    type: number
                  pronounceability:
                    type: number
                  memorability:
                    type: number
                  brandability:
                    type: number
              tld_info:
                type: object
                properties:
                  type:
                    type: string
                  trust_tier:
                    type: string
                  popularity_rank:
                    type:
                    - integer
                    - 'null'
              recommendation_rank:
                type:
                - integer
                - 'null'
              recommendation_reason:
                type:
                - string
                - 'null'
        recommendation:
          type: object
