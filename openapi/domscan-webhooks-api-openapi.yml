openapi: 3.2.0
info:
  title: DomScan Webhooks API
  description: 'DomScan is a domain intelligence API providing domain analysis tools. **Core Features:**

    - Domain Availability: Check single or bulk domains using RDAP with 1,100+ TLDs supported

    - Domain Intelligence: AI suggestions, valuations, health checks, typosquatting detection

    - OSINT Tools: DNS lookup, WHOIS/RDAP, SSL certificates, subdomain discovery, IP geolocation, tech stack detection

    - Social & Branding: Social handle checker, brand name scoring

    - Phone Intelligence: Privacy-first phone number validation, normalization, and classification

    - Pricing: Scheduled standard-TLD tables from verified official registrar sources, plus separate credential-backed exact-domain quotes

    - Watchlist: Domain monitoring for expiration and availability alerts


    **Authentication:**

    Most API endpoints require authentication. Pass your API key via the x-api-key header or Authorization: Bearer header. Operations marked with an empty security requirement are intentionally public, including API specifications and selected catalog endpoints. Get your free API key at https://domscan.net/dashboard. Logged-in users on domscan.net tools pages are authenticated automatically via session cookie. **Rate Limits:**

    Free accounts can sustain 120 requests per minute per account, with a burst capacity of 60. All API keys and dashboard sessions belonging to the same free account share this budget. Bulk endpoints have an additional free-tier budget of 20 HTTP requests per minute per account across all bulk endpoints. Free-tier bulk traffic is also capped at 100 requests per minute per IPv4 address or IPv6 /56 network. Platform-wide edge protections still apply to every tier. Paid accounts can sustain 600 requests per minute, with a burst capacity of 120, shared by every API key and dashboard session of the account. Paid accounts do not receive the additional free-tier bulk budget. Scope: RapidAPI subscribers are counted per subscriber. (scope=rapidapi-customer) Zyla subscribers are counted per subscriber when the gateway identifies them, (scope=zyla-customer) and as one shared gateway budget when it does not. (scope=zyla-gateway) Other authenticated requests are counted per account: every API key and dashboard session of the account shares one budget. (scope=account) A key that is not linked to an account is counted on its own. (scope=api-key) Unauthenticated requests to public endpoints are counted per client IP address (scope unknown when the address cannot be determined, as one shared budget). (scope=ip)


    Every authenticated response, success or error, includes X-RateLimit-Plan, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, and X-RateLimit-Policy. X-RateLimit-Limit and X-RateLimit-Remaining describe the immediate burst bucket; X-RateLimit-Reset is the Unix time in seconds when that bucket is full again; X-RateLimit-Policy also states the sustained per-minute rate, scope, and any free bulk limits. Exceeding a limit returns HTTP 429 with Retry-After. Retry only after the indicated delay. **Credits System:**

    API calls consume credits based on endpoint complexity. Sign up for free to receive 10,000 credits monthly. - 1 credit: Status checks, DNS lookups, tool builders

    - 2-5 credits: Health checks, valuations, OSINT tools

    - Bulk endpoints: standard per-item rate for batching multiple items into fewer HTTP requests. - 6-25 credits: Recipe compound operations


    When credits reach zero, the API returns HTTP 402 with credits_remaining, credits_required, and a purchase_url. API responses include X-Credits-Requested, X-Credits-Charged, and X-Credits-Refunded. X-Credits-Charged is the net charge after any refund made during the request. Authenticated responses also include X-Credits-Remaining whenever the balance is known without an extra lookup. Free credits refresh monthly on the account''s signup anniversary. POST /v1/estimate returns the credits a request would charge without running it, at no cost.'
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: Webhooks
  description: Signed monitoring alerts delivered to your HTTPS endpoints, billed per delivered alert
paths:
  /v1/webhooks:
    get:
      tags:
      - Webhooks
      summary: List alert webhook endpoints
      description: List the HTTPS endpoints that receive signed monitoring alerts, the subscribable event types, and the delivery policy. Works with an API key or a signed-in session.
      operationId: listAlertWebhooks
      responses:
        '200':
          description: Alert webhook endpoints and delivery policy
          content:
            application/json:
              schema:
                type: object
                required:
                - endpoints
                - available_events
                - policy
                properties:
                  endpoints:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertWebhookEndpoint'
                  available_events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertWebhookEventType'
                  all_events:
                    type: string
                    enum:
                    - '*'
                  test_event:
                    type: string
                    enum:
                    - webhook.test
                  policy:
                    $ref: '#/components/schemas/AlertWebhookPolicy'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      x-domscan-credits:
        model: per_request
        default: 0
    post:
      tags:
      - Webhooks
      summary: Create alert webhook endpoint
      description: Register an HTTPS endpoint for signed monitoring alerts. The URL must use HTTPS and resolve to a public address. The signing secret is returned only in this response. Each alert delivered with a 2xx response costs 2 credits; failed deliveries are refunded and test events are free.
      operationId: createAlertWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  format: uri
                  maxLength: 2048
                  description: Public HTTPS URL that receives POST requests.
                description:
                  type:
                  - string
                  - 'null'
                  maxLength: 200
                events:
                  type: array
                  description: Event types to receive. Omit or pass ["*"] to receive every event type, including types added later.
                  items:
                    oneOf:
                    - $ref: '#/components/schemas/AlertWebhookEventType'
                    - type: string
                      enum:
                      - '*'
            example:
              url: https://hooks.example.com/domscan
              description: Production alerts
              events:
              - domain.expiring_30
              - domain.available
              - domain.dns_changed
      responses:
        '201':
          description: Endpoint created. Store the secret now; it is not shown again.
          content:
            application/json:
              schema:
                type: object
                required:
                - endpoint
                - secret
                properties:
                  endpoint:
                    $ref: '#/components/schemas/AlertWebhookEndpoint'
                  secret:
                    type: string
                    pattern: ^whsec_[a-f0-9]{64}$
                    description: HMAC-SHA256 signing secret, returned only once.
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The account already has the maximum of 10 endpoints
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      x-domscan-credits:
        model: per_request
        default: 0
        note: Creating an endpoint is free. Each alert delivered with a 2xx response costs 2 credits. Failed deliveries are refunded and test events are free.
  /v1/webhooks/{webhook_id}:
    parameters:
    - name: webhook_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^whe_[a-f0-9]{32}$
    patch:
      tags:
      - Webhooks
      summary: Update alert webhook endpoint
      description: 'Enable or disable an endpoint, change its subscribed events, or edit its description. Send `{"enabled": true}` to re-enable an endpoint that was paused after repeated failures: its consecutive failure count is reset to 0 and new alerts are delivered again.'
      operationId: updateAlertWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                enabled:
                  type: boolean
                description:
                  type:
                  - string
                  - 'null'
                  maxLength: 200
                events:
                  type: array
                  items:
                    oneOf:
                    - $ref: '#/components/schemas/AlertWebhookEventType'
                    - type: string
                      enum:
                      - '*'
            example:
              enabled: true
              events:
              - '*'
      responses:
        '200':
          description: Updated endpoint
          content:
            application/json:
              schema:
                type: object
                required:
                - endpoint
                properties:
                  endpoint:
                    $ref: '#/components/schemas/AlertWebhookEndpoint'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 0
    delete:
      tags:
      - Webhooks
      summary: Delete alert webhook endpoint
      description: Delete an endpoint. Pending deliveries are cancelled and any credits reserved for them are refunded.
      operationId: deleteAlertWebhook
      responses:
        '200':
          description: Endpoint deleted
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - deleted
                properties:
                  id:
                    type: string
                  deleted:
                    type: boolean
                    enum:
                    - true
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 0
  /v1/webhooks/{webhook_id}/test:
    parameters:
    - name: webhook_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^whe_[a-f0-9]{32}$
    post:
      tags:
      - Webhooks
      summary: Send test webhook event
      description: Send one signed webhook.test event to an active endpoint and return the delivery result. Test events are free, are not retried, and never count toward automatic disabling.
      operationId: testAlertWebhook
      responses:
        '200':
          description: Test delivery result
          content:
            application/json:
              schema:
                type: object
                required:
                - delivery
                - delivered
                properties:
                  delivery:
                    $ref: '#/components/schemas/AlertWebhookDelivery'
                  delivered:
                    type: boolean
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The endpoint is disabled
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      x-domscan-credits:
        model: per_request
        default: 0
  /v1/webhooks/{webhook_id}/rotate-secret:
    parameters:
    - name: webhook_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^whe_[a-f0-9]{32}$
    post:
      tags:
      - Webhooks
      summary: Rotate webhook signing secret
      description: 'Replace the signing secret of an active or paused endpoint. Free. The new secret is returned only in this response and stored encrypted. For the next 24 hours every delivery carries two signatures, new secret first: `X-DomScan-Signature: sha256=,sha256=`. Accept a request when any entry matches a secret you trust. Rotating again during the grace period retires the older previous secret immediately.'
      operationId: rotateAlertWebhookSecret
      responses:
        '200':
          description: Secret rotated. Store the new secret now; it is not shown again.
          content:
            application/json:
              schema:
                type: object
                required:
                - endpoint
                - secret
                - previous_secret_expires_at
                - grace_period_seconds
                properties:
                  endpoint:
                    $ref: '#/components/schemas/AlertWebhookEndpoint'
                  secret:
                    type: string
                    pattern: ^whsec_[a-f0-9]{64}$
                    description: New HMAC-SHA256 signing secret, returned only once.
                  previous_secret_expires_at:
                    type: string
                    format: date-time
                    description: Until this time deliveries are also signed with the previous secret.
                  grace_period_seconds:
                    type: integer
                    enum:
                    - 86400
              example:
                endpoint:
                  id: whe_3f1c0a9b8e7d6c5b4a39281706f5e4d3
                  url: https://hooks.example.com/domscan
                  events:
                  - '*'
                  status: active
                  secret_hint: 4b7a
                  previous_secret_expires_at: '2026-10-11T12:00:00.000Z'
                  secret_rotated_at: '2026-10-10T12:00:00.000Z'
                  created_at: '2026-10-01T09:30:00.000Z'
                secret: whsec_...
                previous_secret_expires_at: '2026-10-11T12:00:00.000Z'
                grace_period_seconds: 86400
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      x-domscan-credits:
        model: per_request
        default: 0
        note: Rotating a signing secret is free.
  /v1/webhooks/{webhook_id}/deliveries:
    parameters:
    - name: webhook_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^whe_[a-f0-9]{32}$
    get:
      tags:
      - Webhooks
      summary: List webhook deliveries
      description: List recent deliveries for an endpoint, newest first. Delivery records are kept for 30 days.
      operationId: listAlertWebhookDeliveries
      parameters:
      - name: limit
        description: Deliveries to return.
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Recent deliveries
          content:
            application/json:
              schema:
                type: object
                required:
                - endpoint_id
                - deliveries
                properties:
                  endpoint_id:
                    type: string
                  deliveries:
                    type: array
                    items:
                      $ref: '#/components/schemas/AlertWebhookDelivery'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 0
components:
  headers:
    XCreditsCharged:
      description: Credits charged by this request, net of any refund made in the same request. Sent on authenticated /v1 responses, including errors (0 when nothing was charged).
      schema:
        type: integer
        minimum: 0
    XFieldsIgnored:
      description: 'Sent when `fields` was used and some paths matched nothing in this response: those paths, comma-separated, at most 20.'
      schema:
        type: string
    XRateLimitLimit:
      description: Burst capacity of the rate limit that applies to this API key.
      schema:
        type: integer
        minimum: 0
    XRateLimitRemaining:
      description: Requests that can still be sent immediately before the rate limit applies.
      schema:
        type: integer
        minimum: 0
    XRateLimitReset:
      description: Unix time in seconds when the burst capacity is fully refilled.
      schema:
        type: integer
        minimum: 0
    XCreditsRemaining:
      description: Credits remaining on the account after this request. Omitted when the balance is not already known without an extra lookup.
      schema:
        type: integer
        minimum: 0
  parameters:
    Naming:
      name: naming
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`snake` returns every camelCase key of a successful JSON response in snake_case (for example `registrarName` becomes `registrar_name`); values are never changed. The `DomScan-Naming: snake` request header does the same; when both are sent this parameter wins, and `default` keeps the original names. Runs before `compact` and `fields`, so `fields` paths use snake_case. Error bodies are already snake_case. Cost is unchanged.'
      schema:
        type: string
        enum:
        - snake
        - default
      example: snake
    Fields:
      name: fields
      in: query
      required: false
      x-domscan-global-parameter: true
      description: Comma-separated dot paths to keep in a successful JSON response, e.g. `domain,classification.status` (arrays apply the path to each item; max 50 paths, 6 levels). Unmatched paths are listed in X-Fields-Ignored. Cost is unchanged.
      schema:
        type: string
      example: domain,classification.status
    Compact:
      name: compact
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`true` drops serving metadata (meta timings and served_by, empty warnings/caveats/notes/errors arrays, a request_id that repeats X-Request-Id) from a successful JSON response. Data fields are never removed.'
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
      example: 'true'
  responses:
    Unauthorized:
      description: 'Authentication required. All API endpoints require a valid API key (x-api-key header or Authorization: Bearer) or an active session cookie.'
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_REQUIRED
              message: 'Authentication required. Provide an API key via x-api-key header or Authorization: Bearer header.'
              docs: https://domscan.net/docs/authentication
              get_key: https://domscan.net/login
              type: authentication_error
              status: 401
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/authentication
    RateLimited:
      description: Rate limit exceeded. Free accounts can sustain 120 requests per minute per account with a burst capacity of 60. Free bulk traffic is additionally limited to 20 requests per minute per account across all bulk endpoints and 100 per minute per IPv4 address or IPv6 /56 network. Paid accounts can sustain 600 requests per minute with a burst capacity of 120.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          schema:
            type: integer
          description: The immediate burst capacity, or the active bulk fixed-window limit when a bulk-specific limit is exceeded.
        X-RateLimit-Remaining:
          schema:
            type: integer
            example: 0
          description: Immediate burst tokens remaining, or requests remaining in the active bulk fixed window.
        X-RateLimit-Reset:
          schema:
            type: integer
            example: 1791590400
          description: Unix time in seconds when the limit that was exceeded allows a new request again.
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
        X-RateLimit-Plan:
          schema:
            type: string
            enum:
            - free
            - paid
          description: The account plan whose policy was applied.
        X-RateLimit-Policy:
          schema:
            type: string
          description: Machine-readable summary of the active tier and limit policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded. Please wait before making more requests.
              type: rate_limit_error
              status: 429
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/rate-limits
              retry_after: 12
    NotFound:
      description: The requested resource was not found.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: The requested resource was not found.
              type: not_found_error
              status: 404
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/error-codes
    BadRequest:
      description: Bad request - invalid parameters
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: Invalid domain format
              suggestion: Domain must be a valid format like example.com
              type: validation_error
              status: 400
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
  schemas:
    AlertWebhookEndpoint:
      type: object
      required:
      - id
      - url
      - events
      - status
      - secret_hint
      - created_at
      properties:
        id:
          type: string
          pattern: ^whe_[a-f0-9]{32}$
        url:
          type: string
          format: uri
        description:
          type:
          - string
          - 'null'
        events:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - active
          - disabled
        disabled_reason:
          type:
          - string
          - 'null'
          enum:
          - customer
          - consecutive_failures
          - null
        consecutive_failures:
          type: integer
          minimum: 0
        secret_hint:
          type: string
          description: Last four characters of the secret.
        previous_secret_expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Set during the 24 hour grace period after a secret rotation, while deliveries are also signed with the previous secret.
        secret_rotated_at:
          type:
          - string
          - 'null'
          format: date-time
        last_success_at:
          type:
          - string
          - 'null'
          format: date-time
        last_failure_at:
          type:
          - string
          - 'null'
          format: date-time
        last_error:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        disabled_at:
          type:
          - string
          - 'null'
          format: date-time
    AlertWebhookPolicy:
      type: object
      required:
      - credits_per_delivered_alert
      - test_event_credits
      - failed_deliveries_charged
      - max_endpoints
      - max_attempts
      - disable_after_consecutive_failures
      - signature_tolerance_seconds
      properties:
        secret_rotation_grace_seconds:
          type: integer
          enum:
          - 86400
          description: How long the previous secret keeps signing deliveries after a rotation.
        secret_rotation_credits:
          type: integer
          enum:
          - 0
        credits_per_delivered_alert:
          type: integer
          enum:
          - 2
        test_event_credits:
          type: integer
          enum:
          - 0
        job_event_credits:
          type: integer
          enum:
          - 0
          description: Credits for a delivered job.completed, job.failed or job.cancelled event. Job completion events are free.
        failed_deliveries_charged:
          type: boolean
          enum:
          - false
        max_endpoints:
          type: integer
        max_attempts:
          type: integer
        disable_after_consecutive_failures:
          type: integer
        signature_tolerance_seconds:
          type: integer
    ErrorResponse:
      type: object
      description: Canonical error format shared by every API error response. Endpoint-specific fields (for example credits_remaining, login_url or evidence_summary) may appear next to error or inside it; clients should ignore fields they do not recognise.
      additionalProperties: true
      properties:
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
              description: Stable, upper-case machine code. Codes are never renamed; the full catalog with HTTP status, type and retryability is published as x-domscan-error-codes.
              example: INVALID_DOMAIN
            type:
              type: string
              enum:
              - authentication_error
              - credits_error
              - permission_error
              - not_found_error
              - conflict_error
              - rate_limit_error
              - timeout_error
              - validation_error
              - upstream_error
              - api_error
              - request_error
              description: Stable error category used by official SDK subclasses
            message:
              type: string
              description: Human-readable error message
              example: Invalid domain format
            status:
              type: integer
              minimum: 400
              maximum: 599
              description: HTTP status repeated in the JSON error for queue and log processors
            retryable:
              type: boolean
              description: Whether retrying can be appropriate after applying retry guidance
            request_id:
              type: string
              description: Request identifier matching the X-Request-Id response header
            suggestion:
              type: string
              description: Suggestion for fixing the error
            details:
              type: object
              description: Optional structured context for the error
              additionalProperties: true
            retry_after:
              type: integer
              minimum: 0
              description: Seconds to wait before retrying when the error is temporary
              example: 300
            docs_url:
              type: string
              description: Absolute link to the documentation section for this error
              example: https://domscan.net/docs/check-availability
          required:
          - type
          - code
          - message
          - status
          - retryable
          - request_id
          - docs_url
    AlertWebhookDelivery:
      type: object
      required:
      - id
      - endpoint_id
      - event_id
      - event_type
      - status
      - attempts
      properties:
        id:
          type: string
          pattern: ^whd_[a-f0-9]{32}$
        endpoint_id:
          type: string
        event_id:
          type: string
          description: Stable event id. Retries reuse it, so receivers can deduplicate.
        event_type:
          type: string
        status:
          type: string
          enum:
          - pending
          - delivering
          - delivered
          - failed
          - cancelled
          - skipped
          description: skipped means the account had too few credits and nothing was sent; cancelled means the endpoint was disabled or deleted first.
        attempts:
          type: integer
          minimum: 0
        next_attempt_at:
          type:
          - string
          - 'null'
          format: date-time
        last_attempt_at:
          type:
          - string
          - 'null'
          format: date-time
        response_status:
          type:
          - integer
          - 'null'
        last_error:
          type:
          - string
          - 'null'
        credits_charged:
          type: integer
          minimum: 0
          description: Net credits for this delivery after any refund.
        refunded:
          type: boolean
        created_at:
          type: string
          format: date-time
        delivered_at:
          type:
          - string
          - 'null'
          format: date-time
    AlertWebhookEventType:
      type: string
      enum:
      - domain.available
      - domain.expiring_30
      - domain.expiring_14
      - domain.expiring_7
      - domain.expiring_1
      - domain.status_change
      - domain.dns_changed
      - domain.certificate_changed
      - domain.registration_changed
      - domain.hosting_changed
      - domain.technology_changed
      - domain.email_security_changed
      - brand.threat_detected
      - ssl.expiring
      - ssl.expired
      - ssl.changed
      - price.dropped
      - dns.changed
      - typosquat.detected
      - job.completed
      - job.failed
      - job.cancelled
