      parameters:
      - name: domain
        description: Domain whose SPF, DKIM and DMARC configuration should be checked.
        in: query
        required: true
        schema:
          type: string
      - name: selectors
        in: query
        required: false
        description: Optional comma-separated DKIM selectors. At most 50 valid DNS selector names are accepted.
        schema:
          type: string
          example: google,selector1,sendgrid
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Email authentication status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailAuthResponse'
              example:
                domain: google.com
                spf:
                  record: v=spf1 include:_spf.google.com ~all
                  lookup_estimate: 1
                  includes:
                  - _spf.google.com
                  redirect: null
                  macros_present: false
