  /v1/similarity:
    get:
      tags:
      - OSINT
      summary: Domain similarity check
      description: Compare two domains for visual/textual similarity. Internationalized names are compared by their Unicode confusable skeleton, so a lookalike such as a Cyrillic а in place of a Latin a is reported as a critical homograph (matching_methods includes homograph).
      operationId: getDomainSimilarity
      parameters:
      - name: domain1
        description: First domain to compare. The alias source is also accepted.
        in: query
        required: true
        schema:
          type: string
      - name: domain2
        description: Second domain to compare. The alias target is also accepted.
        in: query
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Similarity analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarityResponse'
              example:
                domain1: example.com
                domain2: exampel.com
                overall_similarity: 79
                risk_level: medium
                analysis:
                  levenshtein_distance: 2
                  levenshtein_similarity: 71
                  jaro_winkler_similarity: 97
                  visual_similarity: 71
                  keyboard_distance: 6.08
                  common_prefix_length: 5
                  common_suffix_length: 0
                matching_methods:
                - jaro-winkler
                - common-prefix
                - same-tld
                is_potential_typosquat: true
                checked_at: '2026-10-09T10:15:30.000Z'
                meta:
                  served_by: pop=MAD country=ES
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 2
  /v1/mac:
    get:
      tags:
      - OSINT
      summary: MAC address lookup
      description: Identify device manufacturer from MAC address
      operationId: getMacInfo
      parameters:
      - name: mac
        in: query
        required: true
        description: MAC address (any format)
        schema:
          type: string
          example: 00:1A:2B:3C:4D:5E
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: MAC vendor information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MacInfoResponse'
              example:
                mac: 00:1A:2B:3C:4D:5E
                input: 00:1A:2B:3C:4D:5E
                type: eui-48
                oui: 00:1A:2B
                device_id: 3C:4D:5E
                flags:
                  multicast: false
                  locally_administered: false
                  broadcast: false
                vendor:
                  name: Ayecom Technology Co., Ltd.
                  found: true
                  source: live
                  cached: false
                  checked_at: '2026-10-09T10:15:30.000Z'
                meta:
                  served_by: pop=MAD country=ES
                  latency_ms: 184
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Vendor evidence is temporarily unavailable. The request is refunded and can be retried.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UPSTREAM_UNAVAILABLE
                  message: MAC vendor lookup temporarily unavailable
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/mac/info:
    get:
      tags:
      - OSINT
      summary: Get MAC lookup endpoint details
      description: Returns parameter help and an example response for the MAC address lookup endpoint.
      operationId: getMacLookupInfo
      responses:
        '200':
          description: MAC endpoint reference
          content:
            application/json:
              schema:
                type: object
                properties:
                  endpoint:
                    type: string
                  description:
                    type: string
                  parameters:
                    type: object
                  example_request:
                    type: string
                  example_response:
                    type: object
              example:
                endpoint: /v1/mac
                description: Lookup MAC address metadata and vendor information.
                parameters:
                  mac:
                    type: string
                    required: true
                    description: MAC address string in any common format
                    example: 44:38:39:ff:ef:57
                example_request: /v1/mac?mac=44:38:39:ff:ef:57
                example_response:
                  mac: 44:38:39:FF:EF:57
                  type: eui-48
                  oui: '44:38:39'
                  device_id: FF:EF:57
                  flags:
                    multicast: false
                    locally_administered: false
                    broadcast: false
                  vendor:
                    name: Cumulus Networks, Inc
                    found: true
