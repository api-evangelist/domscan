                dkim:
                - selector: google
                  record: v=DKIM1; k=rsa; p=MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8A
                  key_type: rsa
                  key_size: 2048
                dkim_audit:
                  selectors_checked:
