                      depth: 0
                      status: present
                      direct_lookup_count: 1
                      total_lookup_count: 1
                      includes:
                      - _spf.google.com
                      redirect: null
                      mechanisms:
                      - include:_spf.google.com
                      - ~all
                      errors: []
