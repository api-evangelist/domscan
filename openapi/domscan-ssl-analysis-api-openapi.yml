  /v1/ssl/expiring:
    get:
      tags:
      - SSL Analysis
      summary: Check SSL expiry
      description: Check if a domain SSL certificate is expiring soon
      operationId: getSslExpiring
      parameters:
      - name: domain
        in: query
        required: true
        schema:
          type: string
        description: Domain to check
      - name: days
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
        description: Days threshold for expiry warning
      - name: threshold_days
        in: query
        deprecated: true
        schema:
          type: integer
          minimum: 1
          maximum: 365
        description: Deprecated compatibility alias for days. Ignored when days is also supplied.
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: SSL expiry status
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    type: string
                  classification:
                    $ref: '#/components/schemas/ClassificationStatus'
                  certificate_status:
                    type: string
                    enum:
                    - found
                    - unknown
                    description: 'unknown when no certificate could be read (no HTTPS, timeout or blocked). Expiry fields then carry no evidence: expired and expiring_soon are false and days_remaining is 0.'
                  expiring_soon:
                    type: boolean
                  expired:
                    type: boolean
                  days_remaining:
                    type: integer
                  valid_from:
                    type: string
                    format: date-time
                  valid_until:
                    type: string
                    format: date-time
                  subject:
                    type: string
                  issuer:
                    type: string
                  urgency:
                    type: string
                    enum:
                    - ok
                    - notice
                    - warning
                    - critical
                  recommendation:
                    type: string
                  checked_at:
                    type: string
                    format: date-time
              example:
                domain: example.com
                certificate_status: found
                expiring_soon: true
                expired: false
                days_remaining: 25
                valid_from: '2026-08-05T08:12:44Z'
                valid_until: '2026-11-03T08:12:43Z'
                subject: /CN=www.example.com
                issuer: /C=US/O=Let's Encrypt/CN=R11
                urgency: notice
                recommendation: Certificate expires in 25 days - plan renewal
                checked_at: '2026-10-09T10:15:30.000Z'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
