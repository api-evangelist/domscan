      - SSL Analysis
      summary: Check SSL expiry
      description: Check if a domain SSL certificate is expiring soon
      operationId: getSslExpiring
      parameters:
      - name: domain
        in: query
        required: true
        schema:
          type: string
        description: Domain to check
      - name: days
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
        description: Days threshold for expiry warning
      - name: threshold_days
        in: query
        deprecated: true
        schema:
          type: integer
          minimum: 1
          maximum: 365
        description: Deprecated compatibility alias for days. Ignored when days is also supplied.
