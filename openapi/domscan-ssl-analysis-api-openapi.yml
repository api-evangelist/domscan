                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                severity:
                                  type: string
                                finding:
                                  type: string
                                cve:
                                  type: string
                                cwe:
                                  type: string
                          forward_secrecy:
                            type: array
                            items:
