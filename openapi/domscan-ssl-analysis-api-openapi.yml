        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 5
  /v1/ssl/deep-scan:
    get:
      tags:
      - SSL Analysis
      summary: Start or fetch a premium SSL deep scan
      description: Run a premium cached deep SSL/TLS scan for a domain. Returns a fresh cached result immediately when available, or starts a long-running background scan and returns a signed polling token.
      operationId: getSslDeepScan
      parameters:
      - name: domain
        in: query
        required: true
        schema:
          type: string
          example: openai.com
        description: Domain to scan deeply
      - name: refresh
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Ignore a fresh cached result and start a new deep scan
      - name: profile
        in: query
        required: false
        schema:
          type: string
          enum:
          - standard
          - full
          default: standard
        description: Deep scan profile. Use standard for faster testssl coverage or full for the slower, richer scan.
      responses:
        '200':
          description: Fresh cached deep scan result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - pending
                    - ready
                    - error
                  domain:
                    type: string
                  host:
                    type: string
                  port:
                    type: integer
                  profile:
                    type: string
                    enum:
                    - standard
                    - full
                  scan_token:
                    type: string
                  message:
                    type: string
                  poll_after_ms:
                    type: integer
                  cache:
                    type: object
                    properties:
                      hit:
                        type: boolean
                      fresh:
                        type: boolean
                      started_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                      completed_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                      expires_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                      engine:
                        type:
                        - string
                        - 'null'
                      profile:
                        type:
                        - string
                        - 'null'
                        enum:
                        - standard
                        - full
                  result:
                    type: object
                    properties:
                      domain:
                        type: string
                      host:
                        type: string
                      port:
                        type: integer
                      engine:
                        type: object
                        properties:
                          name:
                            type: string
                          mode:
                            type: string
                            enum:
                            - testssl
                            - builtin
                          version:
                            type:
                            - string
                            - 'null'
                          profile:
                            type: string
                            enum:
                            - standard
                            - full
                      target:
                        type: object
                        properties:
                          ip:
                            type:
                            - string
                            - 'null'
                          service:
                            type:
                            - string
                            - 'null'
                          rdns:
                            type:
                            - string
                            - 'null'
                      summary:
                        type: object
                        properties:
                          severity_counts:
                            type: object
                            properties:
                              critical:
                                type: integer
                              high:
                                type: integer
                              medium:
                                type: integer
                              low:
                                type: integer
                              warn:
                                type: integer
                              info:
                                type: integer
                              ok:
                                type: integer
                          actionable_findings:
                            type: integer
                          protocols_offered:
                            type: array
                            items:
                              type: string
                          deprecated_protocols:
                            type: array
                            items:
                              type: string
                          supports_tls_1_3:
                            type: boolean
                          supports_http2:
                            type:
                            - boolean
                            - 'null'
                          supports_http3:
                            type:
                            - boolean
                            - 'null'
                      sections:
                        type: object
                        properties:
                          pretest:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                severity:
                                  type: string
                                finding:
                                  type: string
                                cve:
                                  type: string
                                cwe:
                                  type: string
                          protocols:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                severity:
                                  type: string
                                finding:
                                  type: string
                                cve:
                                  type: string
                                cwe:
                                  type: string
                          server_defaults:
