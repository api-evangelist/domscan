                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                severity:
                                  type: string
                                finding:
                                  type: string
                                cve:
                                  type: string
                                cwe:
                                  type: string
                          browser_simulations:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                severity:
                                  type: string
                                finding:
                                  type: string
                                cve:
                                  type: string
                                cwe:
                                  type: string
                          rating:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                severity:
                                  type: string
                                finding:
                                  type: string
                                cve:
                                  type: string
                                cwe:
                                  type: string
                      findings:
                        type: array
                        items:
                          type: object
                          properties:
                            section:
                              type: string
                            id:
                              type: string
                            severity:
                              type: string
                            finding:
                              type: string
                            cve:
                              type: string
                            cwe:
                              type: string
                      checked_at:
                        type: string
                        format: date-time
                      scan_duration_ms:
                        type: integer
                      notes:
                        type: array
                        items:
                          type: string
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      retryable:
                        type: boolean
              example:
                status: ready
                domain: openai.com
                host: openai.com
                port: 443
                profile: full
                scan_token: eyJrIjoidGxzLWRlZXAtc2NhbiIsImkiOiJleGFtcGxlIiwiaCI6Im9wZW5haS5jb20ifQ
                cache:
                  hit: true
                  fresh: true
                  completed_at: '2026-04-18T22:10:00Z'
                  expires_at: '2026-04-19T22:10:00Z'
                  engine: testssl.sh
                  profile: full
                result:
