openapi: 3.2.0
info:
  title: DomScan SSL Analysis API
  description: DomScan is a domain intelligence API providing domain analysis tools.
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: SSL Analysis
  description: SSL certificate grading, chain analysis, and expiry monitoring
paths:
  /v1/ssl/audit:
    get:
      tags:
      - SSL Analysis
      summary: Comprehensive SSL audit
      description: Run a comprehensive live SSL/TLS audit for a domain, combining certificate, chain, revocation, HSTS, HTTP version, and TLS posture details.
      operationId: getSslAudit
      parameters:
      - name: domain
        in: query
        required: true
        schema:
          type: string
        description: Domain to audit
      responses:
        '200':
          description: Aggregated SSL/TLS audit
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    type: string
                  audit_completeness:
                    type: string
                    enum:
                    - full
                    - partial
                  probe_coverage:
                    type: object
                    properties:
                      tls_inspect:
                        type: boolean
                      tls_audit:
                        type: boolean
                      tls_posture:
                        type: boolean
                      revocation:
                        type: boolean
                      hsts:
                        type: boolean
                      http_versions:
                        type: boolean
                  certificate:
                    type: object
                    properties:
                      subject:
                        type: string
                      issuer:
                        type: string
                      issuer_org:
                        type: string
                      valid_from:
                        type: string
                        format: date-time
                      valid_until:
                        type: string
                        format: date-time
                      days_remaining:
                        type: integer
                      expired:
                        type: boolean
                      san:
                        type: array
                        items:
                          type: string
                      key_type:
                        type: string
                      key_size:
                        type: integer
                      signature_algorithm:
                        type: string
                      serial_number:
                        type: string
                      fingerprint_sha256:
                        type: string
                      hostname_match:
                        type:
                        - boolean
                        - 'null'
                  chain:
                    type: object
                    properties:
                      length:
                        type: integer
                      valid:
                        type: boolean
                      certificates:
                        type: array
                        items:
                          type: object
                          properties:
                            subject:
                              type: string
                            issuer:
                              type: string
                            type:
                              type: string
                              enum:
                              - leaf
                              - intermediate
                              - root
                            valid_from:
                              type:
                              - string
                              - 'null'
                            valid_until:
                              type:
                              - string
                              - 'null'
                      issues:
                        type: array
                        items:
                          type: string
                  protocols:
                    type: object
                    properties:
                      tls_1_3:
                        type: boolean
                      tls_1_2:
                        type: boolean
                      tls_1_1:
                        type: boolean
                      tls_1_0:
                        type: boolean
                      ssl_3:
                        type: boolean
                      preferred_protocol:
                        type: string
                      detection_method:
                        type: string
                        enum:
                        - inferred
                        - active
                      deprecated_protocols_enabled:
                        type: boolean
                  connection:
                    type: object
                    properties:
                      preferred_protocol:
                        type:
                        - string
                        - 'null'
                      preferred_cipher:
                        type:
                        - string
                        - 'null'
                      alpn_negotiated:
                        type:
                        - string
                        - 'null'
                      forward_secrecy:
                        type: boolean
                      forward_secrecy_cipher:
                        type:
                        - string
                        - 'null'
                      secure_renegotiation_supported:
                        type:
                        - boolean
                        - 'null'
                      server_temp_key:
                        type:
                        - string
                        - 'null'
                      peer_signing_digest:
                        type:
                        - string
                        - 'null'
                      peer_signature_type:
                        type:
                        - string
                        - 'null'
                      server_public_key_bits:
                        type:
                        - integer
                        - 'null'
                      compression:
                        type:
                        - string
                        - 'null'
                      expansion:
                        type:
                        - string
                        - 'null'
                      client_certificate_requested:
                        type:
                        - boolean
                        - 'null'
                  certificate_delivery:
                    type: object
                    properties:
                      must_staple:
                        type: boolean
                      sct_embedded:
                        type: boolean
                      sct_count:
                        type: integer
                      ocsp_stapling_present:
                        type: boolean
                      ocsp_stapling_fresh:
                        type:
                        - boolean
                        - 'null'
                      ocsp_stapling_status:
                        type:
                        - string
                        - 'null'
                      ocsp_this_update:
                        type:
                        - string
                        - 'null'
                      ocsp_next_update:
                        type:
                        - string
                        - 'null'
                  handshake_size:
                    type: object
                    description: Estimated certificate-chain and TLS handshake weight for mobile/API client risk triage.
                    properties:
                      chain_certificate_count:
                        type: integer
                      estimated_certificate_bytes:
                        type: integer
                      estimated_handshake_bytes:
                        type: integer
                      risk:
                        type: string
                        enum:
                        - low
                        - medium
                        - high
                      mobile_client_warning:
                        type: boolean
                  alpn_summary:
                    type: object
                    description: ALPN and HTTP protocol-readiness summary from supplemental TLS and HTTP version probes.
                    properties:
                      negotiated_protocol:
                        type:
                        - string
                        - 'null'
                      http2_ready:
                        type:
                        - boolean
                        - 'null'
                      http3_advertised:
                        type:
                        - boolean
                        - 'null'
                      fallback_protocols:
                        type: array
                        items:
                          type: string
                      evidence_sources:
                        type: array
                        items:
                          type: string
                  transport:
                    type: object
                    properties:
                      hsts:
                        type: object
                        properties:
                          reachable:
                            type: boolean
                          final_url:
                            type:
                            - string
                            - 'null'
                          status_code:
                            type:
                            - integer
                            - 'null'
                          header_present:
                            type: boolean
                          hsts_header:
                            type:
                            - string
                            - 'null'
                          max_age:
                            type:
                            - integer
                            - 'null'
                          include_subdomains:
                            type:
                            - boolean
                            - 'null'
                          preload_directive:
                            type:
                            - boolean
                            - 'null'
                          preload_eligible:
                            type: boolean
                          preload_status:
                            type:
                            - string
                            - 'null'
                          preloaded_domain:
                            type:
                            - string
                            - 'null'
                          issues:
                            type: array
                            items:
                              type: string
                          errors:
                            type: array
                            items:
                              type: string
                      http_versions:
                        type: object
                        properties:
                          http1_1:
                            type: boolean
                          http2:
                            type: boolean
                          http3:
                            type: boolean
                          alt_svc:
                            type:
                            - string
                            - 'null'
                          http3_advertised:
                            type: boolean
                          alt_svc_protocols:
                            type: array
                            items:
                              type: string
                          curl_http3_supported:
                            type: boolean
                  revocation:
                    type: object
                    properties:
                      ocsp:
                        type: object
                        properties:
                          present:
                            type: boolean
                          uris:
                            type: array
                            items:
                              type: string
                          checked_uri:
                            type:
                            - string
                            - 'null'
                          status:
                            type:
                            - string
                            - 'null'
                            enum:
                            - good
                            - revoked
                            - unknown
                          verify_ok:
                            type: boolean
                          this_update:
                            type:
                            - string
                            - 'null'
                          next_update:
                            type:
                            - string
                            - 'null'
                          error:
                            type:
                            - string
                            - 'null'
                      crl:
                        type: object
                        properties:
                          present:
                            type: boolean
                          uris:
                            type: array
                            items:
                              type: string
                          checked_uri:
                            type:
                            - string
                            - 'null'
                          fetched:
                            type: boolean
                          http_status:
                            type:
                            - integer
                            - 'null'
                          revoked:
                            type:
                            - boolean
                            - 'null'
                          last_update:
                            type:
                            - string
                            - 'null'
                          next_update:
                            type:
                            - string
                            - 'null'
                          revoked_serial_count:
                            type:
                            - integer
                            - 'null'
                          error:
                            type:
                            - string
                            - 'null'
                  tls_extensions:
                    type: array
                    items:
                      type: string
                  edge_summary:
                    type: object
                    description: Compact supplemental probe summary for SSL Labs / Hardenize-style triage.
                    properties:
                      relay_configured:
                        type: boolean
                      evidence_sources:
                        type: array
                        items:
                          type: string
                      probe_success_count:
                        type: integer
                      probe_attempt_count:
                        type: integer
                      live_handshake_ms:
                        type:
                        - integer
                        - 'null'
                      strongest_protocol:
                        type:
                        - string
                        - 'null'
                      weakest_supported_protocol:
                        type:
                        - string
                        - 'null'
                      deprecated_protocol_count:
                        type: integer
                      http3_ready:
                        type: boolean
                      hsts_preload_ready:
                        type: boolean
                      revocation_checked:
                        type: boolean
                      revocation_good:
                        type:
                        - boolean
                        - 'null'
                      certificate_transparency_ready:
                        type: boolean
                      client_auth_requested:
                        type:
                        - boolean
                        - 'null'
                      weak_transport_detected:
                        type: boolean
                  issues:
                    type: array
                    items:
                      type: string
                  recommendations:
                    type: array
                    items:
                      type: string
                  checked_at:
                    type: string
                    format: date-time
                  check_duration_ms:
                    type: integer
              example:
                domain: cloudflare.com
                audit_completeness: full
                probe_coverage:
                  tls_inspect: true
                  tls_audit: true
                  tls_posture: true
                  revocation: true
                  hsts: true
                  http_versions: true
                certificate:
                  subject: cloudflare.com
                  issuer: Google Trust Services
                  valid_from: '2026-03-01T00:00:00Z'
                  valid_until: '2026-05-30T23:59:59Z'
                  days_remaining: 42
                  expired: false
                  san:
                  - cloudflare.com
                  - '*.cloudflare.com'
                  key_type: ECDSA
                  key_size: 256
                  signature_algorithm: ecdsaWithSHA256
                  serial_number: 539933F4CFE7E8CF13F5E60D139675A1
                  fingerprint_sha256: AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99:AA:BB:CC:DD:EE:FF:00:11:22:33:44:55:66:77:88:99
                  hostname_match: true
                chain:
                  length: 3
                  valid: true
                  certificates:
                  - subject: cloudflare.com
                    issuer: Google Trust Services
                    type: leaf
                  - subject: Google Trust Services
                    issuer: GlobalSign
                    type: intermediate
                  - subject: GlobalSign
                    issuer: GlobalSign
                    type: root
                  issues: []
                protocols:
                  tls_1_3: true
                  tls_1_2: true
                  tls_1_1: false
                  tls_1_0: false
                  ssl_3: false
                  preferred_protocol: TLSv1.3
                  detection_method: active
                  deprecated_protocols_enabled: false
                connection:
                  preferred_protocol: TLSv1.3
                  preferred_cipher: TLS_AES_256_GCM_SHA384
                  alpn_negotiated: h2
                  forward_secrecy: true
                  forward_secrecy_cipher: TLS_AES_256_GCM_SHA384
                  secure_renegotiation_supported: false
                  server_temp_key: X25519, 253 bits
                  peer_signing_digest: SHA256
                  peer_signature_type: ECDSA
                  server_public_key_bits: 256
                  compression: NONE
                  expansion: NONE
                  client_certificate_requested: false
                certificate_delivery:
                  must_staple: false
                  sct_embedded: true
                  sct_count: 2
                  ocsp_stapling_present: true
                  ocsp_stapling_fresh: true
                  ocsp_stapling_status: successful (0x0)
                  ocsp_this_update: '2026-04-15T02:35:16Z'
                  ocsp_next_update: '2026-04-22T01:35:15Z'
                handshake_size:
                  chain_certificate_count: 3
                  estimated_certificate_bytes: 3200
                  estimated_handshake_bytes: 4600
                  risk: low
                  mobile_client_warning: false
                alpn_summary:
                  negotiated_protocol: h2
                  http2_ready: true
                  http3_advertised: true
                  fallback_protocols:
                  - TLSv1.3
                  - TLSv1.2
                  - http/1.1
                  evidence_sources:
                  - tls_audit
                  - http_versions
                transport:
                  hsts:
                    reachable: true
                    final_url: https://cloudflare.com/
                    status_code: 200
                    header_present: true
                    hsts_header: max-age=31536000; includeSubDomains
                    max_age: 31536000
                    include_subdomains: true
                    preload_directive: false
                    preload_eligible: true
                    preload_status: preloaded
                    preloaded_domain: cloudflare.com
                    issues:
                    - missing preload directive
                    errors: []
                  http_versions:
                    http1_1: true
                    http2: true
                    http3: true
                    alt_svc: h3=":443"; ma=86400
                    http3_advertised: true
                    alt_svc_protocols:
                    - h3
                    curl_http3_supported: true
                revocation:
                  ocsp:
                    present: true
                    uris:
                    - http://o.pki.goog/wr2
                    checked_uri: http://o.pki.goog/wr2
                    status: good
                    verify_ok: true
                    this_update: '2026-04-18T20:30:00Z'
                    next_update: '2026-04-19T20:30:00Z'
                    error: null
                  crl:
                    present: true
                    uris:
                    - http://c.pki.goog/wr2.crl
                    checked_uri: http://c.pki.goog/wr2.crl
                    fetched: true
                    http_status: 200
                    revoked: false
                    last_update: '2026-04-17T00:00:00Z'
                    next_update: '2026-04-24T00:00:00Z'
                    revoked_serial_count: 0
                    error: null
                tls_extensions:
                - key share
                - supported versions
