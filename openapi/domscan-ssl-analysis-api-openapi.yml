                  host: openai.com
                  port: 443
                  engine:
                    name: testssl.sh
                    mode: testssl
                    version: 3.3dev
                    profile: full
                  target:
                    ip: 172.64.154.211
                    service: HTTP
                    rdns: --
                  summary:
                    severity_counts:
                      critical: 0
                      high: 1
                      medium: 1
                      low: 0
                      warn: 1
                      info: 6
                      ok: 4
                    actionable_findings: 3
                    protocols_offered:
                    - TLS1_2
                    - TLS1_3
                    deprecated_protocols: []
                    supports_tls_1_3: true
