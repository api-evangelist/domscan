openapi: 3.2.0
info:
  title: DomScan Domain Availability API
  description: 'DomScan is a domain intelligence API providing domain analysis tools. **Core Features:**

    - Domain Availability: Check single or bulk domains using RDAP with 1,100+ TLDs supported

    - Domain Intelligence: AI suggestions, valuations, health checks, typosquatting detection

    - OSINT Tools: DNS lookup, WHOIS/RDAP, SSL certificates, subdomain discovery, IP geolocation, tech stack detection

    - Social & Branding: Social handle checker, brand name scoring

    - Phone Intelligence: Privacy-first phone number validation, normalization, and classification

    - Pricing: Scheduled standard-TLD tables from verified official registrar sources, plus separate credential-backed exact-domain quotes

    - Watchlist: Domain monitoring for expiration and availability alerts


    **Authentication:**

    Most API endpoints require authentication. Pass your API key via the x-api-key header or Authorization: Bearer header. Operations marked with an empty security requirement are intentionally public, including API specifications and selected catalog endpoints. Get your free API key at https://domscan.net/dashboard. Logged-in users on domscan.net tools pages are authenticated automatically via session cookie. **Rate Limits:**

    Free accounts can sustain 120 requests per minute per account, with a burst capacity of 60. All API keys and dashboard sessions belonging to the same free account share this budget. Bulk endpoints have an additional free-tier budget of 20 HTTP requests per minute per account across all bulk endpoints. Free-tier bulk traffic is also capped at 100 requests per minute per IPv4 address or IPv6 /56 network. Platform-wide edge protections still apply to every tier. Paid accounts can sustain 600 requests per minute, with a burst capacity of 120, shared by every API key and dashboard session of the account. Paid accounts do not receive the additional free-tier bulk budget. Scope: RapidAPI subscribers are counted per subscriber. (scope=rapidapi-customer) Zyla subscribers are counted per subscriber when the gateway identifies them, (scope=zyla-customer) and as one shared gateway budget when it does not. (scope=zyla-gateway) Other authenticated requests are counted per account: every API key and dashboard session of the account shares one budget. (scope=account) A key that is not linked to an account is counted on its own. (scope=api-key) Unauthenticated requests to public endpoints are counted per client IP address (scope unknown when the address cannot be determined, as one shared budget). (scope=ip)


    Every authenticated response, success or error, includes X-RateLimit-Plan, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, and X-RateLimit-Policy. X-RateLimit-Limit and X-RateLimit-Remaining describe the immediate burst bucket; X-RateLimit-Reset is the Unix time in seconds when that bucket is full again; X-RateLimit-Policy also states the sustained per-minute rate, scope, and any free bulk limits. Exceeding a limit returns HTTP 429 with Retry-After. Retry only after the indicated delay. **Credits System:**

    API calls consume credits based on endpoint complexity. Sign up for free to receive 10,000 credits monthly. - 1 credit: Status checks, DNS lookups, tool builders

    - 2-5 credits: Health checks, valuations, OSINT tools

    - Bulk endpoints: standard per-item rate for batching multiple items into fewer HTTP requests. - 6-25 credits: Recipe compound operations


    When credits reach zero, the API returns HTTP 402 with credits_remaining, credits_required, and a purchase_url. API responses include X-Credits-Requested, X-Credits-Charged, and X-Credits-Refunded. X-Credits-Charged is the net charge after any refund made during the request. Authenticated responses also include X-Credits-Remaining whenever the balance is known without an extra lookup. Free credits refresh monthly on the account''s signup anniversary. POST /v1/estimate returns the credits a request would charge without running it, at no cost.'
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: Domain Availability
  description: Check if domains are available for registration using RDAP
paths:
  /v1/status:
    get:
      tags:
      - Domain Availability
      summary: Check domain availability
      description: Check if a domain name is available for registration across multiple TLDs. Uses RDAP for authoritative results. Provide either the primary `name` + `tlds` format, or the single-domain shortcut `domain=example.com`.
      operationId: checkDomainAvailability
      parameters:
      - name: name
        in: query
        required: false
        description: Domain name without TLD. Use together with tlds (e.g., "example" for example.com)
        schema:
          type: string
          minLength: 1
          maxLength: 63
          example: mycompany
      - name: tlds
        in: query
        required: false
        description: Comma-separated list of TLDs to check (max 50). Use together with name.
        schema:
          type: string
          example: com,net,org,io
      - name: domain
        in: query
        required: false
        description: Single-domain shortcut for one TLD, for example "mycompany.com"
        schema:
          type: string
          example: mycompany.com
      - name: prefer_cache
        in: query
        description: Deprecated alias of `max_age=2592000`; still accepted. Return cached results if available (faster). Deprecated on 2026-10-10; works until at least 2027-10-10 (Sunset header).
        schema:
          type: boolean
          default: false
        deprecated: true
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/MaxAge'
      responses:
        '200':
          description: Availability check results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
              example:
                name: mycompany
                results:
                - domain: mycompany.com
                  tld: com
                  available: false
                  source: rdap
                  latency_ms: 45
                - domain: mycompany.io
                  tld: io
                  available: true
                  source: rdap
                  latency_ms: 67
                meta:
                  total_checked: 2
                  available_count: 1
                  duration_ms: 120
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            X-Cache-Age:
              $ref: '#/components/headers/XCacheAge'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-freshness:
        parameter: max_age
        aliases:
        - name: prefer_cache
          in: query
          max_age: 2592000
        - name: skip_cache
          in: query
          max_age: 0
        - name: cache_skip
          in: query
          max_age: 0
        - name: cache-skip
          in: query
          max_age: 0
      x-domscan-deprecated-aliases:
      - name: prefer_cache
        in: query
        replacement: max_age=2592000
        deprecated_on: '2026-10-10'
        sunset_on: '2027-10-10'
      - name: skip_cache
        in: query
        replacement: max_age=0
        deprecated_on: '2026-10-10'
        sunset_on: '2027-10-10'
      - name: cache_skip
        in: query
        replacement: max_age=0
        deprecated_on: '2026-10-10'
        sunset_on: '2027-10-10'
      - name: cache-skip
        in: query
        replacement: max_age=0
        deprecated_on: '2026-10-10'
        sunset_on: '2027-10-10'
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/status/bulk:
    post:
      tags:
      - Domain Availability
      summary: Bulk domain availability check
      description: 'Check availability of multiple full domain names at once. Domains are checked in parallel for optimal performance. Results include availability status, source (RDAP or cache), and latency.


        **Credits:** 1 credit per domain. Example: 10 domains = 10 credits, 50 domains = 50 credits.'
      operationId: bulkCheckDomains
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domains
              properties:
                domains:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 50
                  description: Array of full domain names to check
                  example:
                  - example.com
                  - startup.io
                  - brand.ai
                options:
                  type: object
                  properties:
                    prefer_cache:
                      type: boolean
                      default: false
                      description: Return cached results if available (faster but may be stale)
                prefer_cache:
                  type: boolean
                  default: false
                  description: Alias for options.prefer_cache. When both are sent, options.prefer_cache wins.
            example:
              domains:
              - example.com
              - startup.io
              - brand.ai
      responses:
        '200':
          description: Bulk check results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkStatusResponse'
              example:
                results:
                - domain: example.com
                  tld: com
                  available: false
                  source: rdap
                  latency_ms: 45
                - domain: startup.io
                  tld: io
                  available: true
                  source: rdap
                  latency_ms: 67
                - domain: brand.ai
                  tld: ai
                  available: true
                  source: cache
                  latency_ms: 2
                meta:
                  total_checked: 3
                  available_count: 2
                  duration_ms: 120
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            X-Cache-Age:
              $ref: '#/components/headers/XCacheAge'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/DryRun'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/MaxAge'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-freshness:
        parameter: max_age
        aliases: []
        body_aliases:
        - path: options.prefer_cache
          max_age: 2592000
        - path: prefer_cache
          max_age: 2592000
        - path: options.skip_cache
          max_age: 0
        - path: options.cache_skip
          max_age: 0
        - path: options.cache-skip
          max_age: 0
      x-domscan-deprecated-aliases:
      - name: options.prefer_cache
        in: body
        replacement: max_age=2592000
        deprecated_on: '2026-10-10'
        sunset_on: '2027-10-10'
      - name: prefer_cache
        in: body
        replacement: max_age=2592000
        deprecated_on: '2026-10-10'
        sunset_on: '2027-10-10'
      - name: options.skip_cache
        in: body
        replacement: max_age=0
        deprecated_on: '2026-10-10'
        sunset_on: '2027-10-10'
      - name: options.cache_skip
        in: body
        replacement: max_age=0
        deprecated_on: '2026-10-10'
        sunset_on: '2027-10-10'
      - name: options.cache-skip
        in: body
        replacement: max_age=0
        deprecated_on: '2026-10-10'
        sunset_on: '2027-10-10'
      x-domscan-credits:
        model: per_item
        default: 1
  /v1/domain-discovery/jobs:
    post:
      tags:
      - Domain Availability
      summary: Create an asynchronous domain discovery job
      description: Queue one cursor-paginated page from a curated English single-word corpus sourced from iannuttall/unclaimed under the MIT License. Filters are applied before page selection. Every selected word is checked across every requested TLD, and each word-TLD pair counts toward the hard limit of 100 checks per job and uses normal /v1/status pricing. Poll, retrieve results, or cancel the returned job through the existing /v1/batches endpoints. Use next_cursor to continue the filtered search. Unknown outcomes are preserved and are never reported as available.
      operationId: createDomainDiscoveryJob
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional idempotency key for safe job creation retries. Reusing the key with the same payload returns the existing job; reusing it with a different payload returns 409.
        schema:
          type: string
          minLength: 1
          maxLength: 120
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - tlds
              properties:
                notify_webhook:
                  $ref: '#/components/schemas/JobNotifyWebhook'
                tlds:
                  type: array
                  minItems: 1
                  maxItems: 5
                  description: Supported TLDs to check, from 1 to 5 entries. Values are normalized and duplicates collapse before limits and billing are calculated. Each unique TLD creates one domain check for every word in the page.
                  items:
                    type: string
                    minLength: 1
                    maxLength: 253
                    pattern: ^\.?[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$
                    example: io
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: Maximum corpus words to include in this page. limit multiplied by the number of unique TLDs must not exceed 100. By default, DomScan selects the largest page that stays within that cap.
                cursor:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: Opaque server-issued cursor from next_cursor on the previous discovery job. Omit it to start at the first filtered page. The cursor is bound to the corpus version, TLDs, and filter values; changing them returns 400.
                min_length:
                  type: integer
                  minimum: 1
                  maximum: 63
                  default: 3
                  description: Minimum corpus word length, inclusive. Must not exceed max_length when both are provided.
                max_length:
                  type: integer
                  minimum: 1
                  maximum: 63
                  default: 16
                  description: Maximum corpus word length, inclusive. Must be greater than or equal to min_length when both are provided.
                singular_only:
                  type: boolean
                  default: false
                  description: When true, exclude corpus entries that match the bundled corpus regular-plural heuristic.
            example:
              tlds:
              - io
              - ai
              limit: 50
              min_length: 4
              max_length: 8
              singular_only: true
      responses:
        '200':
          description: Existing discovery batch returned for an idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainDiscoveryJobResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '202':
          description: Discovery batch accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainDiscoveryJobResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          description: Idempotency key was reused with different discovery input
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; equals error.request_id in the body.
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: IDEMPOTENCY_CONFLICT
                  message: This Idempotency-Key was already used with a different request.
                  type: conflict_error
                  status: 409
                  retryable: false
                  request_id: m5x7k2p-a9f3
                  docs_url: https://domscan.net/docs/error-codes
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_item
        default: 1
        note: Each word-TLD pair uses the normal /v1/status credit cost, currently 1 credit. Billing and any eligible item refunds follow /v1/status behavior.
  /v1/name-check:
    get:
      tags:
      - Domain Availability
      summary: Check a name across domains, handles and package registries
      description: 'Check one name everywhere in a single request: domain availability across up to 20 TLDs (default com, io, ai, co, app, dev, net, org), the same handle on social and developer platforms (a curated default set, or all), and the package name in npm, PyPI, crates.io, RubyGems, NuGet, Packagist (vendor) and Homebrew. Each item keeps its own status; blocked, rate-limited or failed checks are unknown, never available. The verdict and score summarise the definite results. 5 credits; refunded when nothing could be determined.'
      operationId: checkNameAvailability
      parameters:
      - name: name
        in: query
        required: true
        description: Letters, digits and inner hyphens.
        schema:
          type: string
          minLength: 2
          maxLength: 63
          example: acmeflow
      - name: tlds
        in: query
        description: Up to 20 TLDs. Default com,io,ai,co,app,dev,net,org.
        schema:
          type: string
          example: com,io,ai
      - name: platforms
        in: query
        description: 'Platform ids from /v1/social/info, all or none. Default: 20 major platforms.'
        schema:
          type: string
          example: github,instagram,tiktok
      - name: packages
        in: query
        description: npm, pypi, crates, rubygems, nuget, packagist, homebrew, all or none. Default all.
        schema:
          type: string
          example: npm,pypi
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Name availability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameCheckResponse'
              example:
                name: acmeflow
                status: ok
                checked_at: '2026-10-13T18:00:00.000Z'
                verdict: mostly_available
                score: 80
                determinacy: 100
                summary:
                  com_available: false
                  domains:
                    checked: 2
                    free: 1
                    taken: 1
                    unknown: 0
                  handles:
                    checked: 2
                    free: 2
                    taken: 0
                    unknown: 0
                  packages:
                    checked: 1
                    free: 1
                    taken: 0
                    unknown: 0
                domains:
                - domain: acmeflow.com
                  tld: com
                  status: taken
                  reason: null
                - domain: acmeflow.io
                  tld: io
                  status: available
                  reason: null
                handles:
                - platform: github
                  status: available
                  url: null
                  reason: null
                - platform: instagram
                  status: available
                  url: null
                  reason: null
                packages:
                - registry: npm
                  name: acmeflow
                  status: not_found
                  url: null
                  reason: similar_name_rules
                meta:
                  duration_ms: 4210
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 5
components:
  schemas:
    JobNotifyWebhook:
      description: Optional completion webhook. true sends one signed job.completed, job.failed or job.cancelled event to every active signed webhook endpoint subscribed to it (or to all events) when the job finishes; an endpoint id sends it to that endpoint only. Free. Omit or false for no event.
      oneOf:
      - type: boolean
      - type: string
        pattern: ^whe_[a-f0-9]{32}$
      example: true
    AvailabilityConfidenceSummary:
      type: object
      description: Additive availability confidence rollup showing source mix, cache state, fallback chain, and ambiguity.
      properties:
        scope:
          type: string
          enum:
          - precise
          - estimate
        requested_count:
          type: integer
        result_count:
          type: integer
        invalid_count:
          type: integer
        available_count:
          type: integer
        registered_count:
          type: integer
        restricted_count:
          type: integer
        authoritative_count:
          type: integer
        heuristic_count:
          type: integer
        cached_count:
          type: integer
        error_count:
          type: integer
        ambiguous_count:
          type: integer
        source_counts:
          type: object
          additionalProperties:
            type: integer
        primary_source:
          type:
          - string
          - 'null'
        cache_status:
          type: string
          enum:
          - hit
          - miss
          - mixed
          - none
        rdap_calls:
          type: integer
        refreshes:
          type: integer
        cache_preference_misses:
          type: integer
        fallback_chain:
          type: array
          items:
            type: string
        confidence_level:
          type: string
          enum:
          - high
          - medium
          - low
        determinacy_rate:
          type: number
          minimum: 0
          maximum: 1
        ambiguity_reason:
          type:
          - string
          - 'null'
          enum:
          - errors_present
          - heuristic_dns_fallback
          - non_authoritative_evidence
          - unknown_status
          - null
    StatusResponse:
      type: object
      description: Domain availability check response
      properties:
        cache_age_s:
          type: integer
          minimum: 0
          description: Age in whole seconds of the cached data used for this response; 0 when it was checked fresh. For multi-item responses, the oldest item.
        name:
          type: string
          description: Base domain name (without TLD)
        results:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityResult'
        scope:
          type: string
          enum:
          - precise
          - estimate
          description: Check mode that produced the results
        confidence_summary:
          $ref: '#/components/schemas/AvailabilityConfidenceSummary'
        meta:
          type: object
          properties:
            total_checked:
              type: integer
              description: Number of TLDs checked
            available_count:
              type: integer
              description: Number of available domains
            duration_ms:
              type: integer
              description: Total check duration
            served_by:
              type: string
              description: Location that served the request, as `pop=<code> country=<code>`.
            scope_description:
              type: string
              description: Explains how the scope affects result confidence
    BulkStatusResponse:
      type: object
      description: Bulk domain availability check response
      properties:
        cache_age_s:
          type: integer
          minimum: 0
          description: Age in whole seconds of the cached data used for this response; 0 when it was checked fresh. For multi-item responses, the oldest item.
        results:
          type: array
          items:
            $ref: '#/components/schemas/AvailabilityResult'
        confidence_summary:
          $ref: '#/components/schemas/AvailabilityConfidenceSummary'
        meta:
          type: object
          properties:
            total_checked:
              type: integer
              description: Results returned, including invalid inputs
            available_count:
              type: integer
              description: Results that are available (available is true and no error)
            duration_ms:
              type: integer
    ApiBatchJob:
      type: object
      required:
      - id
      - status
      - total
      - counts
      - billing
      - webhook
      - status_url
      - results_url
      - results_csv_url
      - created_at
      - updated_at
      - processing_deadline_at
      - results_expires_at
      properties:
        id:
          type: string
          pattern: ^bat_[a-f0-9]{32}$
        status:
          type: string
          enum:
          - queued
          - running
          - cancelling
          - completed
          - completed_with_errors
          - cancelled
        total:
          type: integer
          minimum: 1
          maximum: 100
        counts:
          type: object
          required:
          - pending
          - processing
          - succeeded
          - failed
          - cancelled
          properties:
            pending:
              type: integer
            processing:
              type: integer
            succeeded:
              type: integer
            failed:
              type: integer
            cancelled:
              type: integer
        billing:
          type: object
          required:
          - credits_charged
          - credits_refunded
          - credits_net
          properties:
            credits_charged:
              type: integer
            credits_refunded:
              type: integer
            credits_net:
              type: integer
        webhook:
          type: object
          required:
          - configured
          - status
          - attempts
          properties:
            configured:
              type: boolean
            status:
              type: string
              enum:
              - not_configured
              - waiting
              - pending
              - delivering
              - delivered
              - failed
            attempts:
              type: integer
        status_url:
          type: string
          format: uri
        results_url:
          type: string
          format: uri
        results_csv_url:
          type: string
          format: uri
        poll_after_ms:
          type:
          - integer
          - 'null'
        created_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        cancelled_at:
          type:
          - string
          - 'null'
          format: date-time
        updated_at:
          type: string
          format: date-time
        processing_deadline_at:
          type: string
          format: date-time
        results_expires_at:
          type: string
          format: date-time
    ClassificationEvidence:
      type: object
      description: 'Where a classification came from: the source that answered, the method used, when it was observed and an optional machine-readable detail.'
      properties:
        source:
          type: string
          description: Source that produced the observation, for example rdap, dns, http or cache.
          example: rdap
        method:
          type: string
          description: Check method used, for example rdap_lookup, txt_lookup or http_get.
          example: rdap_lookup
        observed_at:
          type: string
          format: date-time
          description: When the evidence was observed. Earlier than checked_at for cached results.
        detail:
          type: string
          description: Optional machine-readable detail such as http_404, nxdomain or taken.
      required:
      - source
      - method
      - observed_at
    NameCheckSection:
      type: object
      required:
      - checked
      - free
      - taken
      - unknown
      properties:
        checked:
          type: integer
          minimum: 0
        free:
          type: integer
          minimum: 0
        taken:
          type: integer
          minimum: 0
        unknown:
          type: integer
          minimum: 0
    ClassificationStatus:
      type: object
      description: Shared present/absent/unknown classification. present and absent are returned only from exact authoritative evidence. Blocked, rate-limited, timed-out, failed and ambiguous checks are unknown with a reason, never absent.
      properties:
        status:
          type: string
          enum:
          - present
          - absent
          - unknown
          description: present, absent or unknown.
        reason:
          type: string
          enum:
          - blocked
          - rate_limited
          - timeout
          - ambiguous
          - upstream_error
          - unsupported
          description: Why the result is unknown. Returned only when status is unknown.
        evidence:
          $ref: '#/components/schemas/ClassificationEvidence'
        checked_at:
          type: string
          format: date-time
          description: When DomScan produced this classification.
      required:
      - status
      - evidence
      - checked_at
    AvailabilityResult:
      type: object
      description: Single domain availability result
      properties:
        classification:
          $ref: '#/components/schemas/ClassificationStatus'
        domain:
          type: string
          description: Full domain name
        tld:
          type: string
          description: Top-level domain
        available:
          type:
          - boolean
          - 'null'
          description: Whether domain is available for public registration. null when status cannot be determined (e.g. RDAP and WHOIS both unavailable)
        availability_reason:
          type: string
          enum:
          - closed_registry
          description: Why public registration is unavailable. Does not indicate whether an RDAP object exists.
        source:
          type: string
          enum:
          - rdap
          - cache
          - dns
          - whois
          - policy
          description: Data source used for check
        confidence:
          type: string
          enum:
          - authoritative
          - heuristic
          description: Result confidence level. "authoritative" for RDAP registry data, "heuristic" for DNS/WHOIS/cache fallbacks. Heuristic results may have false positives (e.g. parked domains without NS records may appear available)
        checked_at:
          type: string
          format: date-time
          description: Timestamp of check
        latency_ms:
          type: integer
          description: Check latency in milliseconds
        cache_age_s:
          type: integer
          description: Age of the cached result in seconds. Present only for cached results.
        registry_status:
          type: array
          items:
            type: string
          description: RDAP status values reported by the registry
        rdap_events:
          type: array
          description: RDAP lifecycle events (registration, expiration, last changed)
          items:
            type: object
            properties:
              eventAction:
                type: string
              eventDate:
                type: string
        proof:
          type: object
          additionalProperties: true
          description: Minimal RDAP evidence for a registered result (links, handle, ldhName, alabel).
        dns_status:
          type: object
          description: DNS delegation evidence used for status flags and fallbacks
          properties:
            has_nameservers:
              type: boolean
            resolvable:
              type: boolean
            checked:
              type: boolean
        timing:
          type: object
          properties:
            cache_lookup_ms:
              type: integer
            rdap_query_ms:
              type: integer
            dns_check_ms:
              type: integer
            total_ms:
              type: integer
        status_flags:
          type: array
          description: Lifecycle status flags derived from registry and DNS evidence
          items:
            type: string
            enum:
            - unknown
            - undelegated
            - inactive
            - pending
            - disallowed
            - claimed
            - reserved
            - invalid
            - active
            - parked
            - marketed
            - expiring
            - deleting
            - premium
            - transferable
            - suffix
            - zone
            - tld
        status:
          type: string
          description: status_flags joined with spaces, or unknown when there are none
        lifecycle_phase:
          type: string
          enum:
          - available
          - active
          - expiring
          - deleting
          - reserved
          - unknown
        is_public_suffix:
          type: boolean
        error:
          type: object
          description: Present when this domain could not be checked
          properties:
            code:
              type: string
            message:
              type: string
            suggestion:
              type: string
            cause:
              type: string
    DomainDiscoveryJobResponse:
      type: object
      required:
      - job
      - discovery
      properties:
        job:
          $ref: '#/components/schemas/ApiBatchJob'
        discovery:
          type: object
          required:
          - corpus
          - corpus_version
          - total_matching_words
          - page_offset
          - page_words
          - domain_checks
          - tlds
          - filters
          - credits_per_domain
          - next_cursor
          properties:
            corpus:
              type: string
              enum:
              - iannuttall/unclaimed
            corpus_version:
              type: string
            total_matching_words:
              type: integer
              minimum: 1
            page_offset:
              type: integer
              minimum: 0
            page_words:
              type: integer
              minimum: 1
              maximum: 100
            domain_checks:
              type: integer
              minimum: 1
              maximum: 100
            tlds:
              type: array
              minItems: 1
              maxItems: 5
              items:
                type: string
            filters:
              type: object
              required:
              - min_length
              - max_length
              - singular_only
              properties:
                min_length:
                  type: integer
                  minimum: 1
                  maximum: 63
                max_length:
                  type: integer
                  minimum: 1
                  maximum: 63
                singular_only:
                  type: boolean
            credits_per_domain:
              type: integer
              minimum: 0
              description: Normal /v1/status cost at job creation time.
            next_cursor:
              type:
              - string
              - 'null'
              description: Opaque cursor for the next page of the filtered corpus. Null when the corpus is exhausted.
    NameCheckResponse:
      type: object
      required:
      - name
      - status
      - checked_at
      - verdict
      - score
      - determinacy
      - summary
      - domains
      - handles
      - packages
      - meta
      properties:
        name:
          type: string
          description: The normalized name that was checked.
        status:
          type: string
          enum:
          - ok
          - unknown
          description: 'unknown: no item had a definite answer; refunded.'
        checked_at:
          type: string
          format: date-time
        verdict:
          type: string
          enum:
          - available_everywhere
          - mostly_available
          - contested
          - unknown
          description: 'available_everywhere: every checked item is free. mostly_available: at least 70% of definite results are free. contested: less than 70%. unknown: fewer than half of the items had a definite answer.'
        score:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
          description: Share of definite results that are free.
        determinacy:
          type: integer
          minimum: 0
          maximum: 100
          description: Share of checked items with a definite answer.
        summary:
          type: object
          required:
          - com_available
          - domains
          - handles
          - packages
          properties:
            com_available:
              type:
              - boolean
              - 'null'
            domains:
              $ref: '#/components/schemas/NameCheckSection'
            handles:
              $ref: '#/components/schemas/NameCheckSection'
            packages:
              $ref: '#/components/schemas/NameCheckSection'
        domains:
          type: array
          items:
            type: object
            required:
            - domain
            - tld
            - status
            - reason
            properties:
              domain:
                type: string
              tld:
                type: string
              status:
                type: string
                enum:
                - available
                - taken
                - unknown
              reason:
                type:
                - string
                - 'null'
        handles:
          type: array
          items:
            type: object
            required:
            - platform
            - status
            - url
            - reason
            properties:
              platform:
                type: string
              status:
                type: string
                enum:
                - available
                - taken
                - unknown
                - not_supported
                - invalid
                description: 'invalid: the name breaks this platform handle rules (reason invalid_handle); not counted'
              url:
                type:
                - string
                - 'null'
                description: Profile URL when taken.
              reason:
                type:
                - string
                - 'null'
        packages:
          type: array
          items:
            type: object
            required:
            - registry
            - name
            - status
            - url
            - reason
            properties:
              registry:
                type: string
                enum:
                - npm
                - pypi
                - crates
                - rubygems
                - nuget
                - packagist
                - homebrew
              name:
                type: string
                description: The name as normalized by the registry.
              status:
                type: string
                enum:
                - taken
                - not_found
                - unknown
                - invalid
                description: 'not_found: no package uses the name; the registry may still refuse names too similar to existing ones.'
              url:
                type:
                - string
                - 'null'
              reason:
                type:
                - string
                - 'null'
        meta:
          type: object
          required:
          - duration_ms
          properties:
            duration_ms:
              type: integer
              minimum: 0
    ErrorResponse:
      type: object
      description: Canonical error format shared by every API error response. Endpoint-specific fields (for example credits_remaining, login_url or evidence_summary) may appear next to error or inside it; clients should ignore fields they do not recognise.
      additionalProperties: true
      properties:
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
              description: Stable, upper-case machine code. Codes are never renamed; the full catalog with HTTP status, type and retryability is published as x-domscan-error-codes.
              example: INVALID_DOMAIN
            type:
              type: string
              enum:
              - authentication_error
              - credits_error
              - permission_error
              - not_found_error
              - conflict_error
              - rate_limit_error
              - timeout_error
              - validation_error
              - upstream_error
              - api_error
              - request_error
              description: Stable error category used by official SDK subclasses
            message:
              type: string
              description: Human-readable error message
              example: Invalid domain format
            status:
              type: integer
              minimum: 400
              maximum: 599
              description: HTTP status repeated in the JSON error for queue and log processors
            retryable:
              type: boolean
              description: Whether retrying can be appropriate after applying retry guidance
            request_id:
              type: string
              description: Request identifier matching the X-Request-Id response header
            suggestion:
              type: string
              description: Suggestion for fixing the error
            details:
              type: object
              description: Optional structured context for the error
              additionalProperties: true
            retry_after:
              type: integer
              minimum: 0
              description: Seconds to wait before retrying when the error is temporary
              example: 300
            docs_url:
              type: string
              description: Absolute link to the documentation section for this error
              example: https://domscan.net/docs/check-availability
          required:
          - type
          - code
          - message
          - status
          - retryable
          - request_id
          - docs_url
  headers:
    XRateLimitLimit:
      description: Burst capacity of the rate limit that applies to this API key.
      schema:
        type: integer
        minimum: 0
    XRateLimitReset:
      description: Unix time in seconds when the burst capacity is fully refilled.
      schema:
        type: integer
        minimum: 0
    XRateLimitRemaining:
      description: Requests that can still be sent immediately before the rate limit applies.
      schema:
        type: integer
        minimum: 0
    IdempotentReplayed:
      description: Present and `true` when this response is a stored replay for a repeated Idempotency-Key. A replay charges nothing.
      schema:
        type: string
        enum:
        - 'true'
    XCreditsRemaining:
      description: Credits remaining on the account after this request. Omitted when the balance is not already known without an extra lookup.
      schema:
        type: integer
        minimum: 0
    XCreditsCharged:
      description: Credits charged by this request, net of any refund made in the same request. Sent on authenticated /v1 responses, including errors (0 when nothing was charged).
      schema:
        type: integer
        minimum: 0
    XCacheAge:
      description: Age in whole seconds of the cached data this response used (0 when it was checked fresh). The same value is returned as `cache_age_s`.
      schema:
        type: integer
        minimum: 0
    Sunset:
      description: 'RFC 8594. Sent with Deprecation: the earliest date the deprecated alias may stop working, as an HTTP-date. See /docs/versioning.'
      schema:
        type: string
        example: Sun, 10 Oct 2027 00:00:00 GMT
    Deprecation:
      description: 'RFC 9745. Sent when the request used a deprecated alias: the date it was deprecated, as `@` and Unix seconds. The response body is unchanged.'
      schema:
        type: string
        example: '@1791590400'
    XFieldsIgnored:
      description: 'Sent when `fields` was used and some paths matched nothing in this response: those paths, comma-separated, at most 20.'
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request - invalid parameters
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: Invalid domain format
              suggestion: Domain must be a valid format like example.com
              type: validation_error
              status: 400
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
    IdempotencyInProgress:
      description: A request with the same Idempotency-Key is still running. Retry after Retry-After seconds to receive its stored response. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: IDEMPOTENCY_IN_PROGRESS
              message: A request with this Idempotency-Key is still being processed. Retry shortly to receive its result.
              type: conflict_error
              status: 409
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
              retry_after: 1
    PaymentRequired:
      description: Insufficient credits for this request. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          schema:
            type: integer
          description: Credits remaining on the account
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INSUFFICIENT_CREDITS
              message: Insufficient credits. This endpoint costs 2 credits but you have 0. Purchase more at https://domscan.net/billing or wait for your monthly reset.
              credits_remaining: 0
              credits_required: 2
              purchase_url: https://domscan.net/billing
              type: credits_error
              status: 402
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/credits-pricing
    RateLimited:
      description: Rate limit exceeded. Free accounts can sustain 120 requests per minute per account with a burst capacity of 60. Free bulk traffic is additionally limited to 20 requests per minute per account across all bulk endpoints and 100 per minute per IPv4 address or IPv6 /56 network. Paid accounts can sustain 600 requests per minute with a burst capacity of 120.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          schema:
            type: integer
          description: The immediate burst capacity, or the active bulk fixed-window limit when a bulk-specific limit is exceeded.
        X-RateLimit-Remaining:
          schema:
            type: integer
            example: 0
          description: Immediate burst tokens remaining, or requests remaining in the active bulk fixed window.
        X-RateLimit-Reset:
          schema:
            type: integer
            example: 1791590400
          description: Unix time in seconds when the limit that was exceeded allows a new request again.
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
        X-RateLimit-Plan:
          schema:
            type: string
            enum:
            - free
            - paid
          description: The account plan whose policy was applied.
        X-RateLimit-Policy:
          schema:
            type: string
          description: Machine-readable summary of the active tier and limit policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded. Please wait before making more requests.
              type: rate_limit_error
              status: 429
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/rate-limits
              retry_after: 12
    IdempotencyKeyReused:
      description: The Idempotency-Key was already used by this API key for a different request (method, path, query or body) in the last 24 hours. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: IDEMPOTENCY_KEY_REUSED
              message: This Idempotency-Key was already used with a different request. Use a new key for a new request.
              type: validation_error
              status: 422
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
    Unauthorized:
      description: 'Authentication required. All API endpoints require a valid API key (x-api-key header or Authorization: Bearer) or an active session cookie.'
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_REQUIRED
              message: 'Authentication required. Provide an API key via x-api-key header or Authorization: Bearer header.'
              docs: https://domscan.net/docs/authentication
              get_key: https://domscan.net/login
              type: authentication_error
              status: 401
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/authentication
  parameters:
    DryRun:
      name: dry_run
      in: query
      required: false
      description: 'Set to `true` to return the credit estimate for this exact request instead of running it. Nothing is executed, no source is called and 0 credits are charged. The response has the same shape as POST /v1/estimate plus `dry_run: true`.'
      schema:
        type: string
        enum:
        - 'true'
      example: 'true'
    Fields:
      name: fields
      in: query
      required: false
      x-domscan-global-parameter: true
      description: Comma-separated dot paths to keep in a successful JSON response, e.g. `domain,classification.status` (arrays apply the path to each item; max 50 paths, 6 levels). Unmatched paths are listed in X-Fields-Ignored. Cost is unchanged.
      schema:
        type: string
      example: domain,classification.status
    Naming:
      name: naming
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`snake` returns every camelCase key of a successful JSON response in snake_case (for example `registrarName` becomes `registrar_name`); values are never changed. The `DomScan-Naming: snake` request header does the same; when both are sent this parameter wins, and `default` keeps the original names. Runs before `compact` and `fields`, so `fields` paths use snake_case. Error bodies are already snake_case. Cost is unchanged.'
      schema:
        type: string
        enum:
        - snake
        - default
      example: snake
    MaxAge:
      name: max_age
      in: query
      required: false
      x-domscan-global-parameter: true
      description: Highest acceptable age of cached data, in whole seconds (0 to 2592000). Cached data older than this is checked again; `0` forces a fresh check. Without it the endpoint keeps its default cache policy. The age served is reported in `cache_age_s` and `X-Cache-Age`. Cost is unchanged.
      schema:
        type: integer
        minimum: 0
        maximum: 2592000
      example: 3600
    Compact:
      name: compact
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`true` drops serving metadata (meta timings and served_by, empty warnings/caveats/notes/errors arrays, a request_id that repeats X-Request-Id) from a successful JSON response. Data fields are never removed.'
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
      example: 'true'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional client-chosen key (1 to 255 printable ASCII characters, for example a UUID). Retrying with the same key, API key and identical request within 24 hours returns the stored response with `Idempotent-Replayed: true` and charges nothing again. Responses larger than 1 MiB, and refunded errors, are not stored, so a retry runs normally. Reusing a key for a different request returns 422 IDEMPOTENCY_KEY_REUSED; a duplicate sent while the first is still running returns 409 IDEMPOTENCY_IN_PROGRESS.'
      schema:
        type: string
        minLength: 1
        maxLength: 255
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: 'API key for authentication. Get yours free at https://domscan.net. Also accepts Authorization: Bearer header.'
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Active DomScan browser session. Used by account-management endpoints.
