  /v1/prices/tld/{tld}:
    get:
      tags:
      - Pricing
      summary: Get specific TLD pricing
      description: Read the daily standard-price snapshot for one TLD. Rows include official provenance, freshness, and recommendation eligibility. Each selected registrar pair costs 1 credit.
      operationId: getTldPricing
      parameters:
      - name: tld
        in: path
        required: true
        description: TLD to get pricing for (without dot)
        schema:
          type: string
          example: com
      - name: registrars
        in: query
        description: Comma-separated enabled standard-pricing registrar IDs. Filters reduce pair checks and credits.
        schema:
          type: string
          example: porkbun,dynadot
      - name: skip_cache
        in: query
        description: Compatibility flag. The request does not refresh upstream full-table sources.
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/DryRun'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: TLD pricing details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TldPricingResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-domscan-credits:
        model: per_pair
        default: 1
        note: 1 credit per selected registrar pair for this TLD. Registrar filters reduce the planned and charged pair count.
  /v1/prices/bulk:
    post:
      tags:
      - Pricing
      summary: Bulk TLD pricing
      description: 'Read scheduled standard pricing for up to 50 unique TLDs per HTTP request. Larger portfolios can be split across requests without changing pair billing.


        **Credits:** 1 credit per unique normalized TLD and selected registrar pair. Example: 10 TLDs across 2 registrars = 20 credits. A daily workload of 3,000 TLDs across 5 registrars uses 60 bulk requests and 15,000 credits per day, or 450,000 credits over 30 days. Duplicate TLDs and registrar IDs count once, and registrar filters reduce the planned and charged pair count.'
      operationId: bulkPricing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - tlds
              properties:
                tlds:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 50
                  description: Array of TLDs to price
                  example:
                  - com
                  - net
                  - org
                  - io
                registrars:
                  type: array
                  items:
                    type: string
                  description: Enabled standard-pricing registrar IDs. Metadata-only, disabled, or unconfigured registrars are rejected before pair billing.
                  example:
                  - porkbun
                  - dynadot
                options:
                  type: object
                  properties:
                    skipCache:
                      type: boolean
                      default: false
            example:
              tlds:
              - com
              - net
              - org
              registrars:
              - porkbun
              - dynadot
      responses:
        '200':
          description: Bulk pricing results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkPricingResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          $ref: '#/components/responses/IdempotencyInProgress'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/DryRun'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-domscan-credits:
        model: per_pair
        default: 1
        note: 1 credit per unique normalized TLD and selected registrar pair. Duplicate TLDs and registrar IDs count once, and registrar filters reduce the planned and charged pair count.
