        model: per_request
        default: 0
  /v1/prices/compare:
    get:
      tags:
      - Pricing
      summary: Compare domain prices
      description: Return scheduled standard rows for the domain's TLD plus separate official exact-domain quotes from configured registrars. Premium and availability behavior stays in exact_quotes; missing renewal or transfer values remain null. Each unique TLD and selected registrar pair costs exactly 1 credit. A standard row and exact-domain quote for the same pair are returned separately but billed once total. A failed or unknown exact quote is refunded 1 credit only when no standard row for that pair is returned; with a standard row, the refund is 0.
      operationId: comparePrices
      parameters:
      - name: domain
        in: query
        required: true
        description: Full domain name to compare prices for
        schema:
          type: string
          example: example.com
      - name: registrars
        in: query
        description: Comma-separated enabled standard or configured exact-domain registrar IDs. Filters reduce checks and credits.
        schema:
          type: string
          example: porkbun
      - name: skip_cache
        in: query
        description: Compatibility flag for standard rows. Exact-domain adapters still perform their documented live checks.
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/DryRun'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Price comparison with recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceCompareResponse'
              example:
                success: true
                data:
                  domain: brandpilot.com
                  tld: com
                  pricing:
                    tld: com
                    prices:
                    - registrar: namecheap
                      registrarName: Namecheap
                      register: 6.98
                      renew: 17.98
                      transfer: 9.16
                      currency: USD
                      features:
                        freeWhoisPrivacy: true
                        freeDns: true
                      lastUpdated: '2026-10-09T18:00:00.000Z'
                      source: api
                      sourceName: Namecheap users.getPricing API
