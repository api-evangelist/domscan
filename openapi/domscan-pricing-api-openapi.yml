components:
  headers:
    XRateLimitLimit:
      description: Burst capacity of the rate limit that applies to this API key.
      schema:
        type: integer
        minimum: 0
    XRateLimitReset:
      description: Unix time in seconds when the burst capacity is fully refilled.
      schema:
        type: integer
        minimum: 0
    XRateLimitRemaining:
      description: Requests that can still be sent immediately before the rate limit applies.
      schema:
        type: integer
        minimum: 0
    IdempotentReplayed:
      description: Present and `true` when this response is a stored replay for a repeated Idempotency-Key. A replay charges nothing.
      schema:
        type: string
        enum:
        - 'true'
    XCreditsRemaining:
      description: Credits remaining on the account after this request. Omitted when the balance is not already known without an extra lookup.
      schema:
        type: integer
        minimum: 0
    XCreditsCharged:
      description: Credits charged by this request, net of any refund made in the same request. Sent on authenticated /v1 responses, including errors (0 when nothing was charged).
      schema:
        type: integer
        minimum: 0
    XFieldsIgnored:
      description: 'Sent when `fields` was used and some paths matched nothing in this response: those paths, comma-separated, at most 20.'
      schema:
        type: string
  schemas:
    PricingCheckAccounting:
      type: object
      description: Transparent pair-check plan and charge. Each unique TLD and selected registrar pair costs 1 credit across standard lookups, bulk requests, and comparisons. Duplicate inputs count once and registrar filters reduce the pair count. A standard row and exact-domain quote for the same pair are billed once total. A failed or unknown exact quote is refunded 1 credit only when no standard row for that pair is returned.
      properties:
        plannedChecks:
          type: integer
          minimum: 0
          description: Unique TLD and selected registrar pairs after input normalization and filters.
        actualChecks:
          type: integer
          minimum: 0
          description: Unique TLD and selected registrar pairs whose standard row or exact quote was evaluated.
        successfulRows:
          type: integer
          minimum: 0
          description: Successfully returned pricing rows or non-error exact quotes; this can be lower than actualChecks.
        creditsCharged:
          type: integer
          minimum: 0
          description: 'Net credits charged for this response: plannedChecks multiplied by creditsPerCheck, minus creditsRefunded. A standard row and exact-domain quote for the same pair are counted once. Zero for unbilled requests.'
        creditsPerCheck:
          type: integer
          enum:
          - 1
          description: Credit cost for each unique TLD and selected registrar pair in this request. This is 1 across standard lookups, bulk requests, and comparisons.
        liveQuoteChecks:
          type: integer
          minimum: 0
          description: 'GET /v1/prices/compare only: selected registrar pairs with an exact-domain quote outcome. This is diagnostic; the pair is counted once even when a standard row is also returned.'
        creditsPerLiveQuote:
          type: integer
          enum:
          - 1
          description: 'GET /v1/prices/compare only: per-pair credit rate for exact-domain quote outcomes. It equals creditsPerCheck, so the same pair is never charged twice.'
        creditsRefunded:
          type: integer
          minimum: 0
          description: 'GET /v1/prices/compare only: 1 credit returned when an exact-domain quote errors or stays unknown and no standard row for that pair is returned. The refund is 0 when the standard row is returned.'
        selectedRegistrars:
          type: array
          items:
            type: string
          description: Normalized registrar set applied to this request.
      required:
      - plannedChecks
      - actualChecks
      - successfulRows
      - creditsCharged
      - creditsPerCheck
      - selectedRegistrars
