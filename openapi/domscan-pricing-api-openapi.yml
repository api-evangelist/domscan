          - not_checked
          - error
        recommendation_basis:
          type: string
          enum:
          - lowest_register
          - renewal_savings
          - transfer_savings
          - no_price_data
          - domain_unavailable
          - insufficient_coverage
    RegistrarsResponse:
      type: object
      description: Registrar metadata with explicit pricing-integration coverage.
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            registrars:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  website:
                    type: string
                    format: uri
                  apiAvailable:
                    type: boolean
                    description: Whether the registrar is known to publish an API. This does not mean DomScan integrates its pricing.
                  providerType:
                    type: string
                    enum:
                    - registrar
                    - reseller
                    - hosting_platform
                    description: Commercial role of the provider. Hosting platforms and resellers are not presented as accredited registrars.
                  pricingIntegrated:
                    type: boolean
                  pricingIntegration:
                    type:
                    - string
                    - 'null'
                    enum:
                    - official_api
                    - official_page
                    - exact_domain_api
                    - null
                    description: Legacy primary integration label. Use standardPricingIntegration, exactDomainPricingIntegrated, and pricingModes when a provider supports both modes.
                  standardPricingIntegration:
                    type:
                    - string
                    - 'null'
                    enum:
                    - official_api
                    - official_page
                    - null
                    description: Official source type for scheduled standard-TLD pricing, or null when standard pricing is not enabled.
                  exactDomainPricingIntegrated:
                    type: boolean
                    description: Whether credential-backed exact-domain quotes are enabled for this provider.
                  pricingModes:
                    type: array
                    items:
                      type: string
                      enum:
                      - tld_standard
                      - exact_domain
                    description: Every enabled pricing mode for this provider. Providers can expose both modes.
                  features:
                    type: object
                    properties:
                      freeWhoisPrivacy:
                        type: boolean
                      freeDns:
                        type: boolean
                      bulkDiscounts:
                        type: boolean
            pricingCoverage:
              type: object
              properties:
                listedRegistrarCount:
                  type: integer
                integratedRegistrarCount:
                  type: integer
                standardPricingSources:
                  type: array
                  items:
                    type: string
                directPricingSources:
                  type: array
                  items:
                    type: string
                scrapedPricingSources:
                  type: array
                  items:
                    type: string
                exactDomainPricingSources:
                  type: array
                  items:
                    type: string
                snapshotGeneratedAt:
                  type:
                  - string
                  - 'null'
                  format: date-time
                sourceHealth:
                  type: array
                  items:
                    type: object
                    properties:
                      source:
                        type: string
                      registrar:
                        type:
                        - string
                        - 'null'
                      configured:
                        type: boolean
                      success:
                        type: boolean
                      sourceType:
                        type:
                        - string
                        - 'null'
                      tldCount:
                        type: integer
                      durationMs:
                        type: integer
                      error:
                        type:
                        - string
                        - 'null'
                      retainedPreviousSnapshot:
                        type: boolean
                      runId:
                        type: string
                        description: Immutable ingestion run identifier for this observation.
                      fetchedAt:
                        type: string
                        format: date-time
                      previousTldCount:
                        type:
                        - integer
                        - 'null'
                      lastSuccessAt:
                        type:
                        - string
                        - 'null'
                        format: date-time
                      contentHash:
                        type:
                        - string
                        - 'null'
                        description: SHA-256 of the normalized parsed source rows.
                      schemaFingerprint:
                        type:
                        - string
                        - 'null'
                        description: Parsed row and operation-field coverage fingerprint.
                      fieldCoverage:
                        type: object
                        properties:
                          register:
                            type: integer
                          renew:
                            type: integer
                          transfer:
                            type: integer
                note:
                  type: string
            lastUpdated:
              type: string
              format: date-time
              description: Time this metadata response was generated, not price freshness.
        meta:
          $ref: '#/components/schemas/PricingMeta'
    ErrorResponse:
      type: object
      description: Canonical error format shared by every API error response. Endpoint-specific fields (for example credits_remaining, login_url or evidence_summary) may appear next to error or inside it; clients should ignore fields they do not recognise.
      additionalProperties: true
      properties:
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
              description: Stable, upper-case machine code. Codes are never renamed; the full catalog with HTTP status, type and retryability is published as x-domscan-error-codes.
              example: INVALID_DOMAIN
            type:
              type: string
              enum:
              - authentication_error
              - credits_error
              - permission_error
              - not_found_error
              - conflict_error
              - rate_limit_error
              - timeout_error
              - validation_error
              - upstream_error
              - api_error
              - request_error
              description: Stable error category used by official SDK subclasses
            message:
              type: string
              description: Human-readable error message
              example: Invalid domain format
            status:
              type: integer
              minimum: 400
              maximum: 599
              description: HTTP status repeated in the JSON error for queue and log processors
            retryable:
              type: boolean
              description: Whether retrying can be appropriate after applying retry guidance
            request_id:
              type: string
              description: Request identifier matching the X-Request-Id response header
            suggestion:
              type: string
              description: Suggestion for fixing the error
            details:
              type: object
              description: Optional structured context for the error
              additionalProperties: true
            retry_after:
              type: integer
              minimum: 0
              description: Seconds to wait before retrying when the error is temporary
              example: 300
            docs_url:
              type: string
              description: Absolute link to the documentation section for this error
              example: https://domscan.net/docs/check-availability
          required:
          - type
          - code
          - message
          - status
          - retryable
          - request_id
          - docs_url
  responses:
    BadRequest:
      description: Bad request - invalid parameters
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: Invalid domain format
              suggestion: Domain must be a valid format like example.com
              type: validation_error
              status: 400
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
    IdempotencyInProgress:
      description: A request with the same Idempotency-Key is still running. Retry after Retry-After seconds to receive its stored response. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: IDEMPOTENCY_IN_PROGRESS
              message: A request with this Idempotency-Key is still being processed. Retry shortly to receive its result.
              type: conflict_error
              status: 409
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
              retry_after: 1
    PaymentRequired:
      description: Insufficient credits for this request. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          schema:
            type: integer
          description: Credits remaining on the account
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INSUFFICIENT_CREDITS
              message: Insufficient credits. This endpoint costs 2 credits but you have 0. Purchase more at https://domscan.net/billing or wait for your monthly reset.
              credits_remaining: 0
              credits_required: 2
              purchase_url: https://domscan.net/billing
              type: credits_error
              status: 402
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/credits-pricing
    RateLimited:
      description: Rate limit exceeded. Free accounts can sustain 120 requests per minute per account with a burst capacity of 60. Free bulk traffic is additionally limited to 20 requests per minute per account across all bulk endpoints and 100 per minute per IPv4 address or IPv6 /56 network. Paid accounts can sustain 600 requests per minute with a burst capacity of 120.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          schema:
            type: integer
          description: The immediate burst capacity, or the active bulk fixed-window limit when a bulk-specific limit is exceeded.
        X-RateLimit-Remaining:
          schema:
            type: integer
            example: 0
          description: Immediate burst tokens remaining, or requests remaining in the active bulk fixed window.
        X-RateLimit-Reset:
          schema:
            type: integer
            example: 1791590400
          description: Unix time in seconds when the limit that was exceeded allows a new request again.
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
        X-RateLimit-Plan:
          schema:
            type: string
            enum:
            - free
            - paid
          description: The account plan whose policy was applied.
        X-RateLimit-Policy:
          schema:
            type: string
          description: Machine-readable summary of the active tier and limit policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded. Please wait before making more requests.
              type: rate_limit_error
              status: 429
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/rate-limits
              retry_after: 12
    IdempotencyKeyReused:
      description: The Idempotency-Key was already used by this API key for a different request (method, path, query or body) in the last 24 hours. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: IDEMPOTENCY_KEY_REUSED
              message: This Idempotency-Key was already used with a different request. Use a new key for a new request.
              type: validation_error
              status: 422
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
    ServiceUnavailable:
      description: The pricing request could not complete. Any base and supplemental pair charges are refunded.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: SOURCE_UNAVAILABLE
              message: Service temporarily unavailable
              type: upstream_error
              status: 503
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/error-codes
    Unauthorized:
      description: 'Authentication required. All API endpoints require a valid API key (x-api-key header or Authorization: Bearer) or an active session cookie.'
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_REQUIRED
              message: 'Authentication required. Provide an API key via x-api-key header or Authorization: Bearer header.'
              docs: https://domscan.net/docs/authentication
              get_key: https://domscan.net/login
              type: authentication_error
              status: 401
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/authentication
  parameters:
    DryRun:
      name: dry_run
      in: query
      required: false
      description: 'Set to `true` to return the credit estimate for this exact request instead of running it. Nothing is executed, no source is called and 0 credits are charged. The response has the same shape as POST /v1/estimate plus `dry_run: true`.'
      schema:
        type: string
        enum:
        - 'true'
      example: 'true'
    Fields:
      name: fields
      in: query
      required: false
      x-domscan-global-parameter: true
      description: Comma-separated dot paths to keep in a successful JSON response, e.g. `domain,classification.status` (arrays apply the path to each item; max 50 paths, 6 levels). Unmatched paths are listed in X-Fields-Ignored. Cost is unchanged.
      schema:
        type: string
      example: domain,classification.status
    Naming:
      name: naming
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`snake` returns every camelCase key of a successful JSON response in snake_case (for example `registrarName` becomes `registrar_name`); values are never changed. The `DomScan-Naming: snake` request header does the same; when both are sent this parameter wins, and `default` keeps the original names. Runs before `compact` and `fields`, so `fields` paths use snake_case. Error bodies are already snake_case. Cost is unchanged.'
      schema:
        type: string
        enum:
        - snake
        - default
      example: snake
    Compact:
      name: compact
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`true` drops serving metadata (meta timings and served_by, empty warnings/caveats/notes/errors arrays, a request_id that repeats X-Request-Id) from a successful JSON response. Data fields are never removed.'
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
      example: 'true'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'Optional client-chosen key (1 to 255 printable ASCII characters, for example a UUID). Retrying with the same key, API key and identical request within 24 hours returns the stored response with `Idempotent-Replayed: true` and charges nothing again. Responses larger than 1 MiB, and refunded errors, are not stored, so a retry runs normally. Reusing a key for a different request returns 422 IDEMPOTENCY_KEY_REUSED; a duplicate sent while the first is still running returns 409 IDEMPOTENCY_IN_PROGRESS.'
      schema:
        type: string
        minLength: 1
        maxLength: 255
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: 'API key for authentication. Get yours free at https://domscan.net. Also accepts Authorization: Bearer header.'
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Active DomScan browser session. Used by account-management endpoints.
externalDocs:
  description: Full API Documentation
  url: https://domscan.net/docs
x-rapidapi-product: domscan
x-domscan-rate-limits:
  free:
    general:
      scope: account
      sustained_requests_per_minute: 120
      burst_capacity: 60
      shared_across_api_keys_and_sessions: true
    bulk:
      scope: all bulk endpoints combined
      account_requests_per_minute: 20
      network_requests_per_minute: 100
      ipv6_network_prefix: 56
  paid:
    general:
      scope: API key for key-authenticated requests; IP for browser sessions
      sustained_requests_per_minute: 600
      burst_capacity: 120
    free_bulk_budget_applies: false
  response:
    status: 429
    retry_header: Retry-After
    headers_on_every_authenticated_response:
    - X-RateLimit-Plan
    - X-RateLimit-Limit
    - X-RateLimit-Remaining
    - X-RateLimit-Reset
    - X-RateLimit-Policy
    reset_header: X-RateLimit-Reset
    burst_headers:
    - X-RateLimit-Limit
    - X-RateLimit-Remaining
    policy_header: X-RateLimit-Policy
