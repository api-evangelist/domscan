openapi: 3.2.0
info:
  title: DomScan Typosquatting API
  description: 'DomScan is a domain intelligence API providing domain analysis tools. **Core Features:**

    - Domain Availability: Check single or bulk domains using RDAP with 1,100+ TLDs supported

    - Domain Intelligence: AI suggestions, valuations, health checks, typosquatting detection

    - OSINT Tools: DNS lookup, WHOIS/RDAP, SSL certificates, subdomain discovery, IP geolocation, tech stack detection

    - Social & Branding: Social handle checker, brand name scoring

    - Phone Intelligence: Privacy-first phone number validation, normalization, and classification

    - Pricing: Scheduled standard-TLD tables from verified official registrar sources, plus separate credential-backed exact-domain quotes

    - Watchlist: Domain monitoring for expiration and availability alerts


    **Authentication:**

    Most API endpoints require authentication. Pass your API key via the x-api-key header or Authorization: Bearer header. Operations marked with an empty security requirement are intentionally public, including API specifications and selected catalog endpoints. Get your free API key at https://domscan.net/dashboard. Logged-in users on domscan.net tools pages are authenticated automatically via session cookie. **Rate Limits:**

    Free accounts can sustain 120 requests per minute per account, with a burst capacity of 60. All API keys and dashboard sessions belonging to the same free account share this budget. Bulk endpoints have an additional free-tier budget of 20 HTTP requests per minute per account across all bulk endpoints. Free-tier bulk traffic is also capped at 100 requests per minute per IPv4 address or IPv6 /56 network. Platform-wide edge protections still apply to every tier. Paid accounts can sustain 600 requests per minute, with a burst capacity of 120, shared by every API key and dashboard session of the account. Paid accounts do not receive the additional free-tier bulk budget. Scope: RapidAPI subscribers are counted per subscriber. (scope=rapidapi-customer) Zyla subscribers are counted per subscriber when the gateway identifies them, (scope=zyla-customer) and as one shared gateway budget when it does not. (scope=zyla-gateway) Other authenticated requests are counted per account: every API key and dashboard session of the account shares one budget. (scope=account) A key that is not linked to an account is counted on its own. (scope=api-key) Unauthenticated requests to public endpoints are counted per client IP address (scope unknown when the address cannot be determined, as one shared budget). (scope=ip)


    Every authenticated response, success or error, includes X-RateLimit-Plan, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, and X-RateLimit-Policy. X-RateLimit-Limit and X-RateLimit-Remaining describe the immediate burst bucket; X-RateLimit-Reset is the Unix time in seconds when that bucket is full again; X-RateLimit-Policy also states the sustained per-minute rate, scope, and any free bulk limits. Exceeding a limit returns HTTP 429 with Retry-After. Retry only after the indicated delay. **Credits System:**

    API calls consume credits based on endpoint complexity. Sign up for free to receive 10,000 credits monthly. - 1 credit: Status checks, DNS lookups, tool builders

    - 2-5 credits: Health checks, valuations, OSINT tools

    - Bulk endpoints: standard per-item rate for batching multiple items into fewer HTTP requests. - 6-25 credits: Recipe compound operations


    When credits reach zero, the API returns HTTP 402 with credits_remaining, credits_required, and a purchase_url. API responses include X-Credits-Requested, X-Credits-Charged, and X-Credits-Refunded. X-Credits-Charged is the net charge after any refund made during the request. Authenticated responses also include X-Credits-Remaining whenever the balance is known without an extra lookup. Free credits refresh monthly on the account''s signup anniversary. POST /v1/estimate returns the credits a request would charge without running it, at no cost.'
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: Typosquatting
  description: Detect typosquatting and brand impersonation risks
paths:
  /v1/typos:
    get:
      tags:
      - Typosquatting
      summary: Detect typosquatting threats
      description: Generate typosquatting permutations using multiple techniques (character swap, missing char, extra char, homoglyphs, etc.) and optionally check which are registered. Includes risk scoring based on similarity to original domain.
      operationId: getTyposquatting
      parameters:
      - name: domain
        in: query
        required: true
        description: Domain to analyze for typosquatting risks
        schema:
          type: string
          example: google.com
      - name: check_registered
        in: query
        description: Check if generated typos are actually registered. Disabled by default and capped for faster responses.
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        description: Maximum permutations to generate and check
        schema:
          type: integer
          default: 100
          minimum: 10
          maximum: 500
      - name: include_tld_swap
        in: query
        description: Include TLD variation permutations (e.g., .co instead of .com)
        schema:
          type: boolean
          default: true
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Typosquatting analysis with risk summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TyposResponse'
              example:
                domain: google.com
                name: google
                tld: com
                permutations_generated: 100
                permutations_checked: 95
                registered_typos:
                - domain: gooogle.com
                  name: gooogle
                  tld: com
                  type: repetition
                  risk: high
                  description: Repeated character
                  registered: true
                - domain: gogle.com
                  name: gogle
                  tld: com
                  type: omission
                  risk: critical
                  description: Missing character
                  registered: true
                available_typos: 50
                risk_summary:
                  critical: 2
                  high: 5
                  medium: 10
                  low: 28
                threat_level: high
                checked_at: '2024-01-15T12:00:00Z'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 2
        variants:
        - parameter: check_registered
          equals: true
          credits: 3
        note: 2 credits by default; 3 credits when check_registered=true.
  /v1/typos/threats:
    get:
      tags:
      - Typosquatting
      summary: Run a live typosquatting threat scan
      description: Generate up to the requested number of typo variants, then check at most 75 supported variants for live registration and DNS activity. scan_summary reports the live-check limit and whether coverage was truncated.
      operationId: analyzeTyposquattingThreats
      parameters:
      - name: domain
        in: query
        required: true
        description: Domain to analyze
        schema:
          type: string
          example: example.com
      - name: limit
        in: query
        description: Maximum variants to generate. Live registration checks are capped at 75.
        schema:
          type: integer
          minimum: 50
          maximum: 500
          default: 200
      - name: include_tld_swap
        in: query
        description: Include alternate-TLD variants
        schema:
          type: boolean
          default: true
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Live typosquatting threat analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TyposThreatAnalysisResponse'
              example:
                domain: example.com
                name: example
                tld: com
                scan_summary:
                  permutations_generated: 109
                  permutations_checked: 75
                  permutations_submitted: 75
                  definitive_results: 71
                  unknown_results: 4
                  omitted_results: 0
                  registered_count: 2
                  active_threats: 2
                  available_for_defensive: 69
                  check_limit: 75
                  coverage_truncated: true
                threat_level: high
                protection_score:
                  score: 2
                  grade: F
                  interpretation:
                    score_meaning: Higher score = less vulnerable to typosquatting attacks
                    factors: Domain length, homoglyph-susceptible characters, keyboard adjacency, TLD popularity, registered typosquats
                    note: Short, well-known domains score lower because they have a larger inherent attack surface for typosquatting, not because they lack brand protection measures.
                  vulnerabilities:
                  - category: homoglyph
                    count: 4
                    risk: critical
                    description: Contains 4 characters with visual lookalikes (e, a, l)
                  - category: keyboard
                    count: 5
                    risk: high
                    description: 5 characters have many keyboard neighbors
                  - category: tld
                    count: 1
                    risk: medium
                    description: .com is a high-value TLD commonly targeted by typosquatters
                  - category: registered_high
                    count: 1
                    risk: high
                    description: 1 high-risk typosquat domains are registered
                  recommendations:
                  - Consider defensive registrations for common homoglyph variants
                  - Consider registering example on alternative TLDs like .net, .org
                  factors:
                    length_factor: 90
                    homoglyph_factor: 68
                    keyboard_factor: 75
                    tld_factor: 80
                threats:
                - domain: xeample.com
                  type: transposition
                  risk: high
                  description: Swapped 'e' and 'x'
                  dns_active: true
                  has_website: true
                  has_mx: false
                  infrastructure:
                    nameservers: []
                  threat_indicators:
                  - Active DNS configuration
                  - Domain resolves to IP (potential website)
                  threat_score: 75
                - domain: example.net
                  type: tld-swap
                  risk: medium
                  description: TLD changed from .com to .net
                  dns_active: true
                  has_website: false
                  has_mx: false
                  infrastructure:
                    nameservers: []
                  threat_indicators:
                  - Active DNS configuration
                  threat_score: 40
                defensive_opportunities:
                - domain: 3xample.com
                  type: homoglyph
                  risk: critical
                - domain: ex4mple.com
                  type: homoglyph
                  risk: critical
                - domain: eaxmple.com
                  type: transposition
                  risk: high
                risk_breakdown:
                  critical: []
                  high:
                  - domain: xeample.com
                    name: xeample
                    tld: com
                    type: transposition
                    risk: high
                    description: Swapped 'e' and 'x'
                    registered: true
                    checked_at: '2026-10-09T10:15:29.000Z'
                    dns_active: true
                    has_website: true
                    has_mx: false
                    infrastructure:
                      nameservers: []
                    threat_indicators:
                    - Active DNS configuration
                    - Domain resolves to IP (potential website)
                    threat_score: 75
                  medium:
                  - domain: example.net
                    name: example
                    tld: net
                    type: tld-swap
                    risk: medium
                    description: TLD changed from .com to .net
                    registered: true
                    checked_at: '2026-10-09T10:15:29.000Z'
                    dns_active: true
                    has_website: false
                    has_mx: false
                    infrastructure:
                      nameservers: []
                    threat_indicators:
                    - Active DNS configuration
                    threat_score: 40
                  low: []
                recommendations:
                - 2 registered typosquat domains have active DNS/websites. Monitor for phishing or brand abuse.
                - 18 high-risk typosquat domains are available. Consider defensive registration to protect your brand.
                - Your domain has significant typosquatting vulnerability. Set up continuous monitoring for new registrations.
                checked_at: '2026-10-09T10:15:30.000Z'
                scan_duration_ms: 4120
                meta:
                  served_by: pop=MAD country=ES
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Threat analysis failed
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; equals error.request_id in the body.
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL
                  message: Threat analysis failed
                  type: api_error
                  status: 500
                  retryable: false
                  request_id: m5x7k2p-a9f3
                  docs_url: https://domscan.net/docs/error-codes
      x-domscan-credits:
        model: per_request
        default: 12
  /v1/typos/report:
    get:
      tags:
      - Typosquatting
      summary: Generate a brand protection report
      description: Generate up to 300 variants, live-check at most 60 supported variants, and return an executive summary, coverage metadata, defensive registration priorities, and monitoring recommendations.
      operationId: generateTyposquattingReport
      parameters:
      - name: domain
        in: query
        required: true
        description: Domain to analyze
        schema:
          type: string
          example: example.com
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Brand protection report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandProtectionReportResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Report generation failed
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; equals error.request_id in the body.
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL
                  message: Report generation failed
                  type: api_error
                  status: 500
                  retryable: false
                  request_id: m5x7k2p-a9f3
                  docs_url: https://domscan.net/docs/error-codes
      x-domscan-credits:
        model: per_request
        default: 18
  /v1/typos/quick:
    get:
      tags:
      - Typosquatting
      summary: Find registered typo domains quickly
      description: Check a smaller typo set and return only registered variants with their permutation type and risk level.
      operationId: quickTyposquattingCheck
      parameters:
      - name: domain
        in: query
        required: true
        description: Domain to analyze
        schema:
          type: string
          example: example.com
      - name: limit
        in: query
        description: Maximum variants to check
        schema:
          type: integer
          minimum: 20
          maximum: 200
          default: 100
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Registered typo domains
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickTyposResponse'
              example:
                domain: example.com
                registered_typos:
                - domain: xeample.com
                  type: transposition
                  risk: high
                  description: Swapped 'e' and 'x'
                - domain: example.net
                  type: tld-swap
                  risk: medium
                  description: TLD changed from .com to .net
                count: 2
                threat_level: high
                coverage:
                  requested: 98
                  definitive: 92
                  unknown: 6
                  omitted: 0
                checked_at: '2026-10-09T10:15:30.000Z'
                scan_duration_ms: 2840
                meta:
                  served_by: pop=MAD country=ES
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Quick threat check failed
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; equals error.request_id in the body.
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INTERNAL
                  message: Quick threat check failed
                  type: api_error
                  status: 500
                  retryable: false
                  request_id: m5x7k2p-a9f3
                  docs_url: https://domscan.net/docs/error-codes
      x-domscan-credits:
        model: per_request
        default: 6
  /v1/typos/permutations:
    get:
      tags:
      - Typosquatting
      summary: Generate typo permutations
      description: Generate typosquatting permutations without checking registration status. Faster endpoint for generating variations only, useful for proactive brand protection planning.
      operationId: getTypoPermutations
      parameters:
      - name: domain
        in: query
        required: true
        description: Domain to generate permutations for
        schema:
          type: string
          example: example.com
      - name: limit
        in: query
        description: Maximum permutations to generate
        schema:
          type: integer
          default: 200
          minimum: 10
          maximum: 1000
      - name: include_tld_swap
        in: query
        description: Include TLD variation permutations
        schema:
          type: boolean
          default: true
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Generated permutations grouped by type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermutationsResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 1
  /v1/typos/score:
    get:
      tags:
      - Typosquatting
      summary: Calculate protection score
      description: Calculate a typosquatting protection score for a domain. Shows how vulnerable the domain is based on name characteristics and optionally factors in registered typos.
      operationId: getProtectionScore
      parameters:
      - name: domain
        in: query
        required: true
        description: Domain to score
        schema:
          type: string
          example: example.com
      - name: check_registered
        in: query
        description: Factor in registered typos when calculating score (slower)
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Protection score analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectionScoreResponse'
              example:
                domain: example.com
                name: example
                tld: com
                protection:
                  score: 65
                  grade: C
                  interpretation:
                    score_meaning: Higher score = less vulnerable to typosquatting attacks
                    factors: Domain length, homoglyph-susceptible characters, keyboard adjacency, TLD popularity, registered typosquats
                    note: Short, well-known domains score lower because they have a larger inherent attack surface for typosquatting, not because they lack brand protection measures.
                  vulnerabilities:
                  - category: homoglyph
                    count: 3
                    risk: high
                    description: Characters with common lookalikes
                  recommendations:
                  - Consider registering common typo variations
                  - Monitor for homoglyph attacks
                  factors:
                    length_factor: 70
                    homoglyph_factor: 60
                    keyboard_factor: 55
                    tld_factor: 40
                checked_at: '2024-01-15T12:00:00Z'
                meta:
                  served_by: pop=MAD country=ES
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 1
components:
  schemas:
    TyposResponse:
      type: object
      description: Typosquatting detection results
      properties:
        domain:
          type: string
          description: Domain analyzed
        name:
          type: string
          description: Domain name without TLD
        tld:
          type: string
          description: TLD
        permutations_generated:
          type: integer
          description: Number of permutations generated
        permutations_checked:
          type: integer
          description: Number actually checked
        registered_typos:
          type: array
          description: Registered typo domains found
          items:
            $ref: '#/components/schemas/TypoCheckResult'
        available_typos:
          type: integer
          description: Number of available typo domains
        unknown_typos:
          type: integer
        risk_summary:
          type: object
          properties:
            critical:
              type: integer
            high:
              type: integer
            medium:
              type: integer
            low:
              type: integer
        threat_level:
          type: string
          enum:
          - none
          - low
          - medium
          - high
          - critical
        family_summary:
          $ref: '#/components/schemas/TypoFamilySummary'
        checked_at:
          type: string
          format: date-time
        check_duration_ms:
          type: integer
        meta:
          type: object
          properties:
            served_by:
