openapi: 3.2.0
info:
  title: DomScan Privacy API
  description: 'DomScan is a domain intelligence API providing domain analysis tools. **Core Features:**

    - Domain Availability: Check single or bulk domains using RDAP with 1,100+ TLDs supported

    - Domain Intelligence: AI suggestions, valuations, health checks, typosquatting detection

    - OSINT Tools: DNS lookup, WHOIS/RDAP, SSL certificates, subdomain discovery, IP geolocation, tech stack detection

    - Social & Branding: Social handle checker, brand name scoring

    - Phone Intelligence: Privacy-first phone number validation, normalization, and classification

    - Pricing: Scheduled standard-TLD tables from verified official registrar sources, plus separate credential-backed exact-domain quotes

    - Watchlist: Domain monitoring for expiration and availability alerts


    **Authentication:**

    Most API endpoints require authentication. Pass your API key via the x-api-key header or Authorization: Bearer header. Operations marked with an empty security requirement are intentionally public, including API specifications and selected catalog endpoints. Get your free API key at https://domscan.net/dashboard. Logged-in users on domscan.net tools pages are authenticated automatically via session cookie. **Rate Limits:**

    Free accounts can sustain 120 requests per minute per account, with a burst capacity of 60. All API keys and dashboard sessions belonging to the same free account share this budget. Bulk endpoints have an additional free-tier budget of 20 HTTP requests per minute per account across all bulk endpoints. Free-tier bulk traffic is also capped at 100 requests per minute per IPv4 address or IPv6 /56 network. Platform-wide edge protections still apply to every tier. Paid accounts can sustain 600 requests per minute, with a burst capacity of 120, shared by every API key and dashboard session of the account. Paid accounts do not receive the additional free-tier bulk budget. Scope: RapidAPI subscribers are counted per subscriber. (scope=rapidapi-customer) Zyla subscribers are counted per subscriber when the gateway identifies them, (scope=zyla-customer) and as one shared gateway budget when it does not. (scope=zyla-gateway) Other authenticated requests are counted per account: every API key and dashboard session of the account shares one budget. (scope=account) A key that is not linked to an account is counted on its own. (scope=api-key) Unauthenticated requests to public endpoints are counted per client IP address (scope unknown when the address cannot be determined, as one shared budget). (scope=ip)


    Every authenticated response, success or error, includes X-RateLimit-Plan, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, and X-RateLimit-Policy. X-RateLimit-Limit and X-RateLimit-Remaining describe the immediate burst bucket; X-RateLimit-Reset is the Unix time in seconds when that bucket is full again; X-RateLimit-Policy also states the sustained per-minute rate, scope, and any free bulk limits. Exceeding a limit returns HTTP 429 with Retry-After. Retry only after the indicated delay. **Credits System:**

    API calls consume credits based on endpoint complexity. Sign up for free to receive 10,000 credits monthly. - 1 credit: Status checks, DNS lookups, tool builders

    - 2-5 credits: Health checks, valuations, OSINT tools

    - Bulk endpoints: standard per-item rate for batching multiple items into fewer HTTP requests. - 6-25 credits: Recipe compound operations


    When credits reach zero, the API returns HTTP 402 with credits_remaining, credits_required, and a purchase_url. API responses include X-Credits-Requested, X-Credits-Charged, and X-Credits-Refunded. X-Credits-Charged is the net charge after any refund made during the request. Authenticated responses also include X-Credits-Remaining whenever the balance is known without an extra lookup. Free credits refresh monthly on the account''s signup anniversary. POST /v1/estimate returns the credits a request would charge without running it, at no cost.'
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: Privacy
  description: Website legal pages, consent tooling and trackers
paths:
  /v1/legal-compliance:
    get:
      tags:
      - Privacy
      summary: Legal pages, consent tooling and trackers on a website
      description: Read one public page and report the legal documents and controls it links to (privacy policy, terms, cookie policy, imprint or legal notice, accessibility statement, "Do Not Sell or Share" / "Your Privacy Choices", contact and refund or withdrawal policy, matched in 15 languages), the consent tooling it loads (26 consent platforms, IAB TCF and GPP stubs, Google Consent Mode, settings controls and banner markup), the known trackers its HTML references, and jurisdiction hints from the country-code TLD. Each signal is found, not_found (the whole page was received and nothing matched) or unknown (a script shell, a truncated page, a footer added by script, or consent tooling that only appears after scripts run). Results are technical evidence for review, not a legal assessment. 2 credits; 6 with render=true. Refunded when the page cannot be analysed (status other than ok).
      operationId: getLegalCompliance
      parameters:
      - name: url
        in: query
        required: true
        description: Page URL or bare domain. Usually the home page.
        schema:
          type: string
        example: https://www.allbirds.com/
      - name: render
        in: query
        description: Run page JavaScript in an isolated browser first, so links, banners and trackers added by script are seen. 6 credits instead of 2.
        schema:
          type: boolean
          default: false
      - name: verify_links
        in: query
        description: Also fetch the linked privacy policy (reachable or broken) and /.well-known/gpc.json (Global Privacy Control support). No extra credits.
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Legal compliance signals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalComplianceResponse'
              example:
                url: https://www.allbirds.com/
                final_url: https://www.allbirds.com/
                status: ok
                reason: null
                checked_at: '2026-10-18T04:14:56.310Z'
                fetch:
                  http_status: 200
                  final_url: https://www.allbirds.com/
                  content_type: text/html
                  bytes: 720698
                  truncated: false
                  redirect_count: 0
                  duration_ms: 812
                  rendered: false
                context:
                  html_lang: en-US
                  content_language: null
                  tld: com
                  regions: []
                  typical_signals:
                  - privacy_policy
                  - terms_of_service
                  - contact
                links:
                  privacy_choices:
                    status: found
                    reason: null
                    evidence:
                      url: null
                      text: Do Not Sell My Personal Information
                      external: false
                      match: text
                    matches: 1
                  privacy_policy:
                    status: found
                    reason: null
                    evidence:
                      url: null
                      text: Privacy policy
                      external: false
                      match: text
                    matches: 1
                  terms_of_service:
                    status: found
                    reason: null
                    evidence:
                      url: null
                      text: Terms of service
                      external: false
                      match: text
                    matches: 1
                  cookie_policy:
                    status: not_found
                    reason: null
                    evidence: null
                    matches: 0
                  imprint:
                    status: not_found
                    reason: null
                    evidence: null
                    matches: 0
                  accessibility_statement:
                    status: not_found
                    reason: null
                    evidence: null
                    matches: 0
                  contact:
                    status: found
                    reason: null
                    evidence:
                      url: https://www.allbirds.com/pages/help
                      text: FAQ/Contact Us
                      external: false
                      match: text
                    matches: 24
                  refund_policy:
                    status: found
                    reason: null
                    evidence:
                      url: https://www.allbirds.com/pages/returns-exchanges
                      text: Returns/Exchanges
                      external: false
                      match: text_and_url
                    matches: 2
                consent:
                  status: found
                  reason: null
                  detected_via:
                  - platform
                  - settings_control
                  - banner_markup
                  platforms:
                  - id: onetrust
                    name: OneTrust
                    evidence: inline_script
                  - id: shopify_privacy_banner
                    name: Shopify privacy banner
                    evidence: script_url
                  frameworks:
                    iab_tcf: false
                    iab_gpp: false
                    iab_usp: false
                    google_consent_mode_default: false
                    google_consent_mode_v2: false
                  settings_link:
                    status: found
                    text: Cookie preferences
                trackers:
                  status: found
                  reason: null
                  detected:
                  - name: Google Tag Manager
                    category: tag_manager
                    evidence: iframe
                  - name: Microsoft Clarity
                    category: session_replay
                    evidence: inline_script
                gpc:
                  status: not_checked
                  supported: null
                  last_update: null
                  reason: null
                privacy_policy_check:
                  status: not_checked
                  http_status: null
                  reason: null
                summary:
                  found: 6
                  not_found: 3
                  unknown: 0
                coverage:
                  score: 89
                  checks_scored:
                  - privacy_policy
                  - terms_of_service
                  - contact
                  - consent_management
                  - cookie_policy
                  checks_unknown: 0
                  score_confidence: full
                observations: []
                client_rendered: false
                caveats:
                - not_legal_advice
                - single_page_checked
                - consent_behaviour_not_tested
                - initial_html_only
                analysis_version: 2026-10-18.1
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 2
        variants:
        - parameter: render
          equals: true
          credits: 6
        note: 2 credits, 6 rendered.
components:
  headers:
    XCreditsCharged:
      description: Credits charged by this request, net of any refund made in the same request. Sent on authenticated /v1 responses, including errors (0 when nothing was charged).
      schema:
        type: integer
        minimum: 0
    XFieldsIgnored:
      description: 'Sent when `fields` was used and some paths matched nothing in this response: those paths, comma-separated, at most 20.'
      schema:
        type: string
    XRateLimitLimit:
      description: Burst capacity of the rate limit that applies to this API key.
      schema:
        type: integer
        minimum: 0
    XRateLimitReset:
      description: Unix time in seconds when the burst capacity is fully refilled.
      schema:
        type: integer
        minimum: 0
    XRateLimitRemaining:
      description: Requests that can still be sent immediately before the rate limit applies.
      schema:
        type: integer
        minimum: 0
    XCreditsRemaining:
      description: Credits remaining on the account after this request. Omitted when the balance is not already known without an extra lookup.
      schema:
        type: integer
        minimum: 0
  parameters:
    Naming:
      name: naming
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`snake` returns every camelCase key of a successful JSON response in snake_case (for example `registrarName` becomes `registrar_name`); values are never changed. The `DomScan-Naming: snake` request header does the same; when both are sent this parameter wins, and `default` keeps the original names. Runs before `compact` and `fields`, so `fields` paths use snake_case. Error bodies are already snake_case. Cost is unchanged.'
      schema:
        type: string
        enum:
        - snake
        - default
      example: snake
    Fields:
      name: fields
      in: query
      required: false
      x-domscan-global-parameter: true
      description: Comma-separated dot paths to keep in a successful JSON response, e.g. `domain,classification.status` (arrays apply the path to each item; max 50 paths, 6 levels). Unmatched paths are listed in X-Fields-Ignored. Cost is unchanged.
      schema:
        type: string
      example: domain,classification.status
    Compact:
      name: compact
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`true` drops serving metadata (meta timings and served_by, empty warnings/caveats/notes/errors arrays, a request_id that repeats X-Request-Id) from a successful JSON response. Data fields are never removed.'
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
      example: 'true'
  responses:
    Unauthorized:
      description: 'Authentication required. All API endpoints require a valid API key (x-api-key header or Authorization: Bearer) or an active session cookie.'
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_REQUIRED
              message: 'Authentication required. Provide an API key via x-api-key header or Authorization: Bearer header.'
              docs: https://domscan.net/docs/authentication
              get_key: https://domscan.net/login
              type: authentication_error
              status: 401
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/authentication
    PaymentRequired:
      description: Insufficient credits for this request. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          schema:
            type: integer
          description: Credits remaining on the account
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INSUFFICIENT_CREDITS
              message: Insufficient credits. This endpoint costs 2 credits but you have 0. Purchase more at https://domscan.net/billing or wait for your monthly reset.
              credits_remaining: 0
              credits_required: 2
              purchase_url: https://domscan.net/billing
              type: credits_error
              status: 402
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/credits-pricing
    RateLimited:
      description: Rate limit exceeded. Free accounts can sustain 120 requests per minute per account with a burst capacity of 60. Free bulk traffic is additionally limited to 20 requests per minute per account across all bulk endpoints and 100 per minute per IPv4 address or IPv6 /56 network. Paid accounts can sustain 600 requests per minute with a burst capacity of 120.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          schema:
            type: integer
          description: The immediate burst capacity, or the active bulk fixed-window limit when a bulk-specific limit is exceeded.
        X-RateLimit-Remaining:
          schema:
            type: integer
            example: 0
          description: Immediate burst tokens remaining, or requests remaining in the active bulk fixed window.
        X-RateLimit-Reset:
          schema:
            type: integer
            example: 1791590400
          description: Unix time in seconds when the limit that was exceeded allows a new request again.
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
        X-RateLimit-Plan:
          schema:
            type: string
            enum:
            - free
            - paid
          description: The account plan whose policy was applied.
        X-RateLimit-Policy:
          schema:
            type: string
          description: Machine-readable summary of the active tier and limit policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded. Please wait before making more requests.
              type: rate_limit_error
              status: 429
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/rate-limits
              retry_after: 12
    BadRequest:
      description: Bad request - invalid parameters
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: Invalid domain format
              suggestion: Domain must be a valid format like example.com
              type: validation_error
              status: 400
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
  schemas:
    OnPageFetch:
      type: object
      required:
      - http_status
      - final_url
      - content_type
      - bytes
      - truncated
      - redirect_count
      - duration_ms
      - rendered
      properties:
        http_status:
          type:
          - integer
          - 'null'
        final_url:
          type: string
        content_type:
          type:
          - string
          - 'null'
        bytes:
          type: integer
          description: HTML bytes received (at most 1 MB is read).
        truncated:
          type: boolean
        redirect_count:
          type: integer
        duration_ms:
          type: integer
        rendered:
          type: boolean
          description: True when the page ran JavaScript in an isolated browser.
    ErrorResponse:
      type: object
      description: Canonical error format shared by every API error response. Endpoint-specific fields (for example credits_remaining, login_url or evidence_summary) may appear next to error or inside it; clients should ignore fields they do not recognise.
      additionalProperties: true
      properties:
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
              description: Stable, upper-case machine code. Codes are never renamed; the full catalog with HTTP status, type and retryability is published as x-domscan-error-codes.
              example: INVALID_DOMAIN
            type:
              type: string
              enum:
              - authentication_error
              - credits_error
              - permission_error
              - not_found_error
              - conflict_error
              - rate_limit_error
              - timeout_error
              - validation_error
              - upstream_error
              - api_error
              - request_error
              description: Stable error category used by official SDK subclasses
            message:
              type: string
              description: Human-readable error message
              example: Invalid domain format
            status:
              type: integer
              minimum: 400
              maximum: 599
              description: HTTP status repeated in the JSON error for queue and log processors
            retryable:
              type: boolean
              description: Whether retrying can be appropriate after applying retry guidance
            request_id:
              type: string
              description: Request identifier matching the X-Request-Id response header
            suggestion:
              type: string
              description: Suggestion for fixing the error
            details:
              type: object
              description: Optional structured context for the error
              additionalProperties: true
            retry_after:
              type: integer
              minimum: 0
              description: Seconds to wait before retrying when the error is temporary
              example: 300
            docs_url:
              type: string
              description: Absolute link to the documentation section for this error
              example: https://domscan.net/docs/check-availability
          required:
          - type
          - code
          - message
          - status
          - retryable
          - request_id
          - docs_url
    LegalComplianceResponse:
      type: object
      required:
      - url
      - final_url
      - status
      - reason
      - checked_at
      - fetch
      - context
      - links
      - consent
      - trackers
      - gpc
      - privacy_policy_check
      - summary
      - coverage
      - observations
      - client_rendered
      - caveats
      - analysis_version
      properties:
        url:
          type: string
          description: Requested URL, normalized.
        final_url:
          type: string
          description: URL after redirects.
        status:
          type: string
          enum:
          - ok
          - not_found
          - not_html
          - unknown
          description: 'ok: a 200 HTML page was analysed. not_found: the page returned an exact 404 or 410. not_html: the page is not HTML. unknown: the page could not be read (blocked, rate limited, timed out, failed, empty, unresolved redirect or a non-final 2xx such as a 202 challenge). Unless the status is ok, the analysis fields are null or empty and the request is refunded.'
        reason:
          type:
          - string
          - 'null'
          enum:
          - blocked
          - rate_limited
          - timeout
          - upstream_error
          - redirect_unresolved
          - http_error
          - empty
          - ambiguous
          - fetch_failed
          - null
          description: Why the page could not be read; null unless unknown.
        checked_at:
          type: string
          format: date-time
        fetch:
          $ref: '#/components/schemas/OnPageFetch'
        context:
          type:
          - object
          - 'null'
          required:
          - html_lang
          - content_language
          - tld
          - regions
          - typical_signals
          properties:
            html_lang:
              type:
              - string
              - 'null'
              description: The `lang` attribute of the html element.
            content_language:
              type:
              - string
              - 'null'
              description: Content-Language response header.
            tld:
              type:
              - string
              - 'null'
            regions:
              type: array
              items:
                type: string
                enum:
                - eea
                - uk
                - ch
                - br
                - us
                - ca
                - au
                - jp
                - kr
                - cn
                - tr
                - ru
                - in
              description: Jurisdiction hints from the country-code TLD only (eea covers EU and EEA TLDs and .eu). Empty for generic TLDs. Never a legal conclusion.
            typical_signals:
              type: array
              items:
                type: string
                enum:
                - privacy_policy
                - terms_of_service
                - contact
                - consent_management
                - cookie_policy
                - imprint
                - privacy_choices
              description: Signals sites in these regions commonly publish. Hints for review, not requirements.
          description: Null unless status is ok.
        links:
          type:
          - object
          - 'null'
          required:
          - privacy_choices
          - privacy_policy
          - terms_of_service
          - cookie_policy
          - imprint
          - accessibility_statement
          - contact
          - refund_policy
          properties:
            privacy_choices:
              type: object
              required:
              - status
              - reason
              - evidence
              - matches
              properties:
                status:
                  type: string
                  enum:
                  - found
                  - not_found
                  - unknown
                  description: 'found: a link or control on the page matched. not_found: the whole page was received and parsed and nothing matched. unknown: absence could not be confirmed (see reason).'
                reason:
                  type:
                  - string
                  - 'null'
                  enum:
                  - client_rendered
                  - insufficient_content
                  - page_truncated
                  - legal_links_not_in_html
                  - requires_rendering
                  - null
                  description: 'Why an absence could not be confirmed. client_rendered: the HTML is a script shell. insufficient_content: an interstitial, block page or redirect stub. page_truncated: only the first 1 MB was read. legal_links_not_in_html: a link-rich page with no legal link at all, so its footer is most likely added by script. requires_rendering (consent only): scripts can add a consent banner after load; retry with render=true. Null when found or not_found.'
                evidence:
                  type:
                  - object
                  - 'null'
                  required:
                  - url
                  - text
                  - external
                  - match
                  properties:
                    url:
                      type:
                      - string
                      - 'null'
                      description: Resolved target. Null for buttons, modal triggers, `#` and `javascript:` links, which are still evidence that the control exists.
                    text:
                      type:
                      - string
                      - 'null'
                      description: Visible label, aria-label or title.
                    external:
                      type: boolean
                      description: Target is hosted on another site.
                    match:
                      type: string
                      enum:
                      - text
                      - url
                      - text_and_url
                      description: 'What matched: the label, the URL path or both.'
                  description: The strongest match; null unless found.
                matches:
                  type: integer
                  description: Links or controls on the page that matched this signal.
            privacy_policy:
              type: object
              required:
              - status
              - reason
              - evidence
              - matches
              properties:
                status:
                  type: string
                  enum:
                  - found
                  - not_found
                  - unknown
                  description: 'found: a link or control on the page matched. not_found: the whole page was received and parsed and nothing matched. unknown: absence could not be confirmed (see reason).'
                reason:
                  type:
                  - string
                  - 'null'
                  enum:
                  - client_rendered
                  - insufficient_content
                  - page_truncated
                  - legal_links_not_in_html
                  - requires_rendering
