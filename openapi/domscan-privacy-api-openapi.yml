              type: integer
            not_found:
              type: integer
            unknown:
              type: integer
          description: Counts over the eight link signals and consent.
        coverage:
          type: object
          required:
          - score
          - checks_scored
          - checks_unknown
          - score_confidence
          properties:
            score:
              type:
              - integer
              - 'null'
              description: Share (0-100) of applicable core signals found, weighted privacy_policy 35, terms_of_service 15, contact 15, consent_management 15, cookie_policy 10, imprint 10. Consent and cookie policy apply to EEA, UK and Swiss sites or when trackers are present; imprint to .de, .at, .ch, .fr, .es and .it. Unknown checks are left out. Null when nothing applicable was answered. A coverage indicator, not a compliance grade.
            checks_scored:
              type: array
              items:
                type: string
                enum:
                - privacy_policy
                - terms_of_service
                - contact
                - consent_management
                - cookie_policy
                - imprint
            checks_unknown:
              type: integer
            score_confidence:
              type: string
              enum:
              - full
              - partial
              description: partial when an applicable check was unknown.
        observations:
          type: array
          items:
            type: string
            enum:
            - privacy_policy_not_linked
            - privacy_policy_link_broken
            - trackers_without_detected_consent_tool
            - imprint_typical_but_not_linked
            - cookie_policy_typical_but_not_linked
            - consent_tool_typical_but_not_found
            - privacy_choices_link_not_found
            - privacy_policy_hosted_externally
            - page_client_rendered
            - legal_links_not_in_html
          description: Evidence-based observations to review. Never legal conclusions.
        client_rendered:
          type:
          - boolean
          - 'null'
          description: The HTML is a script shell; null unless status is ok.
        caveats:
          type: array
          items:
            type: string
            enum:
            - not_legal_advice
            - single_page_checked
            - consent_behaviour_not_tested
            - initial_html_only
            - page_truncated
        analysis_version:
          type: string
