openapi: 3.2.0
info:
  title: DomScan SSL Certificates API
  description: 'DomScan is a domain intelligence API providing domain analysis tools. **Core Features:**

    - Domain Availability: Check single or bulk domains using RDAP with 1,100+ TLDs supported

    - Domain Intelligence: AI suggestions, valuations, health checks, typosquatting detection

    - OSINT Tools: DNS lookup, WHOIS/RDAP, SSL certificates, subdomain discovery, IP geolocation, tech stack detection

    - Social & Branding: Social handle checker, brand name scoring

    - Phone Intelligence: Privacy-first phone number validation, normalization, and classification

    - Pricing: Scheduled standard-TLD tables from verified official registrar sources, plus separate credential-backed exact-domain quotes

    - Watchlist: Domain monitoring for expiration and availability alerts


    **Authentication:**

    Most API endpoints require authentication. Pass your API key via the x-api-key header or Authorization: Bearer header. Operations marked with an empty security requirement are intentionally public, including API specifications and selected catalog endpoints. Get your free API key at https://domscan.net/dashboard. Logged-in users on domscan.net tools pages are authenticated automatically via session cookie. **Rate Limits:**

    Free accounts can sustain 120 requests per minute per account, with a burst capacity of 60. All API keys and dashboard sessions belonging to the same free account share this budget. Bulk endpoints have an additional free-tier budget of 20 HTTP requests per minute per account across all bulk endpoints. Free-tier bulk traffic is also capped at 100 requests per minute per IPv4 address or IPv6 /56 network. Platform-wide edge protections still apply to every tier. Paid accounts can sustain 600 requests per minute, with a burst capacity of 120, shared by every API key and dashboard session of the account. Paid accounts do not receive the additional free-tier bulk budget. Scope: RapidAPI subscribers are counted per subscriber. (scope=rapidapi-customer) Zyla subscribers are counted per subscriber when the gateway identifies them, (scope=zyla-customer) and as one shared gateway budget when it does not. (scope=zyla-gateway) Other authenticated requests are counted per account: every API key and dashboard session of the account shares one budget. (scope=account) A key that is not linked to an account is counted on its own. (scope=api-key) Unauthenticated requests to public endpoints are counted per client IP address (scope unknown when the address cannot be determined, as one shared budget). (scope=ip)


    Every authenticated response, success or error, includes X-RateLimit-Plan, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, and X-RateLimit-Policy. X-RateLimit-Limit and X-RateLimit-Remaining describe the immediate burst bucket; X-RateLimit-Reset is the Unix time in seconds when that bucket is full again; X-RateLimit-Policy also states the sustained per-minute rate, scope, and any free bulk limits. Exceeding a limit returns HTTP 429 with Retry-After. Retry only after the indicated delay. **Credits System:**

    API calls consume credits based on endpoint complexity. Sign up for free to receive 10,000 credits monthly. - 1 credit: Status checks, DNS lookups, tool builders

    - 2-5 credits: Health checks, valuations, OSINT tools

    - Bulk endpoints: standard per-item rate for batching multiple items into fewer HTTP requests. - 6-25 credits: Recipe compound operations


    When credits reach zero, the API returns HTTP 402 with credits_remaining, credits_required, and a purchase_url. API responses include X-Credits-Requested, X-Credits-Charged, and X-Credits-Refunded. X-Credits-Charged is the net charge after any refund made during the request. Authenticated responses also include X-Credits-Remaining whenever the balance is known without an extra lookup. Free credits refresh monthly on the account''s signup anniversary. POST /v1/estimate returns the credits a request would charge without running it, at no cost.'
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: SSL Certificates
  description: Certificate transparency search and subdomain discovery
paths:
  /v1/certificates:
    get:
      tags:
      - SSL Certificates
      summary: Certificate transparency search
      description: Find SSL certificates issued for a domain via CT logs. Includes an intelligence summary with source, cache, truncation, wildcard, issuer, and expiry posture.
      operationId: getCertificates
      parameters:
      - name: domain
        description: Domain to search certificate transparency logs for.
        in: query
        required: true
        schema:
          type: string
      - name: include_subdomains
        description: Include certificates issued for subdomains of the requested domain.
        in: query
        schema:
          type: boolean
          default: true
      - name: include_expired
        description: Include certificates that have already expired.
        in: query
        schema:
          type: boolean
          default: false
      - name: limit
        in: query
        description: Maximum certificates to return on this page.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: cursor
        in: query
        description: The `next_cursor` of the previous page (signed, opaque, valid only for the same account and query). A plain number is still accepted as the legacy offset from `pagination.next_cursor`.
        schema:
          type: string
          maxLength: 512
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/MaxAge'
      responses:
        '200':
          description: Certificate list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificatesResponse'
              example:
                domain: example.com
                certificates:
                - id: '16234550871'
                  issuer:
                    name: R11
                    organization: Let's Encrypt
                  common_name: www.example.com
                  san:
                  - example.com
                  - www.example.com
                  not_before: '2026-09-14T08:12:44'
                  not_after: '2026-12-13T08:12:43'
                  is_expired: false
                  is_wildcard: false
                - id: '16198877412'
                  issuer:
                    name: R11
                    organization: Let's Encrypt
                  common_name: api.example.com
                  san:
                  - api.example.com
                  not_before: '2026-08-20T14:03:10'
                  not_after: '2026-11-18T14:03:09'
                  is_expired: false
                  is_wildcard: false
                summary:
                  total_found: 14
                  returned: 2
                  unique_subdomains: 3
                  issuers:
                  - Let's Encrypt
                  earliest_cert: '2026-08-20T14:03:10'
                  latest_cert: '2026-09-14T08:12:44'
                pagination:
                  limit: 2
                  offset: 0
                  returned: 2
                  total: 14
                  has_more: true
                  next_cursor: '2'
                intelligence_summary:
                  data_source: crt.sh
                  ct_log_sources:
                  - crt.sh
                  source_count: 1
                  cache_status: live
                  returned_count: 2
                  total_found: 14
                  truncated: true
                  limit: 2
                  include_subdomains: true
                  include_expired: false
                  unique_name_count: 3
                  unique_subdomains: 3
                  issuer_count: 1
                  wildcard_cert_count: 0
                  active_cert_count: 2
                  expired_cert_count: 0
                  expiring_within_30_days_count: 0
                  earliest_cert: '2026-08-20T14:03:10'
                  latest_cert: '2026-09-14T08:12:44'
                  latest_expiry: '2026-12-13T08:12:43'
                  has_more: true
                  next_cursor: '2'
                  warning_code: null
                meta:
                  source: crt.sh
                  ct_log_sources:
                  - crt.sh
                  query_time_ms: 1240
                  cached: false
                  page:
                    limit: 2
                    offset: 0
                    returned: 2
                    total: 14
                    has_more: true
                    next_cursor: '2'
                  served_by: pop=MAD country=ES
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            X-Cache-Age:
              $ref: '#/components/headers/XCacheAge'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Certificate transparency sources were unavailable and no cached result could be served. The charged credits are automatically refunded; retry after the `retry_after` seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Certificate search timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-domscan-freshness:
        parameter: max_age
        aliases: []
      x-domscan-pagination:
        default_limit: 100
        max_limit: 1000
        billing: per_page
        legacy_parameters:
        - cursor (numeric offset)
      x-domscan-deprecated-aliases:
      - name: cursor
        in: query
        replacement: cursor=<next_cursor>
        deprecated_on: '2026-10-10'
        sunset_on: '2027-10-10'
      x-domscan-credits:
        model: per_request
        default: 2
  /v1/subdomains:
    get:
      tags:
      - SSL Certificates
      summary: Subdomain discovery
      description: Return best-effort hostname evidence from public certificate and passive discovery sources. `sources=ct` is the only accepted compatibility selector. CT evidence uses the public append-only log model described by RFC 9162. DomScan does not brute-force labels or crawl the target site, so coverage is incomplete. Optional DNS verification checks only the names selected for the response and does not discover more. Wildcard evidence is returned separately when requested. Cache-only misses return 202 and all-source failures without stale cache return 503; both responses refund credits.
      operationId: getSubdomains
      parameters:
      - name: domain
        in: query
        required: true
        description: Root domain to search.
        schema:
          type: string
          example: example.com
      - name: sources
        in: query
        required: false
        description: Compatibility selector. Only `ct` is accepted. It starts the passive discovery pipeline, but response entries identify the provider that supplied their evidence.
        schema:
          type: string
          enum:
          - ct
          default: ct
      - name: verify
        in: query
        required: false
        description: Check DNS only for the returned names. Verification does not discover additional names. Values outside the documented enum return HTTP 400.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          - '1'
          - '0'
          - 'yes'
          - 'no'
          default: 'false'
          example: 'yes'
      - name: include_wildcards
        in: query
        required: false
        description: Return wildcard certificate SAN patterns in the separate `wildcards` array. Wildcards are never mixed into the concrete hostname list. Values outside the documented enum return HTTP 400.
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          - '1'
          - '0'
          - 'yes'
          - 'no'
          default: 'false'
          example: '1'
      - name: limit
        in: query
        required: false
        description: Maximum number of concrete hostname entries to return. The value must be an integer from 1 through 2000; other values return HTTP 400.
        schema:
          type: integer
          minimum: 1
          maximum: 2000
          default: 500
          example: 500
      - name: prefer_cache
        in: query
        required: false
        description: Deprecated alias of `max_age=2592000`; still accepted. Serve cached results only. If no fresh or stale cache is available, return 202, queue a background refresh, and refund the request credits. Values outside the documented enum return HTTP 400. Deprecated on 2026-10-10; works until at least 2027-10-10 (Sunset header).
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
          - '1'
          - '0'
          - 'yes'
          - 'no'
          default: 'false'
          example: 'false'
        deprecated: true
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/MaxAge'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Subdomain list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubdomainsResponse'
              examples:
                ct_primary:
                  summary: crt.sh evidence with DNS verification and wildcard output
                  value:
                    domain: example.com
                    subdomains:
                    - name: api.example.com
                      source: crtsh
                      first_seen: '2025-01-15T00:00:00Z'
                      verified: true
                      dns_records:
                        A:
                        - 192.0.2.10
                    wildcards:
                    - pattern: '*.example.com'
                      source: crtsh
                      first_seen: '2024-11-20T00:00:00Z'
                    summary:
                      total_found: 1
                      returned: 1
                      verified_count: 1
                      unverified_count: 0
                      sources_used:
                      - crtsh
                      apex_included: false
                      wildcard_suppressed_count: 1
                      wildcard_returned_count: 1
                    intelligence_summary:
                      data_sources:
                      - crtsh
                      source_count: 1
                      cache_status: live
                      returned_count: 1
                      total_found: 1
                      truncated: false
                      limit: 500
                      verification_requested: true
                      include_wildcards: true
                      verified_count: 1
                      verified_ratio: 1
                      live_dns_record_count: 1
                      apex_included: false
                      wildcard_suppressed_count: 1
                      wildcard_returned_count: 1
                      first_seen_oldest: '2025-01-15T00:00:00Z'
                      first_seen_newest: '2025-01-15T00:00:00Z'
                      warning_count: 0
                    meta:
                      query_time_ms: 184
                      cached: false
                passive_fallback:
                  summary: Passive fallback evidence without a first-seen certificate time
                  value:
                    domain: example.com
                    subdomains:
                    - name: archive.example.com
                      source: wayback
                      first_seen: null
                      verified: false
                      dns_records: null
                    summary:
                      total_found: 1
                      returned: 1
                      verified_count: 0
                      unverified_count: 1
                      sources_used:
                      - wayback
                      apex_included: false
                      wildcard_suppressed_count: 0
                      wildcard_returned_count: 0
                    intelligence_summary:
                      data_sources:
                      - wayback
                      source_count: 1
                      cache_status: live
                      returned_count: 1
                      total_found: 1
                      truncated: false
                      limit: 500
                      verification_requested: false
                      include_wildcards: false
                      verified_count: 0
                      verified_ratio: 0
                      live_dns_record_count: 0
                      apex_included: false
                      wildcard_suppressed_count: 0
                      wildcard_returned_count: 0
                      first_seen_oldest: null
                      first_seen_newest: null
                      warning_count: 0
                    meta:
                      query_time_ms: 412
                      cached: false
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            X-Cache-Age:
              $ref: '#/components/headers/XCacheAge'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
        '202':
          description: No fresh or stale subdomain result was available for a cache-only request. A background refresh was queued and the request credits were refunded.
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            Retry-After:
              description: Suggested delay before retrying the cache-only request.
              schema:
                type: integer
                example: 30
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
            X-Cache-Age:
              $ref: '#/components/headers/XCacheAge'
            Deprecation:
              $ref: '#/components/headers/Deprecation'
            Sunset:
              $ref: '#/components/headers/Sunset'
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: pending
                  code:
                    type: string
                    example: CACHE_MISS_REFRESH_QUEUED
                  message:
                    type: string
                    example: Try again in a moment
                  domain:
                    type: string
                    example: example.com
                  retry_after:
                    type: integer
                    example: 30
                  credits_charged:
                    type: integer
                    example: 0
                    description: Pending cache refresh responses do not consume credits.
                  billing_status:
                    type: string
                    example: not_charged
                    description: Billing status for this pending response.
                  request_id:
                    type: string
        '400':
          description: Invalid domain, source selector, boolean token, or limit. Boolean query values accept only true, false, 1, 0, yes, or no.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Every discovery source was unavailable and no stale cache could be served. The request credits were refunded.
          headers:
            Retry-After:
              description: Suggested delay before retrying the request.
              schema:
                type: integer
                example: 300
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UPSTREAM_UNAVAILABLE
                  message: Service temporarily unavailable
                  suggestion: Try again in a moment
                  retry_after: 300
        '504':
          description: Subdomain enumeration timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-domscan-freshness:
        parameter: max_age
        aliases:
        - name: prefer_cache
          in: query
          max_age: 2592000
      x-domscan-pagination:
        default_limit: 500
        max_limit: 2000
        billing: per_page
      x-domscan-deprecated-aliases:
      - name: prefer_cache
        in: query
        replacement: max_age=2592000
        deprecated_on: '2026-10-10'
        sunset_on: '2027-10-10'
      x-domscan-credits:
        model: per_request
        default: 4
        variants:
        - parameter: verify
          equals: true
          credits: 5
        note: 4 credits by default; 5 credits when verify=true.
components:
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page. Cursors are opaque, signed, and only valid for the same account and query; anything else is a 400 INVALID_CURSOR.
      schema:
        type: string
        maxLength: 512
    Fields:
      name: fields
      in: query
      required: false
      x-domscan-global-parameter: true
      description: Comma-separated dot paths to keep in a successful JSON response, e.g. `domain,classification.status` (arrays apply the path to each item; max 50 paths, 6 levels). Unmatched paths are listed in X-Fields-Ignored. Cost is unchanged.
      schema:
        type: string
      example: domain,classification.status
    Naming:
      name: naming
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`snake` returns every camelCase key of a successful JSON response in snake_case (for example `registrarName` becomes `registrar_name`); values are never changed. The `DomScan-Naming: snake` request header does the same; when both are sent this parameter wins, and `default` keeps the original names. Runs before `compact` and `fields`, so `fields` paths use snake_case. Error bodies are already snake_case. Cost is unchanged.'
      schema:
        type: string
        enum:
        - snake
        - default
      example: snake
    MaxAge:
      name: max_age
      in: query
      required: false
      x-domscan-global-parameter: true
      description: Highest acceptable age of cached data, in whole seconds (0 to 2592000). Cached data older than this is checked again; `0` forces a fresh check. Without it the endpoint keeps its default cache policy. The age served is reported in `cache_age_s` and `X-Cache-Age`. Cost is unchanged.
      schema:
        type: integer
        minimum: 0
        maximum: 2592000
      example: 3600
    Compact:
      name: compact
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`true` drops serving metadata (meta timings and served_by, empty warnings/caveats/notes/errors arrays, a request_id that repeats X-Request-Id) from a successful JSON response. Data fields are never removed.'
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
      example: 'true'
  headers:
    XRateLimitLimit:
      description: Burst capacity of the rate limit that applies to this API key.
      schema:
        type: integer
        minimum: 0
    XRateLimitReset:
      description: Unix time in seconds when the burst capacity is fully refilled.
      schema:
        type: integer
        minimum: 0
    XRateLimitRemaining:
      description: Requests that can still be sent immediately before the rate limit applies.
      schema:
        type: integer
        minimum: 0
    XCreditsRemaining:
      description: Credits remaining on the account after this request. Omitted when the balance is not already known without an extra lookup.
      schema:
        type: integer
        minimum: 0
    XCreditsCharged:
      description: Credits charged by this request, net of any refund made in the same request. Sent on authenticated /v1 responses, including errors (0 when nothing was charged).
      schema:
        type: integer
        minimum: 0
    XCacheAge:
      description: Age in whole seconds of the cached data this response used (0 when it was checked fresh). The same value is returned as `cache_age_s`.
      schema:
        type: integer
        minimum: 0
    Sunset:
      description: 'RFC 8594. Sent with Deprecation: the earliest date the deprecated alias may stop working, as an HTTP-date. See /docs/versioning.'
      schema:
        type: string
        example: Sun, 10 Oct 2027 00:00:00 GMT
    Deprecation:
      description: 'RFC 9745. Sent when the request used a deprecated alias: the date it was deprecated, as `@` and Unix seconds. The response body is unchanged.'
      schema:
        type: string
        example: '@1791590400'
    XFieldsIgnored:
      description: 'Sent when `fields` was used and some paths matched nothing in this response: those paths, comma-separated, at most 20.'
      schema:
        type: string
  schemas:
    SubdomainIntelligenceSummary:
      type: object
      description: Compact source, cache, truncation, wildcard, and optional DNS verification summary. Counts describe the best-effort response, not every subdomain that exists.
      properties:
        data_sources:
          type: array
          items:
            type: string
            enum:
            - ct
            - crtsh
            - crtname
            - hackertarget
            - threatminer
            - wayback
            - certspotter
        source_count:
          type: integer
        cache_status:
          type: string
          enum:
          - live
          - fresh_cache
          - stale_cache
        returned_count:
          type: integer
        total_found:
          type: integer
        truncated:
          type: boolean
        limit:
          type: integer
        verification_requested:
          type: boolean
          description: Whether DNS was checked for the returned concrete hostnames.
        include_wildcards:
          type: boolean
          description: Whether wildcard certificate evidence was requested separately.
        verified_count:
          type: integer
        verified_ratio:
          type:
          - number
          - 'null'
        live_dns_record_count:
          type: integer
          description: Returned hostnames with at least one A or CNAME verification record.
        apex_included:
          type: boolean
        wildcard_suppressed_count:
          type: integer
        wildcard_returned_count:
          type: integer
        first_seen_oldest:
          type:
          - string
          - 'null'
          description: Oldest valid first_seen value among returned entries, or null.
        first_seen_newest:
          type:
          - string
          - 'null'
          description: Newest valid first_seen value among returned entries, or null.
        warning_count:
          type: integer
    CertificateIntelligenceSummary:
      type: object
      description: Compact source, freshness, truncation, and certificate posture summary for CT search results.
      properties:
        data_source:
          type: string
        ct_log_sources:
          type: array
          items:
            type: string
        source_count:
          type: integer
        cache_status:
          type: string
          enum:
          - live
          - fresh_cache
          - stale_cache
          - partial_unavailable
        returned_count:
          type: integer
        total_found:
          type: integer
        truncated:
          type: boolean
        limit:
          type: integer
        include_subdomains:
          type: boolean
        include_expired:
          type: boolean
        unique_name_count:
          type: integer
        unique_subdomains:
          type: integer
        issuer_count:
          type: integer
        wildcard_cert_count:
          type: integer
        active_cert_count:
          type: integer
        expired_cert_count:
          type: integer
        expiring_within_30_days_count:
          type: integer
        earliest_cert:
          type:
          - string
          - 'null'
        latest_cert:
          type:
          - string
          - 'null'
        latest_expiry:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
        next_cursor:
          type:
          - string
          - 'null'
        warning_code:
          type:
          - string
          - 'null'
    CertificatesResponse:
      type: object
      description: Certificate transparency search results
      properties:
        has_more:
          type: boolean
          description: True when another page exists after this one.
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `cursor` to get the next page; null on the last page.
        cache_age_s:
          type: integer
          minimum: 0
          description: Age in whole seconds of the cached data used for this response; 0 when it was checked fresh. For multi-item responses, the oldest item.
        domain:
          type: string
        certificates:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              issuer:
                type: object
                additionalProperties: true
              common_name:
                type: string
              san:
                type: array
                items:
                  type: string
              not_before:
                type: string
                format: date-time
              not_after:
                type: string
                format: date-time
              is_expired:
                type: boolean
              is_wildcard:
                type: boolean
              fingerprint_sha256:
                type: string
        summary:
          type: object
          properties:
            total_found:
              type: integer
            returned:
              type: integer
            unique_subdomains:
              type: integer
            issuers:
              type: array
              items:
                type: string
            earliest_cert:
              type:
              - string
              - 'null'
            latest_cert:
              type:
              - string
              - 'null'
        pagination:
          $ref: '#/components/schemas/CertificatePagination'
        intelligence_summary:
          $ref: '#/components/schemas/CertificateIntelligenceSummary'
        meta:
          type: object
          additionalProperties: true
    SubdomainsResponse:
      type: object
      description: Best-effort public hostname evidence. This response is not a complete inventory and can include the apex when a source returns it.
      required:
      - domain
      - subdomains
      - summary
      - intelligence_summary
      - meta
      properties:
        has_more:
          type: boolean
          description: True when another page exists after this one.
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass as `cursor` to get the next page; null on the last page.
        cache_age_s:
          type: integer
          minimum: 0
          description: Age in whole seconds of the cached data used for this response; 0 when it was checked fresh. For multi-item responses, the oldest item.
        domain:
          type: string
          example: example.com
        subdomains:
          type: array
          description: Concrete hostnames returned after deduplication and the requested limit. Wildcard patterns are kept out of this array.
          items:
            type: object
            required:
            - name
            - source
            - first_seen
            - verified
            - dns_records
            properties:
              name:
                type: string
                description: Returned hostname. This can equal the requested apex when the source includes it.
                example: api.example.com
              source:
                type: string
                enum:
                - ct
                - crtsh
                - crtname
                - hackertarget
                - threatminer
                - wayback
                - certspotter
                description: Provider that supplied the evidence. `ct` is retained for older cached entries; new live results use a concrete provider value.
                example: crtsh
              first_seen:
                type:
                - string
                - 'null'
                description: For crt.sh and CertSpotter evidence, the earliest valid certificate not-before value found for this hostname. This is certificate validity evidence, not a CT log inclusion timestamp. Passive fallback sources return null.
                example: '2025-01-15T00:00:00Z'
              verified:
                type: boolean
                description: True only when DNS verification was requested and resolution succeeded for this returned hostname.
              dns_records:
                type:
                - object
                - 'null'
                description: A and CNAME records collected while verifying this returned hostname, or null. DNS verification does not discover additional names.
                properties:
                  A:
                    type: array
                    items:
                      type: string
                  CNAME:
                    type:
                    - string
                    - 'null'
        wildcards:
          type: array
          description: Wildcard certificate SAN evidence returned when include_wildcards is enabled. These patterns stay separate from concrete hostnames and do not count toward subdomains.
          items:
            type: object
            required:
            - pattern
            - source
            - first_seen
            properties:
              pattern:
                type: string
                example: '*.example.com'
              source:
                type: string
                enum:
                - ct
                - crtsh
                - certspotter
                description: '`ct` can appear in legacy cached wildcard evidence.'
              first_seen:
                type:
                - string
                - 'null'
                description: Earliest valid certificate not-before evidence for the pattern.
        summary:
          type: object
          properties:
            total_found:
              type: integer
              description: Concrete hostname entries found before applying the response limit.
            returned:
              type: integer
              description: Concrete hostname entries returned.
            verified_count:
              type: integer
              description: Returned hostnames that resolved during optional DNS verification.
            unverified_count:
              type: integer
              description: Returned hostnames that were not verified, including every entry when verification was not requested.
            sources_used:
              type: array
              description: Discovery providers that returned successfully during this request.
              items:
                type: string
                enum:
                - ct
                - crtsh
                - crtname
                - hackertarget
                - threatminer
                - wayback
                - certspotter
            apex_included:
              type: boolean
              description: Whether the concrete hostname list contains the requested apex.
            wildcard_suppressed_count:
              type: integer
              description: Wildcard SAN observations excluded from the concrete hostname list.
            wildcard_returned_count:
              type: integer
              description: Wildcard patterns returned in the separate wildcards array.
        intelligence_summary:
          $ref: '#/components/schemas/SubdomainIntelligenceSummary'
        warnings:
          type: array
          description: Non-fatal upstream warnings when a useful response can still be served.
          items:
            type: string
        meta:
          type: object
          properties:
            query_time_ms:
              type: integer
            cached:
              type: boolean
            stale:
              type: boolean
    CertificatePagination:
      type: object
      description: Offset cursor pagination for certificate transparency results.
      properties:
        limit:
          type: integer
        offset:
          type: integer
        returned:
          type: integer
        total:
          type: integer
        has_more:
          type: boolean
        next_cursor:
          type:
          - string
          - 'null'
    ErrorResponse:
      type: object
      description: Canonical error format shared by every API error response. Endpoint-specific fields (for example credits_remaining, login_url or evidence_summary) may appear next to error or inside it; clients should ignore fields they do not recognise.
      additionalProperties: true
      properties:
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
              description: Stable, upper-case machine code. Codes are never renamed; the full catalog with HTTP status, type and retryability is published as x-domscan-error-codes.
              example: INVALID_DOMAIN
            type:
              type: string
              enum:
              - authentication_error
              - credits_error
              - permission_error
              - not_found_error
              - conflict_error
              - rate_limit_error
              - timeout_error
              - validation_error
              - upstream_error
              - api_error
              - request_error
              description: Stable error category used by official SDK subclasses
            message:
              type: string
              description: Human-readable error message
              example: Invalid domain format
            status:
              type: integer
              minimum: 400
              maximum: 599
              description: HTTP status repeated in the JSON error for queue and log processors
            retryable:
              type: boolean
              description: Whether retrying can be appropriate after applying retry guidance
            request_id:
              type: string
              description: Request identifier matching the X-Request-Id response header
            suggestion:
              type: string
              description: Suggestion for fixing the error
            details:
              type: object
              description: Optional structured context for the error
              additionalProperties: true
            retry_after:
              type: integer
              minimum: 0
              description: Seconds to wait before retrying when the error is temporary
              example: 300
            docs_url:
              type: string
              description: Absolute link to the documentation section for this error
              example: https://domscan.net/docs/check-availability
          required:
          - type
          - code
          - message
          - status
          - retryable
          - request_id
          - docs_url
  responses:
    BadRequest:
      description: Bad request - invalid parameters
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: Invalid domain format
              suggestion: Domain must be a valid format like example.com
              type: validation_error
              status: 400
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
    PaymentRequired:
      description: Insufficient credits for this request. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          schema:
            type: integer
          description: Credits remaining on the account
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INSUFFICIENT_CREDITS
              message: Insufficient credits. This endpoint costs 2 credits but you have 0. Purchase more at https://domscan.net/billing or wait for your monthly reset.
              credits_remaining: 0
              credits_required: 2
              purchase_url: https://domscan.net/billing
              type: credits_error
              status: 402
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/credits-pricing
    RateLimited:
      description: Rate limit exceeded. Free accounts can sustain 120 requests per minute per account with a burst capacity of 60. Free bulk traffic is additionally limited to 20 requests per minute per account across all bulk endpoints and 100 per minute per IPv4 address or IPv6 /56 network. Paid accounts can sustain 600 requests per minute with a burst capacity of 120.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          schema:
            type: integer
          description: The immediate burst capacity, or the active bulk fixed-window limit when a bulk-specific limit is exceeded.
        X-RateLimit-Remaining:
          schema:
            type: integer
            example: 0
          description: Immediate burst tokens remaining, or requests remaining in the active bulk fixed window.
        X-RateLimit-Reset:
          schema:
            type: integer
            example: 1791590400
          description: Unix time in seconds when the limit that was exceeded allows a new request again.
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
        X-RateLimit-Plan:
          schema:
            type: string
            enum:
            - free
            - paid
          description: The account plan whose policy was applied.
        X-RateLimit-Policy:
          schema:
            type: string
          description: Machine-readable summary of the active tier and limit policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded. Please wait before making more requests.
              type: rate_limit_error
              status: 429
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/rate-limits
              retry_after: 12
    Unauthorized:
      description: 'Authentication required. All API endpoints require a valid API key (x-api-key header or Authorization: Bearer) or an active session cookie.'
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_REQUIRED
              message: 'Authentication required. Provide an API key via x-api-key header or Authorization: Bearer header.'
              docs: https://domscan.net/docs/authentication
              get_key: https://domscan.net/login
              type: authentication_error
              status: 401
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/authentication
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: 'API key for authentication. Get yours free at https://domscan.net. Also accepts Authorization: Bearer header.'
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Active DomScan browser session. Used by account-management endpoints.
externalDocs:
  description: Full API Documentation
  url: https://domscan.net/docs
x-rapidapi-product: domscan
x-domscan-rate-limits:
  free:
    general:
      scope: account
      sustained_requests_per_minute: 120
      burst_capacity: 60
      shared_across_api_keys_and_sessions: true
    bulk:
      scope: all bulk endpoints combined
      account_requests_per_minute: 20
      network_requests_per_minute: 100
      ipv6_network_prefix: 56
  paid:
    general:
      scope: API key for key-authenticated requests; IP for browser sessions
      sustained_requests_per_minute: 600
      burst_capacity: 120
    free_bulk_budget_applies: false
  response:
    status: 429
    retry_header: Retry-After
    headers_on_every_authenticated_response:
    - X-RateLimit-Plan
    - X-RateLimit-Limit
    - X-RateLimit-Remaining
    - X-RateLimit-Reset
    - X-RateLimit-Policy
    reset_header: X-RateLimit-Reset
    burst_headers:
    - X-RateLimit-Limit
    - X-RateLimit-Remaining
    policy_header: X-RateLimit-Policy
