        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '422':
          description: The target response could not be categorized. The response includes a bounded retry delay, safe failure reason, and whether a recent failure cache prevented another target attempt. This completed target attempt remains billable.
