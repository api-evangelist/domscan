          - http_status
          - final_url
          - via_proxy
          - redirect_count
          - content_type
          - bytes
          - truncated
          - error
          properties:
            checked_url:
              type: string
              format: uri
            http_status:
              type:
              - integer
              - 'null'
            final_url:
              type:
              - string
              - 'null'
            via_proxy:
              type:
              - boolean
              - 'null'
            redirect_count:
              type:
              - integer
              - 'null'
            content_type:
              type:
              - string
              - 'null'
            bytes:
              type:
              - integer
              - 'null'
            truncated:
              type: boolean
            error:
              type:
              - string
              - 'null'
              enum:
              - timeout
              - request_failed
              - network_error
              - dns_failure
              - null
