          type: string
          format: uri
        domain:
          type: string
        status:
          type: string
          enum:
          - ok
          - partial
          - unknown
          description: 'ok: a 2xx or final 3xx response was graded. partial: a 4xx, 5xx or challenge response was analysed but not graded. unknown: no response was received; refunded.'
        checked_at:
          type: string
          format: date-time
        final_url:
          type:
          - string
          - 'null'
        http_status:
          type:
          - integer
          - 'null'
        redirect_count:
          type:
          - integer
          - 'null'
        https:
          type:
          - boolean
          - 'null'
        score:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
          description: Weighted score. Null unless status is ok.
        grade:
          type:
          - string
          - 'null'
          enum:
          - A+
          - A
          - B
          - C
          - D
          - F
          - null
          description: Null unless status is ok. Capped at D when the final URL is not https.
        summary:
          type:
          - object
          - 'null'
          required:
          - passed
          - warned
          - failed
          - missing
          - not_applicable
          - hsts_preload_ready
          - csp_strict
          properties:
            passed:
              type: integer
              minimum: 0
            warned:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
            missing:
              type: integer
              minimum: 0
            not_applicable:
              type: integer
              minimum: 0
            hsts_preload_ready:
              type: boolean
            csp_strict:
              type: boolean
        checks:
          type: array
          description: 11 checks in a fixed order; empty when status is unknown.
          items:
            type: object
            required:
            - id
            - status
            - value
            - detail_code
            - issues
            - weight
            properties:
              id:
                type: string
                enum:
                - strict_transport_security
                - content_security_policy
                - clickjacking
                - x_content_type_options
                - referrer_policy
                - permissions_policy
                - cross_origin_opener_policy
                - cross_origin_embedder_policy
                - cross_origin_resource_policy
                - information_disclosure
                - cookies
              status:
                type: string
                enum:
                - pass
                - warn
                - fail
                - missing
                - not_applicable
              value:
                type:
                - string
                - 'null'
                description: Observed value, truncated to 512 characters. Cookie checks list names only.
              detail_code:
                type: string
              issues:
                type: array
                items:
                  type: string
              weight:
                type: integer
                minimum: 0
              classification:
                $ref: '#/components/schemas/ClassificationStatus'
        cookies:
          type: array
          description: Observed cookies (max 25). Values are never returned.
          items:
            type: object
            required:
            - name
            - secure
            - http_only
            - same_site
            - issues
            properties:
              name:
                type: string
              secure:
                type: boolean
              http_only:
                type: boolean
              same_site:
                type:
                - string
                - 'null'
                enum:
                - strict
                - lax
                - none
                - invalid
                - null
              issues:
                type: array
                items:
                  type: string
        headers_raw:
          type: object
          additionalProperties:
            type: string
          description: Security-relevant response headers that were present, with lowercase names. Never includes set-cookie.
        recommendations:
          type: array
          items:
            type: string
          description: Triggered recommendation codes in fixed priority order.
        fetch:
          type: object
          required:
          - checked_url
          - http_status
          - final_url
          - via_proxy
          - redirect_count
          - unknown_reason
          properties:
            checked_url:
              type: string
              format: uri
            http_status:
              type:
              - integer
              - 'null'
            final_url:
              type:
              - string
              - 'null'
            via_proxy:
              type:
              - boolean
              - 'null'
            redirect_count:
              type:
              - integer
              - 'null'
            unknown_reason:
              type:
              - string
              - 'null'
              enum:
              - timeout
              - dns_error
              - network_error
              - malformed_response
              - redirect_limit
              - proxy_unavailable
              - null
        caveats:
          type: array
          items:
            type: string
        rubric_version:
          type: string
