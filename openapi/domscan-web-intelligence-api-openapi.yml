              count:
                type: integer
                minimum: 1
              standard:
                type: boolean
                enum:
                - false
        test:
          type: object
          required:
          - user_agent
          - path
          - allowed
          - matched_rule
          - matched_group
          - matched_user_agents
          - reason
          properties:
            user_agent:
              type: string
            path:
              type: string
            allowed:
              type:
              - boolean
              - 'null'
              description: Null when status is unknown or invalid.
