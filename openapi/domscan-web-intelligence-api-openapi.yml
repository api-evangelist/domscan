    OnPageAuditResponse:
      type: object
      required:
      - url
      - final_url
      - status
      - reason
      - checked_at
      - fetch
      - score
      - meta
      - headings
      - content
      - links
      - images
      - resources
      - structured_data
      - checks
      - issues
      - caveats
      properties:
        url:
          type: string
          format: uri
          description: Normalized requested URL.
        final_url:
          type: string
          description: URL after redirects.
        status:
          type: string
          enum:
          - ok
          - not_found
          - not_html
          - unknown
          description: 'ok: a 200 HTML page was analysed. not_found: the page returned an exact 404 or 410. not_html: the page is not HTML. unknown: the page could not be read (blocked, rate limited, timed out, failed, empty, unresolved redirect or a non-final 2xx such as a 202 challenge); analysis fields are null or empty and the request is refunded.'
        reason:
          type:
          - string
          - 'null'
          enum:
          - blocked
          - rate_limited
          - timeout
          - upstream_error
          - redirect_unresolved
          - http_error
          - empty
          - ambiguous
          - fetch_failed
          - null
          description: Why the page is unknown; null otherwise.
        checked_at:
          type: string
          format: date-time
        fetch:
          $ref: '#/components/schemas/OnPageFetch'
        score:
          type:
          - integer
          - 'null'
          description: 'Weighted 0-100 score: high checks weigh 10, medium 5, low 2; a warning earns half; not_applicable checks are excluded. Null unless status is ok.'
        meta:
          type:
          - object
          - 'null'
          properties:
            title:
              type:
              - string
              - 'null'
            title_length:
              type: integer
            description:
              type:
              - string
              - 'null'
            description_length:
              type: integer
            canonical:
              type:
              - string
              - 'null'
              description: 'Absolute canonical URL without fragment: the first valid `<link rel="canonical">` (resolved against the document base URL), else the HTTP Link header canonical.'
            canonical_self_referencing:
              type:
              - boolean
              - 'null'
            canonical_header:
              type:
              - string
              - 'null'
              description: 'Canonical URL from the HTTP `Link: <...>; rel="canonical"` header, resolved against the final URL.'
            robots:
              type:
              - string
              - 'null'
              description: Content of every meta robots tag, joined with a comma.
            googlebot:
              type:
              - string
              - 'null'
              description: Content of every meta googlebot tag, joined with a comma.
            x_robots_tag:
              type:
              - string
              - 'null'
            indexable:
              type: boolean
              description: False when meta robots or an X-Robots-Tag without a crawler prefix says noindex or none (all crawlers).
            googlebot_noindex:
              type: boolean
              description: 'True when Googlebot may not index the page: the all-crawler rules plus meta googlebot and googlebot: scoped X-Robots-Tag directives.'
            nofollow:
              type: boolean
              description: True when meta robots or a global X-Robots-Tag says nofollow or none, so crawlers do not follow any link on the page.
            meta_refresh:
              type:
              - string
              - 'null'
              description: Content of the first `<meta http-equiv="refresh">`, or null.
            duplicate_meta_tags:
              type: array
              items:
                type: string
                enum:
                - description
                - viewport
                - robots
              description: Meta names that appear more than once.
            lang:
              type:
              - string
              - 'null'
            viewport:
              type:
              - string
              - 'null'
            favicon:
              type:
              - string
              - 'null'
            open_graph:
