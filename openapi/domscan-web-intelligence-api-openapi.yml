  /v1/robots/test:
    post:
      tags:
      - Web Intelligence
      summary: Test URLs and crawlers against robots.txt
      description: Test up to 100 URLs or paths against up to 10 user agents under RFC 9309 in one request. Send `robots_txt` to test a draft without fetching anything, or omit it to fetch the live file of `url` (or of the first absolute URL in `urls`). Each result gives the verdict, the deciding rule with its line number and the matched group. Full browser-style user agent strings are reduced to their crawler token. With a live file, URLs on another host are reported as `other_host`, and a file that cannot be read gives `unknown` with null verdicts and is refunded. 1 credit per request.
      operationId: testRobotsTxt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - urls
              properties:
                robots_txt:
                  type: string
                  maxLength: 512000
                  description: robots.txt content to test. When set, nothing is fetched.
                url:
                  type: string
                  maxLength: 2048
                  description: Site whose live robots.txt is fetched when robots_txt is omitted.
                urls:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: string
                    maxLength: 2048
                  description: URLs or paths to test.
                user_agents:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: string
                    maxLength: 200
                  description: Crawlers to test. Defaults to ["*"].
            example:
              robots_txt: 'User-agent: GPTBot

                Disallow: /


                User-agent: *

                Disallow: /admin/

                Allow: /admin/public'
              urls:
              - /blog/post-1
              - /admin/public
              user_agents:
              - Googlebot
              - GPTBot
