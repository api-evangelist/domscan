              example:
                url: https://example.com
                primary_category: SaaS & Cloud
                primary_category_id: IAB25
                categories:
                - category_id: IAB25
                  category: SaaS & Cloud
                  subcategory_id: null
                  subcategory: null
                  confidence: 84
                  keywords_found:
                  - platform
                  - dashboard
                  - enterprise
                  signals:
                  - source: keyword_title
                    evidence: Matched platform and dashboard in the page title.
                - category_id: IAB19
                  category: Technology & Computing
                  subcategory_id: null
                  subcategory: null
                  confidence: 72
                  keywords_found:
                  - api
                  - developer
                  - automation
                  signals:
                  - source: keyword_body
