            render_blocking_stylesheets:
              type:
              - integer
              - 'null'
              description: Stylesheets linked in `<head>` (print-only and disabled ones excluded). Null when the head cannot be delimited.
        structured_data:
          type:
          - object
          - 'null'
          properties:
