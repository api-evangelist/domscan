                type: string
                enum:
                - high
                - medium
                - low
                description: Label derived from confidence_score for backward compatibility
              confidence_score:
                type: integer
                minimum: 0
                maximum: 100
                description: Signature-match confidence for this response, not a population-wide accuracy claim
              evidence:
                type: string
