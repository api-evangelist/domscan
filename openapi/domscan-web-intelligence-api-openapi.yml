          - not_found
          - invalid
          - unknown
          description: 'found: robots.txt parsed. not_found: exact 4xx other than 401, 403 and 429, which means no restrictions. invalid: an HTML page was served instead of robots.txt. unknown: access denied, rate limited, server error, challenge page or network failure; refunded.'
        checked_at:
          type: string
          format: date-time
          description: Time of the fetch. On a cache hit, the time of the original fetch.
