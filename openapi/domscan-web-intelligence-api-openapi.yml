  /v1/sitemaps:
    get:
      tags:
      - Web Intelligence
      summary: Discover and audit XML sitemaps
      description: Discover the XML sitemaps of a public website from robots.txt Sitemap lines, falling back to /sitemap.xml and /sitemap_index.xml, then follow sitemap indexes within a bounded fetch budget. Each fetched file reports its type, URL count, lastmod freshness, image, video, news and hreflang extensions, and protocol issues such as invalid or cross-host URLs, bad dates, duplicates and size limits. Cross-site sitemaps are listed but never fetched. Counts cover fetched files only. Blocked, rate-limited or failed fetches stay `unknown` and an unknown result is refunded.
      operationId: getSitemapAudit
      x-required-any-of:
      - - url
      - - domain
      parameters:
      - name: url
        description: Site URL or bare domain to audit. Only the origin is used. Takes precedence over domain.
        in: query
        schema:
          type: string
          maxLength: 2048
        example: https://example.com
      - name: domain
        description: Alias for url when url is omitted.
        in: query
        schema:
          type: string
          maxLength: 253
        example: example.com
      - name: sitemap
        description: Audit only this sitemap and its index children. Must be an http(s) URL on the same registrable domain as the target. robots.txt is not fetched and standard locations are not tried in this mode.
        in: query
        schema:
          type: string
          maxLength: 2048
          example: https://example.com/sitemap_index.xml
      - name: max_sitemaps
        description: Maximum sitemap documents fetched per request (robots.txt not counted). Sitemaps beyond the budget are listed as skipped_budget.
        in: query
        schema:
          type: integer
