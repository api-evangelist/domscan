          description: 'Status of the comparison: ok only when both fetches were analysed. When only one version could be read, the result is unknown (the failing fetch''s reason, or ambiguous when it was a definite not_found or not_html answer). ok: a 200 HTML page was analysed. not_found: the page returned an exact 404 or 410. not_html: the page is not HTML. unknown: the page could not be read (blocked, rate limited, timed out, failed, empty, unresolved redirect or a non-final 2xx such as a 202 challenge); analysis fields are null or empty and the request is refunded.'
        reason:
          type:
          - string
          - 'null'
          enum:
          - blocked
          - rate_limited
          - timeout
          - upstream_error
          - redirect_unresolved
          - http_error
          - empty
          - ambiguous
          - fetch_failed
          - null
          description: Why the page is unknown; null otherwise.
        checked_at:
          type: string
          format: date-time
        raw:
          type: object
          required:
          - fetch
          - signals
          properties:
            fetch:
              $ref: '#/components/schemas/OnPageFetch'
            signals:
              allOf:
              - $ref: '#/components/schemas/OnPageSignals'
        rendered:
          type: object
          required:
          - fetch
          - signals
          properties:
            fetch:
              $ref: '#/components/schemas/OnPageFetch'
            signals:
              allOf:
              - $ref: '#/components/schemas/OnPageSignals'
        js_dependence:
          type:
          - string
          - 'null'
          enum:
          - none
          - low
          - medium
          - high
          - null
          description: 'high: a high-impact signal (title, canonical, robots, H1 or content) differs. medium: a medium-impact signal differs or JavaScript adds at least 20% of the words.'
        rendered_word_share:
          type:
          - number
          - 'null'
          description: Share of rendered words that are missing from the raw HTML (0-1).
        differences:
          type: array
          items:
            type: object
            required:
            - field
            - change
            - impact
            - raw
            - rendered
            properties:
              field:
                type: string
                enum:
                - title
                - meta_description
                - canonical
                - robots
                - noindex
                - h1
                - word_count
                - internal_links
                - external_links
                - structured_data_types
                - hreflang_count
                - lang
              change:
                type: string
                enum:
                - added_by_js
                - removed_by_js
                - changed_by_js
              impact:
                type: string
                enum:
                - high
                - medium
                - low
              raw:
                description: Raw HTML value (any JSON type, may be null).
              rendered:
                description: Rendered value (any JSON type, may be null).
        issues:
          type: array
          items:
            type: string
            enum:
            - robots_changed_by_js
            - canonical_changed_by_js
            - title_requires_js
            - h1_requires_js
            - content_requires_js
            - links_require_js
            - structured_data_changed_by_js
    TechJobResultsResponse:
      type: object
      required:
      - job
      - results
      - pagination
      properties:
        job:
          $ref: '#/components/schemas/TechScanJob'
        results:
          type: array
          items:
            type: object
            required:
            - index
            - input
            - status
            - billing
            properties:
              index:
                type: integer
              input:
                type: string
              reference:
                type: string
              status:
                type: string
                enum:
                - pending
                - processing
                - succeeded
                - failed
                - cancelled
              data:
                type: object
                additionalProperties: true
              error:
                type: object
                additionalProperties: true
              billing:
                type: object
                additionalProperties: true
              analysis_status:
                type:
                - string
                - 'null'
              detected_count:
                type:
                - integer
                - 'null'
        pagination:
          type: object
          required:
          - limit
          - next_cursor
          - has_more
          properties:
            limit:
              type: integer
            next_cursor:
              type:
              - string
              - 'null'
            has_more:
              type: boolean
  headers:
    XRateLimitLimit:
      description: Burst capacity of the rate limit that applies to this API key.
      schema:
        type: integer
        minimum: 0
    XRateLimitRemaining:
      description: Requests that can still be sent immediately before the rate limit applies.
      schema:
        type: integer
        minimum: 0
    Deprecation:
      description: 'RFC 9745. Sent when the request used a deprecated alias: the date it was deprecated, as `@` and Unix seconds. The response body is unchanged.'
      schema:
        type: string
        example: '@1791590400'
    XRateLimitReset:
      description: Unix time in seconds when the burst capacity is fully refilled.
      schema:
        type: integer
        minimum: 0
    IdempotentReplayed:
      description: Present and `true` when this response is a stored replay for a repeated Idempotency-Key. A replay charges nothing.
      schema:
        type: string
        enum:
        - 'true'
    XCreditsRemaining:
      description: Credits remaining on the account after this request. Omitted when the balance is not already known without an extra lookup.
      schema:
        type: integer
        minimum: 0
    XCreditsCharged:
      description: Credits charged by this request, net of any refund made in the same request. Sent on authenticated /v1 responses, including errors (0 when nothing was charged).
      schema:
        type: integer
        minimum: 0
    XCacheAge:
      description: Age in whole seconds of the cached data this response used (0 when it was checked fresh). The same value is returned as `cache_age_s`.
      schema:
        type: integer
        minimum: 0
    Sunset:
      description: 'RFC 8594. Sent with Deprecation: the earliest date the deprecated alias may stop working, as an HTTP-date. See /docs/versioning.'
      schema:
        type: string
        example: Sun, 10 Oct 2027 00:00:00 GMT
    XFieldsIgnored:
      description: 'Sent when `fields` was used and some paths matched nothing in this response: those paths, comma-separated, at most 20.'
      schema:
        type: string
