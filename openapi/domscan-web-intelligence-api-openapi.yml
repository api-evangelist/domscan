          description: 'broken: http_404, http_410, dns_nxdomain. unknown: blocked, rate_limited, ambiguous, dns_unavailable, timeout, fetch_failed, upstream_error, http_error, redirect_unresolved. unchecked: deadline, host_budget_reached. skipped: unsafe_target.'
    SecurityHeadersAuditResponse:
      type: object
      required:
      - url
      - domain
      - status
      - checked_at
      - final_url
      - http_status
      - redirect_count
      - https
      - score
      - grade
      - summary
      - checks
      - cookies
      - headers_raw
      - recommendations
      - fetch
      - caveats
