          format: uri
        status:
          type: string
          enum:
          - found
          - not_found
          - invalid
          - unknown
          description: 'found: at least one sitemap parsed. unknown: a decisive fetch was blocked, rate limited, failed or skipped for budget; refunded. invalid: files were found but none is a usable sitemap, or declared sitemaps are missing. not_found: every candidate returned an exact 404 or 410.'
        checked_at:
          type: string
          format: date-time
        fetch:
          type: object
          description: 'Primary fetch evidence: the robots.txt fetch, or the explicit sitemap fetch when sitemap is set.'
          required:
          - checked_url
          - http_status
          - final_url
          - via_proxy
          properties:
            checked_url:
              type: string
              format: uri
            http_status:
              type:
              - integer
              - 'null'
            final_url:
              type:
              - string
              - 'null'
            via_proxy:
              type:
              - boolean
              - 'null'
        robots_txt:
          type: object
          required:
          - status
          - url
          - http_status
          - declared_sitemaps
          properties:
            status:
              type: string
              enum:
              - found
              - not_found
              - invalid
              - unknown
              - not_requested
            url:
              type: string
              format: uri
            http_status:
              type:
              - integer
              - 'null'
            declared_sitemaps:
              type: array
              description: All Sitemap declarations (max 50). Cross-site ones are not fetched.
              items:
                type: object
                required:
                - url
                - same_site
                properties:
                  url:
                    type: string
                  same_site:
                    type: boolean
        sitemaps:
          type: array
          description: One entry per fetched or budget-skipped sitemap, in fetch order.
          items:
            $ref: '#/components/schemas/SitemapAuditEntry'
        totals:
          type: object
          required:
          - sitemaps_checked
          - sitemaps_discovered
          - urls_counted
          - budget_exhausted
          properties:
            sitemaps_checked:
              type: integer
              minimum: 0
            sitemaps_discovered:
              type: integer
              minimum: 0
            urls_counted:
              type: integer
              minimum: 0
            budget_exhausted:
              type: boolean
        freshness:
          type: object
          required:
          - newest_lastmod
          - days_since_newest
          properties:
            newest_lastmod:
              type:
              - string
              - 'null'
              format: date-time
            days_since_newest:
              type:
              - integer
              - 'null'
              minimum: 0
        issues:
          type: array
          items:
            type: string
          description: Deduplicated site-level and per-sitemap issue codes.
        caveats:
          type: array
          items:
            type: string
          description: Machine codes such as counts_cover_fetched_files_only, budget_exhausted, time_budget_exhausted, gzip_not_decoded, cross_site_sitemaps_not_fetched and max_index_depth_reached.
