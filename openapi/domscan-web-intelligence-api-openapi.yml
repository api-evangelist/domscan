              type: integer
        checks:
          type: array
          items:
            type: object
            required:
            - id
            - status
            - severity
            properties:
              id:
                type: string
                enum:
                - http_status
                - https
                - mixed_content
                - indexable
                - googlebot_indexable
                - page_nofollow
                - title_present
                - title_length
                - single_title
                - meta_description_present
                - meta_description_length
                - h1_present
                - single_h1
                - heading_hierarchy
                - canonical_present
                - canonical_invalid
                - canonical_conflict
                - canonical_points_elsewhere
                - lang_declared
                - viewport_present
                - charset_declared
                - doctype
                - word_count
                - images_alt
                - images_dimensions
                - empty_anchor_text
                - open_graph
                - structured_data
                - favicon
                - deprecated_tags
                - url_length
                - redirects
                - page_size
                - meta_refresh
                - duplicate_meta_tags
                - https_to_http_links
                - render_blocking_resources
                - charset_mismatch
              status:
                type: string
                enum:
                - pass
                - warn
                - fail
                - not_applicable
              severity:
                type: string
                enum:
                - high
                - medium
                - low
              value:
                description: 'Measured value when relevant: a count, length, status code, language or URL.'
                anyOf:
                - type:
                  - integer
                  - 'null'
                - type:
                  - string
                  - 'null'
                - type: boolean
        issues:
          type: array
          items:
            type: string
            enum:
            - http_status
            - https
            - mixed_content
            - indexable
            - googlebot_indexable
            - page_nofollow
            - title_present
            - title_length
            - single_title
            - meta_description_present
            - meta_description_length
            - h1_present
            - single_h1
            - heading_hierarchy
            - canonical_present
            - canonical_invalid
            - canonical_conflict
            - canonical_points_elsewhere
            - lang_declared
            - viewport_present
            - charset_declared
            - doctype
            - word_count
            - images_alt
            - images_dimensions
            - empty_anchor_text
            - open_graph
            - structured_data
            - favicon
            - deprecated_tags
            - url_length
            - redirects
            - page_size
            - meta_refresh
            - duplicate_meta_tags
            - https_to_http_links
            - render_blocking_resources
            - charset_mismatch
          description: IDs of checks that warned or failed.
        caveats:
          type: array
          items:
            type: string
            enum:
            - page_truncated
            - charset_mismatch
          description: 'page_truncated: the page exceeded the 1 MB read budget, so body checks that found nothing (H1, word count, structured data) or found no problem (alt text, links, deprecated tags) are not_applicable; head checks still apply. charset_mismatch: more than 0.5% of the page text is the U+FFFD replacement character, so the page was probably decoded with the wrong charset.'
