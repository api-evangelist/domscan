  /v1/robots:
    get:
      tags:
      - Web Intelligence
      summary: Parse robots.txt and test crawler access
      description: 'Fetch and parse the robots.txt of a public website under RFC 9309. Returns user-agent groups with allow and disallow rules, declared sitemaps, nonstandard directives and line-level issues, an allow or disallow verdict for one user agent and path, and root access for 14 major AI crawlers. A 404 or other exact 4xx means no restrictions. Access-denied, rate-limited, server-error, challenge and network outcomes return `status: unknown` with a null verdict and are refunded. An HTML page served at /robots.txt is reported as `invalid`.'
      operationId: getRobotsTxt
      x-required-any-of:
      - - url
      - - domain
      parameters:
      - name: url
        description: Site URL or bare domain. Takes precedence over domain. The file is always fetched from https://<host>/robots.txt.
        in: query
        schema:
          type: string
          maxLength: 2048
        example: https://example.com
      - name: domain
        description: Alias for url when url is omitted.
        in: query
        schema:
          type: string
          maxLength: 253
        example: example.com
      - name: user_agent
        description: Crawler to test. Matched on its product token, case-insensitive (GPTBot/1.1 becomes gptbot). Defaults to * (wildcard group only).
        in: query
        schema:
          type: string
          maxLength: 200
          default: '*'
          example: GPTBot
      - name: path
        description: Path to test, including any query string. Full URLs are reduced to path and query, a missing leading slash is added and fragments are dropped. Defaults to the path of url, or /.
        in: query
        schema:
          type: string
          maxLength: 2048
          example: /admin/settings
      - name: skip_cache
        in: query
        description: Deprecated alias of `max_age=0`; still accepted. Set to 1 to bypass the 15-minute robots.txt cache. Deprecated on 2026-10-10; works until at least 2027-10-10 (Sunset header).
        schema:
          type: string
          enum:
          - '1'
        deprecated: true
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      - $ref: '#/components/parameters/MaxAge'
