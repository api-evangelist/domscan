          - signals_unavailable
          - html_characters_analyzed
          - html_bytes_analyzed
          - html_byte_limit
          - html_truncated
          - response_body_truncated
          - mode
          - rendered
          - javascript_executed
          - pages_requested
          - pages_analyzed
          - page_limit
          - network_requests_observed
          - page_limit_reached
          - resource_limit_reached
          - redirected_to_different_host
          - no_detection_reason
          - recommended_mode
          - pages
          properties:
            status:
              type: string
              enum:
              - complete
              - partial
            requested_url:
              type: string
              description: Requested URL with query and fragment removed
            final_url:
              type: string
              description: Post-redirect URL with query and fragment removed
            response_status:
              type: integer
            redirect_count:
              type: integer
              minimum: 0
            relay_used:
              type: boolean
            signals_checked:
              type: array
              items:
                type: string
                enum:
                - header
                - cookie
                - html
                - asset_url
                - network_url
                - javascript
                - meta
                - url
            signals_unavailable:
              type: array
              items:
                type: string
                enum:
                - header
                - cookie
                - html
                - asset_url
                - network_url
                - javascript
                - meta
                - url
            html_characters_analyzed:
              type: integer
              minimum: 0
            html_bytes_analyzed:
              type: integer
              minimum: 0
              description: UTF-8 response-body bytes retained for detection analysis
            html_byte_limit:
              type: integer
              minimum: 1
              description: Maximum response-body bytes retained for detection analysis
            html_truncated:
              type: boolean
            response_body_truncated:
              type: boolean
              description: True when the selected fetch path stopped reading at the byte limit
            mode:
              type: string
              enum:
              - fast
              - rendered
              - deep
            rendered:
              type: boolean
            javascript_executed:
              type: boolean
            pages_requested:
              type: integer
              minimum: 1
              maximum: 5
            pages_analyzed:
              type: integer
              minimum: 1
              maximum: 5
            page_limit:
              type: integer
              minimum: 1
              maximum: 5
            network_requests_observed:
              type: integer
              minimum: 0
            page_limit_reached:
              type: boolean
            resource_limit_reached:
              type: boolean
            redirected_to_different_host:
              type: boolean
              description: True when redirects moved the scan from the requested hostname to another hostname.
            no_detection_reason:
              type:
              - string
              - 'null'
              enum:
              - redirected_to_different_host
              - no_verified_signature_fast_mode
              - no_verified_public_signature
              - target_blocked
              - target_non_html
              - target_empty
              - target_http_error
              - target_network_error
              description: Machine-readable explanation when no verified technologies were detected.
            recommended_mode:
              type:
              - string
              - 'null'
              enum:
              - rendered
              description: A higher-signal scan mode to try when fast mode found no verified public signature.
            pages:
              type: array
              maxItems: 5
              items:
                type: object
                required:
                - url
                - status
                - html_truncated
                - network_requests_observed
                properties:
                  url:
                    type: string
                    format: uri
                  status:
                    type: integer
                  html_truncated:
                    type: boolean
                  network_requests_observed:
                    type: integer
        total_time_ms:
          type: integer
          minimum: 0
        checked_at:
          type: string
          format: date-time
        _meta:
          type: object
          required:
          - served_by
          - analysis_status
          - response_status
          - cache_status
          - stale
          properties:
            served_by:
              type: string
            analysis_status:
              type: string
              enum:
              - ok
              - blocked
              - non_html
              - empty
              - http_error
              - network_error
            response_status:
              type: integer
            cache_status:
              type: string
              enum:
              - miss
              - hit
              - stale
            stale:
              type: boolean
            cached_at:
              type: string
              format: date-time
    ScrapeJob:
      type: object
      required:
      - id
      - status
      - mode
      - output
      - total
      - counts
      - billing
      properties:
        id:
          type: string
          pattern: ^scj_[a-f0-9]{32}$
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - completed_with_errors
        mode:
          type: string
          enum:
          - standard
          - resilient
          - rendered
          - rendered_resilient
        output:
          type: string
          enum:
          - html
          - text
          - markdown
        total:
          type: integer
          minimum: 1
          maximum: 100
        counts:
          type: object
          properties:
            pending:
              type: integer
            processing:
              type: integer
            succeeded:
              type: integer
            failed:
              type: integer
        billing:
          $ref: '#/components/schemas/ScrapeBilling'
        status_url:
          type: string
          format: uri
        results_url:
          type: string
          format: uri
        poll_after_ms:
          type:
          - integer
          - 'null'
        created_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        updated_at:
          type: string
          format: date-time
        processing_deadline_at:
          type: string
          format: date-time
        results_expires_at:
          type: string
          format: date-time
    TechScanTarget:
      oneOf:
      - type: string
        minLength: 1
        maxLength: 2048
      - type: object
        required:
        - url
        additionalProperties: false
        properties:
          url:
            type: string
            minLength: 1
            maxLength: 2048
          reference:
            type: string
            minLength: 1
            maxLength: 128
  responses:
    RateLimited:
      description: Rate limit exceeded. Free accounts can sustain 120 requests per minute per account with a burst capacity of 60. Free bulk traffic is additionally limited to 20 requests per minute per account across all bulk endpoints and 100 per minute per IPv4 address or IPv6 /56 network. Paid accounts can sustain 600 requests per minute with a burst capacity of 120.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
        X-RateLimit-Plan:
          schema:
            type: string
            enum:
            - free
            - paid
          description: The account plan whose policy was applied.
        X-RateLimit-Limit:
          schema:
            type: integer
          description: The immediate burst capacity, or the active bulk fixed-window limit when a bulk-specific limit is exceeded.
        X-RateLimit-Remaining:
          schema:
            type: integer
            example: 0
          description: Immediate burst tokens remaining, or requests remaining in the active bulk fixed window.
        X-RateLimit-Policy:
          schema:
            type: string
          description: Machine-readable summary of the active tier and limit policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded. Please wait before making more requests.
    Conflict:
      description: The requested account change conflicts with current account state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TechPaymentRequired:
      description: Insufficient credits. A technology detection request costs 3 credits.
      headers:
        X-Credits-Remaining:
          schema:
            type: integer
          description: Credits remaining on the account
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INSUFFICIENT_CREDITS
              message: Insufficient credits. This endpoint costs 3 credits but you have 0. Purchase more at https://domscan.net/billing or wait for your monthly reset.
              credits_remaining: 0
              credits_required: 3
              purchase_url: https://domscan.net/billing
    Gone:
      description: The invitation has expired and can no longer be accepted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PaymentRequired:
      description: Insufficient credits for this request
      headers:
        X-Credits-Remaining:
          schema:
            type: integer
          description: Credits remaining on your API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INSUFFICIENT_CREDITS
              message: Insufficient credits. This endpoint costs 2 credits but you have 0. Purchase more at https://domscan.net/billing or wait for your monthly reset.
              credits_remaining: 0
              credits_required: 2
              purchase_url: https://domscan.net/billing
    Forbidden:
      description: The signed-in member does not have permission to perform this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested account resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 'Authentication required. All API endpoints require a valid API key (x-api-key header or Authorization: Bearer) or an active session cookie.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_REQUIRED
              message: 'Authentication required. Provide an API key via x-api-key header or Authorization: Bearer header.'
              docs: https://domscan.net/docs/authentication
              get_key: https://domscan.net/login
    BadGateway:
      description: The public website could not be fetched or returned an unusable response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FETCH_ERROR
              message: Failed to fetch website
    ServiceUnavailable:
      description: The pricing request could not complete. Any base and supplemental pair charges are refunded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: SOURCE_UNAVAILABLE
              message: Service temporarily unavailable
    TechServiceUnavailable:
      description: DomScan could not perform the requested detection work. The request charge is refund-eligible. Target HTTP errors, blocks, empty responses, and target network failures are returned as billable 200 responses with partial analysis metadata instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: UPSTREAM_UNAVAILABLE
              message: Failed to fetch website
    BadRequest:
      description: Bad request - invalid parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: Invalid domain format
              suggestion: Domain must be a valid format like example.com
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: 'API key for authentication. Get yours free at https://domscan.net. Also accepts Authorization: Bearer header.'
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Active DomScan browser session. Used by account-management endpoints.
externalDocs:
  description: Full API Documentation
  url: https://domscan.net/docs
x-rapidapi-product: domscan
x-domscan-rate-limits:
  free:
    general:
      scope: account
      sustained_requests_per_minute: 120
      burst_capacity: 60
      shared_across_api_keys_and_sessions: true
    bulk:
      scope: all bulk endpoints combined
      account_requests_per_minute: 20
      network_requests_per_minute: 100
      ipv6_network_prefix: 56
  paid:
    general:
      scope: API key for key-authenticated requests; IP for browser sessions
      sustained_requests_per_minute: 600
      burst_capacity: 120
    free_bulk_budget_applies: false
  response:
    status: 429
    retry_header: Retry-After
    headers_on_every_authenticated_response:
    - X-RateLimit-Plan
    - X-RateLimit-Limit
    - X-RateLimit-Remaining
    - X-RateLimit-Policy
    burst_headers:
    - X-RateLimit-Limit
    - X-RateLimit-Remaining
    policy_header: X-RateLimit-Policy
x-domscan-response-metadata:
  compatibility: additive response headers; established JSON success bodies are unchanged
  headers:
    X-Request-Id: Unique request identifier for logs and support
    X-API-Version: DomScan API release version
    X-Response-Time: Server processing duration in milliseconds
    X-Credits-Requested: Credits requested before refund settlement
    X-Credits-Charged: Credits retained after settlement
    X-Credits-Refunded: Credits returned during settlement
    X-Credits-Remaining: Authenticated account balance after the request
    X-Data-Freshness: fresh, cached, stale, mixed, or unknown
    X-RateLimit-Limit: Active burst capacity
    X-RateLimit-Remaining: Remaining burst capacity
    X-RateLimit-Plan: Active plan, or not_applicable before authentication
    X-RateLimit-Policy: Machine-readable active rate policy
