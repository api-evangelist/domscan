      tags:
      - Web Intelligence
      summary: Crawl and audit a website
      description: Crawl up to `max_pages` same-site HTML pages breadth first from the start URL, three at a time within a 45 second budget, following robots.txt for all crawlers (the start page is always fetched; an unreadable robots.txt limits the crawl to the start page). Every page gets the on-page audit, and the response aggregates broken internal links (exact 404 or 410 with linking pages), internal redirects, duplicate titles, meta descriptions and H1s, near-duplicate content, noindex, canonicalized and thin pages and the most common failed checks. Scheme and www variants of a URL are one page, and a URL that redirects to a page already crawled or off the site is reported as a redirect only. Near duplicates exclude canonicalized pairs and pages too short to compare. Links to pages beyond the limit are counted in discovered_not_crawled. If the start page cannot be read the result is unknown and refunded.
      operationId: getSiteAudit
      parameters:
      - name: url
        in: query
        required: true
        description: Page URL or bare domain.
        schema:
          type: string
        example: https://example.com/shoes/trail-runner
      - name: max_pages
        in: query
        description: 'Pages to crawl: 10 (10 credits), 25 (20) or 50 (35).'
        schema:
          type: integer
          enum:
          - 10
          - 25
          - 50
          default: 10
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
