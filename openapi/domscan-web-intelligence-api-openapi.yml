              - unknown
              - not_checked
              description: not_checked unless verify_links=true.
            supported:
              type:
              - boolean
              - 'null'
              description: The `gpc` value of /.well-known/gpc.json; null unless found.
            last_update:
              type:
              - string
              - 'null'
            reason:
              type:
              - string
              - 'null'
              description: http_not_found, invalid_gpc_resource, not_a_gpc_resource, unsafe_target, fetch_failed, http_error or http_<status>.
          description: Global Privacy Control support resource.
        privacy_policy_check:
          type: object
          required:
          - status
          - http_status
          - reason
          properties:
            status:
              type: string
              enum:
              - reachable
              - broken
              - unknown
              - not_checked
              description: 'Fetch of the linked privacy policy. broken: an exact 404 or 410. not_checked unless verify_links=true and the policy link has a URL.'
            http_status:
              type:
              - integer
              - 'null'
            reason:
              type:
              - string
              - 'null'
              description: http_not_found, unsafe_target or a page fetch reason such as blocked or timeout.
        summary:
          type: object
          required:
          - found
          - not_found
          - unknown
          properties:
