          - disallow_rules
          - sitemaps
          - issues
          - lines
          - ai_crawlers_allowed
          - ai_crawlers_disallowed
          - ai_crawlers_partial
          - ai_crawlers_unknown
          - ai_crawlers_with_specific_group
          properties:
            groups:
              type: integer
              minimum: 0
            rules:
              type: integer
              minimum: 0
            allow_rules:
              type: integer
              minimum: 0
            disallow_rules:
              type: integer
              minimum: 0
            sitemaps:
              type: integer
              minimum: 0
            issues:
              type: integer
              minimum: 0
            lines:
              type: integer
              minimum: 0
            ai_crawlers_allowed:
              type: integer
              minimum: 0
            ai_crawlers_disallowed:
              type: integer
              minimum: 0
            ai_crawlers_partial:
              type: integer
              minimum: 0
            ai_crawlers_unknown:
              type: integer
              minimum: 0
            ai_crawlers_with_specific_group:
              type: integer
              minimum: 0
        meta:
          type: object
          required:
