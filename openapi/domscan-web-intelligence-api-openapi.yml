components:
  schemas:
    ReputationResponse:
      type: object
      description: Domain reputation score and factors
      properties:
        domain:
          type: string
        reputation_score:
          type: integer
          minimum: 0
          maximum: 100
        grade:
          type: string
        risk_level:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        reputation_score_confidence:
          type: string
          enum:
          - high
          - medium
          - low
        grade_capped_by_parking:
          type: boolean
          description: Set when a parking signal clamped the displayed grade below the raw weighted score.
        factors:
          type: object
          properties:
            age:
              type: object
              additionalProperties: true
            dns_security:
              type: object
              additionalProperties: true
            ssl_certificate:
              type: object
              additionalProperties: true
            hosting:
              type: object
              additionalProperties: true
            web_presence:
              type: object
              additionalProperties: true
              description: details.parked and details.for_sale are true or false only from parking evidence and null when parking could not be determined (details.parking_status is present, absent or unknown). Unknown parking applies no parking penalty and does not count as a confidence signal.
            blacklists:
              type: object
              additionalProperties: true
              description: details.domain_blacklists and details.ip_blacklists report status (listed, not_listed or unknown), checked (lists that answered), listed and unknown (lists that could not answer). When no domain list confirms a clean result and nothing else lowers the factor, score is null and the factor is left out of reputation_score.
            email_config:
              type: object
              additionalProperties: true
          additionalProperties: true
        recommendations:
          type: array
          items:
            type: object
            properties:
              priority:
                type: string
                enum:
                - low
                - medium
                - high
              category:
                type: string
              action:
                type: string
              impact:
                type: string
        evidence_summary:
          $ref: '#/components/schemas/ReputationEvidenceSummary'
        meta:
          type: object
          properties:
            query_time_ms:
              type: integer
            checks_performed:
              type: integer
            cached:
              type: boolean
            served_by:
              type: string
    StructuredDataNestedItem:
      type: object
      required:
      - format
      - types
      - properties
      - values
      - children
      - path
      - status
      - errors
      - warnings
      properties:
        format:
          type: string
          enum:
          - json-ld
          - microdata
          - rdfa
        types:
          type: array
          items:
            type: string
          description: schema.org types without the vocabulary prefix.
        properties:
          type: array
          items:
            type: string
          description: Properties with a value, in source order.
        values:
          type: object
          additionalProperties:
            type: string
          description: Preview (first 200 characters) of scalar property values.
        children:
          type: array
          description: Deeper nested items, with the same shape as this item.
          items:
            type: object
            additionalProperties: true
        path:
          type: string
          example: json_ld[0].children[1]
        status:
          type: string
          enum:
          - valid
          - warnings
          - errors
          - unchecked
          description: 'unchecked: no rules exist for this type; the item was extracted but not validated.'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/StructuredDataIssue'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/StructuredDataIssue'
    ReputationEvidenceSummary:
      type: object
      description: Additive reputation evidence rollup showing factor coverage, blacklist count, cache state, and prioritized remediation pressure.
      properties:
        checks_performed:
          type: integer
        cache_status:
          type: string
          enum:
          - hit
          - miss
        confidence:
          type: string
          enum:
          - high
          - medium
          - low
        risk_level:
          type: string
          enum:
          - low
          - medium
          - high
          - critical
        factor_count:
          type: integer
        scored_factor_count:
          type: integer
        passing_factor_count:
          type: integer
        warning_factor_count:
          type: integer
        failing_factor_count:
          type: integer
        lowest_scoring_factors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              score:
                type:
                - number
                - 'null'
              weight:
                type:
                - number
                - 'null'
        blacklist_listed_count:
          type: integer
        recommendation_count:
          type: integer
        high_priority_recommendation_count:
          type: integer
        grade_capped_by_parking:
          type: boolean
    RedirectRiskSummary:
      type: object
      description: Additive redirect risk rollup for downgrade, domain change, long chains, tracking parameters, and incomplete chains.
      properties:
        risk_level:
          type: string
          enum:
          - low
          - medium
          - high
        risk_flags:
          type: array
          items:
            type: string
        hop_count:
          type: integer
        redirect_count:
          type: integer
        https_upgrade:
          type: boolean
        https_downgrade:
          type: boolean
        domain_changed:
          type: boolean
        final_status:
          type: integer
        error_present:
          type: boolean
        tracking_parameter_hops:
          type: integer
    CategorizeResponse:
      type: object
      description: Website categorization results with multi-signal analysis
      properties:
        cache_age_s:
          type: integer
          minimum: 0
          description: Age in whole seconds of the cached data used for this response; 0 when it was checked fresh. For multi-item responses, the oldest item.
        url:
          type: string
          description: The URL that was categorized
        primary_category:
          type:
          - string
          - 'null'
          description: Top category name
        primary_category_id:
          type:
          - string
          - 'null'
          description: IAB-style category ID (e.g., IAB22)
        categories:
          type: array
          description: Top categories sorted by confidence (max 5)
          items:
            type: object
            properties:
              category_id:
                type: string
                description: IAB-style ID (e.g., IAB22)
              category:
                type: string
                description: Category name
              subcategory_id:
                type:
                - string
                - 'null'
                description: Subcategory ID (e.g., IAB22-1)
              subcategory:
                type:
                - string
                - 'null'
                description: Subcategory name
              confidence:
                type: integer
                minimum: 0
                maximum: 100
              keywords_found:
                type: array
                items:
                  type: string
                description: Keywords that matched
              signals:
                type: array
                description: Evidence signals that contributed to this category match
                items:
                  type: object
                  properties:
                    source:
                      type: string
                      description: Signal source (keyword_title, schema_org, tld_heuristic, etc.)
                    evidence:
                      type: string
                      description: Human-readable explanation
        primary_category_confidence:
          type: string
          enum:
          - high
          - medium
          - low
          - none
          description: 'CAT-006: confidence band derived from the top-1 vs top-2 margin. "low" also signals the top category absolute confidence is under 20.'
        title:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        language:
          type:
          - string
          - 'null'
        language_confidence:
          type: string
          enum:
          - high
          - medium
          - low
          - none
          description: 'CAT-012: coarse confidence for the detected language.'
        adult_content:
          type: boolean
          description: Whether adult content was detected
        signals_used:
          type: integer
          description: Total number of signals analyzed
        cached:
          type: boolean
          description: Whether result was served from cache
        total_time_ms:
          type: integer
        checked_at:
          type: string
          format: date-time
        evidence_summary:
          $ref: '#/components/schemas/CategorizeEvidenceSummary'
        meta:
          type: object
          properties:
            served_by:
              type: string
            cache_status:
              type: string
              enum:
              - miss
              - hit
              - stale
    BulkReputationResponse:
      type: object
      description: Bulk reputation lookup response
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/BulkReputationResult'
        summary:
          type: object
          properties:
            total:
              type: integer
            successful:
              type: integer
            failed:
              type: integer
            cached:
              type: integer
            query_time_ms:
              type: integer
        meta:
          type: object
          properties:
            served_by:
              type: string
    IdentityResolutionResponse:
      type: object
      required:
      - query
      - canonical_domain
      - website_url
      - fetch_state
      - organization
      - identities
      - contacts
      - confidence
      - evidence
      - meta
      properties:
        cache_age_s:
          type: integer
          minimum: 0
          description: Age in whole seconds of the cached data used for this response; 0 when it was checked fresh. For multi-item responses, the oldest item.
        query:
          type: string
        canonical_domain:
          type: string
        website_url:
          type: string
          format: uri
        fetch_state:
          type: string
          enum:
          - ok
          - blocked
          - http_error
          - non_html
          - empty
          - unknown
        organization:
          type: object
          properties:
            name:
              type:
              - string
              - 'null'
            description:
              type:
              - string
              - 'null'
        identities:
          type: array
          items:
            $ref: '#/components/schemas/PublicIdentity'
        contacts:
          type: object
          properties:
            emails:
              type: array
              items:
                type: string
            phones:
              type: array
              items:
                type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidence:
          type: object
          required:
          - declared_identity_count
          - high_confidence_count
          - medium_confidence_count
          - sources
          properties:
            declared_identity_count:
              type: integer
              minimum: 0
            high_confidence_count:
              type: integer
              minimum: 0
            medium_confidence_count:
              type: integer
              minimum: 0
            sources:
              type: array
              items:
                type: string
        meta:
          $ref: '#/components/schemas/WebDataMeta'
    HreflangResponse:
      type: object
      required:
      - url
      - final_url
      - status
      - reason
      - checked_at
      - fetch
      - lang
      - entries
      - self_reference
      - x_default
      - issues
      - return_links
      properties:
        url:
          type: string
          format: uri
          description: Normalized requested URL.
        final_url:
          type: string
          description: URL after redirects.
        status:
          type: string
          enum:
          - ok
          - not_found
          - not_html
          - unknown
          description: 'ok: a 200 HTML page was analysed. not_found: the page returned an exact 404 or 410. not_html: the page is not HTML. unknown: the page could not be read (blocked, rate limited, timed out, failed, empty, unresolved redirect or a non-final 2xx such as a 202 challenge); analysis fields are null or empty and the request is refunded.'
        reason:
          type:
          - string
          - 'null'
          enum:
          - blocked
          - rate_limited
          - timeout
          - upstream_error
          - redirect_unresolved
          - http_error
          - empty
          - ambiguous
          - fetch_failed
          - null
