  /v1/scrape:
    post:
      tags:
      - Web Intelligence
      summary: Scrape one public web page
      description: Retrieve one public HTTP(S) page with bounded redirects and response size. Standard uses one attempt, resilient permits one eligible retry, and rendered modes execute JavaScript in an isolated browser. Free accounts can use standard mode only, with 5 requests per minute, one concurrent request, 100 requests per day, 500 per month, and a 256 KiB response limit. Paid accounts allow 60 requests per minute, up to five concurrent standard or resilient requests, up to two concurrent rendered requests, and a 512 KiB response limit. CAPTCHA solving and premium proxy selection are not offered. Billing is based on processing effort, so target HTTP errors, blocks, rate limits, timeouts, and unsupported content remain charged. Invalid targets cost zero and verified DomScan platform failures are refunded.
      operationId: scrapePage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              additionalProperties: false
              properties:
                url:
                  type: string
                  format: uri
                  minLength: 1
                  maxLength: 2048
                mode:
                  type: string
                  enum:
                  - standard
                  - resilient
                  - rendered
                  - rendered_resilient
                  default: standard
                  description: standard costs 1 credit, resilient costs 2, rendered costs 10, and rendered_resilient costs 20. Free accounts can use standard mode only.
                output:
                  type: string
                  enum:
                  - html
                  - text
                  - markdown
                  default: html
            example:
              url: https://example.com/
              mode: standard
              output: markdown
      responses:
        '200':
          description: Processed target result. A non-success outcome describes the target response and remains billable.
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - billing
                properties:
                  data:
                    $ref: '#/components/schemas/ScrapeResult'
                  billing:
                    $ref: '#/components/schemas/ScrapeBilling'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-domscan-credits:
        model: per_item
        default: 1
        variants:
        - parameter: mode
          equals: resilient
          credits: 2
        - parameter: mode
          equals: rendered
          credits: 10
        - parameter: mode
          equals: rendered_resilient
          credits: 20
        note: Standard costs 1 credit, resilient costs 2, rendered costs 10, and rendered resilient costs 20. Billing is based on processing effort, not target-site success. Invalid targets cost zero and verified platform failures are refunded.
  /v1/scrape/jobs:
    post:
      tags:
      - Web Intelligence
      summary: Create an asynchronous scrape job
      description: Paid accounts can queue 1 to 100 public URLs, with up to three active jobs and 300 queued items per account. Job creation is limited to five requests per minute. Every accepted URL is charged at the selected mode price. Results are retained for 24 hours and job metadata for seven days. CAPTCHA solving and premium proxy selection are not offered. Target-site failures remain billed; items that cannot be processed because of a verified platform failure are refunded.
      operationId: createScrapeJob
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Printable ASCII key, 1 to 128 characters. Reuse with identical input returns the original job.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - urls
              additionalProperties: false
              properties:
                mode:
                  type: string
                  enum:
                  - standard
                  - resilient
                  - rendered
                  - rendered_resilient
                  default: standard
                output:
                  type: string
                  enum:
                  - html
                  - text
                  - markdown
                  default: html
                urls:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items:
                    oneOf:
                    - type: string
                      format: uri
                      maxLength: 2048
                    - type: object
                      required:
                      - url
                      additionalProperties: false
                      properties:
                        url:
                          type: string
                          format: uri
                          maxLength: 2048
                        reference:
                          type: string
                          minLength: 1
                          maxLength: 128
            example:
              mode: resilient
              output: text
              urls:
              - https://example.com/
              - url: https://example.org/
                reference: page-2
      responses:
        '202':
          description: Job accepted or idempotently replayed
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/ScrapeJob'
                  idempotent_replay:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      x-domscan-credits:
        model: per_item
        default: 1
        variants:
        - parameter: mode
          equals: resilient
          credits: 2
        - parameter: mode
          equals: rendered
          credits: 10
        - parameter: mode
          equals: rendered_resilient
          credits: 20
        note: Each accepted URL uses the selected mode price. Target-site failures remain billed; only verified platform failures are refunded.
  /v1/scrape/jobs/{job_id}:
    get:
      tags:
      - Web Intelligence
      summary: Get asynchronous scrape job progress
      operationId: getScrapeJob
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^scj_[a-f0-9]{32}$
      responses:
        '200':
          description: Owner-scoped job status and billing settlement
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/ScrapeJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 0
  /v1/scrape/jobs/{job_id}/results:
    get:
      tags:
      - Web Intelligence
      summary: Get asynchronous scrape job results
      operationId: getScrapeJobResults
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^scj_[a-f0-9]{32}$
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      responses:
        '200':
          description: Ordered page of item results
          content:
            application/json:
              schema:
                type: object
                properties:
                  job:
                    $ref: '#/components/schemas/ScrapeJob'
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                        url:
                          type: string
                          format: uri
                        reference:
                          type: string
                        status:
                          type: string
                          enum:
                          - pending
                          - processing
                          - succeeded
                          - failed
                        data:
                          $ref: '#/components/schemas/ScrapeResult'
                        billing:
                          $ref: '#/components/schemas/ScrapeBilling'
                  pagination:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 0
  /v1/tech/bulk:
    post:
      tags:
      - Web Intelligence
      summary: Bulk detect technology stacks
      description: Run the fast detector for up to 10 ordered targets. Invalid targets cost zero. Each attempted target costs 3 credits, including target HTTP errors, blocks, empty responses, and network failures. A verified DomScan service failure is refunded per item.
      operationId: postTechStackBulk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - targets
              properties:
                mode:
                  type: string
                  enum:
                  - fast
                  default: fast
                targets:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    $ref: '#/components/schemas/TechScanTarget'
            example:
              mode: fast
              targets:
              - example.com
              - url: https://shop.example.com/
                reference: crm-42
      responses:
        '200':
          description: Ordered bulk technology results with item-level billing settlement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechBulkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/TechServiceUnavailable'
      x-domscan-credits:
        model: per_item
        default: 3
        note: Each valid target costs 3 credits. Invalid targets cost zero.
  /v1/tech/jobs:
    post:
      tags:
      - Web Intelligence
      summary: Create asynchronous technology scan job
      description: Create a durable job for up to 100 public targets. Each target has its own credit operation and refund state. Full results expire after 48 hours and operational job records expire after seven days.
      operationId: createTechScanJob
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Printable ASCII key, maximum 128 characters. Reuse with the same request returns the original job; reuse with different input returns 409.
        schema:
          type: string
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - targets
              properties:
                mode:
                  type: string
                  enum:
                  - fast
                  - rendered
                  - deep
                  default: fast
                max_pages:
                  type: integer
                  minimum: 1
                  maximum: 5
                targets:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/TechScanTarget'
            example:
              mode: deep
              max_pages: 3
              targets:
              - example.com
              - url: https://shop.example.com/
                reference: shop
      responses:
        '202':
          description: Job accepted or returned as an idempotent replay
          content:
            application/json:
              schema:
                type: object
                required:
                - job
                - idempotent_replay
                properties:
                  job:
                    $ref: '#/components/schemas/TechScanJob'
                  idempotent_replay:
                    type: boolean
