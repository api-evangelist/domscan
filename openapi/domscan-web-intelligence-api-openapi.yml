          - html_lang
          - content_language
          - tld
          - regions
          - typical_signals
          properties:
            html_lang:
              type:
              - string
              - 'null'
              description: The `lang` attribute of the html element.
            content_language:
              type:
              - string
              - 'null'
              description: Content-Language response header.
            tld:
              type:
              - string
              - 'null'
            regions:
              type: array
              items:
                type: string
                enum:
                - eea
                - uk
                - ch
                - br
                - us
                - ca
                - au
                - jp
                - kr
                - cn
                - tr
                - ru
                - in
              description: Jurisdiction hints from the country-code TLD only (eea covers EU and EEA TLDs and .eu). Empty for generic TLDs. Never a legal conclusion.
            typical_signals:
              type: array
              items:
                type: string
                enum:
                - privacy_policy
                - terms_of_service
                - contact
                - consent_management
                - cookie_policy
                - imprint
                - privacy_choices
              description: Signals sites in these regions commonly publish. Hints for review, not requirements.
          description: Null unless status is ok.
        links:
          type:
          - object
          - 'null'
          required:
          - privacy_choices
          - privacy_policy
          - terms_of_service
          - cookie_policy
          - imprint
          - accessibility_statement
          - contact
          - refund_policy
          properties:
            privacy_choices:
              type: object
              required:
              - status
              - reason
              - evidence
              - matches
              properties:
                status:
                  type: string
                  enum:
                  - found
                  - not_found
                  - unknown
                  description: 'found: a link or control on the page matched. not_found: the whole page was received and parsed and nothing matched. unknown: absence could not be confirmed (see reason).'
                reason:
