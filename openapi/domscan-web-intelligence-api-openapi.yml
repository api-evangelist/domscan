    RobotsTesterResponse:
      type: object
      required:
      - source
      - url
      - robots_url
      - status
      - checked_at
      - summary
      - user_agents
      - results
      - sitemaps
      - issues
      - caveats
      - fetch
      - meta
      properties:
        source:
          type: string
          enum:
          - provided
          - fetched
          description: 'provided: the robots_txt you sent. fetched: the live file of the site.'
        url:
          type:
          - string
          - 'null'
          description: Normalized site URL, if any.
        robots_url:
          type:
          - string
          - 'null'
          description: The fetched robots.txt URL. Null when robots_txt was provided.
        status:
          type: string
          enum:
          - found
          - not_found
          - invalid
          - unknown
          description: Same meaning as GET /v1/robots. A provided file is always found. unknown is refunded and every verdict is null.
        checked_at:
          type: string
          format: date-time
        summary:
          type: object
          required:
          - tests
          - allowed
          - disallowed
          - unknown
          - groups
          - rules
          - issues
          properties:
            tests:
              type: integer
              minimum: 0
              description: URLs times user agents.
            allowed:
              type: integer
              minimum: 0
            disallowed:
              type: integer
              minimum: 0
            unknown:
              type: integer
              minimum: 0
            groups:
              type: integer
              minimum: 0
            rules:
              type: integer
              minimum: 0
            issues:
              type: integer
              minimum: 0
        user_agents:
          type: array
          items:
            type: object
            required:
            - user_agent
            - allowed
            - disallowed
            - unknown
            properties:
              user_agent:
                type: string
              allowed:
                type: integer
                minimum: 0
              disallowed:
                type: integer
                minimum: 0
              unknown:
                type: integer
                minimum: 0
        results:
          type: array
          description: One row per user agent and URL, grouped by user agent in request order.
          items:
            type: object
            required:
            - url
            - path
            - user_agent
            - token
            - allowed
            - reason
            - matched_rule
            - matched_group
            - matched_user_agents
            - vendor
            properties:
              url:
                type: string
                description: The URL or path as sent.
              path:
                type: string
                description: Path and query that was tested.
              user_agent:
                type: string
              token:
                type: string
                description: Product token matched against User-agent lines. A full browser-style string is reduced to its crawler token.
              allowed:
                type:
                - boolean
                - 'null'
              reason:
                type: string
                enum:
                - matched_allow
                - matched_disallow
                - no_matching_rule
                - robots_txt_always_allowed
                - no_robots_file
                - status_unknown
                - invalid_file
                - other_host
                description: 'other_host: the URL is on a different host than the fetched robots.txt, so it is not judged.'
              matched_rule:
                type:
                - object
                - 'null'
                required:
                - type
                - path
                - line
                properties:
                  type:
                    type: string
                    enum:
                    - allow
                    - disallow
                  path:
                    type: string
                  line:
                    type: integer
                    minimum: 1
              matched_group:
                type:
                - string
                - 'null'
                enum:
                - specific
                - wildcard
                - none
                - null
              matched_user_agents:
                type: array
                items:
                  type: string
              vendor:
                type:
                - object
                - 'null'
                description: 'The verdict documented by the crawler owner when it picks a different group than RFC 9309: AdsBot-Google and AdsBot-Google-Mobile ignore the * group, and Googlebot-Image, Googlebot-News and Googlebot-Video use the Googlebot group before *. allowed above stays the RFC 9309 verdict. Null when no such rule applies.'
                required:
                - allowed
                - reason
                - matched_rule
                - matched_group
                properties:
                  allowed:
                    type:
                    - boolean
                    - 'null'
                  reason:
                    type: string
                    enum:
                    - wildcard_group_ignored
                    - googlebot_group_fallback
                  matched_rule:
                    type:
                    - object
                    - 'null'
                    required:
                    - type
                    - path
                    - line
                    properties:
                      type:
                        type: string
                        enum:
                        - allow
                        - disallow
                      path:
                        type: string
                      line:
                        type: integer
                        minimum: 1
                  matched_group:
                    type: string
                    enum:
                    - specific
                    - wildcard
                    - none
        sitemaps:
          type: array
          items:
            type: string
        issues:
          type: array
          description: Syntax and file issues, with the same codes as GET /v1/robots.
          items:
            type: object
            required:
            - code
            - count
            - lines
            properties:
              code:
                type: string
              count:
                type: integer
                minimum: 1
              lines:
                type: array
                items:
                  type: integer
                  minimum: 1
        caveats:
          type: array
          items:
            type: string
        fetch:
          type:
          - object
          - 'null'
          description: Fetch evidence as in GET /v1/robots. Null when robots_txt was provided.
          required:
          - checked_url
          - http_status
          - final_url
          - via_proxy
          - redirect_count
          - content_type
          - bytes
          - truncated
          - error
          properties:
            checked_url:
              type: string
            http_status:
              type:
              - integer
              - 'null'
            final_url:
              type:
              - string
              - 'null'
            via_proxy:
              type:
              - boolean
              - 'null'
            redirect_count:
              type:
              - integer
              - 'null'
            content_type:
              type:
              - string
              - 'null'
            bytes:
              type:
              - integer
              - 'null'
            truncated:
              type: boolean
            error:
              type:
              - string
              - 'null'
        meta:
          type: object
          required:
          - cached
          - duration_ms
          properties:
            cached:
              type: boolean
            duration_ms:
              type: integer
              minimum: 0
    WebDataMeta:
      type: object
