            type: object
            required:
            - user_agent
            - owner
            - purpose
            - root_access
            - group
            properties:
              user_agent:
                type: string
              owner:
                type: string
                enum:
                - openai
                - anthropic
                - google
                - perplexity
                - common_crawl
                - bytedance
                - apple
                - meta
                - amazon
              purpose:
                type: string
                enum:
                - training
                - search
                - user_fetch
                - training_control
              root_access:
                type: string
                enum:
                - allowed
                - partial
                - disallowed
                - unknown
              group:
                type:
                - string
                - 'null'
                enum:
                - specific
                - wildcard
                - none
                - null
        issues:
          type: array
          items:
            type: object
            required:
            - code
            - count
            - lines
            properties:
              code:
                type: string
                enum:
                - unknown_directive
                - nonstandard_directive
                - directive_typo
                - rule_outside_group
                - invalid_line
                - empty_user_agent
                - rule_path_not_absolute
                - crawl_delay_nonstandard
                - invalid_crawl_delay
                - sitemap_not_absolute
                - invalid_sitemap_url
                - too_many_sitemaps
                - size_limit_exceeded
                - no_user_agent_groups
                - empty_file
                - html_instead_of_robots
                - unexpected_content_type
              count:
