                description: 1-based line numbers (first 20). Empty for file-level issues.
        caveats:
          type: array
          items:
            type: string
          description: Machine codes such as rfc_4xx_allows_crawling, rfc_assume_complete_disallow, http_access_denied, http_rate_limited, http_server_error, challenge_or_block_page, redirect_limit_exceeded, timeout, network_error, dns_failure, redirected_to_other_host and parsed_first_500_kib.
        summary:
