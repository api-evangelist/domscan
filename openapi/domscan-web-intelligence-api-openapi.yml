                  $ref: '#/components/schemas/JobNotifyWebhook'
                mode:
                  type: string
                  enum:
                  - fast
                  - rendered
                  - deep
                  default: fast
                max_pages:
                  type: integer
                  minimum: 1
                  maximum: 5
                targets:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/TechScanTarget'
            example:
              mode: deep
              max_pages: 3
              targets:
              - example.com
              - url: https://shop.example.com/
                reference: shop
