    AdsTxtResponse:
      type: object
      required:
      - domain
      - file
      - url
      - checked_at
      - status
      - reason
      - fetch
      - summary
      - variables
      - records
      - issues
      - sellers
      properties:
        domain:
          type: string
        file:
          type: string
          enum:
          - ads.txt
          - app-ads.txt
        url:
          type: string
          format: uri
        checked_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - found
          - not_found
          - invalid
          - unknown
          description: 'found: at least one valid record. not_found: exact 404 or 410. invalid: HTML served, no valid records, or a redirect outside the domain. unknown: blocked, rate limited or failed; refunded.'
        reason:
          type:
          - string
          - 'null'
          description: html_served, no_valid_records, redirect_out_of_scope (the file redirected outside the requested registrable domain, so it is not authoritative; see fetch.final_url), blocked, rate_limited, timeout, upstream_error, http_error or fetch_failed.
        fetch:
          type: object
          properties:
            http_status:
              type:
              - integer
              - 'null'
            final_url:
              type:
              - string
              - 'null'
            bytes:
              type: integer
            truncated:
              type: boolean
        summary:
          type:
          - object
          - 'null'
          properties:
            records:
              type: integer
            direct:
              type: integer
            reseller:
              type: integer
            ad_systems:
              type: integer
            records_truncated:
              type: boolean
            no_authorized_sellers:
              type: boolean
              description: True when the file has the IAB placeholder record (placeholder.example.com, placeholder, DIRECT, placeholder) declaring that no seller is authorized. That record is never checked against a sellers.json.
        variables:
          type: object
          description: Declared variables by lower-case name (contact, subdomain, ownerdomain, managerdomain, inventorypartnerdomain).
          additionalProperties:
            type: array
            items:
              type: string
        records:
          type: array
          description: First 500 valid records.
          items:
            type: object
            properties:
              line:
                type: integer
              ad_system:
                type: string
              account_id:
                type: string
              relationship:
                type: string
                enum:
                - DIRECT
                - RESELLER
              certification_authority_id:
                type:
                - string
                - 'null'
        issues:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                enum:
                - invalid_line
                - invalid_domain
                - invalid_relationship
                - missing_account_id
                - duplicate_record
                - invalid_variable
              count:
                type: integer
              lines:
                type: array
                items:
                  type: integer
                description: First 20 line numbers.
        sellers:
          type:
          - object
          - 'null'
          description: Present with verify_sellers=true.
          properties:
            systems_total:
              type: integer
            systems_checked:
              type: integer
            confirmed:
              type: integer
            confidential:
              type: integer
            type_mismatch:
              type: integer
            seller_not_found:
              type: integer
            unknown:
              type: integer
            systems:
              type: array
              items:
                type: object
                properties:
                  ad_system:
                    type: string
                  sellers_json:
                    type: string
                    enum:
                    - ok
                    - unknown
                  reason:
                    type:
                    - string
                    - 'null'
                  records_checked:
                    type: integer
            results:
              type: array
              items:
                type: object
                properties:
                  ad_system:
                    type: string
                  account_id:
                    type: string
                  relationship:
                    type: string
                    enum:
                    - DIRECT
                    - RESELLER
                  state:
                    type: string
                    enum:
                    - confirmed
                    - confidential
                    - type_mismatch
                    - seller_not_found
                    - unknown
                  seller_type:
                    type:
                    - string
                    - 'null'
                  seller_name:
                    type:
                    - string
                    - 'null'
                  seller_domain:
                    type:
                    - string
                    - 'null'
                  match:
                    type:
                    - string
                    - 'null'
                    enum:
                    - exact
                    - case_insensitive
                    - null
                    description: 'How the account ID matched a seller_id: exact, or case_insensitive after trimming spaces. Null when no seller matched.'
