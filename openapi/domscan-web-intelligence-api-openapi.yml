                  served_by: pop=MAD country=ES
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 3
  /v1/reputation/bulk:
    post:
      tags:
      - Web Intelligence
      summary: Bulk domain reputation
      description: 'Calculate reputation scores for multiple domains in a single request.


        **Credits:** 3 credits per domain. Max 3 domains per request.'
      operationId: bulkDomainReputation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domains
              properties:
                domains:
                  type: array
                  items:
                    type: string
                  minItems: 1
                  maxItems: 3
                  description: Array of domains to score
                  example:
                  - cloudflare.com
                  - example.org
      responses:
        '200':
          description: Bulk reputation scoring results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkReputationResponse'
              example:
                results:
                - domain: cloudflare.com
                  reputation_score: 92
                  grade: A+
                  risk_level: low
                  factors:
                    dns_security:
                      score: 100
                      weight: 0.2
                    ssl_certificate:
                      score: 100
                      weight: 0.2
                  recommendations: []
                  meta:
                    query_time_ms: 1250
                    checks_performed: 7
                    cached: false
                - domain: not a domain
                  error:
                    code: INVALID_DOMAIN
                    message: Invalid domain format
                summary:
                  total: 2
                  successful: 1
                  failed: 1
                  cached: 0
                  query_time_ms: 1310
                meta:
                  served_by: pop=MAD country=ES
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_item
        default: 3
  /v1/parking:
    get:
      tags:
      - Web Intelligence
      summary: Parking & aftermarket detection
      description: Detect if a domain is parked or listed for sale on aftermarket platforms. Identifies parking providers via DNS, HTTP redirect, and HTML content analysis.
      operationId: getParkingDetection
      parameters:
      - name: domain
        in: query
        required: true
        description: Domain to check for parking/aftermarket status
        schema:
          type: string
          example: example.com
      responses:
        '200':
          description: Parking detection results
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    type: string
                  is_parked:
                    type: boolean
                  is_for_sale:
                    type: boolean
                  parking_provider:
                    type:
                    - string
                    - 'null'
                  aftermarket_listings:
                    type: array
                    items:
                      type: object
                      properties:
                        platform:
                          type: string
                        detected_via:
                          type: string
                          enum:
                          - dns
                          - redirect
                          - html
                          - meta
                  signals:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                        detail:
                          type: string
                        provider:
                          type: string
                  confidence:
                    type: number
                  checked_at:
                    type: string
                    format: date-time
                  check_duration_ms:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 2
