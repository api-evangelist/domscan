    DuplicateContentResponse:
      type: object
      required:
      - status
      - checked_at
      - threshold
      - pages
      - pairs
      - clusters
      - duplicates
      - summary
      properties:
        status:
          type: string
          enum:
          - ok
          - unknown
          - insufficient_pages
          description: 'ok: at least two pages were read and at least one pair could be compared. unknown: fewer than two pages could be read because of blocked or failed fetches, or no pair had enough text to compare; refunded. insufficient_pages: fewer than two HTML pages exist.'
        checked_at:
          type: string
          format: date-time
        threshold:
          type: number
          description: Similarity at or above which a pair is a near duplicate.
        pages:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              final_url:
                type: string
              status:
                type: string
                enum:
                - ok
                - not_found
                - not_html
                - unknown
              reason:
                type:
                - string
                - 'null'
              http_status:
                type:
                - integer
                - 'null'
              title:
                type:
                - string
                - 'null'
              meta_description:
                type:
                - string
                - 'null'
              h1:
                type:
                - string
                - 'null'
              canonical:
                type:
                - string
                - 'null'
              word_count:
                type: integer
              comparable:
                type: boolean
                description: False when the page was not read, or has fewer than 50 main-content words and is not scored.
              comparison_reason:
                type:
                - string
                - 'null'
                enum:
                - insufficient_content
                - null
                description: 'insufficient_content: the page was read but is too short to score.'
        pairs:
          type: array
          items:
            type: object
            properties:
              a:
                type: string
              b:
                type: string
              similarity:
                type:
                - number
                - 'null'
                description: Jaccard index of 5-word shingles of the main content (0-1). Null when the pair is not scored.
              containment:
                type:
                - number
                - 'null'
                description: Share of the smaller page found in the larger one (0-1). Null when the pair is not scored.
              near_duplicate:
                type:
                - boolean
                - 'null'
                description: Null when a page has too little content to decide; false when both URLs reach the same final URL.
              comparable:
                type: boolean
                description: Whether the pair was scored.
              canonicalized:
                type: boolean
                description: One page declares the other as canonical, or both declare the same one.
              same_final_url:
                type: boolean
                description: Both URLs end at the same final URL, so they are one page.
              reason:
                type:
                - string
                - 'null'
                enum:
                - insufficient_content
                - same_final_url
                - null
                description: Why the pair was not scored.
        clusters:
          type: array
          items:
            type: array
            items:
              type: string
        duplicates:
          type: object
          properties:
            titles:
              type: array
              items:
                type: object
                properties:
                  value:
                    type: string
                  urls:
                    type: array
                    items:
                      type: string
            meta_descriptions:
              type: array
              items:
                type: object
                properties:
                  value:
                    type: string
                  urls:
                    type: array
                    items:
                      type: string
            h1:
              type: array
              items:
                type: object
                properties:
                  value:
                    type: string
                  urls:
                    type: array
                    items:
                      type: string
        summary:
          type: object
          properties:
            pages:
              type: integer
            readable:
              type: integer
            unknown:
