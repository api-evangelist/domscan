              properties:
                card:
                  type:
                  - string
                  - 'null'
                title:
                  type:
                  - string
                  - 'null'
                description:
                  type:
                  - string
                  - 'null'
                image:
                  type:
                  - string
                  - 'null'
        headings:
          type:
          - object
          - 'null'
          properties:
