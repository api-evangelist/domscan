openapi: 3.2.0
info:
  title: DomScan Domain Intelligence API
  description: 'DomScan is a domain intelligence API providing domain analysis tools. **Core Features:**

    - Domain Availability: Check single or bulk domains using RDAP with 1,100+ TLDs supported

    - Domain Intelligence: AI suggestions, valuations, health checks, typosquatting detection

    - OSINT Tools: DNS lookup, WHOIS/RDAP, SSL certificates, subdomain discovery, IP geolocation, tech stack detection

    - Social & Branding: Social handle checker, brand name scoring

    - Phone Intelligence: Privacy-first phone number validation, normalization, and classification

    - Pricing: Scheduled standard-TLD tables from verified official registrar sources, plus separate credential-backed exact-domain quotes

    - Watchlist: Domain monitoring for expiration and availability alerts


    **Authentication:**

    Most API endpoints require authentication. Pass your API key via the x-api-key header or Authorization: Bearer header. Operations marked with an empty security requirement are intentionally public, including API specifications and selected catalog endpoints. Get your free API key at https://domscan.net/dashboard. Logged-in users on domscan.net tools pages are authenticated automatically via session cookie. **Rate Limits:**

    Free accounts can sustain 120 requests per minute per account, with a burst capacity of 60. All API keys and dashboard sessions belonging to the same free account share this budget. Bulk endpoints have an additional free-tier budget of 20 HTTP requests per minute per account across all bulk endpoints. Free-tier bulk traffic is also capped at 100 requests per minute per IPv4 address or IPv6 /56 network. Platform-wide edge protections still apply to every tier. Paid accounts can sustain 600 requests per minute, with a burst capacity of 120, shared by every API key and dashboard session of the account. Paid accounts do not receive the additional free-tier bulk budget. Scope: RapidAPI subscribers are counted per subscriber. (scope=rapidapi-customer) Zyla subscribers are counted per subscriber when the gateway identifies them, (scope=zyla-customer) and as one shared gateway budget when it does not. (scope=zyla-gateway) Other authenticated requests are counted per account: every API key and dashboard session of the account shares one budget. (scope=account) A key that is not linked to an account is counted on its own. (scope=api-key) Unauthenticated requests to public endpoints are counted per client IP address (scope unknown when the address cannot be determined, as one shared budget). (scope=ip)


    Every authenticated response, success or error, includes X-RateLimit-Plan, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, and X-RateLimit-Policy. X-RateLimit-Limit and X-RateLimit-Remaining describe the immediate burst bucket; X-RateLimit-Reset is the Unix time in seconds when that bucket is full again; X-RateLimit-Policy also states the sustained per-minute rate, scope, and any free bulk limits. Exceeding a limit returns HTTP 429 with Retry-After. Retry only after the indicated delay. **Credits System:**

    API calls consume credits based on endpoint complexity. Sign up for free to receive 10,000 credits monthly. - 1 credit: Status checks, DNS lookups, tool builders

    - 2-5 credits: Health checks, valuations, OSINT tools

    - Bulk endpoints: standard per-item rate for batching multiple items into fewer HTTP requests. - 6-25 credits: Recipe compound operations


    When credits reach zero, the API returns HTTP 402 with credits_remaining, credits_required, and a purchase_url. API responses include X-Credits-Requested, X-Credits-Charged, and X-Credits-Refunded. X-Credits-Charged is the net charge after any refund made during the request. Authenticated responses also include X-Credits-Remaining whenever the balance is known without an extra lookup. Free credits refresh monthly on the account''s signup anniversary. POST /v1/estimate returns the credits a request would charge without running it, at no cost.'
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: Domain Intelligence
  description: Domain comparison, scoring, popularity, lifecycle, and profile intelligence
paths:
  /v1/overview:
    get:
      tags:
      - Domain Intelligence
      summary: Domain overview
      description: Aggregate DNS, RDAP registration, health, reputation, and popularity observations in one call. Fields are null when a component or individual DNS query could not be determined. component_freshness preserves degraded state and its reason across cache hits.
      operationId: getDomainOverview
      parameters:
      - name: domain
        in: query
        required: true
        description: Domain to analyze
        schema:
          type: string
          example: example.com
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Domain overview
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain:
                    type: string
                  health:
                    type: object
                    properties:
                      dns_ok:
                        type:
                        - boolean
                        - 'null'
                        description: Null when the health DNS prerequisite could not be checked.
                      https_ok:
                        type:
                        - boolean
                        - 'null'
                        description: Null when the health check could not determine the result.
                  dns:
                    type: object
                    properties:
                      has_a:
                        type:
                        - boolean
                        - 'null'
                      has_aaaa:
                        type:
                        - boolean
                        - 'null'
                      has_mx:
                        type:
                        - boolean
                        - 'null'
                      nameservers:
                        type:
                        - array
                        - 'null'
                        items:
                          type: string
                  registration:
                    type: object
                    properties:
                      registered:
                        type:
                        - boolean
                        - 'null'
                        description: True or false only after a completed registration lookup. Null for unsupported TLDs or unavailable RDAP data.
                      registrar:
                        type:
                        - string
                        - 'null'
                      created_date:
                        type:
                        - string
                        - 'null'
                      expiry_date:
                        type:
                        - string
                        - 'null'
                      age_days:
                        type:
                        - integer
                        - 'null'
                      days_until_expiry:
                        type:
                        - integer
                        - 'null'
                      dnssec:
                        type:
                        - boolean
                        - 'null'
                  reputation:
                    type: object
                    properties:
                      score:
                        type:
                        - number
                        - 'null'
                      grade:
                        type:
                        - string
                        - 'null'
                  popularity:
                    type: object
                    properties:
                      rank:
                        type:
                        - integer
                        - 'null'
                      bucket:
                        type:
                        - string
                        - 'null'
                  component_freshness:
                    $ref: '#/components/schemas/OverviewComponentFreshness'
                  query_time_ms:
                    type: integer
                  checked_at:
                    type: string
                    format: date-time
                  meta:
                    type: object
                    description: Request metadata.
                    properties:
                      served_by:
                        type: string
                        description: Location that served the request, as `pop=<code> country=<code>`.
                      cached:
                        type: boolean
                        description: True when the response was served from cache.
              example:
                domain: example.com
                health:
                  dns_ok: true
                  https_ok: true
                dns:
                  has_a: true
                  has_aaaa: true
                  has_mx: false
                  nameservers:
                  - ns1.example.net
                  - ns2.example.net
                registration:
                  registered: true
                  registrar: Example Registrar, Inc.
                  created_date: '2019-03-11T14:22:08Z'
                  expiry_date: '2027-03-11T14:22:08Z'
                  age_days: 2769
                  days_until_expiry: 153
                  dnssec: false
                reputation:
                  score: 82
                  grade: A
                popularity:
                  rank: 18452
                  bucket: top-100k
                component_freshness:
                  cache_status: miss
                  checked_at: '2026-10-09T10:15:30.000Z'
                  component_count: 5
                  fresh_component_count: 5
                  degraded_component_count: 0
                  components:
                    health:
                      source: quick_health
                      state: fresh
                      checked_at: '2026-10-09T10:15:30.000Z'
                      evidence_count: 2
                    dns:
                      source: dns
                      state: fresh
                      checked_at: '2026-10-09T10:15:30.000Z'
                      evidence_count: 4
                    registration:
                      source: rdap
                      state: fresh
                      checked_at: '2026-10-09T10:15:30.000Z'
                      evidence_count: 7
                    reputation:
                      source: reputation
                      state: fresh
                      checked_at: '2026-10-09T10:15:30.000Z'
                      evidence_count: 2
                    popularity:
                      source: popularity
                      state: fresh
                      checked_at: '2026-10-09T10:15:30.000Z'
                      evidence_count: 2
                query_time_ms: 1840
                checked_at: '2026-10-09T10:15:30.000Z'
                meta:
                  served_by: pop=MAD country=ES
                  cached: false
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 5
  /v1/popularity:
    get:
      tags:
      - Domain Intelligence
      summary: Get domain popularity
      description: Return the registrable domain's current Tranco rank with explicit ranked, unranked, and unknown states. Unknown results still return HTTP 200 so clients receive a stable response shape, and the request charge is automatically refunded. A successful known lookup is recorded in the lookup-driven history.
      operationId: getDomainPopularity
      parameters:
      - name: domain
        description: Registrable domain to look up.
        in: query
        required: true
        schema:
          type: string
          example: example.com
      - name: include_history
        description: Include the recorded popularity history. Accepts 1, true, yes, 0, false or no; anything else returns 400. History appears only once observations have been recorded for the domain.
        in: query
        schema:
          type: boolean
          default: false
      - name: history_limit
        description: History entries to return, most recent first, from 1 to 365. Validated even when include_history is false.
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Current ranked, unranked, or unknown popularity observation. Unknown results are not charged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainPopularityResponse'
              example:
                domain: example.com
                status: ranked
                rank: 18452
                bucket: top-100k
                source:
                  id: tranco
                  url: https://tranco-list.eu/
                  list_date: '2026-10-08'
                  provenance:
                    owner: Tranco research project
                    source_url: https://tranco-list.eu/
                    methodology_url: https://tranco-list.eu/methodology
                    access_method: public_domain_rank_api
                    cost: none
                    runtime_rate_limits: not_published_cached_and_bounded_by_domscan
                    terms_status: mixed_upstream_licenses_review_required_for_commercial_reuse
                    expected_freshness: daily
                    maintenance_risk: medium
                    fallback_behavior: return_unknown_without_inventing_or_reusing_an_unranked_result
                    last_verified: '2026-08-02'
                freshness:
                  cache_status: miss
                  ttl_seconds: 86400
                checked_at: '2026-10-09T10:15:30.000Z'
                result_count: 1
                empty_result: false
                history:
                  collection: lookup_driven
                  complete_daily_series: false
                  available: true
                  observations:
                  - domain: example.com
                    rank: 18452
                    bucket: top-100k
                    status: ranked
                    source: tranco
                    list_date: '2026-10-08'
                    observed_on: '2026-10-09'
                    checked_at: '2026-10-09T10:15:30.000Z'
                  - domain: example.com
                    rank: 18877
                    bucket: top-100k
                    status: ranked
                    source: tranco
                    list_date: '2026-10-01'
                    observed_on: '2026-10-02'
                    checked_at: '2026-10-02T10:15:30.000Z'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 2
  /v1/popularity/history:
    get:
      tags:
      - Domain Intelligence
      summary: Get domain popularity history
      description: Return prior Tranco observations recorded by successful DomScan lookups. The result is not a complete daily series.
      operationId: getDomainPopularityHistory
      parameters:
      - name: domain
        description: Registrable domain whose recorded history you want.
        in: query
        required: true
        schema:
          type: string
          example: example.com
      - name: limit
        description: History entries to return, most recent first, from 1 to 365.
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Lookup-driven popularity observations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainPopularityHistoryResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-domscan-credits:
        model: per_request
        default: 1
components:
  responses:
    InternalError:
      description: Unexpected service error.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL
              message: An unexpected error occurred. Please try again.
              type: api_error
              status: 500
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/error-codes
    BadRequest:
      description: Bad request - invalid parameters
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: BAD_REQUEST
              message: Invalid domain format
              suggestion: Domain must be a valid format like example.com
              type: validation_error
              status: 400
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/request-headers
    PaymentRequired:
      description: Insufficient credits for this request. Nothing is charged.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          schema:
            type: integer
          description: Credits remaining on the account
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INSUFFICIENT_CREDITS
              message: Insufficient credits. This endpoint costs 2 credits but you have 0. Purchase more at https://domscan.net/billing or wait for your monthly reset.
              credits_remaining: 0
              credits_required: 2
              purchase_url: https://domscan.net/billing
              type: credits_error
              status: 402
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/credits-pricing
    RateLimited:
      description: Rate limit exceeded. Free accounts can sustain 120 requests per minute per account with a burst capacity of 60. Free bulk traffic is additionally limited to 20 requests per minute per account across all bulk endpoints and 100 per minute per IPv4 address or IPv6 /56 network. Paid accounts can sustain 600 requests per minute with a burst capacity of 120.
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          schema:
            type: integer
          description: The immediate burst capacity, or the active bulk fixed-window limit when a bulk-specific limit is exceeded.
        X-RateLimit-Remaining:
          schema:
            type: integer
            example: 0
          description: Immediate burst tokens remaining, or requests remaining in the active bulk fixed window.
        X-RateLimit-Reset:
          schema:
            type: integer
            example: 1791590400
          description: Unix time in seconds when the limit that was exceeded allows a new request again.
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
        X-RateLimit-Plan:
          schema:
            type: string
            enum:
            - free
            - paid
          description: The account plan whose policy was applied.
        X-RateLimit-Policy:
          schema:
            type: string
          description: Machine-readable summary of the active tier and limit policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded. Please wait before making more requests.
              type: rate_limit_error
              status: 429
              retryable: true
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/rate-limits
              retry_after: 12
    Unauthorized:
      description: 'Authentication required. All API endpoints require a valid API key (x-api-key header or Authorization: Bearer) or an active session cookie.'
      headers:
        X-Request-Id:
          schema:
            type: string
          description: Request identifier; equals error.request_id in the body.
        X-Credits-Charged:
          $ref: '#/components/headers/XCreditsCharged'
        X-Credits-Remaining:
          $ref: '#/components/headers/XCreditsRemaining'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: AUTH_REQUIRED
              message: 'Authentication required. Provide an API key via x-api-key header or Authorization: Bearer header.'
              docs: https://domscan.net/docs/authentication
              get_key: https://domscan.net/login
              type: authentication_error
              status: 401
              retryable: false
              request_id: m5x7k2p-a9f3
              docs_url: https://domscan.net/docs/authentication
  headers:
    XRateLimitLimit:
      description: Burst capacity of the rate limit that applies to this API key.
      schema:
        type: integer
        minimum: 0
    XRateLimitReset:
      description: Unix time in seconds when the burst capacity is fully refilled.
      schema:
        type: integer
        minimum: 0
    XRateLimitRemaining:
      description: Requests that can still be sent immediately before the rate limit applies.
      schema:
        type: integer
        minimum: 0
    XCreditsRemaining:
      description: Credits remaining on the account after this request. Omitted when the balance is not already known without an extra lookup.
      schema:
        type: integer
        minimum: 0
    XCreditsCharged:
      description: Credits charged by this request, net of any refund made in the same request. Sent on authenticated /v1 responses, including errors (0 when nothing was charged).
      schema:
        type: integer
        minimum: 0
    XFieldsIgnored:
      description: 'Sent when `fields` was used and some paths matched nothing in this response: those paths, comma-separated, at most 20.'
      schema:
        type: string
  parameters:
    Fields:
      name: fields
      in: query
      required: false
      x-domscan-global-parameter: true
      description: Comma-separated dot paths to keep in a successful JSON response, e.g. `domain,classification.status` (arrays apply the path to each item; max 50 paths, 6 levels). Unmatched paths are listed in X-Fields-Ignored. Cost is unchanged.
      schema:
        type: string
      example: domain,classification.status
    Naming:
      name: naming
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`snake` returns every camelCase key of a successful JSON response in snake_case (for example `registrarName` becomes `registrar_name`); values are never changed. The `DomScan-Naming: snake` request header does the same; when both are sent this parameter wins, and `default` keeps the original names. Runs before `compact` and `fields`, so `fields` paths use snake_case. Error bodies are already snake_case. Cost is unchanged.'
      schema:
        type: string
        enum:
        - snake
        - default
      example: snake
    Compact:
      name: compact
      in: query
      required: false
      x-domscan-global-parameter: true
      description: '`true` drops serving metadata (meta timings and served_by, empty warnings/caveats/notes/errors arrays, a request_id that repeats X-Request-Id) from a successful JSON response. Data fields are never removed.'
      schema:
        type: string
        enum:
        - 'true'
        - 'false'
      example: 'true'
  schemas:
    DomainPopularityHistoryResponse:
      type: object
      required:
      - domain
      - collection
      - complete_daily_series
      - result_count
      - empty_result
      - observations
      properties:
        domain:
          type: string
        collection:
          type: string
          enum:
          - lookup_driven
        complete_daily_series:
          type: boolean
          enum:
          - false
        result_count:
          type: integer
          minimum: 0
          maximum: 365
        empty_result:
          type: boolean
        observations:
          type: array
          items:
            $ref: '#/components/schemas/DomainPopularityObservation'
    OverviewComponentFreshnessEntry:
      type: object
      properties:
        source:
          type: string
        state:
          type: string
          enum:
          - fresh
          - degraded
        checked_at:
          type: string
          format: date-time
        evidence_count:
          type: integer
          description: Number of populated or explicitly observed fields for this component.
        reason:
          type:
          - string
          - 'null'
          enum:
          - upstream_unavailable
          - partial_upstream_failure
          - unsupported_tld
          - legacy_cache_without_provenance
          - null
    OverviewComponentFreshness:
      type: object
      description: Per-component observation status for health, DNS, registration, reputation, and popularity. Cache hits retain the state, timestamp, and reason recorded when the observation was made.
      properties:
        cache_status:
          type: string
          enum:
          - hit
          - miss
        checked_at:
          type: string
          format: date-time
        component_count:
          type: integer
        fresh_component_count:
          type: integer
        degraded_component_count:
          type: integer
        components:
          type: object
