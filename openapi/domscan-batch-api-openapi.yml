openapi: 3.2.0
info:
  title: DomScan Batch API
  description: 'DomScan is a domain intelligence API providing domain analysis tools. **Core Features:**

    - Domain Availability: Check single or bulk domains using RDAP with 1,100+ TLDs supported

    - Domain Intelligence: AI suggestions, valuations, health checks, typosquatting detection

    - OSINT Tools: DNS lookup, WHOIS/RDAP, SSL certificates, subdomain discovery, IP geolocation, tech stack detection

    - Social & Branding: Social handle checker, brand name scoring

    - Phone Intelligence: Privacy-first phone number validation, normalization, and classification

    - Pricing: Scheduled standard-TLD tables from verified official registrar sources, plus separate credential-backed exact-domain quotes

    - Watchlist: Domain monitoring for expiration and availability alerts


    **Authentication:**

    Most API endpoints require authentication. Pass your API key via the x-api-key header or Authorization: Bearer header. Operations marked with an empty security requirement are intentionally public, including API specifications and selected catalog endpoints. Get your free API key at https://domscan.net/dashboard. Logged-in users on domscan.net tools pages are authenticated automatically via session cookie. **Rate Limits:**

    Free accounts can sustain 120 requests per minute per account, with a burst capacity of 60. All API keys and dashboard sessions belonging to the same free account share this budget. Bulk endpoints have an additional free-tier budget of 20 HTTP requests per minute per account across all bulk endpoints. Free-tier bulk traffic is also capped at 100 requests per minute per IPv4 address or IPv6 /56 network. Platform-wide edge protections still apply to every tier. Paid accounts can sustain 600 requests per minute, with a burst capacity of 120, shared by every API key and dashboard session of the account. Paid accounts do not receive the additional free-tier bulk budget. Scope: RapidAPI subscribers are counted per subscriber. (scope=rapidapi-customer) Zyla subscribers are counted per subscriber when the gateway identifies them, (scope=zyla-customer) and as one shared gateway budget when it does not. (scope=zyla-gateway) Other authenticated requests are counted per account: every API key and dashboard session of the account shares one budget. (scope=account) A key that is not linked to an account is counted on its own. (scope=api-key) Unauthenticated requests to public endpoints are counted per client IP address (scope unknown when the address cannot be determined, as one shared budget). (scope=ip)


    Every authenticated response, success or error, includes X-RateLimit-Plan, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset, and X-RateLimit-Policy. X-RateLimit-Limit and X-RateLimit-Remaining describe the immediate burst bucket; X-RateLimit-Reset is the Unix time in seconds when that bucket is full again; X-RateLimit-Policy also states the sustained per-minute rate, scope, and any free bulk limits. Exceeding a limit returns HTTP 429 with Retry-After. Retry only after the indicated delay. **Credits System:**

    API calls consume credits based on endpoint complexity. Sign up for free to receive 10,000 credits monthly. - 1 credit: Status checks, DNS lookups, tool builders

    - 2-5 credits: Health checks, valuations, OSINT tools

    - Bulk endpoints: standard per-item rate for batching multiple items into fewer HTTP requests. - 6-25 credits: Recipe compound operations


    When credits reach zero, the API returns HTTP 402 with credits_remaining, credits_required, and a purchase_url. API responses include X-Credits-Requested, X-Credits-Charged, and X-Credits-Refunded. X-Credits-Charged is the net charge after any refund made during the request. Authenticated responses also include X-Credits-Remaining whenever the balance is known without an extra lookup. Free credits refresh monthly on the account''s signup anniversary. POST /v1/estimate returns the credits a request would charge without running it, at no cost.'
  version: 2.15.0
  contact:
    name: DomScan Support
    url: https://domscan.net
    email: support@domscan.net
  termsOfService: https://domscan.net/legal/terms
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: https://domscan.net
  description: Production server
security:
- apiKey: []
tags:
- name: Batch
paths:
  /v1/domain-discovery/jobs:
    post:
      tags:
      - Batch
      summary: Create an asynchronous domain discovery job
      description: Queue one cursor-paginated page from a curated English single-word corpus sourced from iannuttall/unclaimed under the MIT License. Filters are applied before page selection. Every selected word is checked across every requested TLD, and each word-TLD pair counts toward the hard limit of 100 checks per job and uses normal /v1/status pricing. Poll, retrieve results, or cancel the returned job through the existing /v1/batches endpoints. Use next_cursor to continue the filtered search. Unknown outcomes are preserved and are never reported as available.
      operationId: createDomainDiscoveryJob
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Optional idempotency key for safe job creation retries. Reusing the key with the same payload returns the existing job; reusing it with a different payload returns 409.
        schema:
          type: string
          minLength: 1
          maxLength: 120
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - tlds
              properties:
                notify_webhook:
                  $ref: '#/components/schemas/JobNotifyWebhook'
                tlds:
                  type: array
                  minItems: 1
                  maxItems: 5
                  description: Supported TLDs to check, from 1 to 5 entries. Values are normalized and duplicates collapse before limits and billing are calculated. Each unique TLD creates one domain check for every word in the page.
                  items:
                    type: string
                    minLength: 1
                    maxLength: 253
                    pattern: ^\.?[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$
                    example: io
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: Maximum corpus words to include in this page. limit multiplied by the number of unique TLDs must not exceed 100. By default, DomScan selects the largest page that stays within that cap.
                cursor:
                  type: string
                  minLength: 1
                  maxLength: 512
                  description: Opaque server-issued cursor from next_cursor on the previous discovery job. Omit it to start at the first filtered page. The cursor is bound to the corpus version, TLDs, and filter values; changing them returns 400.
                min_length:
                  type: integer
                  minimum: 1
                  maximum: 63
                  default: 3
                  description: Minimum corpus word length, inclusive. Must not exceed max_length when both are provided.
                max_length:
                  type: integer
                  minimum: 1
                  maximum: 63
                  default: 16
                  description: Maximum corpus word length, inclusive. Must be greater than or equal to min_length when both are provided.
                singular_only:
                  type: boolean
                  default: false
                  description: When true, exclude corpus entries that match the bundled corpus regular-plural heuristic.
            example:
              tlds:
              - io
              - ai
              limit: 50
              min_length: 4
              max_length: 8
              singular_only: true
      responses:
        '200':
          description: Existing discovery batch returned for an idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainDiscoveryJobResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '202':
          description: Discovery batch accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainDiscoveryJobResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          description: Idempotency key was reused with different discovery input
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; equals error.request_id in the body.
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: IDEMPOTENCY_CONFLICT
                  message: This Idempotency-Key was already used with a different request.
                  type: conflict_error
                  status: 409
                  retryable: false
                  request_id: m5x7k2p-a9f3
                  docs_url: https://domscan.net/docs/error-codes
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_item
        default: 1
        note: Each word-TLD pair uses the normal /v1/status credit cost, currently 1 credit. Billing and any eligible item refunds follow /v1/status behavior.
  /v1/batches:
    post:
      tags:
      - Batch
      summary: Create asynchronous API batch
      description: Queue up to 100 supported public GET API requests. Each item uses normal endpoint pricing, has independent refund settlement, and remains retrievable for 24 hours. An optional HTTPS webhook is signed with the supplied secret.
      operationId: createApiBatch
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - requests
              properties:
                notify_webhook:
                  $ref: '#/components/schemas/JobNotifyWebhook'
                requests:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    $ref: '#/components/schemas/ApiBatchRequestItem'
                webhook:
                  type: object
                  required:
                  - url
                  - secret
                  properties:
                    url:
                      type: string
                      format: uri
                      maxLength: 2048
                    secret:
                      type: string
                      minLength: 16
                      maxLength: 256
                      writeOnly: true
            example:
              requests:
              - path: /v1/status
                query:
                  domain: example.com
                reference: customer-42
              - path: /v1/dns
                query:
                  domain: example.org
                  type: MX
              webhook:
                url: https://example.com/hooks/domscan
                secret: replace-with-a-private-secret
      responses:
        '200':
          description: Existing batch returned for an idempotent replay
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '202':
          description: Batch accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - job
                properties:
                  job:
                    $ref: '#/components/schemas/ApiBatchJob'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '409':
          description: Idempotency key was reused with a different batch payload
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; equals error.request_id in the body.
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: IDEMPOTENCY_CONFLICT
                  message: This Idempotency-Key was already used with a different request.
                  type: conflict_error
                  status: 409
                  retryable: false
                  request_id: m5x7k2p-a9f3
                  docs_url: https://domscan.net/docs/error-codes
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 0
        note: Each accepted item uses the normal credit cost of its target endpoint.
    get:
      tags:
      - Batch
      summary: List asynchronous API batches
      description: List unexpired batches for the active customer account.
      operationId: listApiBatches
      parameters:
      - name: limit
        description: Batches to return per page.
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Recent account batches
          content:
            application/json:
              schema:
                type: object
                required:
                - jobs
                - retention_hours
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiBatchJob'
                  retention_hours:
                    type: integer
                    enum:
                    - 24
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 0
  /v1/batches/{job_id}:
    parameters:
    - name: job_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^bat_[a-f0-9]{32}$
    get:
      tags:
      - Batch
      summary: Get asynchronous API batch
      description: Get account-scoped batch progress, billing, webhook, and expiration state.
      operationId: getApiBatch
      responses:
        '200':
          description: Batch status
          content:
            application/json:
              schema:
                type: object
                required:
                - job
                properties:
                  job:
                    $ref: '#/components/schemas/ApiBatchJob'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      x-domscan-credits:
        model: per_request
        default: 0
    delete:
      tags:
      - Batch
      summary: Cancel asynchronous API batch
      description: Cancel pending items and settle their refunds. An item already being processed may finish.
      operationId: cancelApiBatch
      responses:
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema:
                type: object
                required:
                - job
                properties:
                  job:
                    $ref: '#/components/schemas/ApiBatchJob'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 0
  /v1/batches/{job_id}/results:
    get:
      tags:
      - Batch
      summary: Get asynchronous API batch results
      description: Return ordered account-scoped results retained for 24 hours.
      operationId: getApiBatchResults
      parameters:
      - name: job_id
        description: Batch job identifier returned when the batch was created.
        in: path
        required: true
        schema:
          type: string
          pattern: ^bat_[a-f0-9]{32}$
      - name: after
        description: Item position to read after, taken from next_after on the previous page. Ignored when format is csv, which returns every item.
        in: query
        schema:
          type: integer
          minimum: -1
          default: -1
      - name: limit
        description: Items to return per page, from 1 to 100. Ignored when format is csv.
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: format
        in: query
        description: Use csv to download all ordered job items as one RFC 4180 attachment. CSV export ignores after and limit because a batch contains at most 100 items.
        schema:
          type: string
          enum:
          - json
          - csv
          default: json
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Ordered batch results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiBatchResultsResponse'
            text/csv:
              schema:
                type: string
                description: RFC 4180 CSV with stable request, result, error, billing, and timestamp columns.
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 0
  /v1/jobs:
    get:
      tags:
      - Batch
      summary: List asynchronous jobs
      description: List every asynchronous job you own, newest first, across API batches, domain discovery, technology scans and scrape jobs, in one shared job shape. Batches and scrape jobs are shared across the customer account; technology scans belong to the user who created them. Free.
      operationId: listJobs
      parameters:
      - name: limit
        in: query
        required: false
        description: Items per page, from 1 to 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        required: false
        description: Opaque cursor from next_cursor on the previous page. It is signed and bound to the caller and to the kind filter; an edited or foreign cursor returns 400.
        schema:
          type: string
          maxLength: 512
      - name: kind
        in: query
        required: false
        description: Only list jobs of this kind.
        schema:
          $ref: '#/components/schemas/JobKind'
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: One page of jobs, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          description: Invalid limit, kind or cursor
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; equals error.request_id in the body.
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_CURSOR
                  message: 'Invalid parameter: cursor (invalid)'
                  type: validation_error
                  status: 400
                  retryable: false
                  request_id: m5x7k2p-a9f3
                  docs_url: https://domscan.net/docs/error-codes
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 0
  /v1/jobs/{job_id}:
    parameters:
    - name: job_id
      in: path
      required: true
      description: 'Job id from any job creation endpoint: bat_ (API batch or domain discovery), tsj_ (technology scan) or scj_ (scrape).'
      schema:
        type: string
        pattern: ^(bat|tsj|scj)_[a-f0-9]{32}$
    get:
      tags:
      - Batch
      summary: Get asynchronous job
      description: Get the status, progress, credits and links of any job you own by its id. Jobs of another account read as not found. Free.
      operationId: getJob
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Job not found
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; equals error.request_id in the body.
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_FOUND
                  message: Job not found
                  type: not_found_error
                  status: 404
                  retryable: false
                  request_id: m5x7k2p-a9f3
                  docs_url: https://domscan.net/docs/error-codes
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      x-domscan-credits:
        model: per_request
        default: 0
  /v1/jobs/{job_id}/results:
    parameters:
    - name: job_id
      in: path
      required: true
      description: 'Job id from any job creation endpoint: bat_ (API batch or domain discovery), tsj_ (technology scan) or scj_ (scrape).'
      schema:
        type: string
        pattern: ^(bat|tsj|scj)_[a-f0-9]{32}$
    get:
      tags:
      - Batch
      summary: Get asynchronous job results
      description: Get the ordered item results of any job you own, in one shared item shape. API batch and domain discovery results are kept for 24 hours, technology scan results for 48 hours and scrape results for 24 hours. Free.
      operationId: getJobResults
      parameters:
      - name: limit
        in: query
        required: false
        description: Items per page, from 1 to 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: cursor
        in: query
        required: false
        description: Opaque cursor from next_cursor on the previous page. It is signed and bound to this job; an edited cursor or one from another job returns 400.
        schema:
          type: string
          maxLength: 512
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      responses:
        '200':
          description: Ordered job results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResultsResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '400':
          description: Invalid limit or cursor
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; equals error.request_id in the body.
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: INVALID_CURSOR
                  message: 'Invalid parameter: cursor (invalid)'
                  type: validation_error
                  status: 400
                  retryable: false
                  request_id: m5x7k2p-a9f3
                  docs_url: https://domscan.net/docs/error-codes
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Job not found
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; equals error.request_id in the body.
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_FOUND
                  message: Job not found
                  type: not_found_error
                  status: 404
                  retryable: false
                  request_id: m5x7k2p-a9f3
                  docs_url: https://domscan.net/docs/error-codes
        '410':
          description: Job results expired
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; equals error.request_id in the body.
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: RESULTS_EXPIRED
                  message: The results of this job have expired and are no longer available
                  type: request_error
                  status: 410
                  retryable: false
                  request_id: m5x7k2p-a9f3
                  docs_url: https://domscan.net/docs/error-codes
        '429':
          $ref: '#/components/responses/RateLimited'
      x-domscan-credits:
        model: per_request
        default: 0
  /v1/jobs/{job_id}/cancel:
    parameters:
    - name: job_id
      in: path
      required: true
      description: 'Job id from any job creation endpoint: bat_ (API batch or domain discovery), tsj_ (technology scan) or scj_ (scrape).'
      schema:
        type: string
        pattern: ^(bat|tsj|scj)_[a-f0-9]{32}$
    post:
      tags:
      - Batch
      summary: Cancel asynchronous job
      description: Cancel an API batch, domain discovery or technology scan job. Unstarted items are cancelled and their credits refunded; an item already running may finish. Returns 202 when cancellation starts and 200 when the job was already cancelled. Scrape jobs cannot be cancelled, and finished jobs return 409. Free.
      operationId: cancelJob
      responses:
        '200':
          description: The job was already cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCancelResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCancelResponse'
          headers:
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
            X-Fields-Ignored:
              $ref: '#/components/headers/XFieldsIgnored'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Job not found
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; equals error.request_id in the body.
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: NOT_FOUND
                  message: Job not found
                  type: not_found_error
                  status: 404
                  retryable: false
                  request_id: m5x7k2p-a9f3
                  docs_url: https://domscan.net/docs/error-codes
        '409':
          description: The job already finished, or its kind cannot be cancelled
          headers:
            X-Request-Id:
              schema:
                type: string
              description: Request identifier; equals error.request_id in the body.
            X-Credits-Charged:
              $ref: '#/components/headers/XCreditsCharged'
            X-Credits-Remaining:
              $ref: '#/components/headers/XCreditsRemaining'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: JOB_NOT_CANCELLABLE
                  message: This job has already finished and can no longer be cancelled
                  type: conflict_error
                  status: 409
                  retryable: false
                  request_id: m5x7k2p-a9f3
                  docs_url: https://domscan.net/docs/error-codes
        '429':
          $ref: '#/components/responses/RateLimited'
      parameters:
      - $ref: '#/components/parameters/Fields'
      - $ref: '#/components/parameters/Compact'
      - $ref: '#/components/parameters/Naming'
      x-domscan-credits:
        model: per_request
        default: 0
components:
  schemas:
    ApiBatchRequestItem:
      type: object
      required:
      - path
      properties:
        method:
          type: string
          enum:
          - GET
          default: GET
          description: Only supported public GET endpoints can be batched.
        path:
          type: string
          description: Exact non-parameterized public API path, without a query string.
        query:
          type: object
          additionalProperties:
            oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              maxItems: 100
              items:
                oneOf:
                - type: string
                - type: number
                - type: boolean
        reference:
          type: string
          maxLength: 128
    JobNotifyWebhook:
      description: Optional completion webhook. true sends one signed job.completed, job.failed or job.cancelled event to every active signed webhook endpoint subscribed to it (or to all events) when the job finishes; an endpoint id sends it to that endpoint only. Free. Omit or false for no event.
      oneOf:
      - type: boolean
      - type: string
        pattern: ^whe_[a-f0-9]{32}$
      example: true
    JobKind:
      type: string
      enum:
      - batch
      - tech_scan
      - scrape
      - domain_discovery
      description: 'batch: POST /v1/batches. domain_discovery: POST /v1/domain-discovery/jobs. tech_scan: POST /v1/tech/jobs. scrape: POST /v1/scrape/jobs.'
    ApiBatchJob:
      type: object
      required:
      - id
      - status
      - total
      - counts
      - billing
      - webhook
      - status_url
      - results_url
      - results_csv_url
      - created_at
      - updated_at
      - processing_deadline_at
      - results_expires_at
      properties:
        id:
          type: string
          pattern: ^bat_[a-f0-9]{32}$
        status:
          type: string
          enum:
          - queued
          - running
          - cancelling
          - completed
          - completed_with_errors
          - cancelled
        total:
          type: integer
          minimum: 1
          maximum: 100
        counts:
          type: object
          required:
          - pending
          - processing
          - succeeded
          - failed
          - cancelled
          properties:
            pending:
              type: integer
            processing:
              type: integer
            succeeded:
              type: integer
            failed:
              type: integer
            cancelled:
              type: integer
        billing:
          type: object
          required:
          - credits_charged
          - credits_refunded
          - credits_net
          properties:
            credits_charged:
              type: integer
            credits_refunded:
              type: integer
            credits_net:
              type: integer
        webhook:
          type: object
          required:
          - configured
          - status
          - attempts
          properties:
            configured:
              type: boolean
            status:
              type: string
              enum:
              - not_configured
              - waiting
              - pending
              - delivering
              - delivered
              - failed
            attempts:
              type: integer
        status_url:
          type: string
          format: uri
        results_url:
          type: string
          format: uri
        results_csv_url:
          type: string
          format: uri
        poll_after_ms:
          type:
          - integer
          - 'null'
        created_at:
          type: string
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        cancelled_at:
          type:
          - string
          - 'null'
          format: date-time
        updated_at:
          type: string
          format: date-time
        processing_deadline_at:
          type: string
          format: date-time
        results_expires_at:
          type: string
          format: date-time
    JobResultsResponse:
      type: object
      required:
      - job
      - results
      - limit
      - has_more
      - next_cursor
      properties:
        job:
          $ref: '#/components/schemas/Job'
        results:
          type: array
          items:
            $ref: '#/components/schemas/JobResultItem'
        limit:
          type: integer
          minimum: 1
          maximum: 100
        has_more:
          type: boolean
        next_cursor:
          type:
          - string
          - 'null'
    JobCancelResponse:
      type: object
      required:
      - job
      - cancellation
      properties:
        job:
          $ref: '#/components/schemas/Job'
        cancellation:
          type: string
          enum:
          - accepted
          - already_cancelled
    Job:
      type: object
      required:
      - id
      - kind
      - status
      - native_status
      - created_at
      - updated_at
      - started_at
      - completed_at
      - results_expires_at
      - progress
      - credits
      - notify_webhook
      - links
      properties:
        id:
          type: string
          pattern: ^(bat|tsj|scj)_[a-f0-9]{32}$
        kind:
          $ref: '#/components/schemas/JobKind'
        status:
          $ref: '#/components/schemas/JobStatus'
        native_status:
          type: string
          enum:
          - queued
          - running
          - cancelling
          - completed
          - completed_with_errors
          - cancelled
          - expired
          description: Status reported by the endpoint that created the job.
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Set once the job is completed, failed or cancelled.
        results_expires_at:
          type:
          - string
          - 'null'
          format: date-time
        progress:
          type: object
          required:
          - total
          - done
          - succeeded
          - failed
          - cancelled
          properties:
            total:
              type: integer
              minimum: 0
            done:
              type: integer
              minimum: 0
              description: 'Items in a final state: succeeded, failed or cancelled.'
            succeeded:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
            cancelled:
              type: integer
              minimum: 0
        credits:
          type: object
          required:
          - charged
          - refunded
          description: Credits are charged per item when the job is created, so nothing stays reserved; failed or cancelled items are refunded under each endpoint rules.
          properties:
            charged:
              type: integer
              minimum: 0
            refunded:
              type: integer
              minimum: 0
        notify_webhook:
          type:
          - object
          - 'null'
          description: Completion webhook opt-in, or null when the job was created without one.
          required:
          - endpoint_id
          - status
          - event_type
          - deliveries
          properties:
            endpoint_id:
              type:
              - string
              - 'null'
              description: Targeted endpoint, or null for every subscribed endpoint.
            status:
              type: string
              enum:
              - waiting
              - published
              - skipped
            event_type:
              type:
              - string
              - 'null'
              enum:
              - job.completed
              - job.failed
              - job.cancelled
              - null
            deliveries:
              type: integer
              minimum: 0
        links:
          type: object
          required:
          - self
          - results
          - cancel
          properties:
            self:
              type: string
              format: uri
            results:
              type: string
              format: uri
            cancel:
              type:
              - string
              - 'null'
              format: uri
              description: Null when the job cannot be cancelled.
    JobResultItem:
      type: object
      required:
      - index
      - status
      - reference
      - input
      - data
      - error
      - credits
      properties:
        index:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
          - pending
          - processing
          - succeeded
          - failed
          - cancelled
        reference:
          type:
          - string
          - 'null'
        input:
          description: 'The submitted item: a URL for technology scans and scrape jobs, or the API request for batches and domain discovery.'
          oneOf:
          - type: string
          - type: object
            required:
            - method
            - path
            - query
            properties:
              method:
                type: string
                enum:
                - GET
              path:
                type: string
              query:
                type: object
                additionalProperties: true
        data:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Item result, with the same shape as the endpoint that produced it.
        error:
          type:
          - object
          - 'null'
          required:
          - code
          - message
          - retryable
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
        credits:
          type: object
          required:
          - charged
          - refunded
          properties:
            charged:
              type: integer
              minimum: 0
            refunded:
              type: integer
              minimum: 0
    JobStatus:
      type: string
      enum:
      - queued
      - running
      - completed
      - failed
      - cancelled
      description: Unified status. A job that is cancelling reports running. completed_with_errors maps to completed, or to failed when no item succeeded. An expired technology scan reports the outcome it expired from.
    JobResponse:
      type: object
      required:
      - job
      properties:
        job:
          $ref: '#/components/schemas/Job'
    DomainDiscoveryJobResponse:
      type: object
      required:
      - job
      - discovery
      properties:
        job:
          $ref: '#/components/schemas/ApiBatchJob'
        discovery:
          type: object
          required:
          - corpus
          - corpus_version
          - total_matching_words
          - page_offset
          - page_words
          - domain_checks
          - tlds
          - filters
          - credits_per_domain
          - next_cursor
          properties:
            corpus:
              type: string
              enum:
              - iannuttall/unclaimed
            corpus_version:
              type: string
            total_matching_words:
              type: integer
              minimum: 1
            page_offset:
              type: integer
              minimum: 0
            page_words:
              type: integer
              minimum: 1
              maximum: 100
            domain_checks:
              type: integer
              minimum: 1
              maximum: 100
            tlds:
              type: array
              minItems: 1
              maxItems: 5
              items:
                type: string
            filters:
              type: object
              required:
              - min_length
              - max_length
              - singular_only
              properties:
                min_length:
                  type: integer
                  minimum: 1
                  maximum: 63
                max_length:
                  type: integer
                  minimum: 1
                  maximum: 63
                singular_only:
                  type: boolean
            credits_per_domain:
              type: integer
              minimum: 0
              description: Normal /v1/status cost at job creation time.
            next_cursor:
              type:
              - string
              - 'null'
              description: Opaque cursor for the next page of the filtered corpus. Null when the corpus is exhausted.
    ApiBatchResultsResponse:
      type: object
      required:
      - job
      - results
      - next_after
      properties:
        job:
          $ref: '#/components/schemas/ApiBatchJob'
        results:
          type: array
          items:
            type: object
            required:
            - position
            - request
            - status
            - attempts
            - http_status
            - result
            - error
            - billing
            properties:
              position:
                type: integer
                minimum: 0
              reference:
                type:
                - string
                - 'null'
              request:
                type: object
                required:
                - method
                - path
                - query
                properties:
                  method:
                    type: string
                    enum:
                    - GET
                  path:
                    type: string
                  query:
                    type: object
                    additionalProperties: true
              status:
                type: string
                enum:
                - pending
                - processing
                - succeeded
                - failed
                - cancelled
              attempts:
                type: integer
              http_status:
                type:
                - integer
                - 'null'
              result:
                type:
                - object
                - 'null'
                additionalProperties: true
              error:
                type:
                - object
                - 'null'
                additionalProperties: true
              billing:
                type: object
                additionalProperties: true
              started_at:
                type:
                - string
                - 'null'
                format: date-time
              completed_at:
                type:
                - string
                - 'null'
                format: date-time
        next_after:
          type:
          - integer
          - 'null'
    ErrorResponse:
      type: object
      description: Canonical error format shared by every API error response. Endpoint-specific fields (for example credits_remaining, login_url or evidence_summary) may appear next to error or inside it; clients should ignore fields they do not recognise.
      additionalProperties: true
      properties:
        error:
          type: object
          additionalProperties: true
          properties:
            code:
              type: string
              description: Stable, upper-case machine code. Codes are never renamed; the full catalog with HTTP status, type and retryability is published as x-domscan-error-codes.
              example: INVALID_DOMAIN
            type:
              type: string
              enum:
              - authentication_error
              - credits_error
              - permission_error
              - not_found_error
              - conflict_error
              - rate_limit_error
              - timeout_error
              - validation_error
              - upstream_error
              - api_error
              - request_error
              description: Stable error category used by official SDK subclasses
            message:
              type: string
              description: Human-readable error message
              example: Invalid domain format
            status:
              type: integer
              minimum: 400
              maximum: 599
              description: HTTP status repeated in the JSON error for queue and log processors
            retryable:
              type: boolean
              description: Whether retrying can be appropriate after applying retry guidance
            request_id:
              type: string
              description: Request identifier matching the X-Request-Id response header
            suggestion:
              type: string
              description: Suggestion for fixing the error
            details:
              type: object
              description: Optional structured context for the error
              additionalProperties: true
            retry_after:
              type: integer
              minimum: 0
              description: Seconds to wait before retrying when the error is temporary
              example: 300
            docs_url:
              type: string
              description: Absolute link to the documentation section for this error
              example: https://domscan.net/docs/check-availability
          required:
          - type
          - code
          - message
          - status
          - retryable
          - request_id
          - docs_url
    JobListResponse:
      type: object
      required:
      - jobs
      - limit
      - has_more
      - next_cursor
